<!doctype html>
<!-- LINE LIFF 身分綁定頁：依 flow purpose 顯示客戶、月嫂或工會帳號表單。 -->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LINE 身分確認</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { margin: 0; background: #f4f6f8; color: #18212b; font-family: sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 24px 18px; }
    section { background: white; border-radius: 16px; padding: 22px; box-shadow: 0 8px 24px #00000012; }
    h1 { margin-top: 0; font-size: 24px; }
    label { display: block; margin: 16px 0 6px; font-weight: 700; }
    input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #c9d1d9; border-radius: 9px; font-size: 16px; }
    button { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 9px; background: #06c755; color: white; font-size: 17px; font-weight: 700; }
    button:disabled { opacity: .55; }
    #message { margin-top: 16px; white-space: pre-wrap; line-height: 1.5; }
    .error { color: #b42318; }
  </style>
</head>
<body>
<main><section>
  <h1 id="title">LINE 身分確認</h1>
  <p id="description">正在確認登入狀態…</p>
  <form id="form" hidden></form>
  <div id="message" role="status"></div>
</section></main>
<script>
const parameters = new URLSearchParams(location.search);
const flowId = parameters.get("flow_id") || "";
const purpose = parameters.get("purpose") || "";
const definitions = {
  customer_binding: {
    title: "客戶資料綁定",
    description: "請輸入登記時使用的姓名與電話。",
    endpoint: "customer",
    fields: [["name", "姓名", "text"], ["phone", "行動電話", "tel"]]
  },
  staff_verification: {
    title: "月嫂身分申請",
    description: "資料核對後會送交工會人員確認，不會立即切換身分。",
    endpoint: "staff",
    fields: [["name", "姓名", "text"], ["identity_card", "身分證字號", "text"], ["birthday", "生日", "date"]]
  },
  admin_binding: {
    title: "工會帳號綁定",
    description: "請使用既有後台帳號登入；本操作不會變更您的權限。",
    endpoint: "admin",
    fields: [["username", "後台帳號", "text"], ["password", "後台密碼", "password"]]
  }
};
let idToken = "";

function showMessage(text, isError = false) {
  const target = document.getElementById("message");
  target.textContent = text;
  target.className = isError ? "error" : "";
}

function buildForm(definition) {
  const form = document.getElementById("form");
  for (const [name, labelText, type] of definition.fields) {
    const label = document.createElement("label");
    label.htmlFor = name;
    label.textContent = labelText;
    const input = document.createElement("input");
    input.id = name;
    input.name = name;
    input.type = type;
    input.required = true;
    input.maxLength = type === "password" ? 256 : 100;
    form.append(label, input);
  }
  const button = document.createElement("button");
  button.type = "submit";
  button.textContent = "送出確認";
  form.append(button);
  form.hidden = false;
  form.addEventListener("submit", event => submitForm(event, definition, button));
}

async function submitForm(event, definition, button) {
  event.preventDefault();
  button.disabled = true;
  showMessage("正在安全核對資料…");
  const values = Object.fromEntries(new FormData(event.target).entries());
  const payload = {flow_id: flowId, line_id_token: idToken, ...values};
  try {
    const response = await fetch(`/api/v1/line/identity/${definition.endpoint}/apply`, {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.detail || "資料送出失敗");
    const pending = result.data.status === "pending_review";
    showMessage(pending ? "申請已送出，請等待工會人員確認。" : "LINE 身分已完成綁定。", false);
    event.target.querySelectorAll("input,button").forEach(item => item.disabled = true);
  } catch (error) {
    showMessage(error.message || "目前無法送出，請稍後再試。", true);
    button.disabled = false;
  }
}

async function initialize() {
  const definition = definitions[purpose];
  if (!flowId || !definition) throw new Error("連結無效，請回到 LINE 重新取得入口。");
  document.getElementById("title").textContent = definition.title;
  document.getElementById("description").textContent = definition.description;
  const configResponse = await fetch("/api/v1/line/identity/runtime-config");
  const config = await configResponse.json();
  if (!configResponse.ok || !config.data?.liff_id) throw new Error("LIFF 尚未完成設定，請聯絡工會人員。");
  await liff.init({liffId: config.data.liff_id});
  if (!liff.isLoggedIn()) { liff.login(); return; }
  idToken = liff.getIDToken() || "";
  if (!idToken) throw new Error("無法取得 LINE 登入憑證，請重新開啟此頁。");
  buildForm(definition);
}

initialize().catch(error => showMessage(error.message || "頁面初始化失敗。", true));
</script>
</body>
</html>
