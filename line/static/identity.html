<!doctype html>
<!--
File: identity.html
Description: 提供 LIFF 身分與登記前導流程，安全顯示 typed flow 錯誤且不輸出敏感 payload。
-->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LINE 身分確認</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { margin: 0; min-height: 100vh; background: linear-gradient(135deg,#eef2f7,#d9e2ec); color: #334e68; font-family: 'Noto Sans TC',sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 28px 18px; }
    section { position: relative; overflow: hidden; background: #ffffffd9; border: 1px solid #ffffff80; border-radius: 20px; padding: 28px; box-shadow: 0 8px 32px #1f268715; }
    section::before { content: ''; position: absolute; inset: 0 0 auto; height: 6px; background: linear-gradient(90deg,#4a90e2,#63e6be); }
    h1 { margin-top: 0; font-size: 24px; }
    label { display: block; margin: 16px 0 6px; font-weight: 700; }
    input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #c9d1d9; border-radius: 9px; font-size: 16px; }
    button { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 9px; background: #06c755; color: white; font-size: 17px; font-weight: 700; }
    button:disabled { opacity: .55; }
    button.secondary { margin-top: 10px; background: #64748b; }
    #identity-preview { margin-top: 18px; border-radius: 9px; padding: 12px; background: #ecfdf5; color: #166534; white-space: pre-wrap; }
    #customer-choice button { margin-top: 14px; text-align: left; padding: 18px; border: 1px solid #d9e2ec; background: #fff; color: #334e68; box-shadow: 0 4px 15px #00000008; }
    #customer-choice button strong { display: block; font-size: 17px; margin-bottom: 5px; }
    #customer-choice button span { display: block; color: #627d98; font-size: 13px; line-height: 1.5; }
    #message { margin-top: 16px; white-space: pre-wrap; line-height: 1.5; }
    #message:empty { display: none; }
    .error { color: #b42318; }
    #staff-binding-mismatch { color: #243b53; font-size: 18px; line-height: 1.6; }
    #staff-binding-mismatch h2 { margin: 0 0 14px; color: #8c231b; font-size: 24px; line-height: 1.35; }
    #staff-binding-mismatch p { margin: 0 0 14px; }
    #staff-binding-mismatch .button-name { white-space: nowrap; }
    #staff-binding-mismatch ul { margin: 0 0 16px; padding-inline-start: 1.5em; font-weight: 700; }
    #staff-binding-mismatch:not([hidden]) ~ #binding-help button { min-height: 52px; font-size: 18px; }
    #staff-binding-mismatch:not([hidden]) ~ #binding-help #edit-binding { background: #076b45; }
    #staff-binding-mismatch:not([hidden]) ~ #binding-help #call-staff { background: #fff; color: #243b53; border: 1px solid #52677a; }
  </style>
</head>
<body>
<main><section>
  <h1 id="title">LINE 身分確認</h1>
  <p id="description">正在確認登入狀態…</p>
  <div id="customer-choice" hidden>
    <button id="register-new" type="button"><strong>📝 已申請市府平台</strong><span>我已在市府媒合服務平台完成登記，要核對客戶資料並繼續填寫工會需求調查表單。</span></button>
    <button id="goto-gov" type="button"><strong>🏛️ 尚未向市府申請</strong><span>我尚未於市府平台登記，請先前往新竹市政府到宅月子媒合服務平台提出申請。</span></button>
    <button id="register-non-citizen" type="button"><strong>非市民服務申請</strong><span>填寫非市民服務需求，送工會核准建案。</span></button>
  </div>
  <form id="form" hidden></form>
  <div id="message" role="status"></div>
  <div id="staff-binding-mismatch" hidden>
    <h2 tabindex="-1">找不到您的月嫂資料</h2>
    <p>請檢查這三項是否和您在工會登記的資料一樣：</p>
    <ul>
      <li>姓名</li>
      <li>身分證字號</li>
      <li>出生日期</li>
    </ul>
    <p>請點<span class="button-name">「返回修改」</span>檢查資料。如果資料都正確，還是無法綁定，請點<span class="button-name">「呼叫專員」</span>，工會會協助您確認。</p>
  </div>
  <button id="reauthenticate" class="secondary" type="button" hidden>重新登入 LINE</button>
  <div id="binding-help" hidden>
    <button id="edit-binding" class="secondary" type="button">返回修改</button>
    <button id="call-staff" class="secondary" type="button">呼叫專員</button>
  </div>
</section></main>
<script>
const definitions = {
  customer_binding: {
    title: "客戶資料綁定",
    roleLabel: "客戶",
    description: "請輸入登記時使用的姓名與電話。",
    endpoint: "customer",
    fields: [["name", "姓名", "text"], ["phone", "行動電話", "tel"]]
  },
  staff_verification: {
    title: "月嫂身分綁定",
    roleLabel: "月嫂",
    description: "請輸入姓名、身分證字號與出生日期。資料核對成功後會立即完成綁定。",
    endpoint: "staff",
    fields: [["name", "姓名", "text"], ["identity_card", "身分證字號", "text"], ["birthday", "出生日期", "date"]]
  },
  admin_binding: {
    title: "工會帳號綁定",
    roleLabel: "工會人員",
    description: "請使用既有後台帳號登入；本操作不會變更您的權限。",
    endpoint: "admin",
    fields: [["username", "後台帳號", "text"], ["password", "後台密碼", "password"]]
  }
};
let idToken = "";
let flowId = "";
let formBuilt = false;
let bindingResultUnknown = false;
const identityPreviewStatusLabels = {
  authentication_pending: "等待套用時驗證管理員帳號",
  matched: "已找到可綁定資料",
  already_bound: "此 LINE 身分已完成綁定",
  requires_review: "需要工會人員確認",
  not_found: "找不到相符資料",
};

function showMessage(text, isError = false) {
  const target = document.getElementById("message");
  target.textContent = text;
  target.className = isError ? "error" : "";
}

function safeIdentityErrorMessage(result, fallback) {
  const candidates = [
    typeof result?.detail === "string" ? result.detail : null,
    result?.detail?.message,
    result?.detail?.error?.message,
    result?.error?.message
  ];
  const message = candidates.find(
    candidate => typeof candidate === "string" && candidate.trim()
  );
  if (message && /^[a-z][a-z0-9_]+$/.test(message.trim())) return '身分資料或操作連結已失效，請返回 LINE 重新開啟對應入口；如仍無法完成，請呼叫專員。';
  return message ? message.trim() : fallback;
}

function identityErrorCode(result) {
  return result?.detail?.error?.code || result?.detail?.code || result?.error?.code || "";
}

function bindingRequestError(response, result, fallback) {
  const error = new Error(response.status === 410
    ? "綁定連結已失效，請返回 LINE 重新開啟綁定頁面。"
    : safeIdentityErrorMessage(result, fallback));
  error.code = identityErrorCode(result);
  return error;
}

function showIdentityError(error, fallback) {
  showMessage(error?.message || fallback, true);
  document.getElementById("reauthenticate").hidden = !String(error?.code || "").startsWith("liff_");
}

function reauthenticateLine() {
  sessionStorage.clear();
  try { liff.logout(); } catch (_) {}
  liff.login({redirectUri: location.href});
}

function buildForm(definition) {
  if (formBuilt) return;
  const form = document.getElementById("form");
  for (const [name, labelText, type] of definition.fields) {
    const label = document.createElement("label");
    label.htmlFor = name;
    label.textContent = labelText;
    const input = document.createElement("input");
    input.id = name;
    input.name = name;
    input.type = type;
    input.required = true;
    input.maxLength = type === "password" ? 256 : 100;
    form.append(label, input);
  }
  const button = document.createElement("button");
  button.type = "submit";
  button.textContent = "確認送出身分驗證";
  const previewBox = document.createElement("div");
  previewBox.id = "identity-preview";
  previewBox.hidden = true;
  form.append(previewBox, button);
  form.addEventListener("submit", event => submitForm(event, definition, button, previewBox));
  formBuilt = true;
}

function showIdentityEntry(definition, purpose) {
  buildForm(definition);
  if (purpose !== "customer_binding") {
    document.getElementById("form").hidden = false;
    return;
  }
  document.getElementById("description").textContent = "已在新竹市政府平台完成申請登記嗎？";
  document.getElementById("customer-choice").hidden = false;
}

async function ensureLineIdToken() {
  idToken = liff.getIDToken() || "";
  if (!idToken) {
    throw new Error("無法取得 LINE 登入憑證，請確認 LIFF 已啟用 openid 權限後重新開啟此頁。");
  }
  return idToken;
}

async function openStaffPage(path) {
  await openIdentityFlow("staff_self_service");
  const target = new URL(path, location.origin);
  target.searchParams.set("flow_id", flowId);
  location.replace(target.toString());
}

async function openIdentityFlow(purpose) {
  await ensureLineIdToken();
  const idempotencyKey = crypto.randomUUID();
  const response = await fetch("/api/v1/line/identity/flow/open", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      purpose,
      idempotency_key: idempotencyKey,
      line_id_token: idToken
    })
  });
  const result = await response.json();
  if (!response.ok || !result.data?.flow_id) {
    const error = new Error(safeIdentityErrorMessage(result, "目前無法建立安全操作連結，請稍後再試。"));
    error.code = identityErrorCode(result);
    throw error;
  }
  flowId = result.data.flow_id;
  return result.data;
}

function configureCustomerChoice(definition) {
  const registerBtn = document.getElementById("register-new");
  const gotoGovBtn = document.getElementById("goto-gov");
  const registerNonCitizenBtn = document.getElementById("register-non-citizen");

  if (registerBtn) {
    registerBtn.addEventListener("click", async () => {
      try {
        showMessage("正在為您開啟服務綁定與查詢…");
        await openIdentityFlow("customer_binding");
        location.assign(`/line-bind?flow_id=${encodeURIComponent(flowId)}`);
      } catch (error) {
        showIdentityError(error, "目前無法開啟需求調查表單。");
      }
    });
  }

  if (gotoGovBtn) {
    gotoGovBtn.addEventListener("click", () => {
      location.assign("https://hsinchu-nanny.hccg.gov.tw/home");
    });
  }

  if (registerNonCitizenBtn) {
    registerNonCitizenBtn.addEventListener("click", () => {
      location.assign("/line-non-citizen-registration");
    });
  }
}

function requireIdentityPreview(result) {
  const preview = result?.data;
  if (!preview || !Object.hasOwn(identityPreviewStatusLabels, preview.status)
      || !Number.isInteger(preview.expected_version)
      || !/^[0-9a-f]{64}$/.test(preview.preview_fingerprint || "")) {
    throw new Error("預覽回應格式不完整，未執行套用。");
  }
  if (preview.candidate !== null && preview.candidate !== undefined
      && typeof preview.candidate.currently_bound !== "boolean") {
    throw new Error("預覽候選狀態格式不完整，未執行套用。");
  }
  return preview;
}

async function submitForm(event, definition, button, previewBox) {
  event.preventDefault();
  if (bindingResultUnknown) return;
  let applySubmitted = false;
  button.disabled = true;
  document.getElementById("binding-help").hidden = true;
  showMessage("正在核對並綁定身分資料…");
  const values = Object.fromEntries(new FormData(event.target).entries());
  const payload = {flow_id: flowId, line_id_token: idToken, ...values};
  try {
    // 1. 建立背景預覽
    const previewRes = await fetch(`/api/v1/line/identity/${definition.endpoint}/preview`, {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)
    });
    const previewResult = await previewRes.json();
    if (!previewRes.ok || !previewResult.data) {
      throw bindingRequestError(
        previewRes,
        previewResult,
        "目前無法核對身分資料，請稍後再試。"
      );
    }
    const preview = requireIdentityPreview(previewResult);

    // 2. 一鍵直接套用
    applySubmitted = true;
    const applyRes = await fetch(`/api/v1/line/identity/${definition.endpoint}/apply`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        ...payload,
        expected_version: preview.expected_version,
        preview_fingerprint: preview.preview_fingerprint
      })
    });
    const applyResult = await applyRes.json();
    if (!applyRes.ok) {
      applySubmitted = false;
      throw bindingRequestError(
        applyRes,
        applyResult,
        "身分套用失敗，請稍後再試。"
      );
    }
    const receipt = requireIdentityApply(applyResult, preview, definition.endpoint);
    const {roleLabel, endpoint} = definition;
    if (receipt.status === "pending_review") {
      showMessage("重新綁定申請已送出");
      previewBox.textContent = `審核編號：${receipt.review_request_id}。請等待工會確認。核准前會保留原綁定。`;
    } else if (receipt.status === "existing") {
      showMessage(`${roleLabel}身分已完成綁定`);
      previewBox.textContent = "此 LINE 帳號已綁定此身分，可直接返回 LINE 使用。";
    } else {
      showMessage(`${roleLabel}身分綁定成功`);
      const menu = endpoint === "staff" ? "月嫂選單" : endpoint === "admin" ? "工會選單" : "客戶選單";
      previewBox.textContent = endpoint === "admin"
        ? `請返回 LINE 聊天室。系統會稍後更新${menu}。`
        : `請返回 LINE 聊天室。若您只有${roleLabel}身分，系統會稍後更新${menu}。若同時綁定客戶與月嫂身分，請輸入「切換客戶」或「切換月嫂」選擇身分。`;
    }
    previewBox.hidden = false;
    button.disabled = true;
  } catch (error) {
    const staffMismatch = definition.endpoint === "staff"
      && error.code === "line_identity_match_not_found"
      && error.message === "找不到匹配資訊，請檢查輸入內容是否正確或聯繫工會人員";
    if (staffMismatch) {
      showMessage("");
      document.getElementById("reauthenticate").hidden = true;
      document.getElementById("description").hidden = true;
      event.target.hidden = true;
      const mismatch = document.getElementById("staff-binding-mismatch");
      mismatch.hidden = false;
      mismatch.querySelector("h2").focus();
    } else {
      showIdentityError(error, "目前無法完成身分綁定，請確認資料正確或稍後再試。");
    }
    document.getElementById("binding-help").hidden = false;
    bindingResultUnknown = applySubmitted;
    button.disabled = bindingResultUnknown;
  }
}

function requireIdentityApply(result, preview, endpoint) {
  const receipt = result?.data;
  const allowed = endpoint === 'customer' ? ['bound', 'existing', 'pending_review'] : ['bound', 'existing'];
  if (!receipt || !allowed.includes(receipt.status)
      || typeof receipt.receipt_identity !== 'string' || !receipt.receipt_identity.trim()
      || receipt.preview_fingerprint !== preview.preview_fingerprint
      || (receipt.status === 'pending_review' && (!Number.isSafeInteger(receipt.review_request_id) || receipt.review_request_id <= 0))) {
    throw new Error('綁定結果讀回不完整，請勿重複送出；請聯絡工會確認。');
  }
  return receipt;
}

async function callBindingStaff() {
  const button = document.getElementById('call-staff');
  if (button.disabled) return;
  button.disabled = true;
  try {
    if (!liff.isInClient() || liff.getContext()?.type !== 'utou' || !liff.isApiAvailable('sendMessages')) throw new Error();
    await liff.sendMessages([{type:'text', text:'呼叫專員'}]);
  } catch (_) {
    showMessage('請返回官方 LINE 聊天室輸入「呼叫專員」。', true);
    button.disabled = false;
    return;
  }
  showMessage('呼叫已送出，請返回聊天室留言。');
  liff.closeWindow();
}

async function loadLiffId() {
  const response = await fetch("/api/v1/line/identity/runtime-config");
  const result = await response.json();
  if (!response.ok || !result.data?.liff_id) {
    throw new Error("LIFF 尚未完成設定，請聯絡工會人員。");
  }
  return result.data.liff_id;
}

function liffStateParameters(parameters) {
  const rawState = parameters.get("liff.state") || "";
  const queryStart = rawState.indexOf("?");
  const stateQuery = queryStart >= 0 ? rawState.slice(queryStart + 1) : rawState.replace(/^\//, "");
  return new URLSearchParams(stateQuery);
}

function combinedEntryParameters() {
  const parameters = new URLSearchParams(location.search);
  const stateParameters = liffStateParameters(parameters);
  return {parameters, stateParameters};
}

function identityFlowParameters() {
  const {parameters, stateParameters} = combinedEntryParameters();
  if (parameters.get("purpose") && parameters.get("flow_id")) return parameters;
  return stateParameters;
}

function readIdentityFlowContext() {
  const parameters = identityFlowParameters();
  const purpose = parameters.get("purpose") || "";
  const definition = definitions[purpose];
  flowId = parameters.get("flow_id") || "";
  if (!flowId || !definition) {
    throw new Error("連結無效，請回到 LINE 重新取得入口。");
  }
  return {definition, purpose};
}

function requestedRegistrationEntry() {
  const {parameters, stateParameters} = combinedEntryParameters();
  const entry = parameters.get("entry") || stateParameters.get("entry");
  return entry === "registration";
}

function requestedStaffPage() {
  const {parameters, stateParameters} = combinedEntryParameters();
  const target = parameters.get("target") || stateParameters.get("target");
  return {
    staff_order_search: "/line-staff-orders",
    staff_schedule: "/line-staff-schedule",
    staff_profile_update: "/line-staff-profile-update",
    staff_leave_apply: "/line-staff-schedule",
    staff_payout: "/line-staff-payout"
  }[target] || "";
}

function requestedMobileAdminPage() {
  const {parameters, stateParameters} = combinedEntryParameters();
  const target = parameters.get("target") || stateParameters.get("target");
  return {
    customer_service: "/line-mobile-admin?target=customer_service",
    scheduling_review: "/line-mobile-admin?target=scheduling_review",
    staff_review: "/line-mobile-admin?target=staff_review",
    order_tracking: "/line-mobile-admin?target=order_tracking",
    anomalies_center: "/line-mobile-admin?target=anomalies_center",
    dashboard: "/line-mobile-admin?target=dashboard"
  }[target] || "";
}

function requestedStandalonePage() {
  const {parameters, stateParameters} = combinedEntryParameters();
  const target = parameters.get("target") || stateParameters.get("target");
  const entry = parameters.get("entry") || stateParameters.get("entry");
  const reference = parameters.get("ref") || stateParameters.get("ref") || "";
  if (entry === "gateway" || target === "gateway") {
    return "/line-gateway";
  }
  if (target === "candidate_contact" && /^[0-9a-f]{64}$/.test(reference)) {
    return `/line-candidate-contact?ref=${encodeURIComponent(reference)}`;
  }
  if (target === "candidate_contact_customer" && /^[0-9a-f]{64}$/.test(reference)) {
    return `/line-candidate-contact-customer?ref=${encodeURIComponent(reference)}`;
  }
  return {
    faq: "/line-service-help?tab=faq",
    ai_assistant: "/line-service-help?tab=ai",
    profile_update: "/line-profile-guard",
    order_update: "/line-order-update"
  }[target] || "";
}

function hasSensitiveFlowContext() {
  const parameters = identityFlowParameters();
  return Boolean(parameters.get("purpose") || parameters.get("flow_id"));
}

function showRegistrationEntry() {
  const definition = definitions.customer_binding;
  document.getElementById("title").textContent = "服務確認與導流";
  document.getElementById("description").textContent = "已在新竹市政府平台完成申請登記嗎？";
  configureCustomerChoice(definition);
  buildForm(definition);
  document.getElementById("customer-choice").hidden = false;
}

async function validateIdentityFlow(purpose) {
  const payload = {flow_id: flowId, purpose, line_id_token: idToken};
  const response = await fetch("/api/v1/line/identity/flow/validate", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });
  if (response.ok) return;
  const result = await response.json();
  if (response.status === 410) {
    const entry = purpose === 'staff_verification' ? '月嫂身分綁定' : purpose === 'admin_binding' ? '綁定工會帳號' : '客戶登記與綁定';
    throw new Error(`此連結已失效，請返回 LINE 聊天室重新開啟「${entry}」。工會帳號請輸入「綁定工會帳號」。`);
  }
  throw new Error(
    safeIdentityErrorMessage(result, "目前無法驗證連結，請稍後再試。")
  );
}

async function initialize() {
  if (!location.search && !location.hash) {
    location.replace("/line-gateway");
    return;
  }
  const standalonePage = requestedStandalonePage();
  if (standalonePage) { location.replace(standalonePage); return; }
  const liffId = await loadLiffId();
  await liff.init({liffId});
  const mobileAdminPage = requestedMobileAdminPage();
  const staffPage = requestedStaffPage();
  if (!liff.isLoggedIn()) { liff.login(); return; }
  if (mobileAdminPage) { location.replace(mobileAdminPage); return; }
  if (staffPage) { await openStaffPage(staffPage); return; }
  const {parameters, stateParameters} = combinedEntryParameters();
  const target = parameters.get("target") || stateParameters.get("target");
  const purposeParam = parameters.get("purpose") || stateParameters.get("purpose");
  if (target === "staff_verification" || purposeParam === "staff_verification") {
    await ensureLineIdToken();
    await openIdentityFlow("staff_verification");
    const definition = definitions.staff_verification;
    document.getElementById("title").textContent = definition.title;
    document.getElementById("description").textContent = definition.description;
    document.getElementById("customer-choice").hidden = true;
    showIdentityEntry(definition, "staff_verification");
    return;
  }
  if (requestedRegistrationEntry() || !hasSensitiveFlowContext()) {
    showRegistrationEntry();
    return;
  }
  const {definition, purpose} = readIdentityFlowContext();
  document.getElementById("title").textContent = definition.title;
  document.getElementById("description").textContent = definition.description;
  await ensureLineIdToken();
  await validateIdentityFlow(purpose);
  configureCustomerChoice(definition);
  showIdentityEntry(definition, purpose);
}

document.getElementById("reauthenticate").addEventListener("click", reauthenticateLine);
document.getElementById('call-staff').addEventListener('click', callBindingStaff);
document.getElementById('edit-binding').addEventListener('click', () => {
  document.getElementById('binding-help').hidden = true;
  document.getElementById('staff-binding-mismatch').hidden = true;
  document.getElementById('description').hidden = false;
  document.getElementById('form').hidden = false;
  showMessage('請確認資料後重新送出。');
  document.querySelector('#form input')?.focus();
});
initialize().catch(error => showIdentityError(error, "頁面初始化失敗。"));
</script>
</body>
</html>
