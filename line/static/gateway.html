<!-- File: gateway.html | Description: 依 LIFF target 導向客戶登記、資料異動與月嫂服務頁，支援前綴預覽。 -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新竹市月子工會 - 服務確認入口</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --secondary: #63e6be;
            --bg-gradient: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text-dark: #334e68;
            --text-muted: #627d98;
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-dark);
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 6px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* 選擇按鈕區域 */
        .option-card {
            width: 100%;
            font: inherit;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-dark);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .option-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(74, 144, 226, 0.15);
            border-color: var(--primary);
        }

        .option-icon {
            font-size: 32px;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .option-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .option-desc {
            font-size: 13px;
            color: var(--text-muted);
        }

        .step-heading {
            margin-bottom: 16px;
            font-size: 16px;
        }

        .pending-hint, .preview-destination:not(:empty) {
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.75);
            font-size: 14px;
            text-align: start;
            overflow-wrap: anywhere;
        }

        .back-button {
            margin-top: 12px;
            min-height: 44px;
            padding: 8px 14px;
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            background: white;
            color: var(--text-dark);
            font: inherit;
            cursor: pointer;
        }

        .studio-preview { align-items: flex-start; }

        /* 載入遮罩 */
        .loader-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10;
        }

        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(74, 144, 226, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin-bottom: 15px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo" id="pageLogo">新竹市月子工會</div>
        <div class="title" id="pageTitle">服務入口</div>
        <div class="subtitle" id="pageSubtitle">已在新竹市政府平台完成申請登記嗎？</div>
    </div>

    <div id="actionsContainer"></div>
    <div id="previewDestination" class="preview-destination" role="status"></div>

    <!-- 載入中遮罩 -->
    <div class="loader-overlay" id="loaderOverlay">
        <div class="spinner"></div>
        <div class="loader-text" id="loaderText">正在準備您的專屬通道...</div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const studioPreview = urlParams.get('studio_preview') === '1';
    function parseLiffStateParams() {
        const rawState = urlParams.get('liff.state') || '';
        if (!rawState) return new URLSearchParams();
        const queryStart = rawState.indexOf('?');
        if (queryStart >= 0) return new URLSearchParams(rawState.slice(queryStart));
        return new URLSearchParams(rawState);
    }
    const liffStateParams = parseLiffStateParams();
    const targetPage = urlParams.get('target') || liffStateParams.get('target');
    const entryParam = urlParams.get('entry') || liffStateParams.get('entry');

    // 解析直接跳轉的內部路徑（若 liff.state 本身即為 /line-... 路徑）
    let directPath = '';
    const rawState = urlParams.get('liff.state') || '';
    if (rawState) {
        try {
            const decoded = decodeURIComponent(rawState);
            if (decoded.startsWith('/') && !decoded.startsWith('//')) {
                if (/^\/line-[a-z0-9_/-]+(\?.*)?$/i.test(decoded)) {
                    directPath = decoded;
                }
            }
        } catch (_) {}
    }
    const interactionReference = urlParams.get('ref') || liffStateParams.get('ref') || '';
    const targetPaths = {
        gateway: '/line-gateway',
        registration: '/line-bind',
        non_citizen_registration: '/line-non-citizen-registration',
        staff_order_search: '/line-identity?target=staff_order_search',
        staff_schedule: '/line-identity?target=staff_schedule',
        staff_leave_apply: '/line-identity?target=staff_leave_apply',
        profile_update: '/line-profile-guard',
        order_update: '/line-order-update',
        customer_service: '/line-mobile-admin?target=customer_service',
        scheduling_review: '/line-mobile-admin?target=scheduling_review',
        staff_review: '/line-mobile-admin?target=staff_review',
        staff_verification: '/line-identity?target=staff_verification',
        staff_payout: '/line-identity?target=staff_payout',
        order_tracking: '/line-mobile-admin?target=order_tracking',
        anomalies_center: '/line-mobile-admin?target=anomalies_center',
        dashboard: '/line-mobile-admin?target=dashboard',
        faq: '/line-service-help?tab=faq',
        ai_assistant: '/line-service-help?tab=ai'
    };
    if (targetPage === 'candidate_contact' && /^[0-9a-f]{64}$/.test(interactionReference)) {
        targetPaths.candidate_contact = `/line-candidate-contact?ref=${encodeURIComponent(interactionReference)}`;
    }
    if (targetPage === 'candidate_contact_customer' && /^[0-9a-f]{64}$/.test(interactionReference)) {
        targetPaths.candidate_contact_customer = `/line-candidate-contact-customer?ref=${encodeURIComponent(interactionReference)}`;
    }
    const depositCaseNo = urlParams.get('case_no') || liffStateParams.get('case_no') || '';
    if (targetPage === 'deposit_payment' && /^[A-Za-z0-9_-]{1,50}$/.test(depositCaseNo)) {
        targetPaths.deposit_payment = `/line-deposit-payment?case_no=${encodeURIComponent(depositCaseNo)}`;
    }
    let actions = [];
    let twoStep = false;
    let navigationPending = false;
    const registrationGroups = {
        citizen: {
            label: '新竹市民',
            heading: '新竹市民｜市府平台登記狀態',
            actions: ['registered_city', 'apply_city'],
        },
        nonCitizen: {
            label: '非新竹市民',
            heading: '非新竹市民｜工會申請狀態',
            actions: ['non_citizen_binding', 'non_citizen_registration'],
        },
    };

    function loadLiff() {
        if (window.liff) return Promise.resolve(window.liff);
        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
            script.onload = () => resolve(window.liff);
            script.onerror = () => reject(new Error('目前無法載入 LINE 登入功能，請稍後重試。'));
            document.head.append(script);
        });
    }

    async function initLiff() {
        try {
            const studioPreviewMatch = (window.location?.pathname || '').match(/^(.*)\/api\/v1\/line\/identity\/studio-preview(?:\/|$)/);
            const studioApiPrefix = studioPreviewMatch ? studioPreviewMatch[1] : '';
            const pageResponse = await fetch(`${studioApiPrefix}/api/config/liff/runtime?page=gateway`);
            if (!pageResponse.ok) throw new Error('暫時無法開啟服務，請稍後再試。');
            const runtime = await pageResponse.json();
            const root = document.documentElement.style;
            root.setProperty('--primary', runtime.theme.primary_color);
            root.setProperty('--primary-hover', runtime.theme.primary_hover_color);
            root.setProperty('--bg-gradient', runtime.theme.background);
            root.setProperty('--text-dark', runtime.theme.text_color);
            root.setProperty('--text-muted', runtime.theme.muted_text_color);
            document.body.style.fontFamily = runtime.theme.font_family;
            document.getElementById('pageLogo').textContent = runtime.page.content.logo || '';
            document.getElementById('pageTitle').textContent = runtime.page.title;
            document.getElementById('pageSubtitle').textContent = runtime.page.subtitle;
            actions = runtime.page.actions;
            twoStep = runtime.page.content.navigation_layout === 'two_step';
            if (studioPreview) {
                document.body.classList.add('studio-preview');
                renderActions();
                document.getElementById('loaderOverlay').style.display = 'none';
                return;
            }
            const response = await fetch('/api/v1/line/identity/runtime-config');
            const result = await response.json();
            const liffId = result.data?.liff_id;
            if (!response.ok || !liffId) throw new Error('LIFF 尚未完成設定，請聯絡工會人員。');
            const liff = await loadLiff();
            await liff.init({ liffId });
            
            if (!liff.isLoggedIn()) {
                liff.login({ redirectUri: window.location.href });
                return;
            }

            if (!liff.getIDToken()) throw new Error('無法取得 LINE 登入憑證，請確認 LIFF 已啟用 openid。');
            if (directPath) {
                navigateTo(directPath, false);
                return;
            }
            if (targetPaths[targetPage]) {
                navigateTo(targetPaths[targetPage], false);
                return;
            }
            if (entryParam && targetPaths[entryParam]) {
                navigateTo(targetPaths[entryParam], false);
                return;
            }
            renderActions();
            document.getElementById('loaderOverlay').style.display = 'none';
        } catch (err) {
            console.error('LIFF Initialization failed', err);
            document.getElementById('loaderText').textContent = err instanceof Error ? err.message : '載入失敗，請嘗試重新整理。';
        }
    }

    function renderActions(group, focusHeading = false) {
        const container = document.getElementById('actionsContainer');
        container.replaceChildren();
        document.getElementById('previewDestination').textContent = '';
        if (!twoStep) {
            for (const action of actions) container.append(createAction(action));
            return;
        }

        const selected = registrationGroups[group];
        const heading = document.createElement('h2');
        heading.className = 'step-heading';
        heading.tabIndex = -1;
        heading.textContent = selected ? selected.heading : '請選擇您的身分';
        container.append(heading);
        if (!selected) {
            for (const [key, option] of Object.entries(registrationGroups)) {
                const choice = document.createElement('button');
                choice.type = 'button';
                choice.className = 'option-card option-title';
                choice.textContent = option.label;
                choice.addEventListener('click', () => renderActions(key, true));
                container.append(choice);
            }
        } else {
            for (const id of selected.actions) {
                const action = actions.find(item => item.id === id);
                if (action) container.append(createAction(action));
            }
            if (group === 'nonCitizen') {
                const hint = document.createElement('p');
                hint.className = 'pending-hint';
                hint.textContent = '已送出申請，還在等工會審核？請等候審核結果，無須重複填寫。';
                container.append(hint);
            }
            const back = document.createElement('button');
            back.type = 'button';
            back.className = 'back-button';
            back.textContent = '返回選擇身分';
            back.addEventListener('click', () => renderActions(undefined, true));
            container.append(back);
        }
        if (focusHeading) heading.focus();
    }

    function createAction(action) {
        const card = document.createElement(studioPreview ? 'button' : 'a');
        if (studioPreview) card.type = 'button';
        else card.href = action.path;
        card.className = 'option-card';
        card.addEventListener('click', event => {
            event.preventDefault();
            if (studioPreview) {
                document.getElementById('previewDestination').textContent = `目的地：${action.path}`;
            } else {
                navigateTo(action.path, action.path.startsWith('https://'));
            }
        });
        if (action.icon) {
            const icon = document.createElement('span');
            icon.className = 'option-icon';
            icon.setAttribute('aria-hidden', 'true');
            icon.textContent = action.icon;
            card.append(icon);
        }
        const title = document.createElement('span');
        title.className = 'option-title';
        title.textContent = action.label;
        const description = document.createElement('span');
        description.className = 'option-desc';
        description.textContent = action.description;
        card.append(title, description);
        return card;
    }

    function navigateTo(path, isExternal = false) {
        if (isExternal) {
            window.location.href = path;
            return;
        }
        navigationPending = true;
        document.getElementById('loaderOverlay').style.display = 'flex';
        document.getElementById('loaderText').textContent = '正在為您跳轉...';
        window.location.href = path;
    }

    window.addEventListener('pageshow', event => {
        if (!event.persisted || !navigationPending) return;
        navigationPending = false;
        if (!document.getElementById('actionsContainer').hasChildNodes()) renderActions();
        document.getElementById('loaderOverlay').style.display = 'none';
    });

    window.onload = initLiff;
</script>
</body>
</html>
