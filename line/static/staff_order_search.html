<!-- File: staff_order_search.html | Description: 顯示已驗證月嫂可見的 assignment-owned 訂單摘要。 -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>月嫂訂單查詢</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Noto Sans TC", sans-serif; background: #fff7f8; color: #27272a; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #71717a; line-height: 1.6; }
    .panel { background: #fff; border: 1px solid #fecdd3; border-radius: 8px; padding: 16px; margin-top: 16px; }
    label { display: block; font-weight: 700; margin-bottom: 8px; }
    input { width: 100%; border: 1px solid #d4d4d8; border-radius: 6px; padding: 12px; font-size: 16px; }
    button { width: 100%; border: 0; border-radius: 6px; padding: 13px 16px; font-size: 16px; font-weight: 700; color: #fff; background: #be123c; margin-top: 12px; }
    button.secondary { background: #52525b; }
    .message { margin-top: 16px; padding: 12px; border-radius: 6px; background: #f4f4f5; color: #3f3f46; }
    .error { background: #fee2e2; color: #b91c1c; }
    .order { background: #fff; border: 1px solid #e4e4e7; border-radius: 8px; padding: 16px; margin-top: 14px; }
    .order h2 { margin: 0 0 10px; font-size: 20px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .item { border-bottom: 1px solid #f4f4f5; padding: 8px 0; }
    .item b { display: block; color: #52525b; font-size: 13px; margin-bottom: 3px; }
    details { margin-top: 12px; }
    summary { cursor: pointer; font-weight: 700; color: #be123c; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
<main>
  <h1>訂單查詢</h1>
  <p>系統會顯示您已配對的訂單；也可輸入案件編號或客戶姓名縮小結果範圍。</p>
  <section class="panel">
    <label for="keyword">篩選案件編號或客戶姓名（選填）</label>
    <input id="keyword" autocomplete="off" placeholder="例如：115000035 或 王小美">
    <button id="searchBtn">篩選訂單</button>
    <div id="status" class="message" style="display:none;"></div>
    <button id="reauthenticate" class="secondary" type="button" hidden>重新登入 LINE</button>
  </section>
  <section id="results"></section>
<section class="panel" aria-label="回報服務開始安排"><h2>回報服務開始安排</h2><p id="serviceStartStatus" role="status"></p><div id="serviceStartCases"></div><button type="button" onclick="loadServiceStartCases()">重新查詢服務開始安排</button></section>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
let lineIdToken = "";
let flowId = "";
let identityReady = false;

async function captureLineIdentity() {
  try { lineIdToken = liff.getIDToken() || ""; } catch (_) {}
  identityReady = Boolean(lineIdToken);
}

function showStatus(text, isError = false) {
  const box = document.getElementById("status");
  box.textContent = text;
  box.className = "message" + (isError ? " error" : "");
  box.style.display = "block";
}

function responseErrorCode(data) {
  return data.detail?.error?.code || data.detail?.code || data.error?.code || "";
}

function reauthenticateLine() {
  try { liff.logout(); } catch (_) {}
  const redirect = new URL("/line-identity", location.origin);
  redirect.searchParams.set("target", "staff_order_search");
  liff.login({redirectUri: redirect.toString()});
}

function valueText(value) {
  return value === null || value === undefined || value === "" ? "未填寫" : String(value);
}

function requireStaffOrderItem(value) {
  if (!value || typeof value !== "object" || Array.isArray(value)) throw new Error("訂單資料格式錯誤");
  if (typeof value.case_no !== "string" || typeof value.client_name !== "string") {
    throw new Error("訂單資料缺少必要欄位");
  }
  return value;
}

function requireStaffOrderPage(value) {
  if (!value || typeof value !== "object" || Array.isArray(value)) throw new Error("訂單查詢結果格式錯誤");
  if (!Number.isInteger(value.staff_id) || typeof value.staff_name !== "string" || !Array.isArray(value.items)) {
    throw new Error("訂單查詢結果缺少必要欄位");
  }
  return {...value, items: value.items.map(requireStaffOrderItem)};
}

function appendOrderField(root, label, value) {
  const row = document.createElement("div");
  row.className = "item";
  const key = document.createElement("b");
  key.textContent = label;
  row.append(key, document.createTextNode(valueText(value)));
  root.appendChild(row);
}

function renderResults(items) {
  const root = document.getElementById("results");
  root.replaceChildren();
  if (!items.length) {
    showStatus("查無可檢視的訂單。請確認案件編號/姓名是否正確，且該案件已指派給您。", true);
    return;
  }
  showStatus(`共找到 ${items.length} 筆訂單。`);
  for (const item of items) {
    const rows = [
      ["案件編號", item.case_no],
      ["客戶姓名", item.client_name],
      ["客戶電話", item.client_phone],
      ["服務地址", `${valueText(item.city)} ${valueText(item.address)}`],
      ["案件狀態", item.order_status],
      ["服務期間", `${valueText(item.start_date)} 至 ${valueText(item.end_date)}`],
      ["服務天數", item.service_days],
      ["每日時數", item.service_hours_per_day],
      ["預產期/預計月份", item.due_month],
      ["預計服務日期", item.service_start_date],
      ["服務時間", item.service_time],
      ["居住型態", item.residence_type],
      ["生產方式", item.delivery_type],
      ["服務方式", item.service_type],
      ["寶寶資訊", item.baby_info],
      ["其他事項", item.notes],
    ];
    const card = document.createElement("article");
    card.className = "order";
    const heading = document.createElement("h2");
    heading.textContent = `${valueText(item.client_name)}｜${valueText(item.case_no)}`;
    const grid = document.createElement("div");
    grid.className = "grid";
    rows.forEach(([label, value]) => appendOrderField(grid, label, value));
    card.append(heading, grid);
    root.appendChild(card);
  }
}

async function init() {
  const searchButton = document.getElementById("searchBtn");
  searchButton.disabled = true;
  searchButton.textContent = "正在確認 LINE 身分...";
  const params = new URLSearchParams(location.search);
  flowId = params.get("flow_id") || "";
  try {
    const result = await fetch("/api/v1/line/identity/runtime-config").then(r => r.json());
    const config = result.data || {};
    if (config.liff_id) {
      await liff.init({ liffId: config.liff_id });
      if (!liff.isLoggedIn()) {
        if (flowId) {
          identityReady = true;
          return;
        }
        const redirect = new URL("/line-identity", location.origin);
        redirect.searchParams.set("target", "staff_order_search");
        liff.login({redirectUri: redirect.toString()});
        return;
      }
      await captureLineIdentity();
    }
    if (!identityReady && !flowId) {
      showStatus("無法取得 LINE 身分，請關閉此頁後從 LINE 圖文選單重新開啟。", true);
    }
  } catch (err) {
    showStatus("LIFF 初始化失敗，請重新開啟頁面。", true);
  } finally {
    searchButton.disabled = false;
    searchButton.textContent = "篩選訂單";
    if (identityReady || flowId || lineIdToken) { await loadOrders(); await loadServiceStartCases(); }
  }
}

async function loadOrders(keyword = "") {
  if (!identityReady && !flowId && !lineIdToken) {
    showStatus("LINE 身分尚未載入完成，請稍候再查詢；若仍失敗，請關閉此頁後從 LINE 圖文選單重新開啟。", true);
    return;
  }
  showStatus("查詢中...");
  const response = await fetch("/api/v1/line/staff-self-service/orders", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ keyword, flow_id: flowId, line_id_token: lineIdToken })
  });
  const data = await response.json();
  if (!response.ok || !data.success) {
    showStatus(data.message || data.detail?.message || data.detail?.error?.message || "查詢失敗", true);
    document.getElementById("reauthenticate").hidden = !responseErrorCode(data).startsWith("liff_");
    document.getElementById("results").replaceChildren();
    return;
  }
  try {
    renderResults(requireStaffOrderPage(data.data).items);
  } catch (_) {
    document.getElementById("results").replaceChildren();
    showStatus("訂單查詢結果格式錯誤，請聯絡工會人員。", true);
  }
}

document.getElementById("searchBtn").addEventListener("click", async () => {
  const keyword = document.getElementById("keyword").value.trim();
  await loadOrders(keyword);
});

document.getElementById("reauthenticate").addEventListener("click", reauthenticateLine);

async function serviceStartPost(path, body) {
  const response=await fetch('/api/v1/line/staff-self-service/service-start/'+path,{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,flow_id:flowId,line_id_token:lineIdToken})});
  const result=await response.json();
  if(!response.ok || !result.success){const error=new Error(result.detail?.error?.message || result.detail?.message || result.message || '目前無法完成服務安排。');error.httpStatus=response.status;throw error;}
  return result.data;
}
async function loadServiceStartCases() {
  const root=document.getElementById('serviceStartCases');root.replaceChildren();
  const status=document.getElementById('serviceStartStatus');status.textContent='正在查詢本人服務安排…';
  try {
    const data=await serviceStartPost('cases',{});
    for(let i=0;i<sessionStorage.length;i++){const key=sessionStorage.key(i);if(!key?.startsWith('service-start-submit:'))continue;let saved;try{saved=JSON.parse(sessionStorage.getItem(key));}catch{continue;}if(saved && !data.items.some(item=>item.case_no===saved.case_no && item.segment_id===saved.segment_id && item.assignment_id===saved.assignment_id))data.items.push({...saved,order_version:saved.expected_order_version,segment_start_date:saved.start_date??'待確認',segment_end_date:'原操作結果待確認'});}
    if(!data || !Array.isArray(data.items)) throw new Error('服務安排資料格式錯誤。');
    status.textContent=data.items.length?'請先與客戶在服務群組協調，再提交結果。':'目前沒有可回報的服務安排。';
    for(const item of data.items){
      const card=document.createElement('article');card.className='panel';
      const heading=document.createElement('h3');heading.textContent='案件 '+item.case_no+'｜服務區段 '+item.segment_start_date+'～'+item.segment_end_date;card.append(heading);
      const form=document.createElement('form');
      const choice=document.createElement('select');choice.setAttribute('aria-label','協調結果');
      for(const [value,text] of [['accepted','接受，填寫開始日期'],['declined','無法配合，請工會安排代班']]){const option=document.createElement('option');option.value=value;option.textContent=text;choice.append(option);}
      const label=document.createElement('label');label.textContent='雙方約定的服務開始日';
      const start=document.createElement('input');start.type='date';start.required=true;start.setAttribute('aria-label','雙方約定的服務開始日');label.append(start);
      choice.onchange=()=>{label.hidden=choice.value!=='accepted';start.required=choice.value==='accepted';};
      const submit=document.createElement('button');submit.type='submit';submit.textContent='送出協調結果';
      const state=document.createElement('p');state.setAttribute('role','status');
      const recover=document.createElement('button');recover.type='button';recover.textContent='確認原操作結果';recover.hidden=true;
      const storageKey='service-start-submit:'+item.case_no+':'+item.segment_id+':'+item.assignment_id;
      const saved=sessionStorage.getItem(storageKey);let pending=saved?JSON.parse(saved):null;
      const lock=()=>{submit.disabled=Boolean(pending);choice.disabled=Boolean(pending);start.disabled=Boolean(pending);recover.hidden=!pending;};lock();
      const send=async()=>{
        if(!pending)return;submit.disabled=true;recover.disabled=true;
        try{const result=await serviceStartPost('submit',pending);sessionStorage.removeItem(storageKey);pending=null;
          state.textContent=result.status==='applied'?'實際服務日期與排班已更新，結果將記錄於服務群組。':result.status==='substitute_required'?'已交由工會安排代班。':'已收到約定日期，等待其他服務區段的月嫂提交。';
          choice.disabled=true;start.disabled=true;recover.hidden=true;
        }catch(error){state.textContent=error.message;if(error.httpStatus>=400 && error.httpStatus<500){pending=null;sessionStorage.removeItem(storageKey);}lock();}
        finally{recover.disabled=false;}
      };
      recover.onclick=()=>void send();
      form.onsubmit=event=>{event.preventDefault();if(pending)return;
        pending={case_no:item.case_no,segment_id:item.segment_id,assignment_id:item.assignment_id,expected_order_version:item.order_version,
          decision:choice.value,start_date:choice.value==='accepted'?start.value:null,idempotency_key:crypto.randomUUID()};
        sessionStorage.setItem(storageKey,JSON.stringify(pending));lock();void send();};
      form.append(choice,label,submit,recover,state);card.append(form);root.append(card);
    }
  }catch(error){status.textContent=error.message;status.setAttribute('role','alert');}
}

init();
</script>
</body>
</html>
