<!-- File: staff_order_search.html | Description: 顯示已驗證月嫂可見的 assignment-owned 訂單摘要。 -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>月嫂訂單查詢</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Noto Sans TC", sans-serif; background: #f8f5f0; color: #241c18; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 44px; }
    h1 { margin: 0 0 8px; font-size: 32px; font-weight: 800; color: #241c18; }
    p { color: #54443b; font-size: 17px; line-height: 1.6; }
    .panel { background: #fff; border: 2px solid #ded2c9; border-radius: 16px; padding: 20px; margin-top: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    label { display: block; font-weight: 800; font-size: 18px; margin-bottom: 10px; color: #241c18; }
    input { width: 100%; border: 2px solid #ded2c9; border-radius: 12px; padding: 12px 16px; font-size: 18px; color: #241c18; min-height: 52px; outline: none; }
    input:focus { border-color: #973b17; box-shadow: 0 0 0 2px #fcebdd; }
    button { width: 100%; border: 0; border-radius: 14px; padding: 14px 20px; font-size: 19px; font-weight: 800; color: #fff; background: #973b17; margin-top: 14px; min-height: 54px; cursor: pointer; transition: all 0.15s ease; }
    button:active { background: #7c2d0e; }
    button.secondary { background: #54443b; }
    .message { margin-top: 16px; padding: 14px 18px; border-radius: 12px; background: #f2ede9; color: #241c18; font-size: 16px; line-height: 1.6; }
    .error { background: #fee2e2; color: #b91c1c; }
    .order { background: #fff; border: 2px solid #ded2c9; border-radius: 16px; padding: 20px; margin-top: 18px; box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
    .order h2 { margin: 0 0 14px; font-size: 24px; font-weight: 800; color: #973b17; border-bottom: 1.5px solid #f2e6dc; padding-bottom: 10px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .item { border-bottom: 1px solid #f2ede9; padding: 10px 0; font-size: 17px; }
    .item b { display: block; color: #54443b; font-size: 15px; margin-bottom: 4px; font-weight: 700; }
    details { margin-top: 14px; }
    summary { cursor: pointer; font-weight: 800; color: #973b17; font-size: 17px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
<main>
  <h1>訂單查詢</h1>
  <p>查看已配對的訂單，可用案件編號或客戶姓名篩選。</p>
  <section class="panel">
    <label for="keyword">篩選案件編號或客戶姓名（選填）</label>
    <input id="keyword" autocomplete="off" placeholder="例如：115000035 或 王小美">
    <button id="searchBtn">篩選訂單</button>
    <div id="status" class="message" style="display:none;"></div>
    <button id="reauthenticate" class="secondary" type="button" hidden>重新登入 LINE</button>
  </section>
  <section id="results"></section>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
let lineIdToken = "";
let flowId = "";
let identityReady = false;

async function captureLineIdentity() {
  try { lineIdToken = liff.getIDToken() || ""; } catch (_) {}
  identityReady = Boolean(lineIdToken);
}

function showStatus(text, isError = false) {
  const box = document.getElementById("status");
  box.textContent = text;
  box.className = "message" + (isError ? " error" : "");
  box.style.display = "block";
}

function responseErrorCode(data) {
  return data.detail?.error?.code || data.detail?.code || data.error?.code || "";
}

function reauthenticateLine() {
  try { liff.logout(); } catch (_) {}
  const redirect = new URL("/line-identity", location.origin);
  redirect.searchParams.set("target", "staff_order_search");
  liff.login({redirectUri: redirect.toString()});
}

function valueText(value) {
  return value === null || value === undefined || value === "" ? "未填寫" : String(value);
}

function requireStaffOrderItem(value) {
  if (!value || typeof value !== "object" || Array.isArray(value)) throw new Error("訂單資料格式錯誤");
  if (typeof value.case_no !== "string" || typeof value.client_name !== "string") {
    throw new Error("訂單資料缺少必要欄位");
  }
  return value;
}

function requireStaffOrderPage(value) {
  if (!value || typeof value !== "object" || Array.isArray(value)) throw new Error("訂單查詢結果格式錯誤");
  if (!Number.isInteger(value.staff_id) || typeof value.staff_name !== "string" || !Array.isArray(value.items)) {
    throw new Error("訂單查詢結果缺少必要欄位");
  }
  return {...value, items: value.items.map(requireStaffOrderItem)};
}

function appendOrderField(root, label, value) {
  const row = document.createElement("div");
  row.className = "item";
  const key = document.createElement("b");
  key.textContent = label;
  row.append(key, document.createTextNode(valueText(value)));
  root.appendChild(row);
}

function renderResults(items) {
  const root = document.getElementById("results");
  root.replaceChildren();
  if (!items.length) {
    showStatus("找不到你可以看的案件。請核對案件編號或客戶姓名；如果還是找不到，請問工會。", true);
    return;
  }
  showStatus(`共找到 ${items.length} 筆訂單。請在下方查看案件資料。`);
  for (const item of items) {
    const rows = [
      ["案件編號", item.case_no],
      ["客戶姓名", item.client_name],
      ["客戶電話", item.client_phone],
      ["服務地址", `${valueText(item.city)} ${valueText(item.address)}`],
      ["案件狀態", item.order_status],
      ["服務期間", `${valueText(item.start_date)} 至 ${valueText(item.end_date)}`],
      ["服務天數", item.service_days],
      ["每日時數", item.service_hours_per_day],
      ["預產期/預計月份", item.due_month],
      ["預計服務日期", item.service_start_date],
      ["服務時間", item.service_time],
      ["居住型態", item.residence_type],
      ["生產方式", item.delivery_type],
      ["服務方式", item.service_type],
      ["胎數", item.multi_birth_count],
      ["其他事項", item.notes],
    ];
    const card = document.createElement("article");
    card.className = "order";
    const heading = document.createElement("h2");
    heading.textContent = `${valueText(item.client_name)}｜${valueText(item.case_no)}`;
    const grid = document.createElement("div");
    grid.className = "grid";
    rows.forEach(([label, value]) => appendOrderField(grid, label, value));
    card.append(heading, grid);
    root.appendChild(card);
  }
}

async function init() {
  const searchButton = document.getElementById("searchBtn");
  searchButton.disabled = true;
  searchButton.textContent = "正在確認 LINE 身分...";
  const params = new URLSearchParams(location.search);
  flowId = params.get("flow_id") || "";
  try {
    const result = await fetch("/api/v1/line/identity/runtime-config").then(r => r.json());
    const config = result.data || {};
    if (config.liff_id) {
      await liff.init({ liffId: config.liff_id });
      if (!liff.isLoggedIn()) {
        if (flowId) {
          identityReady = true;
          return;
        }
        const redirect = new URL("/line-identity", location.origin);
        redirect.searchParams.set("target", "staff_order_search");
        liff.login({redirectUri: redirect.toString()});
        return;
      }
      await captureLineIdentity();
    }
    if (!identityReady && !flowId) {
      showStatus("無法取得 LINE 身分，請關閉此頁後從 LINE 圖文選單重新開啟。", true);
    }
  } catch (err) {
    showStatus("無法確認 LINE 身分。請關閉此頁，再從 LINE 圖文選單重新開啟。", true);
  } finally {
    searchButton.disabled = false;
    searchButton.textContent = "篩選訂單";
    if (identityReady || flowId || lineIdToken) { await loadOrders(); }
  }
}

async function loadOrders(keyword = "") {
  if (!identityReady && !flowId && !lineIdToken) {
    showStatus("LINE 身分尚未載入完成，請稍候再查詢；若仍失敗，請關閉此頁後從 LINE 圖文選單重新開啟。", true);
    return;
  }
  showStatus("查詢中...");
  try {
    const response = await fetch("/api/v1/line/staff-self-service/orders", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ keyword, flow_id: flowId, line_id_token: lineIdToken })
    });
    const data = await response.json();
    if (!response.ok || !data.success) {
      showStatus(data.message || data.detail?.message || data.detail?.error?.message || "無法查詢訂單。請稍後再按「篩選訂單」。", true);
      document.getElementById("reauthenticate").hidden = !responseErrorCode(data).startsWith("liff_");
      document.getElementById("results").replaceChildren();
      return;
    }
    renderResults(requireStaffOrderPage(data.data).items);
  } catch (_) {
    document.getElementById("results").replaceChildren();
    showStatus("無法讀取查詢結果。請再按一次「篩選訂單」。若仍無法查看，請聯絡工會。", true);
  }
}

document.getElementById("searchBtn").addEventListener("click", async () => {
  const keyword = document.getElementById("keyword").value.trim();
  await loadOrders(keyword);
});

document.getElementById("reauthenticate").addEventListener("click", reauthenticateLine);

init();
</script>
</body>
</html>
