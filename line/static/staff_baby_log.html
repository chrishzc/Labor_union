<!DOCTYPE html>
<!--
File: staff_baby_log.html
Description: 提供已驗證月嫂依正式服務日提交寶寶日誌與受控餐食照片。
-->
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>月嫂寶寶日誌</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Noto Sans TC", sans-serif; background: #fff7f8; color: #27272a; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 44px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    h2 { margin: 0 0 6px; font-size: 21px; }
    p { color: #71717a; line-height: 1.6; }
    .panel { background: #fff; border: 1px solid #fecdd3; border-radius: 8px; padding: 16px; margin-top: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
    .field { margin-top: 12px; }
    label { display: block; font-weight: 700; margin-bottom: 7px; }
    input, textarea, select { width: 100%; border: 1px solid #d4d4d8; border-radius: 6px; padding: 11px; font-size: 16px; }
    textarea { min-height: 120px; resize: vertical; }
    button { border: 0; border-radius: 6px; padding: 13px 16px; font-size: 16px; font-weight: 700; }
    .primary { color: #fff; background: #be123c; }
    .secondary { margin-top: 10px; color: #9f1239; background: #ffe4e6; }
    button:disabled { cursor: not-allowed; opacity: .6; }
    .message { margin-top: 14px; padding: 12px; border-radius: 6px; background: #f4f4f5; color: #3f3f46; overflow-wrap: anywhere; }
    .error { background: #fee2e2; color: #b91c1c; }
    .photo { display: block; max-width: 100%; max-height: 420px; margin-top: 10px; object-fit: contain; }
    .hint { margin: 7px 0 0; font-size: 14px; }
    @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>寶寶日誌</h1>
  <p>請先選擇正式服務日，再填寫當日寶寶照護紀錄。</p>

  <section class="panel" aria-labelledby="serviceDayTitle">
    <h2 id="serviceDayTitle">選擇正式服務日</h2>
    <div class="form-grid">
      <div>
        <label for="monthInput">服務月份</label>
        <input id="monthInput" type="month">
      </div>
      <button id="loadServiceDays" class="primary" type="button" disabled>載入服務日</button>
    </div>
    <div class="field">
      <label for="serviceDay">正式服務日</label>
      <select id="serviceDay" disabled>
        <option value="">請先載入服務日</option>
      </select>
    </div>
    <div id="scheduleStatus" class="message" hidden></div>
    <button id="reauthenticate" class="secondary" type="button" hidden>重新登入 LINE</button>
  </section>

  <section class="panel" aria-labelledby="logTitle">
    <h2 id="logTitle">提交寶寶日誌</h2>
    <p id="selectedServiceDay">尚未選擇正式服務日。</p>
    <div class="field">
      <label for="babyLog">寶寶日誌</label>
      <textarea id="babyLog" maxlength="5000" placeholder="選擇服務日後填寫" disabled></textarea>
    </div>
    <div class="field">
      <label for="mealPhoto">日誌照片</label>
      <input id="mealPhoto" type="file" accept="image/jpeg,image/png" disabled>
      <p class="hint">需要下廚的服務日附一張餐食照；不需下廚時可附一張寶寶照。支援 JPG、PNG，選檔預覽不會直接送出。</p>
    </div>
    <p id="photoLimit" class="hint"></p>
    <figure id="photoPreview" hidden><img id="selectedPhoto" class="photo" alt="準備提交的日誌照片"><figcaption id="selectedPhotoName"></figcaption></figure>
    <button id="applyLog" class="primary" type="button" disabled>送出日誌</button>
    <div id="logStatus" class="message" hidden></div>
  </section>
  <section id="savedLog" class="panel" aria-labelledby="savedLogTitle" hidden>
    <h2 id="savedLogTitle">已提交的日誌</h2>
    <p id="savedLogText"></p>
    <button id="reloadLog" class="secondary" type="button">重新讀取日誌</button>
    <div id="savedPhotos"></div>
    <div id="photoStatus" class="message" role="status" hidden></div>
  </section>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
let lineIdToken = "";
let flowId = "";
let identityReady = false;
let serviceDays = [];
let selectedServiceDay = null;
let mediaCandidate = null;
let logCandidate = null;
let logOptions = null;
let logSubmitted = false;
let transferSettings = null;
let selectedPhotoUrl = null;
let savedPhotoUrl = null;
let savedLog = null;
let busy = false;
let uploadIdentity = null;
let applyOutcomeUnknown = false;

async function captureLineIdentity() {
  try { lineIdToken = liff.getIDToken() || ""; } catch (_) {}
  identityReady = Boolean(lineIdToken);
}

function show(id, text, isError = false) {
  const box = document.getElementById(id);
  box.textContent = text;
  box.className = "message" + (isError ? " error" : "");
  box.setAttribute("role", isError ? "alert" : "status");
  box.hidden = false;
}

function hide(id) {
  document.getElementById(id).hidden = true;
}

function identityPayload() {
  return {
    flow_id: lineIdToken ? "" : flowId,
    line_id_token: lineIdToken,
    development_line_user_id: "",
  };
}

async function responseData(response) {
  try { return await response.json(); } catch (_) { return {}; }
}

function fileSizeLabel(bytes) { return bytes < 1048576 ? `${bytes} bytes` : `${(bytes / 1048576).toFixed(2)} MiB`; }

function responseMessage(data, fallback) {
  const code = responseErrorCode(data);
  if (code.startsWith('liff_')) return 'LINE 登入已失效，請重新登入後再操作。';
  if (code.endsWith('_too_large') && transferSettings) return data.detail?.message || data.detail?.error?.message || `照片超過目前上限 ${fileSizeLabel(transferSettings.photo_max_bytes)}。本次未保存，請選擇較小檔案或請管理者調整上限。`;
  if (code === 'service_day_log_photo_not_found') return '找不到這張照片，或目前身分無法讀取，請重新讀取日誌。';
  if (code.includes('content_type') || code.endsWith('_is_empty')) return '請選擇有效且非空白的 JPG 或 PNG 圖片。';
  if (code === 'service_day_log_idempotency_conflict') return '這個服務日已有日誌，送出後不能修改。';
  if (code === 'service_day_log_meal_photo_required') return '請附上一張餐食照片。';
  if (code.includes('unavailable')) return '檔案服務目前無法使用，請稍後重試；已保存的資料不會因此刪除。';
  return data.message || data.detail?.message || data.detail?.error?.message || data.error?.message || fallback;
}

async function transferRequest(url, options, binary = false) {
  const controller = new AbortController();
  const milliseconds = transferSettings.timeout_seconds * 1000;
  const timer = milliseconds > 0 ? setTimeout(() => controller.abort(), milliseconds) : null;
  try {
    const response = await fetch(url, {...options, signal: controller.signal, cache: 'no-store'});
    const data = binary && response.ok ? await response.blob() : await responseData(response);
    return {response, data};
  } catch (_) {
    throw new Error('連線中斷或等待逾時，結果尚未確認。請保留內容，不要重新建立另一筆送出。');
  } finally { if (timer !== null) clearTimeout(timer); }
}

function setBusy(value) {
  busy = value;
  for (const id of ['monthInput', 'loadServiceDays', 'serviceDay', 'babyLog', 'mealPhoto']) {
    document.getElementById(id).disabled = value || applyOutcomeUnknown ||
      (['babyLog', 'mealPhoto'].includes(id) && (!selectedServiceDay || logSubmitted));
  }
  document.getElementById('applyLog').disabled = value || logSubmitted || !selectedServiceDay || !logOptions;
  document.getElementById('applyLog').textContent = applyOutcomeUnknown ? '以原操作重試' : '送出日誌';
}

function clearSelectedPhoto() {
  if (selectedPhotoUrl) URL.revokeObjectURL(selectedPhotoUrl);
  selectedPhotoUrl = null;
  document.getElementById('selectedPhoto').removeAttribute('src');
  document.getElementById('photoPreview').hidden = true;
}

function selectPhoto() {
  clearSelectedPhoto(); mediaCandidate = null; uploadIdentity = null; invalidateSubmission();
  const file = document.getElementById('mealPhoto').files?.[0];
  if (!file) return;
  if (!['image/jpeg', 'image/png'].includes(file.type) || file.size === 0) {
    show('logStatus', '請選擇有效且非空白的 JPG 或 PNG 圖片。', true);
    document.getElementById('mealPhoto').value = ''; return;
  }
  if (file.size > transferSettings.photo_max_bytes) {
    show('logStatus', `所選照片 ${fileSizeLabel(file.size)}，超過目前上限 ${fileSizeLabel(transferSettings.photo_max_bytes)}。本次未上傳，請選擇較小檔案或請管理者調整上限。`, true);
    document.getElementById('mealPhoto').value = ''; return;
  }
  selectedPhotoUrl = URL.createObjectURL(file);
  document.getElementById('selectedPhoto').src = selectedPhotoUrl;
  document.getElementById('selectedPhotoName').textContent = `${file.name}（${fileSizeLabel(file.size)}），尚未提交`;
  document.getElementById('photoPreview').hidden = false;
}

async function loadPhotoSettings() {
  const response = await fetch('/api/v1/line/staff-self-service/service-day-media/settings', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(identityPayload()),
  });
  const result = await responseData(response);
  if (!response.ok || !result.data) { showReauthenticationFor(result); throw new Error(responseMessage(result, '無法讀取檔案設定，請稍後重新開啟。')); }
  const value = result.data;
  if (!Number.isSafeInteger(value.photo_max_bytes) || value.photo_max_bytes < 1 || !Number.isSafeInteger(value.timeout_seconds) || value.timeout_seconds < 0) throw new Error('檔案設定無法確認，請聯絡管理者。');
  transferSettings = value;
  document.getElementById('photoLimit').textContent = `照片上限：${fileSizeLabel(value.photo_max_bytes)}。`;
}

function renderSavedLog(value) {
  savedLog = value;
  if (savedPhotoUrl) URL.revokeObjectURL(savedPhotoUrl);
  savedPhotoUrl = null;
  document.getElementById('savedLog').hidden = false;
  document.getElementById('savedLogText').textContent = `${value.service_date}｜案件 ${value.case_no}｜${value.baby_log_text}`;
  const target = document.getElementById('savedPhotos'); target.replaceChildren();
  hide('photoStatus');
  for (const attachment of value.controlled_file_attachments) {
    const fileId = attachment.controlled_file_object_id;
    if (!/^cf_[0-9a-f]{32}$/.test(fileId || '')) continue;
    const row = document.createElement('div');
    const image = document.createElement('img'); image.alt = '已保存的日誌照片'; image.className = 'photo'; image.hidden = true;
    for (const [label, download] of [['查看照片', false], ['下載照片', true]]) {
      const button = document.createElement('button'); button.type = 'button'; button.className = 'secondary'; button.textContent = label;
      button.addEventListener('click', async () => {
        const buttons = row.querySelectorAll('button'); buttons.forEach(item => item.disabled = true);
        show('photoStatus', '正在讀取照片，請稍候…');
        try {
          const {response, data} = await transferRequest(`/api/v1/line/staff-self-service/service-day-logs/${value.log_id}/photos/${fileId}/download`, {
            method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(identityPayload()),
          }, true);
          if (!response.ok) { showReauthenticationFor(data); throw new Error(responseMessage(data, '照片讀取失敗，請重試。')); }
          if (!['image/jpeg', 'image/png'].includes(data.type.split(';')[0])) throw new Error('照片格式無法確認，請重新讀取日誌。');
          const url = URL.createObjectURL(data);
          if (download) {
            const anchor = document.createElement('a'); anchor.href = url; anchor.download = `${fileId}.${data.type.startsWith('image/png') ? 'png' : 'jpg'}`; anchor.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
          } else {
            if (savedPhotoUrl) URL.revokeObjectURL(savedPhotoUrl);
            savedPhotoUrl = url; image.src = url; image.hidden = false;
          }
          show('photoStatus', download ? '已交由瀏覽器下載照片。' : '照片已載入。');
        } catch (error) { show('photoStatus', error.message || '照片讀取失敗。', true); }
        finally { buttons.forEach(item => item.disabled = false); }
      });
      row.appendChild(button);
    }
    row.appendChild(image); target.appendChild(row);
  }
}

async function reloadSavedLog() {
  if (!savedLog) return;
  const button = document.getElementById('reloadLog'); button.disabled = true;
  try {
    const {response, data} = await transferRequest(`/api/v1/line/staff-self-service/service-day-logs/${savedLog.log_id}/query`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(identityPayload()),
    });
    if (!response.ok || !data.data) { showReauthenticationFor(data); throw new Error(responseMessage(data, '日誌讀取失敗，請重試。')); }
    renderSavedLog(requireLogReadback(data.data));
  } catch (error) { show('photoStatus', error.message || '日誌讀取失敗。', true); }
  finally { button.disabled = false; }
}

function responseErrorCode(data) {
  return data.detail?.error?.code || data.detail?.code || data.error?.code || "";
}

function showReauthenticationFor(data) {
  document.getElementById("reauthenticate").hidden = !responseErrorCode(data).startsWith("liff_");
}

function reauthenticateLine() {
  try { liff.logout(); } catch (_) {}
  const redirect = new URL("/line-identity", location.origin);
  redirect.searchParams.set("target", "staff_baby_log");
  liff.login({redirectUri: redirect.toString()});
}

function requireScheduleDay(value) {
  if (!value || typeof value !== "object" || Array.isArray(value) ||
      typeof value.work_date !== "string" || typeof value.status !== "string") {
    throw new Error("班表日期格式錯誤");
  }
  return value;
}

function requireStaffSchedule(value) {
  if (!value || typeof value !== "object" || Array.isArray(value) ||
      typeof value.staff_name !== "string" || !Array.isArray(value.days)) {
    throw new Error("班表格式錯誤");
  }
  return {...value, days: value.days.map(requireScheduleDay)};
}

function resetServiceDaySelection(message = "請先載入服務日") {
  serviceDays = [];
  selectedServiceDay = null;
  const select = document.getElementById("serviceDay");
  select.replaceChildren();
  const option = document.createElement("option");
  option.value = "";
  option.textContent = message;
  select.appendChild(option);
  select.disabled = true;
  document.getElementById("selectedServiceDay").textContent = "尚未選擇正式服務日。";
  document.getElementById("babyLog").disabled = true;
  document.getElementById("mealPhoto").disabled = true;
  logOptions = null; logSubmitted = false;
  document.getElementById("mealPhoto").value = "";
  mediaCandidate = null; uploadIdentity = null; clearSelectedPhoto();
  invalidateSubmission();
}

function renderServiceDays(schedule) {
  serviceDays = schedule.days.filter(day =>
    day.status === "working" && day.is_work_day === true &&
    Number.isInteger(day.assignment_id) && day.assignment_id > 0
  );
  const select = document.getElementById("serviceDay");
  select.replaceChildren();
  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = serviceDays.length ? "請選擇正式服務日" : "本月份沒有可填寫的正式服務日";
  select.appendChild(placeholder);
  serviceDays.forEach((day, index) => {
    const option = document.createElement("option");
    option.value = String(index);
    option.textContent = `${day.work_date}${day.case_no ? `｜案件 ${day.case_no}` : ""}${day.client_name ? `｜${day.client_name}` : ""}`;
    select.appendChild(option);
  });
  select.disabled = !serviceDays.length;
  show("scheduleStatus", serviceDays.length
    ? `${schedule.staff_name} 本月份共有 ${serviceDays.length} 個正式服務日。`
    : `${schedule.staff_name} 本月份沒有可填寫的正式服務日。`);
}

async function loadServiceDays() {
  const value = document.getElementById("monthInput").value;
  if (!value) {
    show("scheduleStatus", "請先選擇服務月份。", true);
    return;
  }
  const [year, month] = value.split("-").map(Number);
  const button = document.getElementById("loadServiceDays");
  button.disabled = true;
  resetServiceDaySelection("服務日載入中...");
  show("scheduleStatus", "正式服務日載入中...");
  try {
    const response = await fetch(`/api/v1/line/staff-self-service/schedule?year=${year}&month=${month}`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(identityPayload()),
    });
    const result = await responseData(response);
    if (!response.ok || result.success === false || !result.data) {
      show("scheduleStatus", responseMessage(result, "服務日載入失敗。"), true);
      showReauthenticationFor(result);
      return;
    }
    renderServiceDays(requireStaffSchedule(result.data));
  } catch (_) {
    show("scheduleStatus", "服務日無法載入或資料格式不正確，請稍後重試。", true);
  } finally {
    button.disabled = !identityReady && !flowId;
  }
}

async function selectServiceDay() {
  const rawIndex = document.getElementById("serviceDay").value;
  selectedServiceDay = rawIndex === "" ? null : serviceDays[Number(rawIndex)] || null;
  const selected = selectedServiceDay;
  logOptions = null; logSubmitted = false;
  document.getElementById("mealPhoto").value = "";
  document.getElementById("babyLog").value = "";
  mediaCandidate = null; uploadIdentity = null; clearSelectedPhoto(); invalidateSubmission();
  document.getElementById("selectedServiceDay").textContent = selected
    ? `已選擇 ${selected.work_date}${selected.case_no ? `｜案件 ${selected.case_no}` : ""}`
    : "尚未選擇正式服務日。";
  if (!selected) { setBusy(false); return; }
  setBusy(true);
  try {
    const {response, data} = await transferRequest('/api/v1/line/staff-self-service/service-day-logs/options', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({...identityPayload(), assignment_id:selected.assignment_id, service_date:selected.work_date}),
    });
    if (!response.ok || typeof data.data?.requires_cooking !== 'boolean') {
      showReauthenticationFor(data);
      throw new Error(responseMessage(data, '服務資料不完整，請聯絡工會人員。'));
    }
    if (selectedServiceDay !== selected) return;
    logOptions = data.data;
    document.querySelector('label[for="mealPhoto"]').textContent = logOptions.requires_cooking ? '餐食照片（必填）' : '寶寶照片（選填）';
    hide('logStatus');
  } catch (error) { show('logStatus', error.message || '服務資料讀取失敗，請重新選擇服務日。', true); }
  finally { setBusy(false); }
}

function requireMealPhotoStage(value) {
  if (!value || typeof value !== "object" || Array.isArray(value) ||
      !/^cfs_[0-9a-f]{32}$/.test(value.staging_id) ||
      !/^[0-9a-f]{64}$/.test(value.sha256_digest) ||
      !["image/jpeg", "image/png"].includes(value.content_type) ||
      !Number.isInteger(value.size_bytes) || value.size_bytes <= 0 ||
      typeof value.expires_at !== "string") {
    throw new Error("餐食照片 staging 格式錯誤");
  }
  return value;
}

function requireLogReadback(value) {
  if (!value || typeof value !== "object" || Array.isArray(value) ||
      !Number.isInteger(value.log_id) || typeof value.case_no !== "string" ||
      !Number.isInteger(value.assignment_id) || typeof value.service_date !== "string" ||
      typeof value.baby_log_text !== "string" || typeof value.requires_cooking !== "boolean" ||
      !new Set(["created", "existing"]).has(value.outcome) ||
      !Array.isArray(value.controlled_file_attachments)) throw new Error("寶寶日誌回讀格式錯誤");
  return value;
}

function invalidateSubmission() {
  if (applyOutcomeUnknown) return;
  logCandidate = null;
  setBusy(busy);
}

async function stageMealPhoto(attachmentKind) {
  const input = document.getElementById("mealPhoto");
  const file = input.files && input.files[0];
  if (!file) {
    mediaCandidate = null;
    return null;
  }
  if (!selectedServiceDay) throw new Error("請先選擇正式服務日。");
  const form = new FormData();
  const identity = identityPayload();
  form.append("flow_id", identity.flow_id);
  form.append("line_id_token", identity.line_id_token);
  form.append("development_line_user_id", identity.development_line_user_id);
  form.append("assignment_id", String(selectedServiceDay.assignment_id));
  form.append("service_date", selectedServiceDay.work_date);
  form.append("photo", file, file.name);
  form.append("attachment_kind", attachmentKind);
  if (!uploadIdentity) uploadIdentity = `service-day-media-${crypto.randomUUID()}`;
  const {response, data: result} = await transferRequest("/api/v1/line/staff-self-service/service-day-media", {
    method: "POST",
    headers: {"Idempotency-Key": uploadIdentity},
    body: form,
  });
  if (!response.ok || result.success === false || !result.data) {
    showReauthenticationFor(result);
    throw new Error(responseMessage(result, "照片上傳未完成，請保留原檔案後重試。"));
  }
  const staged = requireMealPhotoStage(result.data);
  mediaCandidate = {
    controlled_file_object_id: null,
    staging_id: staged.staging_id,
    sha256_digest: staged.sha256_digest,
    attachment_kind: attachmentKind,
    sequence: 1,
  };
  return mediaCandidate;
}


async function applyServiceDayLog() {
  if (busy) return;
  const text = document.getElementById('babyLog').value.trim();
  if (!selectedServiceDay || !logOptions || (!applyOutcomeUnknown && !text)) {
    show('logStatus', '請選擇服務日並填寫日誌。', true); return;
  }
  if (!applyOutcomeUnknown && logOptions.requires_cooking && !document.getElementById('mealPhoto').files?.[0]) {
    show('logStatus', '請附上一張餐食照片。', true); return;
  }
  let applyCommitted = false;
  setBusy(true);
  show('logStatus', '正在送出寶寶日誌...');
  try {
    if (!logCandidate) {
      const photo = mediaCandidate || await stageMealPhoto(logOptions.requires_cooking ? 'meal_photo' : 'baby_log_photo');
      logCandidate = {assignmentId:selectedServiceDay.assignment_id, serviceDate:selectedServiceDay.work_date,
        text, controlledFileAttachments:photo ? [photo] : [], idempotencyKey:`service-day-log-${crypto.randomUUID()}`};
    }
    const candidate = logCandidate;
    const {response, data: result} = await transferRequest("/api/v1/line/staff-self-service/service-day-logs/apply", {
      method: "POST",
      headers: {"Content-Type": "application/json", "Idempotency-Key": candidate.idempotencyKey},
      body: JSON.stringify({...identityPayload(), assignment_id: candidate.assignmentId, service_date: candidate.serviceDate, baby_log_text: candidate.text, controlled_file_attachments: candidate.controlledFileAttachments}),
    });
    if (!response.ok || result.success === false || !result.data?.receipt || !result.data?.readback) {
      const unknown = responseErrorCode(result) === "service_day_log_apply_outcome_unknown" || response.status >= 500;
      applyOutcomeUnknown = unknown;
      if (!unknown) logCandidate = null;
      show("logStatus", unknown ? "送出結果尚未確認。請勿重複送出，並聯絡工會人員查核。" : responseMessage(result, "寶寶日誌送出失敗，請核對內容後重試。"), true);
      showReauthenticationFor(result);
      return;
    }
    const committed = requireLogReadback(result.data.readback);
    applyCommitted = true;
    applyOutcomeUnknown = false;
    if (selectedPhotoUrl) document.getElementById('selectedPhotoName').textContent = '照片已隨本次日誌保存。';
    renderSavedLog(committed);
    logCandidate = null;
    logSubmitted = true;
    const {response: readbackResponse, data: readbackResult} = await transferRequest(`/api/v1/line/staff-self-service/service-day-logs/${committed.log_id}/query`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(identityPayload()),
    });
    if (!readbackResponse.ok || readbackResult.success === false || !readbackResult.data) {
      show("logStatus", "日誌已送出，但目前無法重新讀取結果。請勿重複送出，並聯絡工會人員查核。", true);
      return;
    }
    const readback = requireLogReadback(readbackResult.data);
    renderSavedLog(readback);
    show("logStatus", `寶寶日誌 #${readback.log_id} 已送出：${readback.service_date}｜案件 ${readback.case_no}。`);
  } catch (_) {
    applyOutcomeUnknown = !applyCommitted;
    show("logStatus", applyCommitted ? "日誌已送出，但目前無法重新讀取結果。請勿重複送出，並聯絡工會人員查核。" : "送出結果尚未確認。請勿重複送出，並聯絡工會人員查核。", true);
  } finally { setBusy(false); }
}

async function init() {
  const now = new Date();
  document.getElementById("monthInput").value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  flowId = new URLSearchParams(location.search).get("flow_id") || "";
  try {
    const result = await fetch("/api/v1/line/identity/runtime-config").then(response => response.json());
    const config = result.data || {};
    if (config.liff_id) {
      await liff.init({liffId: config.liff_id});
      if (!liff.isLoggedIn()) {
        if (flowId) identityReady = true;
        else {
          const redirect = new URL("/line-identity", location.origin);
          redirect.searchParams.set("target", "staff_baby_log");
          liff.login({redirectUri: redirect.toString()});
          return;
        }
      } else {
        await captureLineIdentity();
      }
    }
  } catch (_) {
    show("scheduleStatus", "LIFF 初始化失敗，請重新開啟頁面。", true);
    document.getElementById("reauthenticate").hidden = false;
  }
  if (!lineIdToken && !flowId) {
    show("scheduleStatus", "無法取得 LINE 身分，請從 LINE 圖文選單重新開啟。", true);
    document.getElementById("reauthenticate").hidden = false;
    return;
  }
  if (!lineIdToken) {
    show('scheduleStatus', '請重新登入 LINE，以取得本人日誌及照片的操作身分。', true);
    document.getElementById('reauthenticate').hidden = false; return;
  }
  try { await loadPhotoSettings(); }
  catch (error) { show('scheduleStatus', error.message, true); return; }
  identityReady = true;
  document.getElementById("loadServiceDays").disabled = false;
  await loadServiceDays();
}

document.getElementById("loadServiceDays").addEventListener("click", loadServiceDays);
document.getElementById("serviceDay").addEventListener("change", selectServiceDay);
document.getElementById("applyLog").addEventListener("click", applyServiceDayLog);
document.getElementById("babyLog").addEventListener("input", invalidateSubmission);
document.getElementById('mealPhoto').addEventListener('change', selectPhoto);
document.getElementById('reloadLog').addEventListener('click', reloadSavedLog);
window.addEventListener('pagehide', () => {
  clearSelectedPhoto(); if (savedPhotoUrl) URL.revokeObjectURL(savedPhotoUrl);
});
document.getElementById("monthInput").addEventListener("change", () => resetServiceDaySelection());
document.getElementById("reauthenticate").addEventListener("click", reauthenticateLine);
init();
</script>
