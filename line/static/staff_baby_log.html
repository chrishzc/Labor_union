<!DOCTYPE html>
<!--
File: staff_baby_log.html
Description: 提供已驗證月嫂依正式服務日提交寶寶日誌與受控餐食照片。
-->
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>月嫂寶寶日誌</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Noto Sans TC", sans-serif; background: #fff7f8; color: #27272a; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 44px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    h2 { margin: 0 0 6px; font-size: 21px; }
    p { color: #71717a; line-height: 1.6; }
    .panel { background: #fff; border: 1px solid #fecdd3; border-radius: 8px; padding: 16px; margin-top: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
    .field { margin-top: 12px; }
    label { display: block; font-weight: 700; margin-bottom: 7px; }
    input, textarea, select { width: 100%; border: 1px solid #d4d4d8; border-radius: 6px; padding: 11px; font-size: 16px; }
    textarea { min-height: 120px; resize: vertical; }
    button { border: 0; border-radius: 6px; padding: 13px 16px; font-size: 16px; font-weight: 700; }
    .primary { color: #fff; background: #be123c; }
    .secondary { margin-top: 10px; color: #9f1239; background: #ffe4e6; }
    button:disabled { cursor: not-allowed; opacity: .6; }
    .message { margin-top: 14px; padding: 12px; border-radius: 6px; background: #f4f4f5; color: #3f3f46; overflow-wrap: anywhere; }
    .error { background: #fee2e2; color: #b91c1c; }
    .hint { margin: 7px 0 0; font-size: 14px; }
    @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>寶寶日誌</h1>
  <p>請先選擇正式服務日，再填寫當日寶寶照護紀錄。</p>

  <section class="panel" aria-labelledby="serviceDayTitle">
    <h2 id="serviceDayTitle">選擇正式服務日</h2>
    <div class="form-grid">
      <div>
        <label for="monthInput">服務月份</label>
        <input id="monthInput" type="month">
      </div>
      <button id="loadServiceDays" class="primary" type="button" disabled>載入服務日</button>
    </div>
    <div class="field">
      <label for="serviceDay">正式服務日</label>
      <select id="serviceDay" disabled>
        <option value="">請先載入服務日</option>
      </select>
    </div>
    <div id="scheduleStatus" class="message" hidden></div>
    <button id="reauthenticate" class="secondary" type="button" hidden>重新登入 LINE</button>
  </section>

  <section class="panel" aria-labelledby="logTitle">
    <h2 id="logTitle">提交寶寶日誌</h2>
    <p id="selectedServiceDay">尚未選擇正式服務日。</p>
    <div class="field">
      <label for="babyLog">寶寶日誌</label>
      <textarea id="babyLog" maxlength="5000" placeholder="選擇服務日後填寫" disabled></textarea>
    </div>
    <div class="field">
      <label for="mealPhoto">餐食照片</label>
      <input id="mealPhoto" type="file" accept="image/jpeg,image/png" disabled>
      <p class="hint">需要下廚的服務日必須上傳一張 JPG 或 PNG；照片會先進入受控檔案 staging，送出日誌時才會一併登錄。</p>
    </div>
    <button id="previewLog" class="primary" type="button" disabled>預覽寶寶日誌</button>
    <div id="logPreview" class="message" hidden></div>
    <label id="confirmLogLabel" class="field" hidden>
      <input id="confirmLog" type="checkbox" disabled>
      我已核對服務日與日誌內容，並要正式送出。
    </label>
    <button id="applyLog" class="primary" type="button" disabled>確認送出日誌</button>
    <div id="logStatus" class="message" hidden></div>
  </section>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
let lineIdToken = "";
let flowId = "";
let identityReady = false;
let serviceDays = [];
let selectedServiceDay = null;
let mediaCandidate = null;
let logCandidate = null;

async function captureLineIdentity() {
  try { lineIdToken = liff.getIDToken() || ""; } catch (_) {}
  identityReady = Boolean(lineIdToken);
}

function show(id, text, isError = false) {
  const box = document.getElementById(id);
  box.textContent = text;
  box.className = "message" + (isError ? " error" : "");
  box.hidden = false;
}

function hide(id) {
  document.getElementById(id).hidden = true;
}

function identityPayload() {
  return {
    flow_id: lineIdToken ? "" : flowId,
    line_id_token: lineIdToken,
    development_line_user_id: "",
  };
}

async function responseData(response) {
  try { return await response.json(); } catch (_) { return {}; }
}

function responseMessage(data, fallback) {
  return data.message || data.detail?.message || data.detail?.error?.message || data.error?.message || fallback;
}

function responseErrorCode(data) {
  return data.detail?.error?.code || data.detail?.code || data.error?.code || "";
}

function showReauthenticationFor(data) {
  document.getElementById("reauthenticate").hidden = !responseErrorCode(data).startsWith("liff_");
}

function reauthenticateLine() {
  try { liff.logout(); } catch (_) {}
  const redirect = new URL("/line-identity", location.origin);
  redirect.searchParams.set("target", "staff_baby_log");
  liff.login({redirectUri: redirect.toString()});
}

function requireScheduleDay(value) {
  if (!value || typeof value !== "object" || Array.isArray(value) ||
      typeof value.work_date !== "string" || typeof value.status !== "string") {
    throw new Error("班表日期格式錯誤");
  }
  return value;
}

function requireStaffSchedule(value) {
  if (!value || typeof value !== "object" || Array.isArray(value) ||
      typeof value.staff_name !== "string" || !Array.isArray(value.days)) {
    throw new Error("班表格式錯誤");
  }
  return {...value, days: value.days.map(requireScheduleDay)};
}

function resetServiceDaySelection(message = "請先載入服務日") {
  serviceDays = [];
  selectedServiceDay = null;
  const select = document.getElementById("serviceDay");
  select.replaceChildren();
  const option = document.createElement("option");
  option.value = "";
  option.textContent = message;
  select.appendChild(option);
  select.disabled = true;
  document.getElementById("selectedServiceDay").textContent = "尚未選擇正式服務日。";
  document.getElementById("babyLog").disabled = true;
  document.getElementById("mealPhoto").disabled = true;
  document.getElementById("previewLog").disabled = true;
  document.getElementById("mealPhoto").value = "";
  mediaCandidate = null;
  invalidateLogPreview();
}

function renderServiceDays(schedule) {
  serviceDays = schedule.days.filter(day =>
    day.status === "working" && day.is_work_day === true &&
    Number.isInteger(day.assignment_id) && day.assignment_id > 0
  );
  const select = document.getElementById("serviceDay");
  select.replaceChildren();
  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = serviceDays.length ? "請選擇正式服務日" : "本月份沒有可填寫的正式服務日";
  select.appendChild(placeholder);
  serviceDays.forEach((day, index) => {
    const option = document.createElement("option");
    option.value = String(index);
    option.textContent = `${day.work_date}${day.case_no ? `｜案件 ${day.case_no}` : ""}${day.client_name ? `｜${day.client_name}` : ""}`;
    select.appendChild(option);
  });
  select.disabled = !serviceDays.length;
  show("scheduleStatus", serviceDays.length
    ? `${schedule.staff_name} 本月份共有 ${serviceDays.length} 個正式服務日。`
    : `${schedule.staff_name} 本月份沒有可填寫的正式服務日。`);
}

async function loadServiceDays() {
  const value = document.getElementById("monthInput").value;
  if (!value) {
    show("scheduleStatus", "請先選擇服務月份。", true);
    return;
  }
  const [year, month] = value.split("-").map(Number);
  const button = document.getElementById("loadServiceDays");
  button.disabled = true;
  resetServiceDaySelection("服務日載入中...");
  show("scheduleStatus", "正式服務日載入中...");
  try {
    const response = await fetch(`/api/v1/line/staff-self-service/schedule?year=${year}&month=${month}`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(identityPayload()),
    });
    const result = await responseData(response);
    if (!response.ok || result.success === false || !result.data) {
      show("scheduleStatus", responseMessage(result, "服務日載入失敗。"), true);
      showReauthenticationFor(result);
      return;
    }
    renderServiceDays(requireStaffSchedule(result.data));
  } catch (_) {
    show("scheduleStatus", "服務日無法載入或資料格式不正確，請稍後重試。", true);
  } finally {
    button.disabled = !identityReady && !flowId;
  }
}

function selectServiceDay() {
  const rawIndex = document.getElementById("serviceDay").value;
  selectedServiceDay = rawIndex === "" ? null : serviceDays[Number(rawIndex)] || null;
  document.getElementById("babyLog").disabled = !selectedServiceDay;
  document.getElementById("mealPhoto").disabled = !selectedServiceDay;
  document.getElementById("previewLog").disabled = !selectedServiceDay;
  document.getElementById("mealPhoto").value = "";
  mediaCandidate = null;
  invalidateLogPreview();
  document.getElementById("selectedServiceDay").textContent = selectedServiceDay
    ? `已選擇 ${selectedServiceDay.work_date}${selectedServiceDay.case_no ? `｜案件 ${selectedServiceDay.case_no}` : ""}`
    : "尚未選擇正式服務日。";
}

function requireLogPreview(value) {
  if (!value || typeof value !== "object" || Array.isArray(value) ||
      typeof value.case_no !== "string" || !Number.isInteger(value.assignment_id) ||
      typeof value.service_date !== "string" || typeof value.baby_log_text !== "string" ||
      ![true, false, null].includes(value.requires_cooking) || typeof value.can_apply !== "boolean" ||
      !Array.isArray(value.blockers) || !/^[0-9a-f]{64}$/.test(value.preview_fingerprint)) {
    throw new Error("寶寶日誌預覽格式錯誤");
  }
  return value;
}

function requireMealPhotoStage(value) {
  if (!value || typeof value !== "object" || Array.isArray(value) ||
      !/^cfs_[0-9a-f]{32}$/.test(value.staging_id) ||
      !/^[0-9a-f]{64}$/.test(value.sha256_digest) ||
      !["image/jpeg", "image/png"].includes(value.content_type) ||
      !Number.isInteger(value.size_bytes) || value.size_bytes <= 0 ||
      typeof value.expires_at !== "string") {
    throw new Error("餐食照片 staging 格式錯誤");
  }
  return value;
}

function requireLogReadback(value) {
  if (!value || typeof value !== "object" || Array.isArray(value) ||
      !Number.isInteger(value.log_id) || typeof value.case_no !== "string" ||
      !Number.isInteger(value.assignment_id) || typeof value.service_date !== "string" ||
      typeof value.baby_log_text !== "string" || typeof value.requires_cooking !== "boolean" ||
      !new Set(["created", "existing"]).has(value.outcome) ||
      !Array.isArray(value.controlled_file_attachments)) throw new Error("寶寶日誌回讀格式錯誤");
  return value;
}

function invalidateLogPreview() {
  const hadCandidate = Boolean(logCandidate);
  logCandidate = null;
  hide("logPreview");
  document.getElementById("confirmLogLabel").hidden = true;
  document.getElementById("confirmLog").checked = false;
  document.getElementById("confirmLog").disabled = true;
  document.getElementById("applyLog").disabled = true;
  if (hadCandidate) show("logStatus", "內容已變更，請重新預覽後再確認送出。");
}

function logBlockerMessage(blockers) {
  if (blockers.includes("service_day_log_meal_photo_required")) return "此案件需要餐食照片；請選擇 JPG 或 PNG 後重新預覽。";
  if (blockers.includes("service_day_log_meal_photo_forbidden")) return "此案件不需要餐食照片；請移除照片後重新預覽。";
  if (blockers.includes("service_day_log_cooking_requirement_unresolved")) return "此案件的下廚需求尚未確定，請先由工會人員補齊訂單資料。";
  return "目前無法送出，請聯絡工會人員確認。";
}

async function stageMealPhoto() {
  const input = document.getElementById("mealPhoto");
  const file = input.files && input.files[0];
  if (!file) {
    mediaCandidate = null;
    return null;
  }
  if (!selectedServiceDay) throw new Error("請先選擇正式服務日。");
  const form = new FormData();
  const identity = identityPayload();
  form.append("flow_id", identity.flow_id);
  form.append("line_id_token", identity.line_id_token);
  form.append("development_line_user_id", identity.development_line_user_id);
  form.append("assignment_id", String(selectedServiceDay.assignment_id));
  form.append("service_date", selectedServiceDay.work_date);
  form.append("photo", file, file.name);
  const response = await fetch("/api/v1/line/staff-self-service/service-day-media", {
    method: "POST",
    headers: {"Idempotency-Key": `service-day-media-${crypto.randomUUID()}`},
    body: form,
  });
  const result = await responseData(response);
  if (!response.ok || result.success === false || !result.data) {
    throw new Error(responseMessage(result, "餐食照片 staging 失敗，請重新選擇照片。"));
  }
  const staged = requireMealPhotoStage(result.data);
  mediaCandidate = {
    controlled_file_object_id: null,
    staging_id: staged.staging_id,
    sha256_digest: staged.sha256_digest,
    attachment_kind: "meal_photo",
    sequence: 1,
  };
  return mediaCandidate;
}

async function previewServiceDayLog() {
  const text = document.getElementById("babyLog").value.trim();
  if (!selectedServiceDay || !text) {
    show("logStatus", "請先選擇正式服務日並填寫寶寶日誌。", true);
    return;
  }
  const button = document.getElementById("previewLog");
  button.disabled = true;
  invalidateLogPreview();
  show("logStatus", "正在準備寶寶日誌預覽...");
  try {
    const previewRequest = async (attachments) => fetch("/api/v1/line/staff-self-service/service-day-logs/preview", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({...identityPayload(), assignment_id: selectedServiceDay.assignment_id, service_date: selectedServiceDay.work_date, baby_log_text: text, controlled_file_attachments: attachments}),
    });
    const initialResponse = await previewRequest([]);
    const initialResult = await responseData(initialResponse);
    if (!initialResponse.ok || initialResult.success === false || !initialResult.data) {
      show("logStatus", responseMessage(initialResult, "寶寶日誌預覽失敗，請稍後重試。"), true);
      showReauthenticationFor(initialResult);
      return;
    }
    const initialPreview = requireLogPreview(initialResult.data);
    const photoSelected = Boolean(document.getElementById("mealPhoto").files?.[0]);
    if (initialPreview.requires_cooking === false && photoSelected) {
      show("logStatus", logBlockerMessage(["service_day_log_meal_photo_forbidden"]), true);
      return;
    }
    if (initialPreview.requires_cooking !== true || !photoSelected) {
      setLogCandidate(initialPreview, [], text);
      return;
    }
    const stagedAttachment = await stageMealPhoto();
    const response = await previewRequest(stagedAttachment ? [stagedAttachment] : []);
    const result = await responseData(response);
    if (!response.ok || result.success === false || !result.data) {
      show("logStatus", responseMessage(result, "寶寶日誌預覽失敗，請稍後重試。"), true);
      showReauthenticationFor(result);
      return;
    }
    setLogCandidate(requireLogPreview(result.data), stagedAttachment ? [stagedAttachment] : [], text);
  } catch (error) {
    show("logStatus", error instanceof Error ? error.message : "無法載入寶寶日誌預覽，請稍後重試。", true);
  } finally {
    button.disabled = !selectedServiceDay;
  }
}

function setLogCandidate(preview, attachments, text) {
  logCandidate = {
    assignmentId: preview.assignment_id,
    serviceDate: preview.service_date,
    text,
    controlledFileAttachments: attachments,
    previewFingerprint: preview.preview_fingerprint,
    idempotencyKey: `service-day-log-${crypto.randomUUID()}`,
  };
  show("logPreview", `${preview.service_date}｜案件 ${preview.case_no}｜${preview.baby_log_text}`);
  document.getElementById("confirmLogLabel").hidden = false;
  document.getElementById("confirmLog").disabled = !preview.can_apply;
  show("logStatus", preview.can_apply ? "請核對預覽內容並勾選確認。" : logBlockerMessage(preview.blockers), !preview.can_apply);
}

async function applyServiceDayLog() {
  if (!logCandidate || !document.getElementById("confirmLog").checked) {
    show("logStatus", "請先預覽並勾選確認。", true);
    return;
  }
  const candidate = logCandidate;
  let applyCommitted = false;
  document.getElementById("applyLog").disabled = true;
  show("logStatus", "正在送出寶寶日誌...");
  try {
    const response = await fetch("/api/v1/line/staff-self-service/service-day-logs/apply", {
      method: "POST",
      headers: {"Content-Type": "application/json", "Idempotency-Key": candidate.idempotencyKey},
      body: JSON.stringify({...identityPayload(), assignment_id: candidate.assignmentId, service_date: candidate.serviceDate, baby_log_text: candidate.text, controlled_file_attachments: candidate.controlledFileAttachments, preview_fingerprint: candidate.previewFingerprint}),
    });
    const result = await responseData(response);
    if (!response.ok || result.success === false || !result.data?.receipt || !result.data?.readback) {
      logCandidate = null;
      const unknown = responseErrorCode(result) === "service_day_log_apply_outcome_unknown";
      show("logStatus", unknown ? "送出結果尚未確認。請勿重複送出，並聯絡工會人員查核。" : responseMessage(result, "寶寶日誌送出失敗；請重新預覽後再操作。"), true);
      showReauthenticationFor(result);
      return;
    }
    const committed = requireLogReadback(result.data.readback);
    applyCommitted = true;
    logCandidate = null;
    document.getElementById("confirmLog").disabled = true;
    const readbackResponse = await fetch(`/api/v1/line/staff-self-service/service-day-logs/${committed.log_id}/query`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(identityPayload()),
    });
    const readbackResult = await responseData(readbackResponse);
    if (!readbackResponse.ok || readbackResult.success === false || !readbackResult.data) {
      show("logStatus", "日誌已送出，但目前無法重新讀取結果。請勿重複送出，並聯絡工會人員查核。", true);
      return;
    }
    const readback = requireLogReadback(readbackResult.data);
    show("logStatus", `寶寶日誌 #${readback.log_id} 已送出：${readback.service_date}｜案件 ${readback.case_no}。`);
  } catch (_) {
    logCandidate = null;
    show("logStatus", applyCommitted ? "日誌已送出，但目前無法重新讀取結果。請勿重複送出，並聯絡工會人員查核。" : "送出結果尚未確認。請勿重複送出，並聯絡工會人員查核。", true);
  }
}

async function init() {
  const now = new Date();
  document.getElementById("monthInput").value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  flowId = new URLSearchParams(location.search).get("flow_id") || "";
  try {
    const result = await fetch("/api/v1/line/identity/runtime-config").then(response => response.json());
    const config = result.data || {};
    if (config.liff_id) {
      await liff.init({liffId: config.liff_id});
      if (!liff.isLoggedIn()) {
        if (flowId) identityReady = true;
        else {
          const redirect = new URL("/line-identity", location.origin);
          redirect.searchParams.set("target", "staff_baby_log");
          liff.login({redirectUri: redirect.toString()});
          return;
        }
      } else {
        await captureLineIdentity();
      }
    }
  } catch (_) {
    show("scheduleStatus", "LIFF 初始化失敗，請重新開啟頁面。", true);
    document.getElementById("reauthenticate").hidden = false;
  }
  if (!lineIdToken && !flowId) {
    show("scheduleStatus", "無法取得 LINE 身分，請從 LINE 圖文選單重新開啟。", true);
    document.getElementById("reauthenticate").hidden = false;
    return;
  }
  identityReady = true;
  document.getElementById("loadServiceDays").disabled = false;
  await loadServiceDays();
}

document.getElementById("loadServiceDays").addEventListener("click", loadServiceDays);
document.getElementById("serviceDay").addEventListener("change", selectServiceDay);
document.getElementById("previewLog").addEventListener("click", previewServiceDayLog);
document.getElementById("applyLog").addEventListener("click", applyServiceDayLog);
document.getElementById("babyLog").addEventListener("input", invalidateLogPreview);
document.getElementById("mealPhoto").addEventListener("change", () => {
  mediaCandidate = null;
  invalidateLogPreview();
});
document.getElementById("confirmLog").addEventListener("change", event => {
  document.getElementById("applyLog").disabled = !logCandidate || !event.currentTarget.checked;
});
document.getElementById("monthInput").addEventListener("change", () => resetServiceDaySelection());
document.getElementById("reauthenticate").addEventListener("click", reauthenticateLine);
init();
</script>
</body>
</html>
