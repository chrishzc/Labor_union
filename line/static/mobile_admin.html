<!-- File: mobile_admin.html | Description: LINE LIFF mobile administration for linked union staff. -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工會手機管理</title>
  <style>
    :root { --green:#059669; --red:#BE123C; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --bg:#f8fafc; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink); }
    main { max-width:760px; margin:0 auto; padding:18px 14px 40px; }
    h1 { margin:0 0 8px; font-size:28px; }
    .caption { color:var(--muted); margin:0 0 18px; line-height:1.5; }
    .tabs { display:flex; gap:8px; margin-bottom:14px; position:sticky; top:0; background:var(--bg); padding:8px 0; z-index:2; }
    .tab { flex:1; border:1px solid var(--line); background:white; color:var(--ink); border-radius:12px; padding:12px 8px; font-size:16px; font-weight:700; }
    .tab.active { background:var(--green); border-color:var(--green); color:white; }
    .toolbar { display:flex; gap:8px; margin-bottom:12px; }
    select,input,textarea { width:100%; border:1px solid var(--line); border-radius:12px; padding:12px; font-size:16px; background:white; }
    textarea { min-height:104px; resize:vertical; }
    button { border:0; border-radius:12px; padding:12px 14px; font-size:16px; font-weight:700; background:var(--green); color:white; }
    button.secondary { background:#64748b; }
    button.danger { background:var(--red); }
    button:disabled { background:#cbd5e1; }
    .card { background:white; border:1px solid var(--line); border-radius:16px; padding:14px; margin:10px 0; box-shadow:0 2px 10px rgba(15,23,42,.04); }
    .row { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .pill { display:inline-block; border-radius:999px; background:#ecfdf5; color:#047857; padding:4px 8px; font-size:13px; }
    .events { border-top:1px solid var(--line); margin-top:12px; padding-top:10px; }
    .event { padding:8px 0; border-bottom:1px solid #f1f5f9; }
    .event small { display:block; color:var(--muted); margin-bottom:4px; }
    .error { background:#fee2e2; color:#b91c1c; border-radius:12px; padding:12px; margin:10px 0; }
    .info { background:#dbeafe; color:#1d4ed8; border-radius:12px; padding:12px; margin:10px 0; }
    .preview { background:#ecfdf5; color:#166534; border-radius:12px; padding:12px; margin-top:12px; white-space:pre-wrap; }
    .hidden { display:none; }
  </style>
</head>
<body>
<main>
  <h1 id="title">工會手機管理</h1>
  <p class="caption" id="subtitle">正在確認您的 LINE 工會人員身分。</p>
  <div class="tabs">
    <button class="tab" id="tabCustomer" type="button">客服中心</button>
    <button class="tab" id="tabReview" type="button">月嫂驗證</button>
  </div>
  <div id="status" class="info">載入中...</div>
  <button id="reauthenticate" class="secondary hidden" type="button">重新登入 LINE</button>
  <section id="customerPane" class="hidden">
    <div class="toolbar">
      <select id="ticketStatus">
        <option value="waiting">等待客服</option>
        <option value="handling">處理中</option>
        <option value="resolved">已完成</option>
      </select>
      <button type="button" id="refreshTickets">重新整理</button>
    </div>
    <div id="tickets"></div>
  </section>
  <section id="reviewPane" class="hidden">
    <div class="toolbar">
      <select id="reviewStatus">
        <option value="pending">待審核</option>
        <option value="approved">已核准</option>
        <option value="rejected">已退回</option>
      </select>
      <button type="button" id="refreshReviews">重新整理</button>
    </div>
    <div id="reviews"></div>
  </section>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
let idToken = "";
let target = "customer_service";
const reviewPreviews = new Map();
const replyPreviews = new Map();
const statusBox = document.getElementById("status");
const panes = {
  customer_service: document.getElementById("customerPane"),
  staff_review: document.getElementById("reviewPane"),
};

function liffStateParams() {
  const params = new URLSearchParams(location.search);
  const raw = params.get("liff.state") || "";
  const start = raw.indexOf("?");
  return new URLSearchParams(start >= 0 ? raw.slice(start) : raw);
}

function targetFromUrl() {
  const params = new URLSearchParams(location.search);
  const state = liffStateParams();
  return params.get("target") || state.get("target") || "customer_service";
}

function showStatus(message, isError=false) {
  statusBox.textContent = message;
  statusBox.className = isError ? "error" : "info";
}

function showEmpty(root, message) {
  const empty = document.createElement("div");
  empty.className = "info";
  empty.textContent = message;
  root.appendChild(empty);
}

function safeErrorMessage(result, fallback) {
  const candidates = [
    typeof result?.detail === "string" ? result.detail : null,
    result?.detail?.message,
    result?.detail?.error?.message,
    result?.error?.message,
    result?.message,
  ];
  const message = candidates.find(item => typeof item === "string" && item.trim());
  return message ? message.trim() : fallback;
}

function safeErrorCode(result) {
  return result?.detail?.error?.code || result?.detail?.code || result?.error?.code || "";
}

function reauthenticateLine() {
  try { liff.logout(); } catch (_) {}
  const redirect = new URL("/line-identity", location.origin);
  redirect.searchParams.set("target", targetFromUrl() === "staff_review" ? "staff_review" : "customer_service");
  liff.login({redirectUri: redirect.toString()});
}

async function postJson(url, body) {
  const response = await fetch(url, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({...body, line_id_token: idToken}),
  });
  const result = await response.json().catch(() => ({}));
  if (!response.ok) {
    const code = safeErrorCode(result);
    document.getElementById("reauthenticate").classList.toggle("hidden", !code.startsWith("liff_"));
    throw new Error(safeErrorMessage(result, "操作失敗"));
  }
  return result.data;
}

async function init() {
  try {
    target = targetFromUrl() === "staff_review" ? "staff_review" : "customer_service";
    const configResponse = await fetch("/api/v1/line/identity/runtime-config");
    const configResult = await configResponse.json();
    const liffId = configResult.data?.liff_id;
    if (!configResponse.ok || !liffId) throw new Error("LIFF 尚未完成設定");
    await liff.init({liffId});
    if (!liff.isLoggedIn()) {
      const redirect = new URL("/line-identity", location.origin);
      redirect.searchParams.set("target", targetFromUrl() === "staff_review" ? "staff_review" : "customer_service");
      liff.login({redirectUri: redirect.toString()});
      return;
    }
    idToken = liff.getIDToken() || "";
    if (!idToken) throw new Error("無法取得 LINE 登入憑證，請確認 LIFF 已啟用 openid。");
    const profile = await postJson("/api/v1/line/mobile-admin/profile", {});
    document.getElementById("subtitle").textContent = `登入人員：${profile.display_name}`;
    switchPane(target);
  } catch (error) {
    showStatus(error.message, true);
  }
}

function switchPane(next) {
  target = next;
  document.getElementById("tabCustomer").classList.toggle("active", target === "customer_service");
  document.getElementById("tabReview").classList.toggle("active", target === "staff_review");
  panes.customer_service.classList.toggle("hidden", target !== "customer_service");
  panes.staff_review.classList.toggle("hidden", target !== "staff_review");
  showStatus(target === "customer_service" ? "客服案件列表" : "月嫂驗證待確認申請");
  if (target === "customer_service") loadTickets();
  else loadReviews();
}

async function loadTickets() {
  try {
    const data = await postJson("/api/v1/line/mobile-admin/customer-service/tickets", {
      status: document.getElementById("ticketStatus").value,
    });
    const root = document.getElementById("tickets");
    root.replaceChildren();
    if (!data.items.length) { showEmpty(root, "目前沒有符合條件的客服案件。"); return; }
    data.items.forEach(ticket => root.appendChild(ticketCard(ticket)));
  } catch (error) { showStatus(error.message, true); }
}

const ticketStatusLabels = {waiting: "待處理", handling: "處理中", resolved: "已完成"};
const ticketCategoryLabels = {
  service_flow: "服務流程",
  payment_subsidy: "收費與補助",
  service_progress: "服務進度",
  profile_update: "修改登記資料",
  contact_union: "聯絡工會",
  other: "其他問題",
};
const reviewStatusLabels = {
  pending: "待審核",
  approved: "已核准",
  rejected: "已退回",
  cancelled: "已取消",
  expired: "已逾期",
};
const reviewOutcomeLabels = {created: "本次審核已完成", existing: "先前已完成相同審核"};

function businessLabel(labels, value, fallback) {
  return labels[value] || fallback;
}

function ticketCard(ticket) {
  const card = document.createElement("div");
  card.className = "card";
  const row = document.createElement("div");
  row.className = "row";
  const title = document.createElement("strong");
  title.textContent = `#${ticket.ticket_id} ${ticket.client_name || "未綁定客戶"}`;
  const status = document.createElement("span");
  status.className = "pill";
  status.textContent = businessLabel(ticketStatusLabels, ticket.status, "狀態待確認");
  row.append(title, status);
  const summary = document.createElement("p");
  summary.textContent = `類型：${businessLabel(ticketCategoryLabels, ticket.category, "其他問題")}｜案件：${ticket.case_no || "無"}｜電話：${ticket.client_phone || "無"}`;
  const events = document.createElement("div");
  events.className = "events";
  events.id = `events-${ticket.ticket_id}`;
  const reply = document.createElement("textarea");
  reply.id = `reply-${ticket.ticket_id}`;
  reply.placeholder = "輸入要回覆給用戶的內容";
  const resolveLabel = document.createElement("label");
  const resolve = document.createElement("input");
  resolve.type = "checkbox";
  resolve.id = `resolve-${ticket.ticket_id}`;
  resolveLabel.append(resolve, document.createTextNode(" 回覆後標示完成"));
  const actions = document.createElement("div");
  actions.style.marginTop = "10px";
  const replyButton = document.createElement("button");
  replyButton.type = "button";
  replyButton.textContent = "預覽回覆";
  replyButton.addEventListener("click", () => previewTicketReply(ticket));
  actions.appendChild(replyButton);
  const preview = document.createElement("div");
  preview.id = `reply-preview-${ticket.ticket_id}`;
  preview.className = "preview hidden";
  const invalidate = () => invalidateTicketReplyPreview(ticket.ticket_id);
  reply.addEventListener("input", invalidate);
  resolve.addEventListener("change", invalidate);
  card.append(row, summary, events, reply, resolveLabel, actions, preview);
  loadTicketDetail(ticket.ticket_id);
  return card;
}

async function loadTicketDetail(ticketId) {
  try {
    const data = await postJson(`/api/v1/line/mobile-admin/customer-service/tickets/${ticketId}`, {});
    const root = document.getElementById(`events-${ticketId}`);
    root.replaceChildren();
    data.events.forEach(event => {
      const item = document.createElement("div");
      item.className = "event";
      const metadata = document.createElement("small");
      metadata.textContent = new Date(event.created_at).toLocaleString();
      const message = document.createElement("span");
      message.textContent = event.message_text || event.event_type;
      item.append(metadata, message);
      root.appendChild(item);
    });
  } catch (_) {
    const root = document.getElementById(`events-${ticketId}`);
    root.replaceChildren();
    const message = document.createElement("span");
    message.textContent = "處理紀錄載入失敗，請重試。";
    const retry = document.createElement("button");
    retry.type = "button";
    retry.className = "secondary";
    retry.textContent = "重新載入處理紀錄";
    retry.addEventListener("click", () => loadTicketDetail(ticketId));
    root.append(message, retry);
  }
}

function invalidateTicketReplyPreview(ticketId) {
  replyPreviews.delete(ticketId);
  const root = document.getElementById(`reply-preview-${ticketId}`);
  if (root) {
    root.replaceChildren();
    root.classList.add("hidden");
  }
}

function requireReplyPreview(data, ticket) {
  if (!data || data.ticket_id !== ticket.ticket_id
      || !Number.isInteger(data.current_version)
      || !Number.isInteger(data.expected_version)
      || !Number.isInteger(data.reply_character_count)
      || data.will_enqueue_delivery !== true
      || data.apply_ready !== true
      || typeof data.preview_fingerprint !== "string"
      || !/^[0-9a-f]{64}$/.test(data.preview_fingerprint)) {
    throw new Error("客服回覆預覽格式不完整，未執行套用。");
  }
  return data;
}

function renderTicketReplyPreview(ticket, state) {
  const root = document.getElementById(`reply-preview-${ticket.ticket_id}`);
  root.replaceChildren();
  root.classList.remove("hidden");
  const summary = document.createElement("div");
  summary.textContent = [
    `狀態：${businessLabel(ticketStatusLabels, state.preview.before_status, "待確認")} → ${businessLabel(ticketStatusLabels, state.preview.after_status, "待確認")}`,
    `回覆字數：${state.preview.reply_character_count}`,
    "套用後只會排入 LINE 發送佇列，尚未送達。",
  ].join("\n");
  const confirm = document.createElement("button");
  confirm.type = "button";
  confirm.textContent = "確認套用此客服回覆預覽";
  confirm.addEventListener("click", () => applyTicketReply(ticket));
  const cancel = document.createElement("button");
  cancel.type = "button";
  cancel.className = "secondary";
  cancel.textContent = "取消預覽";
  cancel.addEventListener("click", () => invalidateTicketReplyPreview(ticket.ticket_id));
  root.append(summary, confirm, cancel);
}

async function previewTicketReply(ticket) {
  const text = document.getElementById(`reply-${ticket.ticket_id}`).value.trim();
  if (!text) { showStatus("請先輸入回覆內容。", true); return; }
  const payload = {
    reply_text: text,
    resolve: document.getElementById(`resolve-${ticket.ticket_id}`).checked,
    internal_note: null,
    expected_version: ticket.version,
  };
  try {
    const data = await postJson(`/api/v1/line/mobile-admin/customer-service/tickets/${ticket.ticket_id}/reply/preview`, payload);
    const preview = requireReplyPreview(data, ticket);
    const idempotencyKey = globalThis.crypto?.randomUUID
      ? `mobile-reply:${ticket.ticket_id}:${globalThis.crypto.randomUUID()}`
      : `mobile-reply:${ticket.ticket_id}:${Date.now().toString(36)}`;
    const state = {payload, preview, idempotencyKey};
    replyPreviews.set(ticket.ticket_id, state);
    renderTicketReplyPreview(ticket, state);
    showStatus("客服回覆預覽已建立；尚未寫入或排入傳送。");
  } catch (error) { showStatus(error.message, true); }
}

async function applyTicketReply(ticket) {
  const state = replyPreviews.get(ticket.ticket_id);
  if (!state) { showStatus("客服回覆預覽已失效，請重新預覽。", true); return; }
  try {
    const data = await postJson(`/api/v1/line/mobile-admin/customer-service/tickets/${ticket.ticket_id}/reply/apply`, {
      ...state.payload,
      preview_fingerprint: state.preview.preview_fingerprint,
      idempotency_key: state.idempotencyKey,
    });
    if (!data || data.ticket_id !== ticket.ticket_id
        || !Number.isInteger(data.resulting_version)
        || data.delivery_enqueued !== true
        || data.delivery_delivered !== false
        || typeof data.preview_fingerprint !== "string"
        || !data.readback || data.readback.ticket?.ticket_id !== ticket.ticket_id) {
      throw new Error("客服回覆結果驗證資料不完整，請勿重複送出並聯絡工會確認。");
    }
    replyPreviews.delete(ticket.ticket_id);
    showStatus([
      `客服回覆已保存：工單 #${data.ticket_id}`,
      "LINE 訊息已排入可靠發送佇列，尚未送達。",
    ].join("\n"));
    await loadTickets();
  } catch (error) { showStatus(error.message, true); }
}

async function loadReviews() {
  try {
    const data = await postJson("/api/v1/line/mobile-admin/identity-reviews", {
      review_status: document.getElementById("reviewStatus").value,
      review_type: "staff_verification",
    });
    const root = document.getElementById("reviews");
    root.replaceChildren();
    if (!data.items.length) { showEmpty(root, "目前沒有符合條件的月嫂驗證申請。"); return; }
    data.items.forEach(review => root.appendChild(reviewCard(review)));
  } catch (error) { showStatus(error.message, true); }
}

function reviewCard(review) {
  const card = document.createElement("div");
  card.className = "card";
  card.id = `review-card-${review.request_id}`;
  const row = document.createElement("div");
  row.className = "row";
  const title = document.createElement("strong");
  title.textContent = `#${review.request_id} ${review.display_name}`;
  const status = document.createElement("span");
  status.className = "pill";
  status.textContent = businessLabel(reviewStatusLabels, review.status, "狀態待確認");
  row.append(title, status);
  const summary = document.createElement("p");
  summary.textContent = `LINE：${review.line_user_id_masked}｜送出：${review.created_at ? new Date(review.created_at).toLocaleString() : "無"}`;
  if (review.status !== "pending") {
    const readonlyReason = document.createElement("p");
    readonlyReason.className = "muted";
    readonlyReason.textContent = `${businessLabel(reviewStatusLabels, review.status, "目前狀態待確認")}，此申請僅供查閱；如需變更請由工會依正式更正流程處理。`;
    card.append(row, summary, readonlyReason);
    return card;
  }
  const reason = document.createElement("textarea");
  reason.id = `reason-${review.request_id}`;
  reason.placeholder = "審核備註或退回原因";
  const actions = document.createElement("div");
  actions.style.display = "flex";
  actions.style.gap = "8px";
  actions.style.marginTop = "10px";
  const approve = document.createElement("button");
  approve.type = "button";
  approve.textContent = "預覽核准";
  approve.addEventListener("click", () => previewReviewDecision(review, "approve"));
  const reject = document.createElement("button");
  reject.type = "button";
  reject.className = "danger";
  reject.textContent = "預覽退回";
  reject.addEventListener("click", () => previewReviewDecision(review, "reject"));
  actions.append(approve, reject);
  const preview = document.createElement("div");
  preview.id = `review-preview-${review.request_id}`;
  preview.className = "preview hidden";
  card.append(row, summary, reason, actions, preview);
  return card;
}

function requireReviewPreview(data, review, decision) {
  const validFingerprint = typeof data?.preview_fingerprint === "string"
    && /^[0-9a-f]{64}$/.test(data.preview_fingerprint);
  if (!data || data.request_id !== review.request_id || data.decision !== decision
      || !Number.isInteger(data.expected_version) || !Number.isInteger(data.resulting_version)
      || typeof data.before_status !== "string" || typeof data.after_status !== "string"
      || !validFingerprint) {
    throw new Error("審核預覽格式不完整，未執行套用。");
  }
  return data;
}

function renderReviewPreview(review, previewState) {
  const root = document.getElementById(`review-preview-${review.request_id}`);
  root.replaceChildren();
  root.classList.remove("hidden");
  const summary = document.createElement("div");
  const preview = previewState.preview;
  summary.textContent = [
    `狀態：${businessLabel(reviewStatusLabels, preview.before_status, "待確認")} → ${businessLabel(reviewStatusLabels, preview.after_status, "待確認")}`,
    `LINE：${preview.line_user_id_masked}`,
  ].join("\n");
  const confirm = document.createElement("button");
  confirm.type = "button";
  confirm.textContent = "確認套用此預覽";
  confirm.addEventListener("click", () => applyReviewDecision(review));
  const cancel = document.createElement("button");
  cancel.type = "button";
  cancel.className = "secondary";
  cancel.textContent = "取消預覽";
  cancel.addEventListener("click", () => {
    reviewPreviews.delete(review.request_id);
    root.replaceChildren();
    root.classList.add("hidden");
  });
  root.append(summary, confirm, cancel);
}

async function previewReviewDecision(review, decision) {
  const reason = document.getElementById(`reason-${review.request_id}`).value.trim() || (decision === "approve" ? "手機端核准月嫂驗證" : "");
  if (!reason) { showStatus("退回申請時請輸入原因。", true); return; }
  try {
    const data = await postJson(`/api/v1/line/mobile-admin/identity-reviews/${review.request_id}/decision/preview`, {
      decision,
      expected_version: review.version,
      reason,
    });
    const preview = requireReviewPreview(data, review, decision);
    const idempotencyKey = globalThis.crypto?.randomUUID
      ? `mobile-review:${review.request_id}:${globalThis.crypto.randomUUID()}`
      : `mobile-review:${review.request_id}:${Date.now().toString(36)}`;
    reviewPreviews.set(review.request_id, {preview, reason, idempotencyKey});
    renderReviewPreview(review, reviewPreviews.get(review.request_id));
    showStatus("審核預覽已建立；尚未變更狀態。");
  } catch (error) { showStatus(error.message, true); }
}

async function applyReviewDecision(review) {
  const state = reviewPreviews.get(review.request_id);
  if (!state) { showStatus("審核預覽已失效，請重新預覽。", true); return; }
  try {
    const data = await postJson(`/api/v1/line/mobile-admin/identity-reviews/${review.request_id}/decision/apply`, {
      decision: state.preview.decision,
      expected_version: state.preview.expected_version,
      reason: state.reason,
      preview_fingerprint: state.preview.preview_fingerprint,
      idempotency_key: state.idempotencyKey,
    });
    if (!data || data.request_id !== review.request_id || typeof data.status !== "string"
        || !Number.isInteger(data.version) || typeof data.outcome !== "string"
        || typeof data.receipt_identity !== "string" || !data.receipt_identity) {
      throw new Error("套用結果驗證資料不完整，請勿重複送出並聯絡工會確認。");
    }
    reviewPreviews.delete(review.request_id);
    showStatus([
      `審核結果已更新：申請 #${data.request_id}｜${businessLabel(reviewStatusLabels, data.status, "狀態待確認")}`,
      businessLabel(reviewOutcomeLabels, data.outcome, "審核結果已保存"),
      "通知僅排入可靠佇列，尚未證明送達。",
    ].join("\n"));
    loadReviews();
  } catch (error) { showStatus(error.message, true); }
}

document.getElementById("tabCustomer").addEventListener("click", () => switchPane("customer_service"));
document.getElementById("tabReview").addEventListener("click", () => switchPane("staff_review"));
document.getElementById("refreshTickets").addEventListener("click", loadTickets);
document.getElementById("refreshReviews").addEventListener("click", loadReviews);
document.getElementById("ticketStatus").addEventListener("change", loadTickets);
document.getElementById("reviewStatus").addEventListener("change", loadReviews);
