<!-- File: staff_schedule.html -->
<!-- Description: 提供月嫂 LIFF 班表查詢與請假待辦送出介面。 -->
<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>月嫂排班資訊</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Noto Sans TC", sans-serif; background: #fff7f8; color: #27272a; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 44px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #71717a; line-height: 1.6; }
    .primary { border: 0; border-radius: 6px; padding: 13px 12px; font-size: 16px; font-weight: 700; color: #fff; background: #be123c; }
    .panel { background: #fff; border: 1px solid #fecdd3; border-radius: 8px; padding: 16px; margin-top: 14px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
    label { display: block; font-weight: 700; margin-bottom: 7px; }
    input, textarea, select { width: 100%; border: 1px solid #d4d4d8; border-radius: 6px; padding: 11px; font-size: 16px; }
    textarea { min-height: 86px; resize: vertical; }
    .message { margin-top: 14px; padding: 12px; border-radius: 6px; background: #f4f4f5; color: #3f3f46; }
    .error { background: #fee2e2; color: #b91c1c; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid #e4e4e7; border-radius: 8px; overflow: hidden; margin-top: 14px; }
    .head, .day { min-height: 74px; border-right: 1px solid #e4e4e7; border-bottom: 1px solid #e4e4e7; padding: 6px; font-size: 13px; }
    .head { min-height: auto; background: #f4f4f5; text-align: center; font-weight: 700; }
    .day:nth-child(7n), .head:nth-child(7n) { border-right: 0; }
    .date { font-weight: 700; margin-bottom: 4px; }
    .work { background: #ffe4e6; }
    .rest { background: #dcfce7; }
    .available { background: #fff; color: #71717a; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; font-size: 14px; color: #52525b; }
    .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
    .hide { display: none; }
  </style>
</head>
<body>
<main>
  <h1>排班資訊</h1>
  <p>您可以查詢個人班表月曆，也可以送出請假待辦；送出後仍須由工會人員依正式排班流程處理。</p>

  <section class="panel">
    <h2>請假申請</h2>
    <p>請填寫希望請假的日期與簡要說明。這不是正式核准，工會人員會另行確認服務安排。</p>
    <div class="toolbar">
      <div><label for="leaveStart">開始日期</label><input id="leaveStart" type="date"></div>
      <div><label for="leaveEnd">結束日期</label><input id="leaveEnd" type="date"></div>
    </div>
    <div style="margin-top:10px"><label for="leaveReason">說明（選填）</label><textarea id="leaveReason" maxlength="1000"></textarea></div>
    <button id="submitLeave" class="primary" style="margin-top:12px">送出請假申請</button>
    <button id="cancelLeave" class="primary hide" style="margin-top:12px;background:#52525b">取消尚未受理的申請</button>
    <div id="leaveStatus" class="message" style="display:none;"></div>
  </section>

  <section id="calendarPanel" class="panel">
    <div class="toolbar">
      <div>
        <label for="monthInput">查詢月份</label>
        <input id="monthInput" type="month">
      </div>
      <button id="loadSchedule" class="primary">查詢班表</button>
    </div>
    <div id="calendarStatus" class="message" style="display:none;"></div>
    <div class="legend">
      <span><i class="dot" style="background:#ffe4e6"></i>服務日</span>
      <span><i class="dot" style="background:#dcfce7"></i>休息/請假</span>
      <span><i class="dot" style="background:#fff;border:1px solid #d4d4d8"></i>未排班</span>
    </div>
    <div id="calendar" class="calendar"></div>
  </section>

</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
let lineUserId = "";
let lineIdToken = "";
let flowId = "";
let pendingLeaveKey = "";
let currentLeaveRequest = null;

async function captureLineIdentity() {
  try {
    const context = liff.getContext && liff.getContext();
    if (context?.userId) lineUserId = context.userId;
  } catch (_) {}
  try {
    const profile = await liff.getProfile();
    if (profile?.userId) lineUserId = profile.userId;
  } catch (_) {}
  try { lineIdToken = liff.getIDToken() || ""; } catch (_) {}
}

function show(id, text, isError = false) {
  const box = document.getElementById(id);
  box.textContent = text;
  box.className = "message" + (isError ? " error" : "");
  box.style.display = "block";
}

function identityPayload() {
  return { flow_id: flowId, line_id_token: lineIdToken };
}

function leaveIdempotencyKey() {
  if (!pendingLeaveKey) {
    const random = globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`;
    pendingLeaveKey = `staff-leave-${random}`;
  }
  return pendingLeaveKey;
}

async function submitLeaveRequest() {
  const leaveStartDate = document.getElementById("leaveStart").value;
  const leaveEndDate = document.getElementById("leaveEnd").value;
  if (!leaveStartDate || !leaveEndDate) {
    show("leaveStatus", "請填寫請假起訖日。", true);
    return;
  }
  show("leaveStatus", "請假申請送出中...");
  const response = await fetch("/api/v1/line/staff-self-service/leave-requests", {
    method: "POST",
    headers: {"Content-Type": "application/json", "Idempotency-Key": leaveIdempotencyKey()},
    body: JSON.stringify({...identityPayload(), leave_start_date: leaveStartDate, leave_end_date: leaveEndDate, leave_reason: document.getElementById("leaveReason").value})
  });
  const data = await response.json();
  if (!response.ok || data.success === false || !data.data) {
    show("leaveStatus", data.message || data.detail?.message || "請假申請送出失敗，請使用同一畫面重試。", true);
    return;
  }
  currentLeaveRequest = {requestId: data.data.request_id, version: data.data.version};
  localStorage.setItem("staffLeaveRequest", JSON.stringify(currentLeaveRequest));
  document.getElementById("cancelLeave").classList.remove("hide");
  show("leaveStatus", "請假申請已送出，等待工會人員受理處理。若尚未受理可在此取消。");
}

async function cancelLeaveRequest() {
  if (!currentLeaveRequest) return;
  const reason = window.prompt("請輸入取消原因（必填）") || "";
  if (!reason.trim()) {
    show("leaveStatus", "取消請填寫原因。", true);
    return;
  }
  show("leaveStatus", "取消申請處理中...");
  const response = await fetch(`/api/v1/line/staff-self-service/leave-requests/${currentLeaveRequest.requestId}/cancel`, {
    method: "POST",
    headers: {"Content-Type": "application/json", "Idempotency-Key": `staff-leave-cancel-${currentLeaveRequest.requestId}-${currentLeaveRequest.version}`},
    body: JSON.stringify({...identityPayload(), expected_version: currentLeaveRequest.version, reason})
  });
  const data = await response.json();
  if (!response.ok || data.success === false || !data.data) {
    show("leaveStatus", data.message || data.detail?.message || "取消失敗，可能已受理，請聯絡工會人員。", true);
    return;
  }
  localStorage.removeItem("staffLeaveRequest");
  currentLeaveRequest = null;
  document.getElementById("cancelLeave").classList.add("hide");
  show("leaveStatus", "請假申請已取消。");
}

function renderCalendar(schedule) {
  const root = document.getElementById("calendar");
  const year = schedule.year;
  const month = schedule.month;
  const first = new Date(year, month - 1, 1);
  const lastDay = new Date(year, month, 0).getDate();
  const weekNames = ["日", "一", "二", "三", "四", "五", "六"];
  const byDay = {};
  for (const item of schedule.days || []) {
    const day = Number(String(item.work_date).slice(-2));
    if (!byDay[day]) byDay[day] = [];
    byDay[day].push(item);
  }
  root.innerHTML = weekNames.map(name => `<div class="head">${name}</div>`).join("");
  for (let i = 0; i < first.getDay(); i++) root.insertAdjacentHTML("beforeend", `<div class="day available"></div>`);
  for (let day = 1; day <= lastDay; day++) {
    const items = byDay[day] || [];
    const workItems = items.filter(item => item.status === "working");
    const restItems = items.filter(item => item.status === "resting");
    const css = workItems.length ? "work" : (restItems.length ? "rest" : "available");
    const text = workItems.length
      ? workItems.map(item => `${item.client_name || "服務案件"} ${item.case_no || ""}`).join("<br>")
      : (restItems.length ? "休息/請假" : "未排班");
    root.insertAdjacentHTML("beforeend", `<div class="day ${css}"><div class="date">${day}</div><div>${text}</div></div>`);
  }
}

async function loadSchedule() {
  const value = document.getElementById("monthInput").value;
  if (!value) {
    show("calendarStatus", "請先選擇查詢月份。", true);
    return;
  }
  const [year, month] = value.split("-").map(Number);
  show("calendarStatus", "班表查詢中...");
  const response = await fetch(`/api/v1/line/staff-self-service/schedule?year=${year}&month=${month}`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(identityPayload())
  });
  const data = await response.json();
  if (!response.ok || data.success === false || !data.data) {
    show("calendarStatus", data.message || data.detail?.message || "查詢失敗", true);
    return;
  }
  show("calendarStatus", `${data.data.staff_name} 的 ${year} 年 ${month} 月排班`);
  renderCalendar(data.data);
}

async function init() {
  const now = new Date();
  document.getElementById("monthInput").value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  const params = new URLSearchParams(location.search);
  try {
    currentLeaveRequest = JSON.parse(localStorage.getItem("staffLeaveRequest") || "null");
    if (currentLeaveRequest?.requestId && currentLeaveRequest?.version) document.getElementById("cancelLeave").classList.remove("hide");
  } catch (_) { localStorage.removeItem("staffLeaveRequest"); }
  lineUserId = params.get("userId") || "";
  flowId = params.get("flow_id") || "";
  try {
    const result = await fetch("/api/v1/line/identity/runtime-config").then(r => r.json());
    const config = result.data || {};
    if (config.liff_id) {
      await liff.init({ liffId: config.liff_id });
      if (!liff.isLoggedIn()) {
        if (flowId || lineUserId) return;
        liff.login();
        return;
      }
      await captureLineIdentity();
    }
  } catch (_) {
    show("calendarStatus", "LIFF 初始化失敗，請重新開啟頁面。", true);
  }
  loadSchedule();
}

document.getElementById("loadSchedule").addEventListener("click", loadSchedule);
document.getElementById("submitLeave").addEventListener("click", submitLeaveRequest);
document.getElementById("cancelLeave").addEventListener("click", cancelLeaveRequest);
init();
</script>
</body>
</html>
