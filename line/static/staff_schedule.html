<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>月嫂排班資訊</title><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fff7f8;color:#27272a;font-family:'Noto Sans TC',sans-serif}main{max-width:760px;margin:auto;padding:24px 12px 40px}h1{margin:0 0 8px}p{color:#71717a;line-height:1.6}.panel{background:#fff;border:1px solid #fecdd3;border-radius:12px;padding:14px;margin-top:16px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}label{display:block;font-weight:700;margin-bottom:7px}input,button{width:100%;padding:11px;border-radius:8px;font-size:16px}input{border:1px solid #d4d4d8}button{border:0;background:#be123c;color:#fff;font-weight:700}.message{margin-top:12px;padding:10px;background:#f4f4f5;border-radius:8px}.error{background:#fee2e2;color:#b91c1c}.calendar{display:grid;grid-template-columns:repeat(7,1fr);margin-top:14px;border:1px solid #e4e4e7;border-radius:8px;overflow:hidden}.head,.day{min-height:70px;padding:5px;border-right:1px solid #e4e4e7;border-bottom:1px solid #e4e4e7;font-size:12px}.head{min-height:auto;text-align:center;background:#f4f4f5;font-weight:700}.work{background:#ffe4e6}.rest{background:#dcfce7}.locked{background:#fef3c7}.date{font-weight:700;margin-bottom:4px}.notice{margin-top:14px;color:#52525b;font-size:14px}
  </style>
</head>
<body><main><h1>排班資訊</h1><p>查詢您的正式服務日、休息日與待成立鎖定檔期。</p><section class="panel"><div class="toolbar"><div><label for="month">查詢月份</label><input id="month" type="month"></div><button id="load">查詢班表</button></div><div id="message" class="message" hidden></div><div id="calendar" class="calendar"></div><div class="notice">請假或代班會影響正式案件、薪資與客戶期程，第一版請聯絡工會人員提出申請，由工會完成預覽及確認後套用。</div></section></main>
<script>
let idToken='';
function message(text,error=false){const box=document.getElementById('message');box.textContent=text;box.className='message'+(error?' error':'');box.hidden=false}
function render(data){const root=document.getElementById('calendar');root.replaceChildren();['日','一','二','三','四','五','六'].forEach(name=>{const head=document.createElement('div');head.className='head';head.textContent=name;root.append(head)});const first=new Date(data.year,data.month-1,1);for(let i=0;i<first.getDay();i++){const blank=document.createElement('div');blank.className='day';root.append(blank)}const grouped={};for(const item of data.days){const day=Number(String(item.work_date).slice(-2));(grouped[day]??=[]).push(item)}const last=new Date(data.year,data.month,0).getDate();for(let day=1;day<=last;day++){const items=grouped[day]||[];const working=items.filter(item=>item.status==='working');const resting=items.filter(item=>item.status==='resting');const locked=items.filter(item=>item.status==='waiting_deposit_lock');const cell=document.createElement('div');cell.className='day '+(working.length?'work':resting.length?'rest':locked.length?'locked':'');const date=document.createElement('div');date.className='date';date.textContent=day;const detail=document.createElement('div');detail.textContent=working.length?working.map(item=>`${item.client_name||'服務案件'} ${item.case_no||''}`).join('、'):resting.length?'休息／請假':locked.length?'待成立鎖定':'未排班';cell.append(date,detail);root.append(cell)}}
async function initialize(){const now=new Date();document.getElementById('month').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;const config=await fetch('/api/v1/line/identity/runtime-config').then(r=>r.json());await liff.init({liffId:config.data.liff_id});if(!liff.isLoggedIn()){liff.login();return}idToken=liff.getIDToken()||'';if(!idToken)throw new Error('無法取得 LINE 登入憑證');await loadSchedule()}
async function loadSchedule(){const selected=document.getElementById('month').value;if(!selected){message('請選擇月份。',true);return}const [year,month]=selected.split('-').map(Number);message('班表查詢中…');try{const response=await fetch(`/api/v1/line/staff-self-service/schedule?year=${year}&month=${month}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({line_id_token:idToken})});const result=await response.json();if(!response.ok)throw new Error(result.detail?.message||'查詢失敗');message(`${result.data.staff_name} 的 ${year} 年 ${month} 月排班`);render(result.data)}catch(error){message(error.message||'查詢失敗',true)}}
document.getElementById('load').addEventListener('click',loadSchedule);initialize().catch(error=>message(error.message||'LIFF 初始化失敗，請重新開啟頁面。',true));
</script></body></html>
