<!DOCTYPE html>
<!--
File: staff_schedule.html
Description: 提供月嫂查班及提交已協調的請假、順延與代班結果。
-->
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>月嫂排班資訊</title>
  <style>
  [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Noto Sans TC", sans-serif; background: #fff7f8; color: #27272a; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 44px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #71717a; line-height: 1.6; }
    button { border: 0; border-radius: 6px; padding: 13px 12px; font-size: 16px; font-weight: 700; }
    .primary { color: #fff; background: #be123c; }
    .secondary { margin-top: 10px; color: #9f1239; background: #ffe4e6; }
    button:disabled { cursor: not-allowed; opacity: .6; }
    .panel { background: #fff; border: 1px solid #fecdd3; border-radius: 8px; padding: 16px; margin-top: 14px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { margin-top: 12px; }
    .full { grid-column: 1 / -1; }
    .hint { margin: 7px 0 0; font-size: 14px; color: #71717a; }
    .section-title { margin: 0 0 6px; font-size: 21px; }
    label { display: block; font-weight: 700; margin-bottom: 7px; }
    input, textarea, select { width: 100%; border: 1px solid #d4d4d8; border-radius: 6px; padding: 11px; font-size: 16px; }
    textarea { min-height: 86px; resize: vertical; }
    .message { margin-top: 14px; padding: 12px; border-radius: 6px; background: #f4f4f5; color: #3f3f46; }
    .error { background: #fee2e2; color: #b91c1c; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid #e4e4e7; border-radius: 8px; overflow: hidden; margin-top: 14px; }
    .head, .day { min-height: 74px; border-right: 1px solid #e4e4e7; border-bottom: 1px solid #e4e4e7; padding: 6px; font-size: 13px; }
    .head { min-height: auto; background: #f4f4f5; text-align: center; font-weight: 700; }
    .day:nth-child(7n), .head:nth-child(7n) { border-right: 0; }
    .date { font-weight: 700; margin-bottom: 4px; }
    .work { background: #ffe4e6; }
    .rest { background: #dcfce7; }
    .waiting { background: #fef3c7; }
    .unavailable { background: #ede9fe; }
    .historical { background: #e0f2fe; }
    .available { background: #fff; color: #71717a; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; font-size: 14px; color: #52525b; }
    .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
    .hide { display: none; }
    @media (max-width: 560px) { .toolbar, .form-grid { grid-template-columns: 1fr; } .full { grid-column: auto; } }
  </style>
</head>
<body>
<main>
  <h1>排班資訊</h1>
  <p>您可以查詢個人班表月曆。</p>

  <section id="calendarPanel" class="panel">
    <div class="toolbar">
      <div>
        <label for="monthInput">查詢月份</label>
        <input id="monthInput" type="month">
      </div>
      <button id="loadSchedule" class="primary" disabled>查詢班表</button>
    </div>
    <div id="calendarStatus" class="message" style="display:none;"></div>
    <div class="legend">
      <span><i class="dot" style="background:#ffe4e6"></i>服務日</span>
      <span><i class="dot" style="background:#fef3c7"></i>已鎖定／待成立</span>
      <span><i class="dot" style="background:#ede9fe"></i>正式不可服務</span>
      <span><i class="dot" style="background:#dcfce7"></i>休息日</span>
      <span><i class="dot" style="background:#fff;border:1px solid #d4d4d8"></i>可排班</span>
    </div>
    <div id="calendar" class="calendar"></div>
    <button id="reauthenticate" class="secondary" type="button" hidden>重新登入 LINE</button>
  </section>

  <section class="panel" aria-labelledby="leaveTitle">
    <h2 id="leaveTitle" class="section-title">請假、順延與代班</h2>
    <p>請先在案件群組與客戶協調，再送出結果。順延無衝突會直接更新；需要代班或排程衝突才交工會處理。</p>
    <div id="leaveCases"></div>
    <p id="leaveStatus" role="status"></p>
    <button type="button" id="reloadLeaveCases">重新查詢請假與排班</button>
  </section>
<section class="panel" aria-label="回報服務開始安排"><h2>回報服務開始安排</h2><p id="serviceStartStatus" role="status"></p><div id="serviceStartCases"></div><button type="button" onclick="loadServiceStartCases()">重新查詢服務開始安排</button></section>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
let lineIdToken = "";
let flowId = "";
let identityReady = false;


async function captureLineIdentity() {
  try { lineIdToken = liff.getIDToken() || ""; } catch (_) {}
  identityReady = Boolean(lineIdToken);
}

function show(id, text, isError = false) {
  const box = document.getElementById(id);
  box.textContent = text;
  box.className = "message" + (isError ? " error" : "");
  box.hidden = false;
  box.style.display = "block";
}

function hide(id) {
  const box = document.getElementById(id);
  box.hidden = true;
  box.style.display = "none";
}

function identityPayload() {
  return {
    flow_id: lineIdToken ? "" : flowId,
    line_id_token: lineIdToken,
    development_line_user_id: "",
  };
}

async function responseData(response) {
  try { return await response.json(); } catch (_) { return {}; }
}

function responseMessage(data, fallback) {
  return data.message || data.detail?.message || data.detail?.error?.message || data.error?.message || fallback;
}

function responseErrorCode(data) {
  return data.detail?.error?.code || data.detail?.code || data.error?.code || "";
}

function showReauthenticationFor(data) {
  document.getElementById("reauthenticate").hidden = !responseErrorCode(data).startsWith("liff_");
}

function reauthenticateLine() {
  try { liff.logout(); } catch (_) {}
  const redirect = new URL("/line-identity", location.origin);
  redirect.searchParams.set("target", "staff_schedule");
  liff.login({redirectUri: redirect.toString()});
}

const scheduleStatuses = new Set([
  "available", "working", "resting", "historical_assignment",
  "waiting_deposit_lock", "staff_unavailability",
]);

function requireScheduleDay(value) {
  if (!value || typeof value !== "object" || Array.isArray(value)) throw new Error("班表日期格式錯誤");
  if (typeof value.work_date !== "string" || !scheduleStatuses.has(value.status)) {
    throw new Error("班表日期缺少必要狀態");
  }
  return value;
}

function requireStaffSchedule(value) {
  if (!value || typeof value !== "object" || Array.isArray(value)) throw new Error("班表格式錯誤");
  if (!Number.isInteger(value.staff_id) || typeof value.staff_name !== "string" ||
      !Number.isInteger(value.year) || !Number.isInteger(value.month) || !Array.isArray(value.days)) {
    throw new Error("班表缺少必要欄位");
  }
  return {...value, days: value.days.map(requireScheduleDay)};
}

function appendCalendarCell(root, className, text = "") {
  const cell = document.createElement("div");
  cell.className = className;
  cell.textContent = text;
  root.appendChild(cell);
  return cell;
}

function dayPresentation(items) {
  const item = items.find(value => value.status === "staff_unavailability")
    || items.find(value => value.status === "working")
    || items.find(value => value.status === "waiting_deposit_lock")
    || items.find(value => value.status === "historical_assignment")
    || items.find(value => value.status === "resting")
    || items[0];
  if (!item || item.status === "available") return {className: "available", text: "可排班"};
  if (item.status === "working") {
    const subject = item.client_name || item.case_no || "服務案件";
    return {className: "work", text: `服務日｜${subject}`};
  }
  if (item.status === "waiting_deposit_lock") return {className: "waiting", text: "已鎖定／待成立"};
  if (item.status === "staff_unavailability") {
    return {className: "unavailable", text: item.unavailability_reason || "正式不可服務"};
  }
  if (item.status === "historical_assignment") return {className: "historical", text: "歷史指派"};
  return {className: "rest", text: "休息日"};
}

function renderCalendar(schedule) {
  const root = document.getElementById("calendar");
  const year = schedule.year;
  const month = schedule.month;
  const first = new Date(year, month - 1, 1);
  const lastDay = new Date(year, month, 0).getDate();
  const weekNames = ["日", "一", "二", "三", "四", "五", "六"];
  const byDay = {};
  for (const item of schedule.days || []) {
    const day = Number(String(item.work_date).slice(-2));
    if (!byDay[day]) byDay[day] = [];
    byDay[day].push(item);
  }
  root.replaceChildren();
  weekNames.forEach(name => appendCalendarCell(root, "head", name));
  for (let i = 0; i < first.getDay(); i++) appendCalendarCell(root, "day available");
  for (let day = 1; day <= lastDay; day++) {
    const items = byDay[day] || [];
    const presentation = dayPresentation(items);
    const cell = appendCalendarCell(root, `day ${presentation.className}`);
    appendCalendarCell(cell, "date", String(day));
    appendCalendarCell(cell, "", presentation.text);
  }
}

async function loadSchedule() {
  const monthInput = document.getElementById("monthInput");
  const value = monthInput.value;
  if (!value) {
    show("calendarStatus", "請先選擇查詢月份。", true);
    return;
  }
  const [year, month] = value.split("-").map(Number);
  const button = document.getElementById("loadSchedule");
  button.disabled = true;
  monthInput.disabled = true;
  show("calendarStatus", "班表查詢中...");
  try {
    const response = await fetch(`/api/v1/line/staff-self-service/schedule?year=${year}&month=${month}`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(identityPayload())
    });
    const data = await responseData(response);
    if (!response.ok || data.success === false || !data.data) {
      document.getElementById("calendar").replaceChildren();
      show("calendarStatus", responseMessage(data, "查詢失敗"), true);
      showReauthenticationFor(data);
      return;
    }
    const schedule = requireStaffSchedule(data.data);
    show("calendarStatus", `${schedule.staff_name} 的 ${year} 年 ${month} 月排班`);
    renderCalendar(schedule);
  } catch (_) {
    document.getElementById("calendar").replaceChildren();
    show("calendarStatus", "班表無法載入或資料格式不正確，請稍後重試；持續發生時請聯絡工會人員。", true);
  } finally {
    button.disabled = !identityReady && !flowId;
    monthInput.disabled = false;
  }
}

async function init() {
  const now = new Date();
  document.getElementById("monthInput").value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  const params = new URLSearchParams(location.search);
  flowId = params.get("flow_id") || "";
  try {
    const result = await fetch("/api/v1/line/identity/runtime-config").then(r => r.json());
    const config = result.data || {};
    if (config.liff_id) {
      await liff.init({ liffId: config.liff_id });
      if (!liff.isLoggedIn()) {
        if (flowId) identityReady = true;
        else {
          const redirect = new URL("/line-identity", location.origin);
          redirect.searchParams.set("target", "staff_schedule");
          liff.login({redirectUri: redirect.toString()});
          return;
        }
      } else {
        await captureLineIdentity();
      }
    }
  } catch (_) {
    show("calendarStatus", "LIFF 初始化失敗，請重新開啟頁面。", true);
    document.getElementById("reauthenticate").hidden = false;
  }
  if (!lineIdToken && !flowId) {
    show("calendarStatus", "無法取得 LINE 身分，請從 LINE 圖文選單重新開啟。", true);
    document.getElementById("reauthenticate").hidden = false;
    return;
  }
  identityReady = true;
  document.getElementById("loadSchedule").disabled = false;

  loadSchedule();
  await loadServiceStartCases();
  await loadLeaveCases();
}

document.getElementById("loadSchedule").addEventListener("click", loadSchedule);
document.getElementById('reloadLeaveCases').onclick=()=>void loadLeaveCases();
document.getElementById("reauthenticate").addEventListener("click", reauthenticateLine);

async function serviceStartPost(path, body) {
  const response=await fetch('/api/v1/line/staff-self-service/service-start/'+path,{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,flow_id:flowId,line_id_token:lineIdToken})});
  const result=await response.json();
  if(!response.ok || !result.success){const error=new Error(result.detail?.error?.message || result.detail?.message || result.message || '目前無法完成服務安排。');error.httpStatus=response.status;throw error;}
  return result.data;
}
async function loadServiceStartCases() {
  const root=document.getElementById('serviceStartCases');root.replaceChildren();
  const status=document.getElementById('serviceStartStatus');status.textContent='正在查詢本人服務安排…';
  try {
    const data=await serviceStartPost('cases',{});
    for(let i=0;i<sessionStorage.length;i++){const key=sessionStorage.key(i);if(!key?.startsWith('service-start-submit:'))continue;let saved;try{saved=JSON.parse(sessionStorage.getItem(key));}catch{continue;}if(saved && !data.items.some(item=>item.case_no===saved.case_no && item.segment_id===saved.segment_id && item.assignment_id===saved.assignment_id))data.items.push({...saved,order_version:saved.expected_order_version,segment_start_date:saved.start_date??'待確認',segment_end_date:'原操作結果待確認'});}
    if(!data || !Array.isArray(data.items)) throw new Error('服務安排資料格式錯誤。');
    status.textContent=data.items.length?'請先與客戶在服務群組協調，再提交結果。':'目前沒有可回報的服務安排。';
    for(const item of data.items){
      const card=document.createElement('article');card.className='panel';
      const heading=document.createElement('h3');heading.textContent='案件 '+item.case_no+'｜服務區段 '+item.segment_start_date+'～'+item.segment_end_date;card.append(heading);
      const form=document.createElement('form');
      const choice=document.createElement('select');choice.setAttribute('aria-label','協調結果');
      for(const [value,text] of [['accepted','接受，填寫開始日期'],['declined','無法配合，請工會安排代班']]){const option=document.createElement('option');option.value=value;option.textContent=text;choice.append(option);}
      const label=document.createElement('label');label.textContent='雙方約定的服務開始日';
      const start=document.createElement('input');start.type='date';start.required=true;start.setAttribute('aria-label','雙方約定的服務開始日');label.append(start);
      choice.onchange=()=>{label.hidden=choice.value!=='accepted';start.required=choice.value==='accepted';};
      const submit=document.createElement('button');submit.type='submit';submit.textContent='送出協調結果';
      const state=document.createElement('p');state.setAttribute('role','status');
      const recover=document.createElement('button');recover.type='button';recover.textContent='確認原操作結果';recover.hidden=true;
      const storageKey='service-start-submit:'+item.case_no+':'+item.segment_id+':'+item.assignment_id;
      const saved=sessionStorage.getItem(storageKey);let pending=saved?JSON.parse(saved):null;
      const lock=()=>{submit.disabled=Boolean(pending);choice.disabled=Boolean(pending);start.disabled=Boolean(pending);recover.hidden=!pending;};lock();
      const send=async()=>{
        if(!pending)return;submit.disabled=true;recover.disabled=true;
        try{const result=await serviceStartPost('submit',pending);sessionStorage.removeItem(storageKey);pending=null;
          state.textContent=result.status==='applied'?'實際服務日期與排班已更新，結果將記錄於服務群組。':result.status==='substitute_required'?'已交由工會安排代班。':'已收到約定日期，等待其他服務區段的月嫂提交。';
          choice.disabled=true;start.disabled=true;recover.hidden=true;
        }catch(error){state.textContent=error.message;if(error.httpStatus>=400 && error.httpStatus<500){pending=null;sessionStorage.removeItem(storageKey);}lock();}
        finally{recover.disabled=false;}
      };
      recover.onclick=()=>void send();
      form.onsubmit=event=>{event.preventDefault();if(pending)return;
        pending={case_no:item.case_no,segment_id:item.segment_id,assignment_id:item.assignment_id,expected_order_version:item.order_version,
          decision:choice.value,start_date:choice.value==='accepted'?start.value:null,idempotency_key:crypto.randomUUID()};
        sessionStorage.setItem(storageKey,JSON.stringify(pending));lock();void send();};
      form.append(choice,label,submit,recover,state);card.append(form);root.append(card);
    }
  }catch(error){status.textContent=error.message;status.setAttribute('role','alert');}
}

async function leaveResultPost(path, body) {
  const response=await fetch('/api/v1/line/staff-self-service/leave-results/'+path,{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...identityPayload(),...body})});
  const result=await response.json();
  if(!response.ok || !result.success){const error=new Error(result.detail?.error?.message||result.detail?.message||result.message||'目前無法送出協調結果。');error.httpStatus=response.status;throw error;}
  return result.data;
}
async function loadLeaveCases(){
  const root=document.getElementById('leaveCases');root.replaceChildren();
  const status=document.getElementById('leaveStatus');status.textContent='正在查詢本人正式排班…';
  try{
    const data=await leaveResultPost('cases',{});
    for(let i=0;i<sessionStorage.length;i++){
      const key=sessionStorage.key(i);if(!key?.startsWith('leave-result-submit:'))continue;
      let pending;try{pending=JSON.parse(sessionStorage.getItem(key));}catch{continue;}
      if(!data.items.some(item=>item.case_no===pending.case_no&&item.assignment_id===pending.assignment_id))
        data.items.push({...pending,order_version:pending.expected_order_version,scheduling_version:pending.expected_scheduling_version,service_dates:pending.dates.map(d=>d.original_date)});
    }
    status.textContent=data.items.length?'請選擇受影響的服務日，再填寫協調結果。':'目前沒有可提交請假的正式排班。';
    for(const item of data.items){
      const card=document.createElement('article');card.className='panel';const h=document.createElement('h3');h.textContent='案件 '+item.case_no;card.append(h);
      const form=document.createElement('form');const choice=document.createElement('select');choice.setAttribute('aria-label','請假協調結果');
      for(const [value,text] of [['defer','已協調順延'],['substitute','需要安排代班']]){const o=document.createElement('option');o.value=value;o.textContent=text;choice.append(o);}form.append(choice);
      const dayList=document.createElement('fieldset');const legend=document.createElement('legend');legend.textContent='選擇受影響的服務日';dayList.append(legend);dayList.style.maxHeight='360px';dayList.style.overflowY='auto';form.append(dayList);
      const fields=item.service_dates.map(day=>{
        const row=document.createElement('div');row.className='field';
        const label=document.createElement('label');const check=document.createElement('input');check.type='checkbox';check.setAttribute('aria-label','原服務日 '+day);check.style.width='auto';label.style.display='flex';label.style.gap='8px';label.append(check,document.createTextNode('原服務日 '+day));
        const newLabel=document.createElement('label');newLabel.textContent='協議後日期';newLabel.hidden=true;const input=document.createElement('input');input.type='date';input.setAttribute('aria-label',day+' 協議後日期');input.disabled=true;newLabel.append(input);
        check.onchange=()=>{newLabel.hidden=!check.checked||choice.value!=='defer';input.disabled=!check.checked||choice.value!=='defer';input.required=check.checked&&choice.value==='defer';};
        row.append(label,newLabel);dayList.append(row);return {day,check,input,newLabel};
      });
      choice.onchange=()=>fields.forEach(f=>{f.newLabel.hidden=!f.check.checked||choice.value!=='defer';f.input.disabled=!f.check.checked||choice.value!=='defer';f.input.required=f.check.checked&&choice.value==='defer';});
      const send=document.createElement('button');send.type='submit';send.textContent='送出請假協調結果';
      const recover=document.createElement('button');recover.type='button';recover.textContent='確認原操作結果';
      const message=document.createElement('p');message.setAttribute('role','status');
      const storageKey='leave-result-submit:'+item.case_no+':'+item.assignment_id;
      let pending=JSON.parse(sessionStorage.getItem(storageKey)||'null');let busy=false;
      const lock=()=>{send.disabled=busy||Boolean(pending);choice.disabled=busy||Boolean(pending);recover.hidden=!pending;recover.disabled=busy;for(const f of fields){f.check.disabled=busy||Boolean(pending);f.input.disabled=busy||Boolean(pending)||!f.check.checked||choice.value!=='defer';}};
      const submit=async()=>{if(!pending||busy)return;busy=true;lock();
        try{const result=await leaveResultPost('submit',pending);pending=null;sessionStorage.removeItem(storageKey);
          message.textContent=result.status==='applied'?(result.result.group_record_queued?'正式日期、排班及帳務已更新，日期表已交付案件群組寄送。':'正式日期、排班及帳務已更新；本案尚缺案件群組設定，請聯絡工會。'):(result.conflict_message?'日期有排程衝突，原排班尚未變更，已交工會處理。':'已收到代班需求，交由工會安排；原排班尚未變更。');
          for(const element of form.elements)element.disabled=true;recover.hidden=true;
        }catch(error){message.textContent=error.message;if(error.httpStatus>=400&&error.httpStatus<500){pending=null;sessionStorage.removeItem(storageKey);}busy=false;lock();}
        finally{busy=false;recover.disabled=false;}
      };
      recover.onclick=()=>void submit();form.onsubmit=event=>{event.preventDefault();if(pending||busy)return;
        const selected=fields.filter(f=>f.check.checked);if(!selected.length){message.textContent='請至少選擇一個原服務日。';return;}
        if(choice.value==='defer'&&selected.some(f=>!f.input.value||f.input.value<=f.day)){message.textContent='請填寫晚於原服務日的協議後日期。';return;}
        pending={case_no:item.case_no,assignment_id:item.assignment_id,decision:choice.value,
          dates:selected.map(f=>({original_date:f.day,new_date:choice.value==='defer'?f.input.value:null})),
          expected_order_version:item.order_version,expected_scheduling_version:item.scheduling_version,idempotency_key:crypto.randomUUID()};
        sessionStorage.setItem(storageKey,JSON.stringify(pending));void submit();};
      form.append(send,recover,message);card.append(form);root.append(card);lock();
    }
  }catch(error){status.textContent=error.message;}
}

init();
