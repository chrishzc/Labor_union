<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的資料｜新竹市到宅月子工會</title>
  <style>
    :root {
      --paper: #fffdfa;
      --text: #3e2723;
      --muted: #74593f;
      --accent: #ab421f;
      --accent-hover: #883314;
      --border: #e8cec2;
      --soft: #fff2ec;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f8f5f0;
      color: var(--text);
      font: 18px/1.6 "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
    }
    main { width: min(100%, 664px); margin: 0 auto; padding: 20px 16px max(32px, env(safe-area-inset-bottom)); }
    .page-header, .section, .submit-panel {
      background: var(--paper);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
    }
    .page-header { border-top: 5px solid var(--accent); box-shadow: 0 6px 20px rgba(120, 52, 28, .08); }
    .brand { color: var(--accent); font-size: 16px; font-weight: 800; margin: 0 0 8px; }
    h1 { font-size: 34px; font-weight: 800; line-height: 1.2; margin: 0 0 12px; }
    p { margin: 0; }
    .help { color: var(--muted); font-size: 16px; }
    form { display: grid; gap: 18px; margin-top: 18px; }
    fieldset { border: 0; min-inline-size: 0; margin: 0; padding: 0; }
    legend { color: var(--text); font-size: 24px; font-weight: 800; padding: 0; margin-bottom: 14px; border-bottom: 1.5px solid #f2e6dc; padding-bottom: 8px; width: 100%; }
    .field-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .field, .preference { display: block; min-width: 0; font-weight: 800; font-size: 18px; }
    .field-wide, .preference { grid-column: 1 / -1; }
    .preference .help { display: block; margin: 5px 0 0; font-weight: 400; font-size: 15px; }
    input:not([type=checkbox]), textarea, select {
      display: block;
      width: 100%;
      min-height: 52px;
      margin-top: 6px;
      padding: 12px 14px;
      border: 1.5px solid #b89484;
      border-radius: 12px;
      color: var(--text);
      background: #fff;
      font: inherit;
      font-size: 18px;
      font-weight: 500;
    }
    textarea { min-height: 84px; resize: vertical; }
    input:focus-visible, textarea:focus-visible, button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    #profile-photos h3, #profile-applications h2 { font-size: 1.1rem; margin: .8rem 0 .4rem; }
    #photo-status:not(:empty) { margin-top: .75rem; }
    .photo-draft { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); align-items: start; gap: .6rem; padding: .7rem 0; border-bottom: 1px solid var(--border); }
    .photo-draft img { width: 100%; max-height: 10rem; object-fit: contain; border-radius: 8px; background: var(--soft); }
    .photo-draft label { display: block; margin-bottom: .5rem; }
    .photo-draft-action { color: var(--accent); border: 1px solid var(--border); border-radius: 10px; background: var(--paper); padding: .45rem .65rem; font: inherit; cursor: pointer; }
    .bank-choice {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 54px;
      margin-top: 12px;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--soft);
      font-weight: 800;
      font-size: 18px;
      cursor: pointer;
    }
    .bank-choice input { accent-color: var(--accent); width: 26px; height: 26px; flex: none; margin: 0; cursor: pointer; }
    #bank-fields { margin-top: 16px; }
    .submit-panel button, #submission-recovery {
      width: 100%;
      min-height: 56px;
      padding: 14px 20px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(171, 66, 31, .2);
    }
    .submit-panel button:hover:not(:disabled), #submission-recovery:hover:not(:disabled) { background: var(--accent-hover); }
    .submit-panel button:disabled, #submission-recovery:disabled { opacity: .65; cursor: wait; }

    /* 長者友善接案偏好 Chip / Pill 切換標籤 */
    .preference-group {
      margin-top: 14px;
      padding: 16px;
      background: #faf8f5;
      border: 1.5px solid #ded2c9;
      border-radius: 14px;
    }
    .preference-group-title {
      font-size: 20px;
      font-weight: 800;
      color: #241c18;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 48px;
      padding: 10px 18px;
      border-radius: 24px;
      border: 2px solid #cfb8aa;
      background: #fff;
      color: #3e2723;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .chip-btn:hover {
      background: #fff5f0;
      border-color: #ab421f;
    }
    .chip-btn[aria-pressed="true"] {
      background: #ab421f;
      border-color: #883314;
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(171, 66, 31, 0.25);
    }
    .chip-icon {
      font-size: 16px;
      line-height: 1;
    }
    .status { margin-top: 14px; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--paper); }
    .status[data-state="ready"] { display: none; }
    .status[data-state="error"] { color: #972923; background: #fff1ef; border-color: #e6ada7; }
    .status[data-state="receipt"] { color: #255b3f; background: #f0faf3; border-color: #b6d9c4; }
    #submit-status:not(:empty) { margin-top: 10px; }
    #submit-status[data-error] { color: #972923; }
    @media (max-width: 420px) {
      main { padding-inline: 12px; }
      .page-header, .section, .submit-panel { padding: 16px; }
      .field-grid { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
<main>
  <header class="page-header">
    <p class="brand">新竹市到宅月子工會</p>
    <h1>我的資料</h1>
    <p class="help">只需填寫要變更的欄位。工會核准後，整張申請的資料才會一起更新。</p>
  </header>
  <p id="status" class="status" role="status" aria-live="polite">正在確認 LINE 身分…</p>
  <button id="submission-recovery" type="button" hidden aria-describedby="status">查詢原申請</button>
  <form id="form" hidden>
    <div class="section"><fieldset><legend>聯絡方式</legend><div id="contact" class="field-grid"></div></fieldset></div>
    <div class="section"><fieldset><legend>聯絡地址</legend><div id="address-fields" class="field-grid"></div></fieldset></div>
    <div class="section"><fieldset><legend>緊急聯絡</legend><div id="emergency" class="field-grid"></div></fieldset></div>
    <div class="section">
      <fieldset>
        <legend id="bank-legend">更換收款帳戶</legend>
        <p id="current-bank" class="help"></p>
        <label class="bank-choice"><input id="replace-bank" type="checkbox"><span id="replace-bank-label">申請更換收款帳戶</span></label>
        <div id="bank-fields" class="field-grid" hidden></div>
      </fieldset>
    </div>
    <div class="section"><fieldset><legend>接案偏好</legend><div id="preferences" class="field-grid"></div></fieldset></div>
    <div class="section">
      <fieldset id="profile-photos">
        <legend>履歷網頁照片與證照</legend>
        <p class="help" id="photo-privacy-notice">上傳前請確認個資已經遮蔽，若無遮蔽則視為不介意讓客戶得知。</p>
        <div class="field-grid">
          <label>模板項目<select id="photo-template"><option value="">請選擇項目</option></select></label>
          <label>選擇照片<input id="photo-files" aria-describedby="photo-privacy-notice" type="file" accept="image/jpeg,image/png,image/webp" multiple disabled></label>
        </div>
        <p class="help" id="photo-status" role="status"></p>
        <div id="photo-drafts"></div>
      </fieldset>
      <div id="profile-applications" hidden>
        <h2>我的申請紀錄</h2>
        <ul></ul>
      </div>
    </div>
    <div class="submit-panel">
      <button id="send" type="submit" aria-describedby="submit-status">送出整張申請</button>
      <p id="submit-status" class="help" role="status"></p>
    </div>
  </form>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="/static/staff_profile_web_photos.js"></script>
<script>
const profileLabels = {
  phone: "手機", tel: "市話", tel_ext: "分機", email: "Email", city: "縣市",
  zip_code: "郵遞區號", address: "詳細地址", emergency_contact_name: "緊急聯絡人",
  emergency_contact_phone: "緊急聯絡電話"
};
const relationLabels = {
  service_regions: "服務地區", service_periods: "服務時段", rest_schedule: "排休方式",
  baby_types: "接案胎數", holiday_availability: "特殊節日可接案"
};
const form = document.getElementById("form");
const status = document.getElementById("status");
const send = document.getElementById("send");
const submitStatus = document.getElementById("submit-status");
const replacement = document.getElementById("replace-bank");
const bankFields = document.getElementById("bank-fields");
const recovery = document.getElementById("submission-recovery");
const submissionKey = "staff-profile-change:submission";
const conflictKey = submissionKey + ":conflict";
let submissionId = sessionStorage.getItem(submissionKey);
let submissionConflict = Boolean(submissionId) && sessionStorage.getItem(conflictKey) === submissionId;
let identity, snapshot, pendingSubmission;
const photoForm = createProfilePhotoForm();
const applicationStatuses = { pending: "待工會審核", approving: "工會處理中", approved: "已核准", rejected: "已退回", conflict: "資料已更新，請重新申請" };

function showApplications(applications) {
  const container = document.getElementById("profile-applications");
  container.hidden = !applications.length;
  container.querySelector("ul").replaceChildren(...applications.map(item => {
    const entry = document.createElement("li");
    entry.textContent = "申請 #" + item.id + "，" + (applicationStatuses[item.status] || "處理中");
    return entry;
  }));
}

function show(message, state = "notice") {
  status.textContent = message;
  status.dataset.state = state;
}

function input(parent, id, label, value, options = {}) {
  const wrapper = document.createElement("label");
  wrapper.className = options.hint ? "preference" : options.wide ? "field field-wide" : "field";
  const caption = document.createElement("span");
  caption.id = id + "-label";
  caption.textContent = label;
  wrapper.append(caption);
  const element = document.createElement(options.multiline ? "textarea" : "input");
  element.id = id;
  element.setAttribute("aria-labelledby", caption.id);
  element.value = value ?? "";
  if (options.inputMode) element.inputMode = options.inputMode;
  else if (options.numeric) element.inputMode = "numeric";
  if (options.type) element.type = options.type;
  if (options.maximum) element.maxLength = options.maximum;
  if (options.hint) {
    const hint = document.createElement("small");
    hint.id = id + "-hint";
    hint.className = "help";
    hint.textContent = options.hint;
    wrapper.append(hint);
    element.setAttribute("aria-describedby", hint.id);
  }
  wrapper.append(element);
  parent.append(wrapper);
  return element;
}

function value(id) { return document.getElementById(id).value.trim(); }
function lines(text) { return text.split("\n").map(item => item.trim()).filter(Boolean); }
function relationText(rows) {
  return rows.map(row => row.detail ? row.value + "：" + row.detail : row.value).join("\n");
}

const standardRelationOptions = {
  service_regions: ["東區", "北區", "香山區", "竹北市", "竹東鎮", "新埔鎮", "關西鎮", "湖口鄉", "新豐鄉", "芎林鄉", "橫山鄉", "寶山鄉"],
  service_periods: [
    "4小時", "8小時"
  ],
  rest_schedule: ["週休二日", "隔週休", "排休", "配合案家需求", "不限"],
  baby_types: ["單胞胎", "雙胞胎", "早產兒照護", "大寶照護"],
  holiday_availability: ["國定假日可接案", "農曆春節可接案", "特殊節日可配合", "依勞基法休假"],
  transportation: ["機車", "自用小客車", "公車/客運", "步行/自行車", "家人接送"]
};
const standardStartTimes = ["8:00", "8:30", "9:00", "9:30"];

function formatCanonicalPeriod(hoursStr, startTimeStr) {
  const hours = parseInt(hoursStr, 10);
  const [hStr, mStr] = startTimeStr.split(":");
  const startH = parseInt(hStr, 10);
  const startM = parseInt(mStr, 10);
  const pad = n => String(n).padStart(2, "0");
  const startNormalized = pad(startH) + ":" + pad(startM);
  const durationMinutes = hours === 8 ? (8 * 60 + 30) : (hours * 60);
  const endTotalMinutes = startH * 60 + startM + durationMinutes;
  const endH = Math.floor(endTotalMinutes / 60);
  const endM = endTotalMinutes % 60;
  const endNormalized = pad(endH) + ":" + pad(endM);
  return hours + "小時(" + startNormalized + "-" + endNormalized + ")";
}

function parseServicePeriods(rawPeriods) {
  const selectedHours = new Set();
  const selectedStarts = new Set();
  for (const item of rawPeriods) {
    const val = typeof item === "object" ? (item.value || "") : String(item);
    const match = val.match(/^(\d+)小時(?:\((\d{2}):(\d{2})-.*\))?$/);
    if (match) {
      selectedHours.add(match[1] + "小時");
      if (match[2]) {
        const h = parseInt(match[2], 10);
        const m = match[3];
        selectedStarts.add(h + ":" + m);
      }
    } else if (val.includes("小時")) {
      const hMatch = val.match(/(\d+)小時/);
      if (hMatch) selectedHours.add(hMatch[1] + "小時");
    }
    if (typeof item === "object" && item.detail) {
      const details = item.detail.split(/[,、，]/).map(s => s.trim());
      for (const d of details) {
        if (/^\d{1,2}:\d{2}$/.test(d)) {
          const [dh, dm] = d.split(":");
          selectedStarts.add(parseInt(dh, 10) + ":" + dm);
        }
      }
    }
  }
  return {
    hours: Array.from(selectedHours),
    starts: Array.from(selectedStarts)
  };
}

function composeServicePeriods(hoursList, startList) {
  const targetHours = hoursList.length > 0 ? hoursList : (startList.length > 0 ? ["8小時"] : []);
  if (targetHours.length === 0) return [];
  if (startList.length === 0) return targetHours;
  const result = [];
  for (const hStr of targetHours) {
    for (const sStr of startList) {
      result.push(formatCanonicalPeriod(hStr, sStr));
    }
  }
  return result;
}

function chipGroup(parent, key, label, currentValues, candidateList) {
  const group = document.createElement("div");
  group.className = "preference-group";
  group.id = "group-" + key;

  const title = document.createElement("div");
  title.className = "preference-group-title";
  title.textContent = label;
  group.append(title);

  const container = document.createElement("div");
  container.className = "chips-container";
  container.id = "chips-" + key;

  const currentSet = new Set(currentValues.map(v => typeof v === "object" ? v.value : v));
  const allCandidates = [...new Set([...(candidateList || []), ...currentSet])];

  allCandidates.forEach(val => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip-btn";
    const isSelected = currentSet.has(val);
    btn.setAttribute("aria-pressed", isSelected ? "true" : "false");
    btn.dataset.value = val;

    const icon = document.createElement("span");
    icon.className = "chip-icon";
    icon.textContent = isSelected ? "✓" : "+";

    const text = document.createElement("span");
    text.textContent = val;

    btn.append(icon, text);
    btn.onclick = () => {
      const nowPressed = btn.getAttribute("aria-pressed") === "true";
      const nextPressed = !nowPressed;
      btn.setAttribute("aria-pressed", nextPressed ? "true" : "false");
      icon.textContent = nextPressed ? "✓" : "+";
    };
    container.append(btn);
  });

  group.append(container);
  parent.append(group);
}

function render(data) {
  const groups = { contact: ["phone", "tel", "tel_ext", "email"], "address-fields": ["city", "zip_code", "address"],
    emergency: ["emergency_contact_name", "emergency_contact_phone"] };
  const types = { phone: "tel", tel: "tel", emergency_contact_phone: "tel" };
  for (const [group, fields] of Object.entries(groups)) {
    for (const key of fields) {
      input(document.getElementById(group), key, profileLabels[key], data.profile[key],
        { type: types[key], inputMode: key === "email" ? "email" : undefined,
          numeric: key === "zip_code" || key === "tel_ext", wide: key === "address" });
    }
  }
  const hasBank = !!data.bank;
  const bankLegend = document.getElementById("bank-legend");
  const replaceBankLabel = document.getElementById("replace-bank-label");
  if (bankLegend) bankLegend.textContent = hasBank ? "更換收款帳戶" : "設定收款帳戶";
  if (replaceBankLabel) replaceBankLabel.textContent = hasBank ? "申請更換收款帳戶" : "申請設定收款帳戶";

  document.getElementById("current-bank").textContent = hasBank
    ? "目前帳號末四碼 " + data.bank.account_last4 : "尚未設定收款帳戶。勾選下方即可新增。";
  replacement.disabled = false;
  input(bankFields, "bank_branch_code", "金融機構與分行代碼（共 7 碼）", "", {
    numeric: true, maximum: 7, hint: "請填寫 7 碼數字（前 3 碼為銀行代碼，後 4 碼為分行代碼）"
  });
  input(bankFields, "account_no", hasBank ? "新收款帳號" : "收款帳號", "", {
    numeric: true, maximum: 20, wide: true
  });
  const preferences = document.getElementById("preferences");
  const parsedPeriods = parseServicePeriods(data.relations.service_periods || []);
  for (const [key, label] of Object.entries(relationLabels)) {
    if (key === "service_periods") {
      chipGroup(preferences, "service_periods", "服務時段", parsedPeriods.hours, ["4小時", "8小時"]);
      chipGroup(preferences, "preferred_start_time", "偏好服務開始時間", parsedPeriods.starts, standardStartTimes);
      continue;
    }
    const currentItems = data.relations[key] || [];
    const candidates = data.relation_options?.[key] || standardRelationOptions[key] || [];
    chipGroup(preferences, key, label, currentItems, candidates);
  }
  chipGroup(preferences, "transportation", "交通方式", data.transportation || [], standardRelationOptions.transportation);
}

function changes() {
  const profile = {};
  for (const key of Object.keys(profileLabels)) {
    if (value(key) !== (snapshot.profile[key] ?? "")) profile[key] = value(key) || null;
  }
  const relations = {};
  for (const key of Object.keys(relationLabels)) {
    if (key === "service_periods") continue;
    const container = document.getElementById("chips-" + key);
    const selectedBtns = container ? container.querySelectorAll('.chip-btn[aria-pressed="true"]') : [];
    const currentValues = Array.from(selectedBtns).map(btn => btn.dataset.value);
    const snapshotValues = (snapshot.relations[key] || []).map(item => item.value);
    const isDifferent = currentValues.length !== snapshotValues.length ||
      currentValues.some((v, idx) => v !== snapshotValues[idx]);
    if (isDifferent) {
      relations[key] = currentValues.map(v => ({ value: v }));
    }
  }

  const periodsContainer = document.getElementById("chips-service_periods");
  const selectedPeriodBtns = periodsContainer ? periodsContainer.querySelectorAll('.chip-btn[aria-pressed="true"]') : [];
  const selectedHours = Array.from(selectedPeriodBtns).map(btn => btn.dataset.value);

  const startsContainer = document.getElementById("chips-preferred_start_time");
  const selectedStartBtns = startsContainer ? startsContainer.querySelectorAll('.chip-btn[aria-pressed="true"]') : [];
  const selectedStarts = Array.from(selectedStartBtns).map(btn => btn.dataset.value);

  const nextPeriods = composeServicePeriods(selectedHours, selectedStarts);
  const snapPeriods = (snapshot.relations.service_periods || []).map(item => item.value);
  const isPeriodDiff = nextPeriods.length !== snapPeriods.length ||
    nextPeriods.some((p, idx) => p !== snapPeriods[idx]);
  if (isPeriodDiff) {
    relations.service_periods = nextPeriods.map(v => ({ value: v }));
  }

  let bankUpdate = null;
  if (replacement.checked) {
    const rawBankBranch = value("bank_branch_code").replace(/\D/g, "");
    bankUpdate = {
      bank_code: rawBankBranch.slice(0, 3),
      branch_code: rawBankBranch.slice(3, 7),
      account_no: value("account_no")
    };
  }

  const transportContainer = document.getElementById("chips-transportation");
  const selectedTransBtns = transportContainer ? transportContainer.querySelectorAll('.chip-btn[aria-pressed="true"]') : [];
  const currentTrans = Array.from(selectedTransBtns).map(btn => btn.dataset.value);
  const snapTrans = snapshot.transportation || [];
  const isTransDiff = currentTrans.length !== snapTrans.length ||
    currentTrans.some((v, idx) => v !== snapTrans[idx]);

  return {
    profile, relations,
    ...(isTransDiff ? { transportation: currentTrans } : {}),
    ...(bankUpdate ? { bank: bankUpdate } : {})
  };
}

async function request(path, body) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  try {
    const response = await fetch("/api/v1/line/staff-self-service/profile-change/" + path, {
      method: "POST", headers: { "Content-Type": "application/json" }, cache: "no-store",
      body: typeof body === "string" ? body : JSON.stringify({ ...identity, ...body }),
      signal: controller.signal
    });
    const result = await response.json().catch(() => null);
    if (!response.ok) {
      const detail = result?.detail?.error || result?.error;
      const error = new Error(detail?.message || "處理失敗，請核對資料後再試。");
      error.httpStatus = response.status;
      error.definitive = Boolean(detail?.code) && [400, 401, 403, 404, 422].includes(response.status);
      throw error;
    }
    return result?.data;
  } finally {
    clearTimeout(timeout);
  }
}

function showSubmitError(message) {
  submitStatus.textContent = message;
  submitStatus.setAttribute("data-error", "");
}

function enableForm(enabled) {
  send.disabled = !enabled;
  form.inert = !enabled;
}

function clearSubmission() {
  sessionStorage.removeItem(submissionKey);
  sessionStorage.removeItem(conflictKey);
  submissionId = null;
  submissionConflict = false;
  pendingSubmission = undefined;
  recovery.hidden = true;
}

function showReceipt(receipt) {
  if (!Number.isSafeInteger(receipt?.id) || receipt.id <= 0
      || !Number.isSafeInteger(receipt.version) || receipt.version <= 0
      || !Object.hasOwn(applicationStatuses, receipt.status)) {
    throw new Error("申請結果讀回不完整。");
  }
  clearSubmission();
  form.reset();
  photoForm.clear();
  form.hidden = true;
  show("申請 #" + receipt.id + "，" + applicationStatuses[receipt.status], "receipt");
  window.scrollTo(0, 0);
}

function showRecovery(message) {
  enableForm(false);
  const queryOnly = submissionConflict || !pendingSubmission;
  recovery.textContent = queryOnly ? "查詢原申請" : "重新送出";
  recovery.hidden = false;
  const fallback = submissionConflict
    ? "申請發生衝突，請查詢原申請或聯絡工會確認。"
    : "尚未確認送件成功，請先確認原申請的結果。";
  show(message ?? fallback, "error");
}

async function sendSubmission(retrying = false) {
  try {
    showReceipt(await request("submit", pendingSubmission));
  } catch (error) {
    if (error.httpStatus === 409) {
      submissionConflict = true;
      pendingSubmission = undefined;
      sessionStorage.setItem(conflictKey, submissionId);
    } else if (!retrying && error.definitive) {
      clearSubmission();
      showSubmitError(error.message);
      enableForm(true);
      return;
    }
    showRecovery();
  }
}

async function loadForm() {
  snapshot = await request("query", {});
  render(snapshot);
  photoForm.load(snapshot.web_profile);
  showApplications(snapshot.applications ?? []);
  form.hidden = false;
  enableForm(true);
  show("", "ready");
}

async function recoverSubmission() {
  if (!submissionId || recovery.disabled) return;
  recovery.disabled = true;
  try {
    const result = await request("submission-status", { submission_id: submissionId });
    if (result?.status === "not_received" && Object.keys(result).length === 1) {
      if (submissionConflict) {
        recovery.hidden = true;
        show("本次申請未送出。申請狀態已變更，請聯絡工會確認。", "error");
      } else if (pendingSubmission) {
        show("正在重新送出原申請…");
        await sendSubmission(true);
      } else {
        showRecovery("目前查無原申請，原填寫資料已無法復原。請查詢原申請或聯絡工會確認。");
      }
    } else {
      showReceipt(result);
    }
  } catch {
    showRecovery();
  } finally {
    recovery.disabled = false;
  }
}

replacement.addEventListener("change", () => {
  bankFields.hidden = !replacement.checked;
  if (!replacement.checked) document.getElementById("account_no").value = "";
});
form.addEventListener("submit", async event => {
  event.preventDefault();
  if (send.disabled || submissionId) return;
  enableForm(false);
  send.textContent = "正在送出…";
  submitStatus.textContent = "";
  submitStatus.removeAttribute("data-error");
  try {
    const proposed = changes();
    const photos = await photoForm.upload(identity);
    if (photos.length) proposed.web_contents = photos;
    const id = crypto.randomUUID();
    sessionStorage.setItem(submissionKey, id);
    submissionId = id;
    pendingSubmission = JSON.stringify({ ...identity, ...proposed, basis: snapshot.basis, submission_id: submissionId });
    await sendSubmission();
  } catch (error) {
    showSubmitError(error.message || "無法準備送件，請再試一次。");
    enableForm(true);
  } finally {
    send.textContent = "送出整張申請";
  }
});

recovery.addEventListener("click", recoverSubmission);

async function init() {
  try {
    const flow = new URLSearchParams(location.search).get("flow_id") || "";
    const response = await fetch("/api/v1/line/identity/runtime-config", { cache: "no-store" });
    const { data } = await response.json();
    let token = "";
    if (data?.liff_id) {
      await liff.init({ liffId: data.liff_id });
      if (liff.isLoggedIn()) token = liff.getIDToken() || "";
      else if (!flow) { liff.login({ redirectUri: location.href }); return; }
    }
    if (!token && !flow) throw new Error("請從 LINE 圖文選單開啟此頁。");
    identity = token ? { line_id_token: token } : { flow_id: flow };
    if (submissionId) {
      enableForm(false);
      await recoverSubmission();
    } else {
      await loadForm();
    }
  } catch (error) { show(error.message || "無法載入資料，請重新開啟。", "error"); }
}
init();
</script>
</body>
</html>
