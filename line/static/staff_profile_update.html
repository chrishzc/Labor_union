<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的資料｜新竹市到宅月子工會</title>
  <style>
    :root {
      --paper: #fffdfa;
      --text: #3e2723;
      --muted: #74593f;
      --accent: #ab421f;
      --accent-hover: #883314;
      --border: #e8cec2;
      --soft: #fff2ec;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #fff5f2 0%, #faece8 100%);
      color: var(--text);
      font: 17px/1.6 "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
    }
    main { width: min(100%, 664px); margin: 0 auto; padding: 20px 16px max(28px, env(safe-area-inset-bottom)); }
    .page-header, .section, .submit-panel {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .page-header { border-top: 4px solid var(--accent); box-shadow: 0 6px 20px rgba(120, 52, 28, .08); }
    .brand { color: var(--accent); font-size: 15px; font-weight: 700; margin: 0 0 8px; }
    h1 { font-size: 32px; line-height: 1.2; margin: 0 0 12px; }
    p { margin: 0; }
    .help { color: var(--muted); font-size: 15px; }
    form { display: grid; gap: 16px; margin-top: 16px; }
    fieldset { border: 0; min-inline-size: 0; margin: 0; padding: 0; }
    legend { color: var(--text); font-size: 21px; font-weight: 700; padding: 0; margin-bottom: 12px; }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .field, .preference { display: block; min-width: 0; font-weight: 700; }
    .field-wide, .preference { grid-column: 1 / -1; }
    .preference .help { display: block; margin: 3px 0 0; font-weight: 400; }
    input:not([type=checkbox]), textarea {
      display: block;
      width: 100%;
      min-height: 48px;
      margin-top: 5px;
      padding: 9px 12px;
      border: 1px solid #b89484;
      border-radius: 10px;
      color: var(--text);
      background: #fff;
      font: inherit;
      font-weight: 400;
    }
    textarea { min-height: 78px; resize: vertical; }
    input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .bank-choice {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--soft);
      font-weight: 700;
    }
    .bank-choice input { accent-color: var(--accent); width: 22px; height: 22px; flex: none; margin: 0; }
    #bank-fields { margin-top: 14px; }
    .submit-panel button {
      width: 100%;
      min-height: 52px;
      padding: 12px 16px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
    .submit-panel button:hover:not(:disabled) { background: var(--accent-hover); }
    .submit-panel button:disabled { opacity: .65; cursor: wait; }
    .status { margin-top: 14px; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--paper); }
    .status[data-state="ready"] { display: none; }
    .status[data-state="error"] { color: #972923; background: #fff1ef; border-color: #e6ada7; }
    .status[data-state="receipt"] { color: #255b3f; background: #f0faf3; border-color: #b6d9c4; }
    #submit-status:not(:empty) { margin-top: 10px; }
    #submit-status[data-error] { color: #972923; }
    @media (max-width: 420px) {
      main { padding-inline: 12px; }
      .page-header, .section, .submit-panel { padding: 16px; }
      .field-grid { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
<main>
  <header class="page-header">
    <p class="brand">新竹市到宅月子工會</p>
    <h1>我的資料</h1>
    <p class="help">只需填寫要變更的欄位。工會核准後，整張申請的資料才會一起更新。</p>
  </header>
  <p id="status" class="status" role="status" aria-live="polite">正在確認 LINE 身分…</p>
  <form id="form" hidden>
    <div class="section"><fieldset><legend>聯絡方式</legend><div id="contact" class="field-grid"></div></fieldset></div>
    <div class="section"><fieldset><legend>聯絡地址</legend><div id="address-fields" class="field-grid"></div></fieldset></div>
    <div class="section"><fieldset><legend>緊急聯絡</legend><div id="emergency" class="field-grid"></div></fieldset></div>
    <div class="section">
      <fieldset>
        <legend>更換收款帳戶</legend>
        <p id="current-bank" class="help"></p>
        <label class="bank-choice"><input id="replace-bank" type="checkbox">申請更換收款帳戶</label>
        <div id="bank-fields" class="field-grid" hidden></div>
      </fieldset>
    </div>
    <div class="section"><fieldset><legend>接案偏好</legend><div id="preferences" class="field-grid"></div></fieldset></div>
    <div class="submit-panel">
      <button id="send" type="submit" aria-describedby="submit-status">送出整張申請</button>
      <p id="submit-status" class="help" role="status"></p>
    </div>
  </form>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const profileLabels = {
  phone: "手機", tel: "市話", tel_ext: "分機", email: "Email", city: "縣市",
  zip_code: "郵遞區號", address: "詳細地址", emergency_contact_name: "緊急聯絡人",
  emergency_contact_phone: "緊急聯絡電話"
};
const relationLabels = {
  service_regions: "服務地區", service_periods: "服務時段", rest_schedule: "排休方式",
  baby_types: "接案胎數", holiday_availability: "特殊節日可接案"
};
const form = document.getElementById("form");
const status = document.getElementById("status");
const send = document.getElementById("send");
const submitStatus = document.getElementById("submit-status");
const replacement = document.getElementById("replace-bank");
const bankFields = document.getElementById("bank-fields");
let identity, snapshot, previousSubmission;

function show(message, state = "notice") {
  status.textContent = message;
  status.dataset.state = state;
}

function input(parent, id, label, value, options = {}) {
  const wrapper = document.createElement("label");
  wrapper.className = options.hint ? "preference" : options.wide ? "field field-wide" : "field";
  const caption = document.createElement("span");
  caption.id = id + "-label";
  caption.textContent = label;
  wrapper.append(caption);
  const element = document.createElement(options.multiline ? "textarea" : "input");
  element.id = id;
  element.setAttribute("aria-labelledby", caption.id);
  element.value = value ?? "";
  if (options.inputMode) element.inputMode = options.inputMode;
  else if (options.numeric) element.inputMode = "numeric";
  if (options.type) element.type = options.type;
  if (options.maximum) element.maxLength = options.maximum;
  if (options.hint) {
    const hint = document.createElement("small");
    hint.id = id + "-hint";
    hint.className = "help";
    hint.textContent = options.hint;
    wrapper.append(hint);
    element.setAttribute("aria-describedby", hint.id);
  }
  wrapper.append(element);
  parent.append(wrapper);
  return element;
}

function value(id) { return document.getElementById(id).value.trim(); }
function lines(text) { return text.split("\n").map(item => item.trim()).filter(Boolean); }
function relationText(rows) {
  return rows.map(row => row.detail ? row.value + "：" + row.detail : row.value).join("\n");
}

function render(data) {
  const groups = { contact: ["phone", "tel", "tel_ext", "email"], "address-fields": ["city", "zip_code", "address"],
    emergency: ["emergency_contact_name", "emergency_contact_phone"] };
  const types = { phone: "tel", tel: "tel", emergency_contact_phone: "tel" };
  for (const [group, fields] of Object.entries(groups)) {
    for (const key of fields) {
      input(document.getElementById(group), key, profileLabels[key], data.profile[key],
        { type: types[key], inputMode: key === "email" ? "email" : undefined,
          numeric: key === "zip_code" || key === "tel_ext", wide: key === "address" });
    }
  }
  document.getElementById("current-bank").textContent = data.bank
    ? "目前帳號末四碼 " + data.bank.account_last4 : "尚未設定收款帳戶，請聯絡工會。";
  replacement.disabled = !data.bank;
  for (const [key, label, maximum] of [["bank_code", "銀行代碼", 3], ["branch_code", "分行代碼", 4], ["account_no", "新收款帳號", 20]]) {
    input(bankFields, key, label, "", { numeric: true, maximum, wide: key === "account_no" });
  }
  const preferences = document.getElementById("preferences");
  for (const [key, label] of Object.entries(relationLabels)) {
    const hint = key === "service_periods"
      ? "一行一項，例如 4小時(09:00-13:00)"
      : "一行一項。可選值：" + data.relation_options[key].join("、");
    input(preferences, key, label, relationText(data.relations[key]), { multiline: true, hint });
  }
  input(preferences, "transportation", "交通方式", data.transportation.join("\n"), { multiline: true, hint: "一行一項。" });
  const days = data.matching.preferred_service_days ?? {};
  input(preferences, "minimum", "最少可承接天數", days.minimum, { numeric: true });
  input(preferences, "maximum", "最多可承接天數", days.maximum, { numeric: true });
  input(preferences, "hours", "每日可服務時數", data.matching.daily_service_hours?.values.join(","), { hint: "用逗號分隔，例如 4,8。" });
}

function changes() {
  const profile = {};
  for (const key of Object.keys(profileLabels)) {
    if (value(key) !== (snapshot.profile[key] ?? "")) profile[key] = value(key) || null;
  }
  const relations = {};
  for (const key of Object.keys(relationLabels)) {
    if (value(key) !== relationText(snapshot.relations[key])) {
      relations[key] = lines(value(key)).map(line => {
        const separator = line.indexOf("：");
        return separator < 0 ? { value: line } : { value: line.slice(0, separator), detail: line.slice(separator + 1) };
      });
    }
  }
  const matching = {};
  const days = snapshot.matching.preferred_service_days ?? {};
  if (value("minimum") !== String(days.minimum ?? "") || value("maximum") !== String(days.maximum ?? "")) {
    matching.preferred_service_days = { kind: "integer_range", minimum: Number(value("minimum")), maximum: Number(value("maximum")) };
  }
  if (value("hours") !== (snapshot.matching.daily_service_hours?.values.join(",") ?? "")) {
    matching.daily_service_hours = {
      kind: "integer_set", values: [...new Set(value("hours").split(/[,，]/).map(Number))].sort((a, b) => a - b)
    };
  }
  return {
    profile, relations, matching,
    ...(value("transportation") === snapshot.transportation.join("\n") ? {} : { transportation: lines(value("transportation")) }),
    ...(replacement.checked ? { bank: { bank_code: value("bank_code"), branch_code: value("branch_code"), account_no: value("account_no") } } : {})
  };
}

async function request(path, body) {
  const response = await fetch("/api/v1/line/staff-self-service/profile-change/" + path, {
    method: "POST", headers: { "Content-Type": "application/json" }, cache: "no-store",
    body: JSON.stringify({ ...identity, ...body })
  });
  const result = await response.json();
  if (!response.ok) throw new Error(result.detail?.error?.message || result.error?.message || "處理失敗，請核對資料後再試。");
  return result.data;
}

replacement.addEventListener("change", () => {
  bankFields.hidden = !replacement.checked;
  if (!replacement.checked) document.getElementById("account_no").value = "";
});
form.addEventListener("submit", async event => {
  event.preventDefault();
  send.disabled = true;
  send.textContent = "正在送出…";
  submitStatus.textContent = "";
  submitStatus.removeAttribute("data-error");
  try {
    const proposed = changes();
    const signature = JSON.stringify(proposed);
    if (previousSubmission?.signature !== signature) previousSubmission = { signature, id: crypto.randomUUID() };
    const result = await request("submit", { ...proposed, basis: snapshot.basis, submission_id: previousSubmission.id });
    form.reset();
    previousSubmission = null;
    form.hidden = true;
    const labels = { pending: "待工會審核", approving: "工會處理中", approved: "已核准", rejected: "已退回", conflict: "資料已更新，請重新申請" };
    show("申請 #" + result.id + "，" + (labels[result.status] || "已送出"), "receipt");
    window.scrollTo(0, 0);
  } catch (error) {
    submitStatus.textContent = error.message || "送出失敗，請再試一次。";
    submitStatus.setAttribute("data-error", "");
  } finally {
    send.disabled = false;
    send.textContent = "送出整張申請";
  }
});

async function init() {
  try {
    const flow = new URLSearchParams(location.search).get("flow_id") || "";
    const response = await fetch("/api/v1/line/identity/runtime-config", { cache: "no-store" });
    const { data } = await response.json();
    let token = "";
    if (data?.liff_id) {
      await liff.init({ liffId: data.liff_id });
      if (liff.isLoggedIn()) token = liff.getIDToken() || "";
      else if (!flow) { liff.login({ redirectUri: location.href }); return; }
    }
    if (!token && !flow) throw new Error("請從 LINE 圖文選單開啟此頁。");
    identity = token ? { line_id_token: token } : { flow_id: flow };
    snapshot = await request("query", {});
    render(snapshot);
    form.hidden = false;
    show("", "ready");
  } catch (error) { show(error.message || "無法載入資料，請重新開啟。", "error"); }
}
init();
</script>
</body>
</html>
