<!DOCTYPE html>
<!--
File: profile_update.html
Description: 保留客戶資料異動原始版面，但在正式 Query／Preview／Apply 契約完成前只提供人工辦理指引。
-->
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>修改登記資料申請</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --bg: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%);
            --card: rgba(255,255,255,.92);
            --text: #334e68;
            --muted: #627d98;
            --error: #d64545;
            --success: #2f855a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px 12px;
            background: var(--bg);
            color: var(--text);
            font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .container {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 18px;
            padding: 24px 18px;
            box-shadow: 0 8px 30px rgba(31, 38, 135, .08);
        }
        .logo { color: var(--primary); font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px; }
        h1 { font-size: 22px; text-align: center; margin: 0 0 8px; }
        .subtitle { color: var(--muted); text-align: center; line-height: 1.6; margin-bottom: 22px; }
        .section-title { color: var(--primary); font-size: 17px; font-weight: 700; margin: 22px 0 12px; }
        .option, .field-card {
            background: rgba(255,255,255,.75);
            border: 1px solid rgba(74,144,226,.18);
            border-radius: 12px;
            padding: 13px;
            margin-bottom: 10px;
        }
        .option { display: flex; gap: 10px; align-items: flex-start; }
        .option input { width: 20px; height: 20px; accent-color: var(--primary); margin-top: 2px; }
        label { font-weight: 600; line-height: 1.45; }
        .help { color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 4px; }
        input, textarea, select {
            width: 100%;
            margin-top: 8px;
            border: 1px solid rgba(0,0,0,.12);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 16px;
            color: var(--text);
            background: #fff;
        }
        textarea { min-height: 90px; resize: vertical; }
        button {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 15px 16px;
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            background: var(--primary);
            margin-top: 14px;
        }
        button.secondary { background: #718096; }
        button:disabled { opacity: .55; }
        .status {
            display: none;
            border-radius: 12px;
            padding: 13px;
            line-height: 1.6;
            margin: 16px 0;
        }
        .status.error { display: block; color: var(--error); background: rgba(214,69,69,.08); border: 1px solid rgba(214,69,69,.2); }
        .status.notice { display: block; color: var(--text); background: rgba(74,144,226,.08); border: 1px solid rgba(74,144,226,.2); }
        .success-card { display: none; text-align: center; padding: 18px 0; }
        .success-icon { font-size: 48px; color: var(--success); margin-bottom: 12px; }
        .success-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .success-desc { color: var(--muted); line-height: 1.7; }
        .loader {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,.82);
            align-items: center;
            justify-content: center;
            z-index: 10;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>
<div class="container">
    <div id="formArea">
        <div class="logo" id="logo">新竹市月子工會</div>
        <h1>修改登記資料申請</h1>
        <div class="subtitle">線上異動申請仍在建置中。目前請直接在 LINE 對話留下想修改的項目與內容，由工會人員人工核對與補登。</div>
        <div id="status" class="status"></div>
        <form id="changeForm">
            <div class="section-title">1. 勾選要修改的項目</div>
            <div id="fieldOptions"></div>
            <div class="section-title">2. 填寫修改後內容</div>
            <div id="fieldInputs"></div>
            <button type="submit" id="submitButton" disabled>線上申請尚未啟用</button>
        </form>
    </div>
</div>

<script>
    const fields = [
        { id: "name", label: "姓名", help: "由工會核對身分後人工更新。" },
        { id: "phone", label: "聯絡電話", help: "請在 LINE 對話提供可聯絡的電話。" },
        { id: "expected_date", label: "預產期／生產日", help: "請提供正確日期與異動原因。" },
        { id: "service_days", label: "服務天數", help: "服務條件異動須由工會確認案件狀態。" },
        { id: "address", label: "服務地址", help: "請勿在公開群組留下完整地址。" }
    ];

    function init() {
        renderOptions();
        const status = document.getElementById("status");
        status.textContent = "這個入口目前不會送出或修改正式資料。請回到 LINE 對話聯絡工會，由專員人工協助。";
        status.className = "status notice";
    }

    function renderOptions() {
        const container = document.getElementById("fieldOptions");
        container.innerHTML = fields.map(field => `
            <div class="option">
                <input type="checkbox" id="pick_${field.id}" value="${field.id}" disabled>
                <div>
                    <label for="pick_${field.id}">${escapeHtml(field.label)}</label>
                    <div class="help">${escapeHtml(field.help)}</div>
                </div>
            </div>
        `).join("");
        document.getElementById("fieldInputs").innerHTML = '<div class="help">正式查詢、異動預覽與送出流程完成後，才會在此載入目前資料。</div>';
    }

    document.getElementById("changeForm").addEventListener("submit", event => {
        event.preventDefault();
        return false;
    });

    function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, char => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
        }[char]));
    }

    init();
</script>
</body>
</html>
