<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>修改登記資料申請</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --bg: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%);
            --card: rgba(255,255,255,.92);
            --text: #334e68;
            --muted: #627d98;
            --error: #d64545;
            --success: #2f855a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px 12px;
            background: var(--bg);
            color: var(--text);
            font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .container {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 18px;
            padding: 24px 18px;
            box-shadow: 0 8px 30px rgba(31, 38, 135, .08);
        }
        .logo { color: var(--primary); font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px; }
        h1 { font-size: 22px; text-align: center; margin: 0 0 8px; }
        .subtitle { color: var(--muted); text-align: center; line-height: 1.6; margin-bottom: 22px; }
        .section-title { color: var(--primary); font-size: 17px; font-weight: 700; margin: 22px 0 12px; }
        .option, .field-card {
            background: rgba(255,255,255,.75);
            border: 1px solid rgba(74,144,226,.18);
            border-radius: 12px;
            padding: 13px;
            margin-bottom: 10px;
        }
        .option { display: flex; gap: 10px; align-items: flex-start; }
        .option input { width: 20px; height: 20px; accent-color: var(--primary); margin-top: 2px; }
        label { font-weight: 600; line-height: 1.45; }
        .help { color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 4px; }
        input, textarea, select {
            width: 100%;
            margin-top: 8px;
            border: 1px solid rgba(0,0,0,.12);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 16px;
            color: var(--text);
            background: #fff;
        }
        textarea { min-height: 90px; resize: vertical; }
        button {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 15px 16px;
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            background: var(--primary);
            margin-top: 14px;
        }
        button.secondary { background: #718096; }
        button:disabled { opacity: .55; }
        .status {
            display: none;
            border-radius: 12px;
            padding: 13px;
            line-height: 1.6;
            margin: 16px 0;
        }
        .status.error { display: block; color: var(--error); background: rgba(214,69,69,.08); border: 1px solid rgba(214,69,69,.2); }
        .success-card { display: none; text-align: center; padding: 18px 0; }
        .success-icon { font-size: 48px; color: var(--success); margin-bottom: 12px; }
        .success-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .success-desc { color: var(--muted); line-height: 1.7; }
        .loader {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,.82);
            align-items: center;
            justify-content: center;
            z-index: 10;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>
<div class="container">
    <div id="formArea">
        <div class="logo" id="logo">新竹市月子工會</div>
        <h1>修改登記資料申請</h1>
        <div class="subtitle">請先勾選想修改的項目，再依序填寫新內容。送出後將由工會人員審核，審核通過後才會更新正式資料。</div>
        <div id="status" class="status"></div>
        <form id="changeForm">
            <div class="section-title">1. 勾選要修改的項目</div>
            <div id="fieldOptions"></div>
            <div class="section-title">2. 填寫修改後內容</div>
            <div id="fieldInputs"></div>
            <button type="submit" id="submitButton">送出修改申請</button>
        </form>
    </div>
    <div id="successCard" class="success-card">
        <div class="success-icon">✓</div>
        <div class="success-title">申請已送出</div>
        <div class="success-desc">您的資料修改申請已暫存，請耐心等候工會人員審核。審核完成後，工會將依結果通知您。</div>
        <button onclick="closeWindow()">關閉視窗</button>
    </div>
</div>
<div id="loader" class="loader">資料送出中，請稍候...</div>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    let currentLineUserId = "";
    let currentIdToken = "";
    let fields = [];
    const supportedIds = new Set(["name", "phone", "expected_date", "service_days", "address"]);

    async function init() {
        try {
            const [lineRes, configRes] = await Promise.all([
                fetch("/api/line/config"),
                fetch("/api/config/liff/runtime?page=registration")
            ]);
            const lineConfig = await lineRes.json();
            const runtime = await configRes.json();
            fields = (runtime.page.fields || []).filter(field => supportedIds.has(field.id));
            applyTheme(runtime.theme || {});
            renderOptions();
            await initLiff(lineConfig);
        } catch (error) {
            showError("載入失敗，請重新整理後再試。");
        }
    }

    function applyTheme(theme) {
        if (theme.primary_color) document.documentElement.style.setProperty("--primary", theme.primary_color);
        if (theme.primary_hover_color) document.documentElement.style.setProperty("--primary-hover", theme.primary_hover_color);
        if (theme.background) document.documentElement.style.setProperty("--bg", theme.background);
        if (theme.text_color) document.documentElement.style.setProperty("--text", theme.text_color);
        if (theme.muted_text_color) document.documentElement.style.setProperty("--muted", theme.muted_text_color);
    }

    async function initLiff(config) {
        const urlParams = new URLSearchParams(window.location.search);
        const rawState = urlParams.get("liff.state") || "";
        const stateQueryStart = rawState.indexOf("?");
        const liffStateParams = new URLSearchParams(stateQueryStart >= 0 ? rawState.slice(stateQueryStart) : rawState);
        const urlUserId = urlParams.get("userId") || liffStateParams.get("userId") || "";
        if (config.liff_id) {
            await liff.init({ liffId: config.liff_id });
            if (!liff.isLoggedIn()) {
                liff.login({ redirectUri: window.location.href });
                return;
            }
            const profile = await liff.getProfile();
            currentLineUserId = profile.userId;
            currentIdToken = liff.getIDToken() || "";
        } else {
            currentLineUserId = urlUserId || "dev-profile-change-user";
        }
    }

    function renderOptions() {
        const container = document.getElementById("fieldOptions");
        container.innerHTML = fields.map(field => `
            <div class="option">
                <input type="checkbox" id="pick_${field.id}" value="${field.id}" onchange="renderInputs()">
                <div>
                    <label for="pick_${field.id}">${escapeHtml(field.label)}</label>
                    <div class="help">${formatRule(field)}</div>
                </div>
            </div>
        `).join("");
        renderInputs();
    }

    function renderInputs() {
        const selected = selectedFields();
        const container = document.getElementById("fieldInputs");
        if (!selected.length) {
            container.innerHTML = `<div class="help">請先勾選至少一個要修改的項目。</div>`;
            return;
        }
        container.innerHTML = selected.map(field => `
            <div class="field-card">
                <label for="value_${field.id}">${escapeHtml(field.label)}的新內容</label>
                ${renderControl(field)}
                <div class="help">${formatRule(field)}</div>
            </div>
        `).join("");
    }

    function selectedFields() {
        return fields.filter(field => document.getElementById(`pick_${field.id}`)?.checked);
    }

    function renderControl(field) {
        const placeholder = escapeHtml(field.placeholder || "");
        if (field.type === "number") {
            return `<input id="value_${field.id}" type="number" min="1" step="1" placeholder="${placeholder}" required>`;
        }
        if (field.type === "date") {
            return `<input id="value_${field.id}" type="date" required>`;
        }
        if (field.type === "phone") {
            return `<input id="value_${field.id}" type="tel" inputmode="tel" placeholder="例如：0912345678" required>`;
        }
        return `<textarea id="value_${field.id}" placeholder="${placeholder}" required></textarea>`;
    }

    function formatRule(field) {
        if (field.type === "phone") return "請填 09 開頭手機號碼，或可聯絡到您的完整電話。";
        if (field.type === "date") return "請依日期格式選擇，避免用文字描述日期。";
        if (field.type === "number") return "請填數字，例如 30。";
        return field.help_text || "請填寫完整且正確的新內容。";
    }

    document.getElementById("changeForm").addEventListener("submit", async event => {
        event.preventDefault();
        const selected = selectedFields();
        if (!selected.length) {
            showError("請先勾選要修改的項目。");
            return;
        }
        const changes = [];
        for (const field of selected) {
            const control = document.getElementById(`value_${field.id}`);
            const value = (control?.value || "").trim();
            if (!value) {
                showError(`請填寫「${field.label}」的新內容。`);
                return;
            }
            changes.push({ field_id: field.id, label: field.label, value });
        }
        showLoader(true);
        try {
            const response = await fetch("/api/line/profile-change-requests", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    line_user_id: currentLineUserId,
                    line_id_token: currentIdToken,
                    changes
                })
            });
            const result = await response.json();
            showLoader(false);
            if (response.ok && result.status === "success") {
                document.getElementById("formArea").style.display = "none";
                document.getElementById("successCard").style.display = "block";
            } else {
                showError(result.message || result.detail || "送出失敗，請稍後再試。");
            }
        } catch (error) {
            showLoader(false);
            showError("系統連線錯誤，請檢查網路後再試。");
        }
    });

    function showError(message) {
        const status = document.getElementById("status");
        status.textContent = message;
        status.className = "status error";
    }

    function showLoader(show) {
        document.getElementById("loader").style.display = show ? "flex" : "none";
    }

    function closeWindow() {
        if (window.liff && liff.isInClient()) liff.closeWindow();
    }

    function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, char => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
        }[char]));
    }

    init();
</script>
</body>
</html>
