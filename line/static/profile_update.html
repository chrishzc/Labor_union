<!DOCTYPE html>
<!--
File: profile_update.html
Description: 以 server 驗證的 LIFF token 提出 Client 資料異動申請，經 Preview／確認後送出 pending request。
-->
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>修改登記資料申請</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --bg: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%);
            --card: rgba(255,255,255,.92);
            --text: #334e68;
            --muted: #627d98;
            --error: #d64545;
            --success: #2f855a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px 12px;
            background: var(--bg);
            color: var(--text);
            font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .container {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 18px;
            padding: 24px 18px;
            box-shadow: 0 8px 30px rgba(31, 38, 135, .08);
        }
        .logo { color: var(--primary); font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px; }
        h1 { font-size: 22px; text-align: center; margin: 0 0 8px; }
        .subtitle { color: var(--muted); text-align: center; line-height: 1.6; margin-bottom: 22px; }
        .section-title { color: var(--primary); font-size: 17px; font-weight: 700; margin: 22px 0 12px; }
        .option, .field-card {
            background: rgba(255,255,255,.75);
            border: 1px solid rgba(74,144,226,.18);
            border-radius: 12px;
            padding: 13px;
            margin-bottom: 10px;
        }
        .option { display: flex; gap: 10px; align-items: flex-start; }
        .option input { width: 20px; height: 20px; accent-color: var(--primary); margin-top: 2px; }
        label { font-weight: 600; line-height: 1.45; }
        .help { color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 4px; }
        input, textarea, select {
            width: 100%;
            margin-top: 8px;
            border: 1px solid rgba(0,0,0,.12);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 16px;
            color: var(--text);
            background: #fff;
        }
        textarea { min-height: 90px; resize: vertical; }
        button {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 15px 16px;
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            background: var(--primary);
            margin-top: 14px;
        }
        button.secondary { background: #718096; }
        button:disabled { opacity: .55; }
        .status {
            display: none;
            border-radius: 12px;
            padding: 13px;
            line-height: 1.6;
            margin: 16px 0;
        }
        .status.error { display: block; color: var(--error); background: rgba(214,69,69,.08); border: 1px solid rgba(214,69,69,.2); }
        .status.notice { display: block; color: var(--text); background: rgba(74,144,226,.08); border: 1px solid rgba(74,144,226,.2); }
        .success-card { display: none; text-align: center; padding: 18px 0; }
        .success-icon { font-size: 48px; color: var(--success); margin-bottom: 12px; }
        .success-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .success-desc { color: var(--muted); line-height: 1.7; }
        .readback-card { display: none; background: rgba(47,133,90,.08); border: 1px solid rgba(47,133,90,.2); border-radius: 12px; padding: 13px; margin: 16px 0; line-height: 1.7; }
        .loader {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,.82);
            align-items: center;
            justify-content: center;
            z-index: 10;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>
<div class="container">
    <div id="formArea">
        <div class="logo" id="logo">新竹市月子工會</div>
        <h1>修改登記資料申請</h1>
        <div class="subtitle">身分由伺服器驗證。你可以修改自己的基本資料；送出後由工會人員核准，核准前不會直接變更資料。</div>
        <div id="status" class="status"></div>
        <div id="submissionReadback" class="readback-card" aria-live="polite"></div>
        <form id="changeForm">
            <div class="section-title">目前登記資料</div>
            <div id="currentValues" class="field-card">正在讀取…</div>
            <div class="section-title">選擇要修改的項目</div>
            <div id="fieldOptions"></div>
            <div class="section-title">填寫修改後內容</div>
            <div id="fieldInputs"></div>
            <button type="submit" id="submitButton" disabled>預覽異動</button>
            <button type="button" class="secondary" id="applyButton" hidden>確認並送出申請</button>
        </form>
    </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    const fields = [
        ["name", "姓名"], ["gender", "性別"], ["phone", "聯絡電話"], ["city", "縣市"],
        ["address", "地址"], ["residence_type", "居住型態"], ["delivery_type", "生產方式"],
        ["baby_info", "寶寶資訊"], ["notes", "其他事項"]
    ].map(([id, label]) => ({id, label}));
    let lineIdToken = "";
    let profile = null;
    let preview = null;
    const correlationId = `liff-profile-${Date.now()}`;

    async function init() {
        renderOptions();
        try {
            const config = await fetch('/api/v1/line/identity/runtime-config');
            const configBody = await config.json();
            const liffId = configBody.data?.liff_id;
            if (!config.ok || !liffId) throw new Error('LIFF 尚未完成設定。');
            await liff.init({liffId});
            if (!liff.isLoggedIn()) { liff.login({redirectUri: location.href}); return; }
            lineIdToken = liff.getIDToken() || "";
            if (!lineIdToken) throw new Error('無法取得 LINE 登入憑證，請重新開啟此頁。');
            await openCustomerIdentityFlow();
            const result = await request('/api/v1/line/client-profile/query', {line_id_token: lineIdToken});
            profile = result.data;
            renderCurrent(profile);
            document.getElementById("submitButton").disabled = false;
            showStatus("已載入目前資料。選擇欄位後可先預覽，預覽不會寫入資料。", "notice");
        } catch (error) { showStatus(error.message || "目前無法載入資料，請稍後再試。", "error"); }
    }

    async function openCustomerIdentityFlow() {
        const storageKey = "line-flow-idempotency:customer_binding";
        const idempotencyKey = sessionStorage.getItem(storageKey) || crypto.randomUUID();
        sessionStorage.setItem(storageKey, idempotencyKey);
        await request('/api/v1/line/identity/flow/open', {
            purpose: 'customer_binding',
            idempotency_key: idempotencyKey,
            line_id_token: lineIdToken
        });
    }

    function renderOptions() {
        const container = document.getElementById("fieldOptions");
        container.innerHTML = fields.map(field => `
            <div class="option">
                <input type="checkbox" id="pick_${field.id}" value="${field.id}">
                <div>
                    <label for="pick_${field.id}">${escapeHtml(field.label)}</label>
                    <div class="help">送出後由工會人員核准。</div>
                </div>
            </div>
        `).join("");
        container.querySelectorAll("input").forEach(input => input.addEventListener("change", renderInputs));
    }

    function renderCurrent(view) {
        document.getElementById("currentValues").innerHTML = fields.map(field => `<div><strong>${escapeHtml(field.label)}</strong>：${escapeHtml(view.values[field.id] || "")}</div>`).join("");
    }
    function renderInputs() {
        const selected = [...document.querySelectorAll("#fieldOptions input:checked")].map(input => input.value);
        document.getElementById("fieldInputs").innerHTML = selected.length ? selected.map(id => `<div class="field-card"><label for="value_${id}">${escapeHtml(fields.find(field => field.id === id).label)}</label><input id="value_${id}" data-profile-field="${id}" value="${escapeHtml(profile?.values[id] || "")}" required></div>`).join("") : '<div class="help">請先選擇至少一個欄位。</div>';
    }
    document.getElementById("changeForm").addEventListener("submit", async event => {
        event.preventDefault();
        const changes = Object.fromEntries([...document.querySelectorAll("[data-profile-field]")].map(input => [input.dataset.profileField, input.value]));
        try {
            const result = await request('/api/v1/line/client-profile/preview', {line_id_token: lineIdToken, changes, expected_version: profile.version, reason: 'LIFF 本人資料異動申請'});
            preview = result.data;
            showStatus(`請確認異動欄位：${Object.keys(preview.requested).join('、')}。目前尚未送出。`, "notice");
            document.getElementById("applyButton").hidden = false;
            document.getElementById("submitButton").hidden = true;
        } catch (error) { showStatus(error.message || "無法建立預覽，請重新載入。", "error"); }
    });
    document.getElementById("applyButton").addEventListener("click", async () => {
        if (!preview || !confirm("確認送出資料異動申請？送出後將等待工會人員審核。")) return;
        try {
            const result = await request('/api/v1/line/client-profile/apply', {line_id_token: lineIdToken, changes: preview.requested, expected_version: preview.current_version, reason: 'LIFF 本人資料異動申請', preview_fingerprint: preview.preview_fingerprint, idempotency_key: `liff-profile-${crypto.randomUUID()}`, correlation_id: correlationId});
            const receipt = result.data;
            if (receipt?.readback) {
                profile = receipt.readback;
                renderCurrent(profile);
            }
            renderSubmissionReceipt(receipt);
            showStatus(`申請已送出，目前狀態：${receipt?.request?.status || "pending"}。上方已顯示伺服器讀回資料。`, "notice");
            document.getElementById("applyButton").hidden = true;
            document.getElementById("changeForm").querySelectorAll("input,button").forEach(control => control.disabled = true);
        } catch (error) { showStatus(error.message || "申請未送出，請重新預覽。", "error"); }
    });
    async function request(url, payload) {
        const response = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.detail?.error?.message || body.detail?.message || '操作未完成。');
        return body;
    }
    function showStatus(message, kind) { const status = document.getElementById("status"); status.textContent = message; status.className = `status ${kind}`; }

    function renderSubmissionReceipt(receipt) {
        const card = document.getElementById("submissionReadback");
        if (!receipt?.request || !receipt?.readback) return;
        card.textContent = "";
        const title = document.createElement("strong");
        title.textContent = `申請單 #${receipt.request.request_id}（${receipt.request.status}）`;
        card.appendChild(title);
        card.appendChild(document.createElement("br"));
        const detail = document.createElement("span");
        detail.textContent = fields.map(field => `${field.label}：${receipt.readback.values?.[field.id] || ""}`).join("；");
        card.appendChild(detail);
        card.style.display = "block";
    }

    function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, char => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
        }[char]));
    }

    init();
</script>
</body>
</html>
