<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>月嫂個人網頁</title>
  <style>
    :root { color-scheme: light; font: 16px/1.6 "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; color: #1e1b19; background: #fff8f6; }
    body { margin: 0; }
    main { box-sizing: border-box; width: min(100% - 32px, 820px); margin: clamp(16px, 4vw, 40px) auto; padding: clamp(16px, 4vw, 36px); background: #fff; border: 1px solid #f2e2dc; border-radius: 12px; }
    h1 { font-size: clamp(1.75rem, 4vw, 2.25rem); line-height: 1.25; margin: 0; }
    h2 { font-size: 1.125rem; line-height: 1.4; margin: 0 0 .75rem; }
    section { border-top: 1px solid #f2e2dc; margin-top: 1.5rem; padding-top: 1.5rem; }
    .photos { display: flex; gap: .75rem; overflow-x: auto; overscroll-behavior-inline: contain; scroll-snap-type: x mandatory; padding-bottom: .35rem; }
    figure { flex: 0 0 min(85%, 20rem); min-width: 0; margin: 0; scroll-snap-align: start; }
    .photos img, .unavailable { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #fff8f6; border-radius: .5rem; }
    .unavailable { display: grid; place-items: center; margin: 0; }
    .photo-open { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
    .photo-open img { display: block; }
    #photo-viewer { box-sizing: border-box; position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; overflow: hidden; color: #fff; background: #181513; }
    #photo-viewer::backdrop { background: #181513; }
    .viewer-layout { display: grid; height: 100%; grid-template-rows: auto minmax(0, 1fr); }
    .viewer-controls { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; padding: .5rem max(.75rem, env(safe-area-inset-right)) .5rem max(.75rem, env(safe-area-inset-left)); }
    .viewer-controls button { min-height: 44px; min-width: 44px; padding: .4rem .75rem; font: inherit; }
    #photo-close { margin-inline-end: auto; }
    #photo-plane { min-width: 0; min-height: 0; display: grid; place-items: center; overflow: hidden; touch-action: none; user-select: none; }
    #photo-large { display: block; min-width: 0; min-height: 0; max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; }
    :focus-visible { outline: 2px solid #c2410c; outline-offset: 2px; }
  </style>
  <script defer src="./static/staff_web_profile.js"></script>
</head>
<body>
  <main>
    <p id="status" role="status">正在確認 LINE 身分…</p>
    <h1 id="staff-name" hidden></h1>
    <div id="groups"></div>
  </main>
  <dialog id="photo-viewer" aria-label="履歷照片大圖">
    <div class="viewer-layout">
      <div class="viewer-controls">
        <button type="button" id="photo-close" autofocus>關閉大圖</button>
        <button type="button" id="photo-smaller" aria-label="縮小圖片">−</button>
        <button type="button" id="photo-larger" aria-label="放大圖片">+</button>
      </div>
      <div id="photo-plane"><img id="photo-large" alt="" draggable="false"></div>
    </div>
  </dialog>
</body>
</html>
