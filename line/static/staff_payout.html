<!DOCTYPE html>
<!--
File: staff_payout.html
Description: 提供已驗證月嫂依目標付款月份查詢本人逐案薪資與付款紀錄。
-->
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>月嫂薪資請款明細</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Noto Sans TC", sans-serif; background: #f8f5f0; color: #241c18; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { margin: 0 0 8px; font-size: 32px; font-weight: 800; color: #241c18; }
    h2 { margin: 0; font-size: 24px; font-weight: 800; color: #241c18; }
    p { color: #54443b; font-size: 17px; line-height: 1.6; }
    .panel, .payment { background: #fff; border: 2px solid #ded2c9; border-radius: 16px; padding: 20px; margin-top: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .controls { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: end; }
    label { display: block; font-weight: 800; font-size: 18px; margin-bottom: 8px; color: #241c18; }
    input { width: 100%; border: 2px solid #ded2c9; border-radius: 12px; padding: 12px 14px; font-size: 18px; color: #241c18; min-height: 52px; outline: none; }
    input:focus { border-color: #973b17; box-shadow: 0 0 0 2px #fcebdd; }
    button { border: 0; border-radius: 14px; padding: 14px 22px; font-size: 18px; font-weight: 800; min-height: 54px; cursor: pointer; transition: all 0.15s ease; }
    .primary { color: #fff; background: #973b17; }
    .primary:hover:not(:disabled) { background: #7c2d0e; }
    .secondary { margin-top: 12px; color: #973b17; background: #fcebdd; border: 2px solid #e9c5ad; }
    button:disabled { cursor: not-allowed; opacity: .6; }
    .message { margin-top: 16px; padding: 14px 18px; border-radius: 12px; background: #f2ede9; color: #241c18; font-size: 16px; overflow-wrap: anywhere; line-height: 1.6; }
    .error { background: #fee2e2; color: #b91c1c; }
    .summary { display: flex; justify-content: space-between; gap: 14px; align-items: center; border-bottom: 1.5px solid #f2ede9; padding-bottom: 14px; }
    .amount { color: #241c18; font-size: 28px; font-weight: 900; white-space: nowrap; }
    .status { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 8px; background: #fcebdd; color: #8c320e; font-size: 15px; font-weight: 800; border: 1px solid #e2bca1; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 10px 16px; margin: 16px 0 0; font-size: 17px; }
    dt { color: #54443b; font-weight: 700; }
    dd { margin: 0; text-align: right; font-weight: 800; color: #241c18; }
    .transactions { margin: 16px 0 0; padding: 14px 18px; border-left: 4px solid #973b17; background: #fbf9f6; border-radius: 0 10px 10px 0; font-size: 15px; }
    .transactions li { margin-top: 8px; }
    @media (max-width: 560px) { .controls { grid-template-columns: 1fr; } .summary { display: block; } .amount { margin-top: 10px; font-size: 32px; } }
  </style>
</head>
<body>
<main>
  <h1>薪資請款明細</h1>
  <p>選一個月份，就能看每個案件的薪資和付款紀錄。</p>
  <section class="panel" aria-labelledby="queryTitle">
    <h2 id="queryTitle">選擇付款月份</h2>
    <div class="controls">
      <div>
        <label for="monthInput">預計付款月份</label>
        <input id="monthInput" type="month">
      </div>
      <button id="loadPayouts" class="primary" type="button" disabled>查詢薪資明細</button>
    </div>
    <div id="status" class="message" hidden></div>
    <button id="reauthenticate" class="secondary" type="button" hidden>重新登入 LINE</button>
  </section>

  <section id="results" aria-live="polite"></section>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
let lineIdToken = "";
let flowId = "";
let identityReady = false;

function identityPayload() {
  return {flow_id: lineIdToken ? "" : flowId, line_id_token: lineIdToken, development_line_user_id: ""};
}

function showStatus(text, isError = false) {
  const box = document.getElementById("status");
  box.textContent = text;
  box.className = "message" + (isError ? " error" : "");
  box.hidden = false;
}

async function responseData(response) {
  try { return await response.json(); } catch (_) { return {}; }
}

function responseMessage(data, fallback) {
  return data.message || data.detail?.message || data.detail?.error?.message || data.error?.message || fallback;
}

function responseErrorCode(data) {
  return data.detail?.error?.code || data.detail?.code || data.error?.code || "";
}

function showReauthenticationFor(data) {
  document.getElementById("reauthenticate").hidden = !responseErrorCode(data).startsWith("liff_");
}

function reauthenticateLine() {
  try { liff.logout(); } catch (_) {}
  const redirect = new URL("/line-identity", location.origin);
  redirect.searchParams.set("target", "staff_payout");
  liff.login({redirectUri: redirect.toString()});
}

function requirePayoutPage(value) {
  if (!value || typeof value !== "object" || Array.isArray(value) ||
      typeof value.staff_name !== "string" || !Number.isInteger(value.year) ||
      !Number.isInteger(value.month) || !Array.isArray(value.items)) {
    throw new Error("目前查不到薪資，請聯絡工會。");
  }
  value.items.forEach(item => {
    if (!item || typeof item !== "object" || typeof item.case_no !== "string" ||
        typeof item.payment_status !== "string" || !Array.isArray(item.transactions)) {
      throw new Error("目前查不到案件薪資，請聯絡工會。");
    }
  });
  return value;
}

function money(value) {
  const amount = Number(value);
  return Number.isFinite(amount) ? new Intl.NumberFormat("zh-TW", {style: "currency", currency: "TWD", maximumFractionDigits: 0}).format(amount) : "—";
}

function statusLabel(status) {
  return ({pending: "待付款", payable: "待付款", partially_paid: "部分付款", completed: "已完成", paid: "已付款", anomaly: "需工會確認"})[status] || "需工會確認";
}

function detailRow(list, label, value) {
  const term = document.createElement("dt");
  term.textContent = label;
  const detail = document.createElement("dd");
  detail.textContent = value;
  list.append(term, detail);
}

function renderPayouts(page) {
  const results = document.getElementById("results");
  results.replaceChildren();
  if (!page.items.length) {
    showStatus(`${page.staff_name} 在 ${page.year} 年 ${page.month} 月沒有薪資請款明細。若要查其他月份，請變更「預計付款月份」後再查詢。`);
    return;
  }
  showStatus(`${page.staff_name}｜${page.year} 年 ${page.month} 月有 ${page.items.length} 筆案件薪資。`);
  page.items.forEach(item => {
    const article = document.createElement("article");
    article.className = "payment";
    const summary = document.createElement("div");
    summary.className = "summary";
    const titleBox = document.createElement("div");
    const title = document.createElement("h2");
    title.textContent = `案件 ${item.case_no}`;
    const badge = document.createElement("span");
    badge.className = "status";
    badge.textContent = statusLabel(item.payment_status);
    titleBox.append(title, badge);
    const amount = document.createElement("div");
    amount.className = "amount";
    amount.textContent = money(item.total_payable);
    summary.append(titleBox, amount);
    const details = document.createElement("dl");
    detailRow(details, "應付金額", money(item.total_payable));
    detailRow(details, "已付金額", money(item.amount_paid));
    detailRow(details, "還沒付的金額", money(item.amount_remaining));
    detailRow(details, "預計付款日", item.due_date || "還沒確定");
    detailRow(details, "實際付款日", item.paid_at || "尚未付款");
    const feeNotice = document.createElement("p");
    feeNotice.className = "hint";
    feeNotice.style.margin = "10px 0 0";
    feeNotice.style.fontSize = "15px";
    feeNotice.style.color = "#7c2d0e";
    feeNotice.textContent = "跨行匯款，銀行會扣 15 元手續費。若是政府補助方案一，客戶付的部分和政府補助的部分會在不同日期匯款。";
    article.append(summary, details, feeNotice);
    if (item.transactions.length) {
      const transactions = document.createElement("ul");
      transactions.className = "transactions";
      item.transactions.forEach(transaction => {
        const row = document.createElement("li");
        row.textContent = `${transaction.occurred_at || "沒有付款日期"}｜${statusLabel(transaction.transaction_status)}｜${money(transaction.amount)}`;
        transactions.appendChild(row);
      });
      article.appendChild(transactions);
    }
    results.appendChild(article);
  });
}

async function loadPayouts() {
  const value = document.getElementById("monthInput").value;
  if (!value) { showStatus("請先選要查的付款月份。", true); return; }
  const [year, month] = value.split("-").map(Number);
  const button = document.getElementById("loadPayouts");
  button.disabled = true;
  document.getElementById("results").replaceChildren();
  showStatus("薪資明細載入中...");
  try {
    const response = await fetch(`/api/v1/line/staff-self-service/payouts?year=${year}&month=${month}`, {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(identityPayload()),
    });
    const result = await responseData(response);
    if (!response.ok || result.success === false || !result.data) {
      showStatus(responseMessage(result, "無法讀取薪資明細。請稍後再按「查詢薪資明細」。"), true);
      showReauthenticationFor(result);
      return;
    }
    renderPayouts(requirePayoutPage(result.data));
  } catch (_) {
    showStatus("無法讀取薪資明細。請稍後再按「查詢薪資明細」。若仍無法查看，請聯絡工會。", true);
  } finally {
    button.disabled = !identityReady && !flowId;
  }
}

async function init() {
  const month = new Intl.DateTimeFormat("sv-SE", {timeZone:"Asia/Taipei",year:"numeric",month:"2-digit"}).format(new Date());
  document.getElementById("monthInput").value = month;
  flowId = new URLSearchParams(location.search).get("flow_id") || "";
  try {
    const result = await fetch("/api/v1/line/identity/runtime-config").then(response => response.json());
    const config = result.data || {};
    if (config.liff_id) {
      await liff.init({liffId: config.liff_id});
      if (!liff.isLoggedIn()) {
        if (flowId) identityReady = true;
        else { reauthenticateLine(); return; }
      } else {
        try { lineIdToken = liff.getIDToken() || ""; } catch (_) {}
      }
    }
  } catch (_) {
    showStatus("無法確認 LINE 身分。請按「重新登入 LINE」。", true);
    document.getElementById("reauthenticate").hidden = false;
  }
  if (!lineIdToken && !flowId) {
    showStatus("無法取得 LINE 身分，請從 LINE 圖文選單重新開啟。", true);
    document.getElementById("reauthenticate").hidden = false;
    return;
  }
  identityReady = true;
  document.getElementById("loadPayouts").disabled = false;
  await loadPayouts();
}

document.getElementById("loadPayouts").addEventListener("click", loadPayouts);
document.getElementById("reauthenticate").addEventListener("click", reauthenticateLine);
init();
</script>
</body>
</html>
