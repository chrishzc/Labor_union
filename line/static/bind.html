<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新竹市月子工會 - LINE 帳號綁定</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --bg-gradient: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text-dark: #334e68;
            --text-muted: #627d98;
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
            --error: #ef5350;
            --success: #66bb6a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-dark);
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* 頂部裝飾條 */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #4a90e2 0%, #63e6be 100%);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
        }
        .form-input.invalid {
            border-color: var(--error);
            box-shadow: 0 0 0 3px rgba(239, 83, 80, 0.12);
        }
        .field-error {
            display: none;
            margin-top: 6px;
            color: var(--error);
            font-size: 13px;
            line-height: 1.45;
        }
        .field-error.visible { display: block; }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #4a90e2 0%, #357abd 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.2);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* 提示卡片與狀態 */
        .status-message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            line-height: 1.5;
        }

        .status-message.error {
            background: rgba(239, 83, 80, 0.1);
            border: 1px solid rgba(239, 83, 80, 0.2);
            color: var(--error);
            display: block;
        }

        .status-message.success {
            background: rgba(102, 187, 106, 0.1);
            border: 1px solid rgba(102, 187, 106, 0.2);
            color: var(--success);
            display: block;
        }

        .status-message.info {
            background: rgba(74, 144, 226, 0.1);
            border: 1px solid rgba(74, 144, 226, 0.2);
            color: var(--primary);
            display: block;
        }

        /* 載入遮罩 */
        .loader-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.3s ease;
            border-radius: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(74, 144, 226, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin-bottom: 15px;
        }

        .loader-text {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* 成功卡片 */
        .success-card {
            text-align: center;
            display: none;
        }

        .success-icon {
            width: 70px;
            height: 70px;
            background: rgba(102, 187, 106, 0.1);
            color: var(--success);
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            margin-bottom: 20px;
            border: 2px solid rgba(102, 187, 106, 0.2);
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .success-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--success);
        }

        .success-text {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn-close {
            width: 100%;
            padding: 12px;
            background: #f0f4f8;
            color: var(--text-dark);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-close:hover {
            background: #e2e8f0;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 測試降級標籤 */
        .test-badge {
            display: inline-block;
            background: #ff9800;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container" id="mainCard">
    <!-- 載入中遮罩 -->
    <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <div class="loader-text" id="loaderText">正在初始化系統...</div>
    </div>

    <!-- 一般表單卡片 -->
    <div id="formContent">
        <div class="header">
            <div class="logo" id="pageLogo">Labor Union</div>
            <div class="title" id="formTitle">客戶登記與 LINE 綁定</div>
            <div class="subtitle" id="formSubtitle">請核對姓名與電話。已完成登記即可綁定；尚未完成者，請填寫需求調查，送出後由工會審核。</div>
        </div>

        <div class="status-message" id="statusMessage"></div>
        <button type="button" id="bindingResultLookup" hidden>查詢原綁定</button>
        <a id="restartBinding" href="/line-bind" hidden>重新開啟客戶登記與綁定</a>

        <form id="bindForm" onsubmit="handleFormSubmit(event)" novalidate>
            <!-- LINE User ID 在背景自動獲取，不需產婦手動填寫 -->
            <input type="hidden" id="lineUserId">

            <div class="form-group">
                <label class="form-label" for="userName" id="userNameLabel">您的真實姓名</label>
                <input class="form-input" type="text" id="userName" placeholder="請輸入姓名" required maxlength="30" autocomplete="name">
            </div>

            <div class="form-group">
                <label class="form-label" for="userPhone" id="userPhoneLabel">聯絡電話</label>
                <input class="form-input" type="tel" id="userPhone" placeholder="請輸入聯絡電話（例 0912345678）" required inputmode="numeric" maxlength="20" autocomplete="tel">
            </div>

            <button class="btn-submit" type="submit" id="btnSubmit">確認綁定</button>
        </form>
        <div id="bindingFailureActions" style="display:none; gap:10px; margin-top:14px;">
            <button type="button" class="btn-close" style="flex:1;" onclick="dismissBindingFailure()">返回修改</button>
        </div>
    </div>

    <!-- 成功卡片 -->
    <div class="success-card" id="successContent">
        <div class="success-icon">✓</div>
        <div class="success-title" id="successTitle">綁定與查詢成功</div>
        <div class="success-text" id="successDesc">
            綁定成功，專屬選單將稍後更新。
        </div>
        <button class="btn-close" id="closeButton" onclick="closeLiffWindow()">關閉視窗</button>
    </div>
</div>

<!-- 載入 LINE LIFF SDK -->
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    // 預設配置與狀態
    let isTestMode = false;
    let currentIdToken = '';
    let runtimePage = null;
    let bindingOperationPending = false;
    let bindingResultUnknown = false;
    let pendingBinding = null;

    // 取得 DOM 元素
    const loader = document.getElementById('loader');
    const loaderText = document.getElementById('loaderText');
    const statusMessage = document.getElementById('statusMessage');
    const lineUserIdInput = document.getElementById('lineUserId');
    const formContent = document.getElementById('formContent');
    const successContent = document.getElementById('successContent');
    const successDesc = document.getElementById('successDesc');

    // 輔助函式：顯示提示訊息
    function showMessage(text, type = 'info') {
        statusMessage.textContent = text;
        statusMessage.className = `status-message ${type}`;
    }

    function normalizePhone(value) {
        return String(value || '').replace(/\D/g, '');
    }

    function setFieldError(input, message) {
        const group = input.closest('.form-group');
        if (!group) return;
        let error = group.querySelector('.field-error');
        if (!error) {
            error = document.createElement('div');
            error.className = 'field-error';
            group.appendChild(error);
        }
        input.classList.toggle('invalid', Boolean(message));
        error.textContent = message || '';
        error.classList.toggle('visible', Boolean(message));
    }

    function clearFieldErrors() {
        document.querySelectorAll('.form-input.invalid').forEach(input => input.classList.remove('invalid'));
        document.querySelectorAll('.field-error').forEach(error => {
            error.textContent = '';
            error.classList.remove('visible');
        });
    }

    function validateBindForm(nameInput, phoneInput, lineUserId) {
        clearFieldErrors();
        const errors = [];
        const name = nameInput.value.trim();
        const phone = normalizePhone(phoneInput.value);
        phoneInput.value = phone;
        if (!name) {
            errors.push('請填寫姓名。');
            setFieldError(nameInput, '請填寫姓名。');
        } else if (name.length < 2) {
            errors.push('姓名至少需 2 個字。');
            setFieldError(nameInput, '姓名至少需 2 個字。');
        } else if (/\d/.test(name)) {
            errors.push('姓名不可包含數字。');
            setFieldError(nameInput, '姓名不可包含數字。');
        }
        if (!/^09\d{8}$/.test(phone)) {
            errors.push('聯絡電話需為 09 開頭的 10 碼手機號碼，例如 0912345678。');
            setFieldError(phoneInput, '聯絡電話需為 09 開頭的 10 碼手機號碼，例如 0912345678。');
        }
        if (!lineUserId) {
            const queryUserId = getQueryParam('userId');
            lineUserIdInput.value = queryUserId || ('client-' + Math.random().toString(36).substring(2, 10));
        }
        return {
            ok: errors.length === 0,
            message: errors[0] || ''
        };
    }

    // 輔助函式：隱藏載入中
    function hideLoader() {
        loader.style.opacity = '0';
        setTimeout(() => {
            loader.style.display = 'none';
        }, 300);
    }

    // 輔助函式：顯示載入中
    function showLoader(text) {
        loaderText.textContent = text;
        loader.style.display = 'flex';
        loader.style.opacity = '1';
    }

    // 取得 URL 查詢參數中的 userId (用於 Webhook 降級測試)
    function getQueryParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    const existingCaseEntry = getQueryParam('entry') === 'existing_case';
    const bindingAttemptKey = 'line-binding-attempt:bind:' + (getQueryParam('flow_id') || '');

    // 初始化頁面
    window.addEventListener('DOMContentLoaded', async () => {
        if (existingCaseEntry) {
            document.getElementById('restartBinding').href = '/line-bind?entry=existing_case';
        }
        try {
            // 取得現行標準 LIFF runtime 配置
            let liffId = '';
            try {
                const configRes = await fetch('/api/v1/line/identity/runtime-config');
                if (configRes.ok) {
                    const configData = await configRes.json();
                    liffId = configData.data?.liff_id || '';
                }
            } catch (e) {
                console.warn('讀取 runtime-config 失敗:', e);
            }

            const runtimeRes = await fetch('/api/config/liff/runtime?page=bind');
            if (!runtimeRes.ok) throw new Error('目前無法開啟綁定頁面。請稍後從 LINE 重新開啟。');
            const runtime = await runtimeRes.json();
            runtimePage = runtime.page;
            applyRuntime(runtime);

            if (!liffId || liffId === 'your_liff_id_here' || liffId.trim() === '') {
                hideLoader();
                return;
            }

            await liff.init({ liffId: liffId });

            // 檢查登入狀態，若在 LINE client 未登入則自動登入
            if (!liff.isLoggedIn()) {
                if (liff.isInClient()) {
                    showLoader('正在導向 LINE 登入授權...');
                    liff.login({ redirectUri: window.location.href });
                    return;
                } else {
                    hideLoader();
                    return;
                }
            }

            currentIdToken = liff.getIDToken() || '';
            if (await recoverPendingBinding()) {
                hideLoader();
                return;
            }
            // 已登入，背景自動獲取 User Profile（不需使用者手動填寫）
            const profile = await liff.getProfile();
            if (profile && profile.userId) {
                lineUserIdInput.value = profile.userId;
                await fetchAndFillClientInfo(profile.userId, currentIdToken);
            }
            hideLoader();

        } catch (error) {
            console.warn('LIFF 載入提示:', error);
            hideLoader();
            showMessage(error.message || '頁面初始化失敗，請稍後重試。', 'error');
            document.querySelectorAll('#bindForm input, #bindForm button').forEach(control => control.disabled = true);
        }
    });

    function applyRuntime(runtime) {
        const theme = runtime.theme;
        const page = runtime.page;
        const root = document.documentElement.style;
        root.setProperty('--primary', theme.primary_color);
        root.setProperty('--primary-hover', theme.primary_hover_color);
        root.setProperty('--bg-gradient', theme.background);
        root.setProperty('--text-dark', theme.text_color);
        root.setProperty('--text-muted', theme.muted_text_color);
        document.body.style.fontFamily = theme.font_family;
        document.getElementById('pageLogo').textContent = page.content.logo || '';
        document.getElementById('formTitle').textContent = page.title;
        document.getElementById('formSubtitle').textContent = existingCaseEntry
            ? '請填你向工會登記時用的姓名和手機號碼。'
            : page.subtitle;
        document.getElementById('btnSubmit').textContent = page.submit_button;
        document.getElementById('successTitle').textContent = page.success_title;
        successDesc.textContent = page.success_description;
        document.getElementById('closeButton').textContent = page.content.close_button || '關閉視窗';
        loaderText.textContent = page.loading_text;
        const fields = Object.fromEntries(page.fields.map(field => [field.id, field]));
        applyFieldConfig(fields.name, 'userName', 'userNameLabel');
        applyFieldConfig(fields.phone, 'userPhone', 'userPhoneLabel');
    }

    function applyFieldConfig(field, inputId, labelId) {
        if (!field) return;
        document.getElementById(labelId).textContent = field.label;
        const input = document.getElementById(inputId);
        input.placeholder = field.placeholder || '';
        input.required = Boolean(field.required);
    }

    // 查詢並帶入既有客戶資料
    async function fetchAndFillClientInfo(userId, idToken) {
        try {
            const res = await fetch('/api/line/client-info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    line_user_id: userId || '',
                    line_id_token: idToken || ''
                })
            });
            if (res.ok) {
                const data = await res.json();
                if (data.status === 'success' && data.client) {
                    document.getElementById('userName').value = data.client.name || '';
                    document.getElementById('userPhone').value = data.client.phone || '';
                    showMessage(runtimePage?.content?.client_prefill_message || '已自動帶入您先前綁定之姓名與電話。', 'info');
                }
            }
        } catch (e) {
            console.warn('無法自動帶入用戶資料:', e);
        }
    }

    // 啟動測試模式 (不展示任何內部 ID 輸入框)
    function enableTestMode(tipText) {
        isTestMode = true;
        if (tipText) showMessage(tipText, 'info');
        hideLoader();
    }

    function showBindingFailure(message) {
        const problem = message || '資料無法核對，請確認姓名與電話。';
        showMessage(problem + ' 如需協助，請回 LINE 官方帳號聊天室留言。', 'error');
        document.getElementById('bindingFailureActions').style.display = 'flex';
    }

    function showRebindBlocked(response, result) {
        const error = result.detail?.error;
        if (response.status !== 409 || error?.code !== 'line_customer_rebind_blocked' || typeof error.message !== 'string' || !error.message.trim()) {
            return false;
        }
        showMessage(error.message, 'error');
        document.getElementById('bindingFailureActions').style.display = 'flex';
        return true;
    }

    function dismissBindingFailure() {
        document.getElementById('bindingFailureActions').style.display = 'none';
        showMessage('', 'info');
        document.getElementById('userName').focus();
    }

    function showBindingResult(title, description, caseNo) {
        formContent.style.display = 'none';
        successContent.style.display = 'block';
        const isNewBinding = title === '綁定成功';
        document.getElementById('successTitle').textContent = (isNewBinding && runtimePage?.success_title) || title;
        successDesc.style.whiteSpace = 'pre-line';
        successDesc.textContent = [...new Set([isNewBinding ? runtimePage?.success_description : '', description,
            caseNo ? `案件編號：${caseNo}` : ''])].filter(Boolean).join('\n');
    }

    async function requestBindingOutcome(path, body) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 15000);
        try {
            const response = await fetch(path, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body), signal: controller.signal,
            });
            return {response, result: await response.json()};
        } finally {
            clearTimeout(timer);
        }
    }

    function isBindingReceipt(receipt) {
        return receipt && ['bound', 'existing'].includes(receipt.status)
            && typeof receipt.receipt_identity === 'string' && receipt.receipt_identity.trim();
    }

    function clearBindingAttempt() {
        sessionStorage.removeItem(bindingAttemptKey);
        pendingBinding = null;
        bindingResultUnknown = false;
        document.getElementById('bindingResultLookup').hidden = true;
    }

    function renderBindingReceipt(receipt, caseNo) {
        sessionStorage.removeItem('line_flow_id_customer');
        clearBindingAttempt();
        if (receipt.status === 'existing') {
            showBindingResult('您已完成綁定', '您已完成綁定，可直接返回 LINE 使用。', caseNo);
            return;
        }
        showBindingResult('綁定成功', '綁定成功，專屬選單將稍後更新。若同時具有客戶與月嫂身分，請返回聊天室輸入「切換客戶」或「切換月嫂」，明確選擇要使用的身分。', caseNo);
    }

    function showBindingLookup(message) {
        document.getElementById('btnSubmit').disabled = true;
        document.getElementById('bindingFailureActions').style.display = 'none';
        const lookup = document.getElementById('bindingResultLookup');
        lookup.hidden = false;
        lookup.onclick = readBindingResult;
        showMessage(message, 'error');
    }

    async function readBindingResult() {
        const lookup = document.getElementById('bindingResultLookup');
        if (!pendingBinding || lookup.disabled) return;
        lookup.disabled = true;
        try {
            const {response, result} = await requestBindingOutcome('/api/v1/line/identity/flow/binding-result', {
                ...pendingBinding, line_id_token: currentIdToken,
            });
            if (response.ok && isBindingReceipt(result?.data)) {
                renderBindingReceipt(result.data);
                return;
            }
            showBindingLookup('還不能確認 LINE 是否已綁定。請稍後按「查詢原綁定」，或聯絡工會。');
        } catch {
            showBindingLookup('暫時無法確認綁定結果。請稍後按「查詢原綁定」。');
        } finally {
            lookup.disabled = false;
        }
    }

    async function recoverPendingBinding() {
        const raw = sessionStorage.getItem(bindingAttemptKey);
        if (!raw) return false;
        let attempt;
        try { attempt = JSON.parse(raw); } catch { return false; }
        if (!attempt || attempt.purpose !== 'customer_binding' || !attempt.flow_id || !attempt.attempt_id) return false;
        pendingBinding = {flow_id: attempt.flow_id, purpose: attempt.purpose, attempt_id: attempt.attempt_id};
        bindingResultUnknown = true;
        showBindingLookup('正在查詢原綁定。');
        await readBindingResult();
        return true;
    }

    async function applyCustomerBinding(candidate) {
        const attempt = {flow_id: candidate.flowId, purpose: 'customer_binding', attempt_id: crypto.randomUUID()};
        sessionStorage.setItem(bindingAttemptKey, JSON.stringify(attempt));
        pendingBinding = attempt;
        bindingResultUnknown = true;
        const {response, result} = await requestBindingOutcome('/api/v1/line/identity/customer/apply', {
            flow_id: candidate.flowId,
            line_id_token: currentIdToken,
            name: candidate.name,
            phone: candidate.phone,
            expected_version: candidate.preview.expected_version,
            preview_fingerprint: candidate.preview.preview_fingerprint,
            attempt_id: attempt.attempt_id,
        });
        if (!response.ok && response.status >= 400 && response.status < 500
            && ![408, 429].includes(response.status) && result?.detail
            && (response.status !== 409 || ['line_customer_rebind_blocked', 'line_identity_binding_conflict']
                .includes(result.detail?.error?.code))) {
            clearBindingAttempt();
            if (showRebindBlocked(response, result)) return;
            if (response.status === 410) {
                sessionStorage.removeItem('line_flow_id_customer');
                document.getElementById('restartBinding').hidden = false;
            }
        }
        if (!response.ok || !isBindingReceipt(result?.data)
            || result.data.preview_fingerprint !== candidate.preview.preview_fingerprint) {
            throw new Error('目前無法完成綁定，請重新核對資料。');
        }
        renderBindingReceipt(result.data, candidate.preview.candidate?.case_no);
    }

    async function handleFormSubmit(event) {
        event.preventDefault();
        if (bindingOperationPending || bindingResultUnknown) return;
        const nameInput = document.getElementById('userName');
        const phoneInput = document.getElementById('userPhone');
        const validation = validateBindForm(nameInput, phoneInput, lineUserIdInput.value.trim());
        if (!validation.ok) {
            showBindingFailure(validation.message);
            return;
        }
        dismissBindingFailure();
        bindingOperationPending = true;
        showLoader(runtimePage?.content?.submit_loading_text || '正在核對資料...');
        try {
            let flowId = getQueryParam('flow_id') || sessionStorage.getItem('line_flow_id_customer');
            if (!flowId) {
                const response = await fetch('/api/v1/line/identity/flow/open', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({purpose: 'customer_binding', idempotency_key: crypto.randomUUID(), line_id_token: currentIdToken}),
                });
                const result = await response.json();
                if (!response.ok || !result.data?.flow_id) throw new Error('請回到 LINE 重新開啟綁定頁面。');
                flowId = result.data.flow_id;
            }
            sessionStorage.setItem('line_flow_id_customer', flowId);
            const name = nameInput.value.trim();
            const phone = normalizePhone(phoneInput.value);
            const response = await fetch('/api/v1/line/identity/customer/preview', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({flow_id: flowId, line_id_token: currentIdToken, name, phone}),
            });
            const result = await response.json();
            if (showRebindBlocked(response, result)) return;
            if (response.status === 410) {
                sessionStorage.removeItem('line_flow_id_customer');
                document.getElementById('restartBinding').hidden = false;
                throw new Error('連結已失效或已使用，請重新開啟客戶登記與綁定。');
            }
            if (!response.ok || !result.data) throw new Error('目前無法核對資料，請稍後再試。');
            const preview = result.data;
            if (!['already_bound', 'matched', 'not_found'].includes(preview.status)
                || !Number.isSafeInteger(preview.expected_version) || preview.expected_version < 0
                || !/^[0-9a-f]{64}$/.test(preview.preview_fingerprint || '')
                || (preview.status !== 'not_found' && (!preview.candidate || typeof preview.candidate.currently_bound !== 'boolean'))) {
                throw new Error('資料核對結果不完整，請重新開啟頁面或聯絡工會確認。');
            }
            if (existingCaseEntry && (!preview.candidate?.case_no || !preview.candidate.has_completed_survey)) {
                throw new Error('無法核對案件資料。請確認姓名及手機號碼，或聯絡工會協助。');
            }
            if (preview.status === 'already_bound') {
                showBindingResult('您已完成綁定', '您已完成綁定，可直接返回 LINE 使用。', preview.candidate?.case_no);
                return;
            }
            if (preview.status === 'matched' && preview.candidate?.has_completed_survey) {
                await applyCustomerBinding({flowId, name, phone, preview});
                return;
            }
            if (preview.status === 'not_found' || (preview.status === 'matched' && preview.candidate)) {
                const target = new URL('/line-registration', window.location.origin);
                target.searchParams.set('flow_id', flowId);
                target.searchParams.set('name', name);
                target.searchParams.set('phone', phone);
                if (preview.candidate?.case_no) target.searchParams.set('case_no', preview.candidate.case_no);
                window.location.replace(target.toString());
                return;
            }
            throw new Error('資料無法核對，請確認姓名與電話。');
        } catch (error) {
            if (bindingResultUnknown) {
                showBindingLookup('尚未確認綁定結果，請查詢原綁定。');
            } else {
                showBindingFailure(error.message || '目前無法核對資料，請稍後再試。');
                document.getElementById('btnSubmit').disabled = false;
            }
        } finally {
            bindingOperationPending = false;
            hideLoader();
        }
    }

    // 關閉 LIFF 視窗
    function closeLiffWindow() {
        try {
            if (liff && liff.isInClient()) {
                liff.closeWindow();
            } else {
                // 一般瀏覽器環境
                window.close();
                showMessage('若視窗未自動關閉，請手動關閉此分頁。', 'info');
            }
        } catch (e) {
            window.close();
        }
    }
</script>
