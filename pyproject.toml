[project]
name = "union"
version = "0.2.1"
description = "LINE-enabled administration, scheduling, and finance reconciliation for the Hsinchu postpartum caregiver union"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.3",
    "playwright>=1.60.0",
    "pymysql>=1.1.1",
    "openpyxl>=3.1.5",
    "watchdog>=6.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.38.0",
    "chromadb>=0.5.5",
    "requests>=2.32.3",
    "pydantic>=2.0.0",
    "pillow>=12.0.0",
    "python-multipart>=0.0.20",
    "redis>=5.2.0",
    "python-dotenv>=1.2.2",
    "jsonschema>=4.26.0",
    "google-auth>=2.38.0",
    "cachecontrol>=0.14.0",
    "starlette>=1.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires an explicitly configured disposable external service",
]

[dependency-groups]
dev = [
    "graphifyy>=0.9.43",
    "httpx2>=2.10.0",
    "pytest>=8.0",
]
