name: Issue 246 pre-merge acceptance

on:
  push:
    branches: ["dry-run/order-workbench-v2"]
    paths: [".github/workflows/issue-246-premerge-acceptance.yml"]

permissions:
  contents: read

concurrency:
  group: issue-246-premerge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-fixed-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui_react/package-lock.json

      - name: Verify fixed candidate inputs
        shell: bash
        run: |
          set -euo pipefail
          expected_candidate='c5b37b7259a024a729e03914b4e0d42eb061cea1'
          expected_main='49068f5feac5afb10b0e290150e06135cb4c27ed'
          verifier='.github/workflows/issue-246-premerge-acceptance.yml'
          git fetch --no-tags origin main dry-run/order-workbench-v2
          git merge-base --is-ancestor "$expected_candidate" "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$expected_main"
          test "$(git rev-parse origin/dry-run/order-workbench-v2)" = "$GITHUB_SHA"
          changed=$(git -c core.quotepath=false diff --name-only "$expected_candidate...$GITHUB_SHA")
          test "$changed" = "$verifier"
          git checkout --detach "$expected_candidate"
          test "$(git rev-parse HEAD)" = "$expected_candidate"

      - name: Install exact focused Python dependencies from repository lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, sys, tomllib
          with open('uv.lock', 'rb') as stream:
              packages = tomllib.load(stream)['package']
          wanted = {
              'pytest', 'python-dotenv', 'openpyxl', 'pymysql', 'fastapi',
              'pydantic', 'starlette', 'httpx', 'requests', 'jsonschema', 'pandas',
              'cryptography'
          }
          selected = {
              package['name']: package
              for package in packages
              if package['name'] in wanted
              and package.get('source') == {'registry': 'https://pypi.org/simple'}
          }
          missing = wanted - selected.keys()
          assert not missing, f'missing locked packages: {sorted(missing)}'
          specs = [f"{name}=={selected[name]['version']}" for name in sorted(wanted)]
          subprocess.run(
              [sys.executable, '-m', 'pip', 'install', '--only-binary=:all:', *specs],
              check=True,
          )
          PY

      - name: Verify directly affected owner backend and writer contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/domains/orders/subsystems/orders/modules/cancellation \
            tests/domains/orders/subsystems/orders/modules/historical-adoption \
            tests/domains/orders/subsystems/orders/modules/historical-completion \
            tests/domains/orders/subsystems/orders/modules/historical-precision-restart \
            tests/domains/orders/subsystems/orders/modules/historical-service-accounting \
            tests/domains/orders/subsystems/orders/modules/historical-stage-baseline \
            tests/domains/orders/subsystems/orders/modules/intake-terms-bootstrap \
            tests/domains/orders/subsystems/orders/modules/operational-stage-projection \
            tests/domains/orders/subsystems/orders/modules/service-date-confirmation \
            tests/test_task97_commit_dispositions.py \
            tests/test_writer_inventory_v3_dispositions.py \
            tests/test_weekly_report_migration_target_confirmation.py \
            tests/domains/global/subsystems/migration/modules/local-database-fresh-reset/test_bootstrap_disposable_mysql_schema.py
          python scripts/validate_writer_inventory_v3_candidate.py
          python scripts/validate_writer_inventory_v3_dispositions.py

      - name: Verify route registration and legacy preservation smoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from api.routes.orders_core_stage_projection import router
          paths = {route.path for route in router.routes}
          required = {
              '/api/orders/core-stage-timelines',
              '/api/orders/{case_no}/historical-adoption-evidence',
          }
          missing = required - paths
          assert not missing, f'missing beta routes: {sorted(missing)}'
          print('beta_route_smoke=', sorted(required))
          PY
          grep -q 'orders_core_stage_projection' api/main.py
          test -f ui_react/src/pages/OrderTrackerPage.tsx
          test -f ui_react/src/pages/OrdersPage.tsx
          test -f ui_react/src/pages/OrderWorkbenchV2Page.tsx

      - name: Verify current Beta React parity with install hooks disabled
        shell: bash
        run: |
          set -euo pipefail
          cd ui_react
          python - <<'PY'
          import json
          lock = json.load(open('package-lock.json', encoding='utf-8'))
          assert lock['lockfileVersion'] == 3
          resolved = [meta['resolved'] for meta in lock['packages'].values() if meta.get('resolved')]
          assert resolved
          assert all(url.startswith('https://registry.npmjs.org/') for url in resolved)
          assert all(meta.get('integrity') for meta in lock['packages'].values() if meta.get('resolved'))
          print('locked_install_hooks_disabled=', sorted(path for path, meta in lock['packages'].items() if meta.get('hasInstallScript')))
          PY
          npm ci --ignore-scripts
          npm test -- \
            src/tests/order_workbench_v2* \
            src/tests/order_core_stage_projection_contract.test.ts \
            src/tests/orders_contract_document_source.test.ts \
            src/tests/orders_incomplete_card_actions.test.tsx \
            src/tests/orders_service_dates_flow.test.tsx \
            src/tests/orders_entry_cutover.test.tsx \
            src/tests/react_entrypoint_registry.test.ts \
            src/tests/route_guard.test.tsx \
            --reporter=json --outputFile=../issue246-react-results.json
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('../issue246-react-results.json', 'utf8'));
          console.log(JSON.stringify({ tests: report.numTotalTests, passed: report.numPassedTests, failed: report.numFailedTests, pending: report.numPendingTests, success: report.success }));
          if (!report.success || report.numFailedTests !== 0 || report.numPendingTests !== 0) process.exit(1);
          JS
          npm run build

      - name: Verify repository Python syntax boundary
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- '*.py' | xargs -0 -r python -m py_compile
          git diff --check
          test ! -e .github/workflows/issue-245-final-integration.yml
