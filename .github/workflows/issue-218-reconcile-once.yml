name: Issue 218 one-time reconciliation

on:
  push:
    branches: [fix/issue-218-intake-drawer-20260906]
    paths: [.github/workflows/issue-218-reconcile-once.yml]

permissions:
  contents: read

jobs:
  align-reviewed-test-entry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.align.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: align
        name: Use the preserved contract entry without weakening download assertions
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def run(*args):
              subprocess.run(['git', *args], check=True)
          assert git('rev-parse', 'HEAD^') == '570e55748b8e285abd7c6da87082bdc3d2839006'
          path = Path('ui_react/src/tests/orders_page_real_data.test.tsx')
          text = path.read_text()
          old = "fireEvent.click(screen.getByRole('button', { name: '開啟補件工作台' }));"
          new = "fireEvent.click(screen.getAllByRole('button', { name: /條款與契約/ })[0]);"
          assert text.count(old) == 1, 'reviewed selector has changed'
          path.write_text(text.replace(old, new, 1))
          run('diff', '--check')
          run('diff', '--', str(path))
          run('add', '--', str(path))
          assert git('diff', '--cached', '--name-only') == str(path)
          run('config', 'user.name', 'github-actions[bot]')
          run('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          run('commit', '-m', 'test(orders): use the preserved drawer entry for archived contract verification')
          run('push', 'origin', 'HEAD:refs/heads/fix/issue-218-intake-drawer-20260906')
          sha = git('rev-parse', 'HEAD')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\n')
          print(f'ISSUE218_VERIFICATION_HEAD={sha}')
          PY

  issue218-focused-ui:
    needs: align-reviewed-test-entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.align-reviewed-test-entry.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: ui_react
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify all intake component flows
        working-directory: ui_react
        run: npm test -- src/tests/domains/orders/subsystems/orders/modules/order-card-projection/order_intake_completion_entry.test.tsx
      - name: Verify four original drawer entries and retained contract download
        working-directory: ui_react
        run: npm test -- src/tests/orders_page_real_data.test.tsx -t 'keeps original drawer actions for missing intake fields|downloads the selected archived contract version through the existing client owner'
      - name: Type-check and build final UI
        working-directory: ui_react
        run: npm run build

  compare-existing-date-test:
    needs: align-reviewed-test-entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.align-reviewed-test-entry.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: ui_react
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run the same actual-start test against immutable main and repaired head
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          root = Path.cwd()
          base = '54b1ffe08a3a9735fa65acbb5bb919eeca1af614'
          base_dir = Path(os.environ['RUNNER_TEMP']) / 'issue218-baseline'
          subprocess.run(['git', 'worktree', 'add', '--detach', str(base_dir), base], check=True)
          (base_dir / 'ui_react/node_modules').symlink_to(root / 'ui_react/node_modules', target_is_directory=True)
          target = 'exposes an editable actual-start Preview while Apply remains reason-gated'
          result_codes = []
          for label, directory in [('main', base_dir), ('repaired', root)]:
              report_path = Path(os.environ['RUNNER_TEMP']) / f'issue218-{label}-date-result.json'
              log_path = Path(os.environ['RUNNER_TEMP']) / f'issue218-{label}-date.log'
              with log_path.open('w') as log:
                  completed = subprocess.run([
                      'npm', 'test', '--', 'src/tests/orders_page_real_data.test.tsx', '-t', target,
                      '--reporter=json', f'--outputFile={report_path}',
                  ], cwd=directory / 'ui_react', stdout=log, stderr=subprocess.STDOUT)
              result_codes.append(completed.returncode)
              report = json.loads(report_path.read_text())
              tests = [item for suite in report['testResults'] for item in suite['assertionResults'] if item['status'] != 'pending']
              print('ISSUE218_DATE_BASELINE_COMPARISON=' + json.dumps({
                  'tree': label, 'sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=directory, text=True).strip(),
                  'exit_code': completed.returncode, 'passed': report['numPassedTests'], 'failed': report['numFailedTests'],
                  'tests': [{'name': t['fullName'], 'status': t['status'],
                             'failure': [m.split('Ignored nodes:')[0][:1200] for m in t.get('failureMessages', [])]} for t in tests],
              }, ensure_ascii=False))
          # A failure remains a failed diagnostic; it is not relabeled as success.
          raise SystemExit(1 if any(result_codes) else 0)
          PY
