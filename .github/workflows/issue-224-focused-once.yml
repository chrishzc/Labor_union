name: Issue 224 terminal aggregate one-off verification
on:
  push:
    branches: [fix/issue-224-legal-state-matrix]
    paths: [.github/workflows/issue-224-focused-once.yml]
permissions:
  contents: read
jobs:
  terminal-aggregate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify scoped baseline
        run: |
          git cat-file -e 457b55bee3e97839aeede3e11cec0bfc72e9fedb^{commit}
          test "$(git diff --name-only 457b55bee3e97839aeede3e11cec0bfc72e9fedb HEAD)" = ".github/workflows/issue-224-focused-once.yml"
      - name: Install exact locked pytest
        run: |
          python - <<'PY'
          import subprocess, tomllib
          with open('uv.lock', 'rb') as stream:
              packages = tomllib.load(stream)['package']
          pytest = next(package for package in packages if package['name'] == 'pytest')
          assert pytest['source'] == {'registry': 'https://pypi.org/simple'}
          version = pytest['version']
          print('::notice title=Exact pytest version::' + version, flush=True)
          subprocess.run(['python','-m','pip','install','--only-binary=:all:','pytest==' + version], check=True)
          PY
      - name: Execute issue 224 terminal aggregate focused tests
        run: |
          python -m pytest -q tests/domains/orders/subsystems/orders/modules/operational-stage-projection/test_terminal_aggregate_query.py --junitxml=/tmp/issue-224.xml
      - name: Publish exact test receipt
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, xml.etree.ElementTree as ET
          path = pathlib.Path('/tmp/issue-224.xml')
          if not path.exists():
              raise SystemExit('Focused result NOT_RUN: no test receipt')
          root = ET.parse(path).getroot()
          suites = list(root.iter('testsuite'))
          result = {key: sum(int(suite.get(key, 0)) for suite in suites) for key in ('tests','failures','errors','skipped')}
          result['head'] = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          result['tested_product_commit'] = '457b55bee3e97839aeede3e11cec0bfc72e9fedb'
          result['cases'] = [case.get('name') for case in root.iter('testcase')]
          result['boundary'] = 'issue #224 owner projection + normal legal matrix + non-normal exclusion; no DB/browser/provider'
          text = json.dumps(result, ensure_ascii=False)
          print('::notice title=Issue 224 focused receipt::' + text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('```json\n' + json.dumps(result, ensure_ascii=False, indent=2) + '\n```\n')
          assert result['tests'] == 21 and result['failures'] == 0 and result['errors'] == 0 and result['skipped'] == 0, result
          PY
