name: Issue 218 disposable MySQL HTTP acceptance

on:
  push:
    branches: ["fix/issue-218-intake-drawer-20260906"]
    paths: [".github/workflows/issue218-disposable-mysql-http.yml"]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: test
      ACCESS_CONTROL_PROFILE: local_auth
      ENABLE_ADMIN_AUTH: "true"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ci-root-password
      DB_DATABASE: lu_test_issue218_http
      LABOR_UNION_TEST_MYSQL_HOST: 127.0.0.1
      LABOR_UNION_TEST_MYSQL_PORT: "3306"
      LABOR_UNION_TEST_MYSQL_USER: root
      LABOR_UNION_TEST_MYSQL_PASSWORD: ci-root-password
      LABOR_UNION_TEST_MYSQL_DATABASE: lu_test_issue218_http
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run disposable MySQL and persisted line-agent HTTP acceptance
        run: |
          python -m pytest -q -s tests/domains/orders/subsystems/orders/modules/intake-terms-bootstrap/integration/test_order_intake_disposable_mysql_http.py
          git diff --check
