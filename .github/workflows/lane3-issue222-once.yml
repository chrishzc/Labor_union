name: Lane3 issue222 correction verification
on:
  push:
    branches: [fix/issue-222-source-review-owner-readback]
    paths: [.github/workflows/lane3-issue222-once.yml]
permissions:
  contents: write
jobs:
  owner-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: lane3root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -plane3root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    env:
      LABOR_UNION_TEST_MYSQL_HOST: 127.0.0.1
      LABOR_UNION_TEST_MYSQL_PORT: '3306'
      LABOR_UNION_TEST_MYSQL_USER: root
      LABOR_UNION_TEST_MYSQL_PASSWORD: lane3root
      LABOR_UNION_TEST_MYSQL_DATABASE: lu_test_issue222
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: lane3root
      DB_DATABASE: lu_test_issue222
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 40
      - name: Align disposable assertions to current aggregate review owner contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD d03551ab75de3e9cffc32ee772bdcf863181adad)" = d03551ab75de3e9cffc32ee772bdcf863181adad
          test "$(git rev-parse HEAD^)" = 25e99f868b27d0182d6c6d80747e362ce64d8999
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_finance_source_review_mysql_e2e.py')
          text = path.read_text(encoding='utf-8')
          old = "        assert manifest.json()['data']['review_count'] == 1, 'T11_2_SOURCE_REVIEW_OCCURRENCE_NOT_IN_QUERY'\n        reviews = client.get(url+'/review-rows')\n        assert reviews.status_code == 200, reviews.text\n        page = reviews.json()['data']\n        assert page['batch_identity'] == batch and page['items'] == []\n        assert len(page['source_reviews']) == 1\n        source = page['source_reviews'][0]\n        assert source['source_sheet'] == '來源' and source['source_row'] == 3\n        assert 'invalid:transaction_amount' in source['issue_codes']\n"
          new = "        reviews = client.get(url+'/review-rows')\n        assert reviews.status_code == 200, reviews.text\n        page = reviews.json()['data']\n        assert page['batch_identity'] == batch\n        assert manifest.json()['data']['review_count'] == len(page['items']) + len(page['source_reviews'])\n        assert len(page['items']) == 1 and page['items'][0]['disposition'] == 'business_pending'\n        assert sum(item['disposition'] == 'manual_review' for item in page['items']) + len(page['source_reviews']) == 1\n        assert len(page['source_reviews']) == 1\n        source = page['source_reviews'][0]\n        assert source['source_sheet'] == '來源' and source['source_row'] == 3\n        assert 'finance_source_field_invalid:transaction_amount' in source['issue_codes']\n"
          assert text.count(old) == 1, 'aggregate review assertion anchor drifted'
          text = text.replace(old, new)
          old = "        assert client.get(url+'/review-rows').json() == reviews.json()\n        replay = ingest(headers_http['Idempotency-Key'])\n"
          new = "        after_apply_reviews = client.get(url+'/review-rows').json()['data']\n        assert after_apply_reviews['source_reviews'] == page['source_reviews']\n        assert sum(item['disposition'] == 'manual_review' for item in after_apply_reviews['items']) + len(after_apply_reviews['source_reviews']) == 1\n        replay = ingest(headers_http['Idempotency-Key'])\n"
          assert text.count(old) == 1, 'post-apply review assertion anchor drifted'
          text = text.replace(old, new)
          old = "        assert client.get(url+'/manifest').json()['data']['review_count'] == 1\n"
          new = "        assert client.get(url+'/manifest').json()['data']['review_count'] == manifest.json()['data']['review_count']\n"
          assert text.count(old) == 1, 'post-replay manifest assertion anchor drifted'
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git add tests/test_finance_source_review_mysql_e2e.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(finance): verify #222 manual KPI on aggregate owner readback'
          VERIFIED_SHA=$(git rev-parse HEAD)
          echo "VERIFIED_SHA=$VERIFIED_SHA" >> "$GITHUB_ENV"
          git push origin HEAD:fix/issue-222-source-review-owner-readback
          echo "verified_sha=$VERIFIED_SHA" | tee /tmp/issue222-product-sha.txt
      - name: Install current Python runtime dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt 'pytest>=8,<9' 'httpx2>=2.10,<3'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install current UI lockfile without lifecycle hooks
        working-directory: ui_react
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused type and UI acceptance
        working-directory: ui_react
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npm test -- src/tests/finance_source_review_list.test.tsx src/tests/finance_query_page.test.tsx src/tests/finance_entry_cutover.test.tsx src/tests/finance_request_lifecycle.test.tsx
      - name: Disposable MySQL API owner readback and replay acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q -s tests/test_finance_source_review_mysql_e2e.py | tee /tmp/issue222-mysql-readback.log
      - name: Record exact verification receipt
        if: always()
        shell: bash
        run: |
          {
            echo "baseline=d03551ab75de3e9cffc32ee772bdcf863181adad"
            echo "verified_sha=${VERIFIED_SHA:-not_written}"
            echo "event_head=$GITHUB_SHA"
            echo "mysql_database=lu_test_issue222"
          } | tee /tmp/issue222-receipt.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue222-correction-${{ github.sha }}
          path: |
            /tmp/issue222-product-sha.txt
            /tmp/issue222-mysql-readback.log
            /tmp/issue222-receipt.txt
          if-no-files-found: warn
          retention-days: 1
