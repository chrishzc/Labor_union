name: Lane3 issue222 one-time verification
on:
  push:
    branches: [fix/issue-222-finance-review-list]
    paths: [.github/workflows/lane3-issue222-once.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install existing lockfile without lifecycle hooks
        working-directory: ui_react
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fresh focused UI baseline
        working-directory: ui_react
        run: npm test -- src/tests/finance_source_review_list.test.tsx src/tests/finance_query_page.test.tsx src/tests/finance_entry_cutover.test.tsx
      - name: Export bounded code and locked test runtime for offline work
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/issue222-evidence
          git rev-parse HEAD > /tmp/issue222-evidence/HEAD.txt
          python - <<'PY'
          import pathlib, subprocess, tarfile
          roots = ('ui_react/', 'api/', 'domains/', 'subsystems/', 'infrastructure/', 'shared_kernel/', 'tests/', 'db/', 'validation/', 'tools/', 'config/', '.arch-map/')
          extensions = {'.py', '.ts', '.tsx', '.css', '.json', '.sql', '.toml', '.md', '.html', '.yml', '.yaml'}
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with tarfile.open('/tmp/issue222-evidence/source.tar.gz', 'w:gz') as archive:
              for name in files:
                  path = pathlib.Path(name)
                  if name in {'AGENTS.md', 'pyproject.toml', 'requirements.txt'} or (name.startswith(roots) and path.suffix in extensions and not path.name.startswith('.env')):
                      archive.add(name, arcname=name, recursive=False)
          PY
          tar -czf /tmp/issue222-evidence/node_modules.tar.gz -C ui_react node_modules
          sha256sum /tmp/issue222-evidence/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue222-offline-${{ github.sha }}
          path: /tmp/issue222-evidence/
          if-no-files-found: error
          retention-days: 1
