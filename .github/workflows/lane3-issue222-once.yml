name: Lane3 issue222 correction verification
on:
  push:
    branches: [fix/issue-222-source-review-owner-readback]
    paths: [.github/workflows/lane3-issue222-once.yml]
permissions:
  contents: write
jobs:
  owner-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: lane3root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -plane3root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    env:
      LABOR_UNION_TEST_MYSQL_HOST: 127.0.0.1
      LABOR_UNION_TEST_MYSQL_PORT: '3306'
      LABOR_UNION_TEST_MYSQL_USER: root
      LABOR_UNION_TEST_MYSQL_PASSWORD: lane3root
      LABOR_UNION_TEST_MYSQL_DATABASE: lu_test_issue222
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: lane3root
      DB_DATABASE: lu_test_issue222
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 20
      - name: Correct verifier assumptions and write exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD d03551ab75de3e9cffc32ee772bdcf863181adad)" = d03551ab75de3e9cffc32ee772bdcf863181adad
          test "$(git rev-parse HEAD^)" = fd108db7f6ebcc03066245ba8803cf58705082f8
          python3 - <<'PY'
          from pathlib import Path

          mysql_test = Path('tests/test_finance_source_review_mysql_e2e.py')
          text = mysql_test.read_text(encoding='utf-8')
          old = "        replay = ingest(headers_http['Idempotency-Key'])\n        reimport = ingest('t11-reimport:'+token)\n        assert replay.status_code == reimport.status_code == 200\n        assert replay.json()['data']['batch_identity'] == reimport.json()['data']['batch_identity'] == batch\n        assert _counts() == applied, 'replay/reimport must not duplicate dispatch, receipts, payout or review occurrences'\n"
          new = "        replay = ingest(headers_http['Idempotency-Key'])\n        reselect = ingest(headers_http['Idempotency-Key'])\n        assert replay.status_code == reselect.status_code == 200\n        assert replay.json()['data']['batch_identity'] == reselect.json()['data']['batch_identity'] == batch\n        assert _counts() == applied, 'replay/same-key reselect must not duplicate dispatch, receipts, payout or review occurrences'\n"
          assert text.count(old) == 1, 'replay verifier anchor drifted'
          text = text.replace(old, new)
          old = "        result = subprocess.run(['npm', '--prefix', str(root/'ui_react'), 'test', '--', 'src/tests/finance_source_review_list.test.tsx', '-t', 'same-run source-review'], cwd=root, env={'PATH': os.environ['PATH'], 'HOME': str(tmp_path), 'CI': 'true', 'FI_REVIEW_EXCHANGE': str(exchange)}, capture_output=True, text=True, timeout=60)\n        assert result.returncode == 0, result.stdout[-5000:]+result.stderr[-5000:]\n"
          new = "        ui_report = tmp_path/'typed-ui-report.json'\n        result = subprocess.run(['npm', '--prefix', str(root/'ui_react'), 'test', '--', 'src/tests/finance_source_review_list.test.tsx', '-t', 'same-run source-review', '--reporter=json', '--outputFile', str(ui_report)], cwd=root, env={'PATH': os.environ['PATH'], 'HOME': str(tmp_path), 'CI': 'true', 'FI_REVIEW_EXCHANGE': str(exchange)}, capture_output=True, text=True, timeout=60)\n        assert result.returncode == 0, result.stdout[-5000:]+result.stderr[-5000:]\n        report = json.loads(ui_report.read_text(encoding='utf-8'))\n        assert report.get('numPassedTests') == 1 and report.get('numFailedTests') == 0, report\n"
          assert text.count(old) == 1, 'typed UI verifier anchor drifted'
          mysql_test.write_text(text.replace(old, new), encoding='utf-8')

          ui_test = Path('ui_react/src/tests/finance_source_review_list.test.tsx')
          text = ui_test.read_text(encoding='utf-8')
          import_anchor = "import { financeImportQueryClient } from '../api/finance_import/finance_import_query_client';\n"
          assert text.count(import_anchor) == 1, 'query import anchor drifted'
          text = text.replace(import_anchor, import_anchor + "import { transport } from '../api/shared/transport';\nimport { readFileSync } from 'node:fs';\n")
          test_block = r'''

            const exchangePath = process.env.FI_REVIEW_EXCHANGE;
            (exchangePath ? it : it.skip)('decodes same-run source-review owner envelopes through the real typed query client', async () => {
              const raw = JSON.parse(readFileSync(exchangePath!, 'utf-8')) as Record<string, any>;
              const batch = raw.ingestion.data.batch_identity as string;
              const sourceReview = raw.reviews.data.source_reviews[0] as { source_sheet: string; source_row: number; issue_codes: string[] };
              vi.restoreAllMocks();
              vi.spyOn(ordersQueryClient, 'getOrderSummaries').mockResolvedValue({ items: [], next_cursor: null, etag: 'c'.repeat(64) });
              vi.spyOn(financeImportMutationClient, 'ingest').mockResolvedValue(raw.ingestion.data);
              vi.spyOn(financeImportMutationClient, 'preview').mockResolvedValue(raw.preview.data);
              const get = vi.spyOn(transport, 'get').mockImplementation(async (path: string) => {
                if (path.endsWith('/manifest')) return raw.manifest;
                if (path.endsWith('/review-rows')) return raw.reviews;
                throw new Error(`unexpected GET ${path}`);
              });

              await showPreview();
              await waitFor(() => expect(reviewCount()).toBe('1'));
              expect(screen.getByText(batch)).toBeInTheDocument();
              expect(screen.getByText(`${sourceReview.source_sheet}#${sourceReview.source_row}`)).toBeInTheDocument();
              expect(screen.getByText(sourceReview.issue_codes[0])).toBeInTheDocument();
              expect(get.mock.calls.some(([path]) => String(path).endsWith('/manifest'))).toBe(true);
              expect(get.mock.calls.some(([path]) => String(path).endsWith('/review-rows'))).toBe(true);
            });
          '''
          closing = '\n});'
          index = text.rfind(closing)
          assert index > 0 and 'decodes same-run source-review owner envelopes' not in text, 'conditional test anchor drifted'
          text = text[:index] + test_block + text[index:]
          ui_test.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git add tests/test_finance_source_review_mysql_e2e.py ui_react/src/tests/finance_source_review_list.test.tsx
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(finance): align #222 disposable owner readback verifier'
          VERIFIED_SHA=$(git rev-parse HEAD)
          echo "VERIFIED_SHA=$VERIFIED_SHA" >> "$GITHUB_ENV"
          git push origin HEAD:fix/issue-222-source-review-owner-readback
          echo "verified_sha=$VERIFIED_SHA" | tee /tmp/issue222-product-sha.txt
      - name: Install current Python runtime dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt 'pytest>=8,<9' 'httpx2>=2.10,<3'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install current UI lockfile without lifecycle hooks
        working-directory: ui_react
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused type and UI acceptance
        working-directory: ui_react
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npm test -- src/tests/finance_source_review_list.test.tsx src/tests/finance_query_page.test.tsx src/tests/finance_entry_cutover.test.tsx src/tests/finance_request_lifecycle.test.tsx
      - name: Disposable MySQL API owner readback and replay acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q -s tests/test_finance_source_review_mysql_e2e.py | tee /tmp/issue222-mysql-readback.log
      - name: Record exact verification receipt
        if: always()
        shell: bash
        run: |
          {
            echo "baseline=d03551ab75de3e9cffc32ee772bdcf863181adad"
            echo "verified_sha=${VERIFIED_SHA:-not_written}"
            echo "event_head=$GITHUB_SHA"
            echo "mysql_database=lu_test_issue222"
          } | tee /tmp/issue222-receipt.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue222-correction-${{ github.sha }}
          path: |
            /tmp/issue222-product-sha.txt
            /tmp/issue222-mysql-readback.log
            /tmp/issue222-receipt.txt
          if-no-files-found: warn
          retention-days: 1
