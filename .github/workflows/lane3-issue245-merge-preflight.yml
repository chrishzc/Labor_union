name: Lane3 issue245 bounded integration
on:
  push:
    branches: [dry-run/order-workbench-v2]
    paths: [.github/workflows/lane3-issue245-merge-preflight.yml]
permissions:
  contents: write
jobs:
  integrate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='f63eedc899f2f7be7a24117a42c5bdd3232299d6'
          expected_main='879fc64a336892fe55472a04b54aedd438b19707'
          expected_pr214='7f7d2554de6b490395749d2d8fa146c32c8d9768'
          git fetch --no-tags origin main fix/current-regression-baseline-20260905 dry-run/order-workbench-v2
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git rev-parse origin/main)" = "$expected_main"
          test "$(git rev-parse origin/fix/current-regression-baseline-20260905)" = "$expected_pr214"
          test "$(git rev-parse origin/dry-run/order-workbench-v2)" = "$GITHUB_SHA"
      - name: Install exact focused Python dependencies already locked by the repository
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, tomllib
          with open('uv.lock', 'rb') as stream:
              packages = tomllib.load(stream)['package']
          wanted = {'pytest', 'python-dotenv', 'openpyxl', 'pymysql'}
          selected = {package['name']: package for package in packages if package['name'] in wanted}
          assert selected.keys() == wanted
          specs = []
          for name in sorted(wanted):
              package = selected[name]
              assert package['source'] == {'registry': 'https://pypi.org/simple'}
              specs.append(f"{name}=={package['version']}")
          subprocess.run(['python3', '-m', 'pip', 'install', '--only-binary=:all:', *specs], check=True)
          PY
      - name: Merge current main and PR214 with only evidence-backed resolutions
        shell: bash
        run: |
          set -euo pipefail
          task97='document/架構重整/03_追蹤清單與證據/evidence/task97_repository_commit_dispositions_v1.json'
          writer_manifest='document/架構重整/03_追蹤清單與證據/evidence/writer_inventory_v3/writer_inventory_v3_disposition.manifest.json'
          writer_records='document/架構重整/03_追蹤清單與證據/evidence/writer_inventory_v3/writer_inventory_v3_disposition.records.jsonl'
          intake_test='ui_react/src/tests/domains/orders/subsystems/orders/modules/order-card-projection/order_intake_completion_entry.test.tsx'
          bootstrap_test='tests/domains/global/subsystems/migration/modules/local-database-fresh-reset/test_bootstrap_disposable_mysql_schema.py'
          git config user.name 'Execution Lane 3'
          git config user.email 'execution-lane-3@example.invalid'

          set +e
          git merge --no-commit --no-ff origin/main
          main_rc=$?
          set -e
          test "$main_rc" -eq 1
          expected_main_conflicts=$(printf '%s\n' "$task97" 'ui_react/src/pages/OrdersManagementPage.tsx' "$intake_test" | sort)
          actual_main_conflicts=$(git diff --name-only --diff-filter=U | sort)
          test "$actual_main_conflicts" = "$expected_main_conflicts"
          git checkout --theirs -- "$task97" ui_react/src/pages/OrdersManagementPage.tsx "$intake_test"
          git add "$task97" ui_react/src/pages/OrdersManagementPage.tsx "$intake_test"
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m 'merge(beta): reconcile current main for #245'

          set +e
          git merge --no-commit --no-ff origin/fix/current-regression-baseline-20260905
          pr214_rc=$?
          set -e
          test "$pr214_rc" -eq 1
          expected_pr214_conflicts=$(printf '%s\n' "$task97" "$writer_manifest" "$writer_records" "$bootstrap_test" | sort)
          actual_pr214_conflicts=$(git diff --name-only --diff-filter=U | sort)
          test "$actual_pr214_conflicts" = "$expected_pr214_conflicts"
          git checkout --ours -- "$task97" "$writer_manifest" "$writer_records" "$bootstrap_test"
          git add "$task97" "$writer_manifest" "$writer_records" "$bootstrap_test"
          # Permanent CI belongs to current main; PR214 only added its own branch trigger.
          git checkout origin/main -- .github/workflows/python-app.yml
          # Completed #244 verifier is not part of the integrated candidate.
          git rm -f .github/workflows/issue-244-final-focused.yml
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m 'merge(beta): absorb PR214 fixed candidate for #245'

          # Evidence is derived from the final source tree, never selected from a stale side.
          python3 scripts/generate_task97_commit_dispositions.py
          python3 scripts/reconcile_writer_inventory_v3_dispositions.py
          git add "$task97" "$writer_manifest" "$writer_records"
          if ! git diff --cached --quiet; then
            git commit -m 'chore(beta): rebuild #245 writer evidence'
          fi
      - name: Verify PR214 focused contracts on the integrated tree
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q \
            tests/test_task97_commit_dispositions.py \
            tests/test_writer_inventory_v3_dispositions.py \
            tests/test_weekly_report_migration_target_confirmation.py \
            tests/domains/global/subsystems/migration/modules/local-database-fresh-reset/test_bootstrap_disposable_mysql_schema.py
          git ls-files -z -- '*.py' | xargs -0 -r python3 -m py_compile
          git diff --check origin/main...HEAD
      - name: Verify Beta React parity and build
        shell: bash
        working-directory: ui_react
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm ci
          npm test
          npm run build
      - name: Push only if inputs are still current
        shell: bash
        run: |
          set -euo pipefail
          expected_main='879fc64a336892fe55472a04b54aedd438b19707'
          expected_pr214='7f7d2554de6b490395749d2d8fa146c32c8d9768'
          git fetch --no-tags origin main fix/current-regression-baseline-20260905 dry-run/order-workbench-v2
          test "$(git rev-parse origin/main)" = "$expected_main"
          test "$(git rev-parse origin/fix/current-regression-baseline-20260905)" = "$expected_pr214"
          test "$(git rev-parse origin/dry-run/order-workbench-v2)" = "$GITHUB_SHA"
          git rm .github/workflows/lane3-issue245-merge-preflight.yml
          git commit -m 'chore(beta): remove #245 one-time integration verifier'
          git push origin HEAD:dry-run/order-workbench-v2
          echo "INTEGRATED_HEAD=$(git rev-parse HEAD)"
