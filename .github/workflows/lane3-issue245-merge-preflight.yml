name: Lane3 issue245 merge preflight
on:
  push:
    branches: [dry-run/order-workbench-v2]
    paths: [.github/workflows/lane3-issue245-merge-preflight.yml]
permissions:
  contents: read
jobs:
  merge-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce latest-main merge and report exact conflicts
        shell: bash
        run: |
          set -uo pipefail
          git fetch --no-tags origin main
          git config user.name lane3-issue245-preflight
          git config user.email lane3-issue245-preflight@example.invalid
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          echo "MERGE_EXIT=$rc"
          echo "CONFLICT_PATHS_BEGIN"
          git diff --name-only --diff-filter=U || true
          echo "CONFLICT_PATHS_END"
          echo "UNMERGED_INDEX_BEGIN"
          git ls-files -u || true
          echo "UNMERGED_INDEX_END"
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
