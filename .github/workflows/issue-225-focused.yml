name: Issue 225 focused verification

on:
  push:
    branches:
      - lane3/issue-225-admin-root-connection

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run issue 225 focused regression
        run: python -m pytest -q tests/domains/external-integration/subsystems/access/regression/test_development_root_admin_connection_lifetime.py
      - name: Verify bounded diff whitespace
        run: git diff --check origin/main...HEAD
