name: Issue 218 intake drawer repair

on:
  push:
    branches: ["fix/issue-218-intake-drawer-20260906"]
    paths: [".github/workflows/issue218-intake-drawer-repair.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply bounded repair
        run: python scripts/issue218_intake_drawer_repair_tmp.py
      - name: Preserve explicit TypeScript narrowing
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('ui_react/src/pages/OrdersPage.tsx')
          text = page.read_text(encoding='utf-8')
          text = text.replace(
              'isOrderIntakeIncomplete(contractOrder || dateConfirmOrder) && renderIntakeRepair',
              'isOrderIntakeIncomplete((contractOrder || dateConfirmOrder)!) && renderIntakeRepair',
              1,
          ).replace(
              'renderIntakeRepair(contractOrder || dateConfirmOrder, async () => {',
              'renderIntakeRepair((contractOrder || dateConfirmOrder)!, async () => {',
              1,
          )
          page.write_text(text, encoding='utf-8')
          test = Path('ui_react/src/tests/order_intake_completion_entry.test.tsx')
          source = test.read_text(encoding='utf-8').replace(
              ') => ReactModule.ReactNode;',
              ") => import('react').ReactNode;",
              1,
          )
          test.write_text(source, encoding='utf-8')
          PY
      - name: Verify focused React behavior
        working-directory: ui_react
        run: |
          npm ci
          npm test -- --run src/tests/order_intake_completion_entry.test.tsx src/tests/orders_page_real_data.test.tsx
          npm run build
      - name: Commit verified repair
        run: |
          rm scripts/issue218_intake_drawer_repair_tmp.py .github/workflows/issue218-intake-drawer-repair.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(orders): move intake repair into existing drawer"
          git push origin HEAD:fix/issue-218-intake-drawer-20260906
