name: Lane 1 issue 243 one-time convergence

on:
  push:
    branches: [ "fix/current-regression-baseline-20260905" ]

permissions:
  contents: write

jobs:
  converge-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/current-regression-baseline-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Preflight focused runner
        run: python -c "import pytest; print('pytest', pytest.__version__)"
      - name: Apply exact unresolved decisions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          generator_path = Path("scripts/generate_task97_commit_dispositions.py")
          generator = generator_path.read_text(encoding="utf-8")
          marker = "\n\n\n@dataclass(frozen=True)\nclass CommitLocation:"
          unresolved = '''

# Exact reviewed identities whose current acceptance evidence is still unresolved.
# This overrides classification only; REVIEWED_COMMIT_BOUNDARIES remains the
# exact semantic owner/layer record and sibling identities inherit neither map.
UNRESOLVED_REVIEWED_COMMIT_BOUNDARIES: dict[str, tuple[str, str, str]] = {
    "api/dependencies/admin_auth.py:ensure_development_root_admin:commit:COMMIT:-:a726d561eba65201:1": (
        "PR #214 current source still closes the development bootstrap connection only on the normal tail; #225 proved and repaired this resource-lifetime gap on current main, but that repair is not present in this fixed PR head.",
        "Reconcile the already-verified #225 owner-local resource-lifetime repair into the candidate before accepting this exact commit boundary; do not change its existing commit owner or MFA semantics.",
        "PR214_ADMIN_AUTH_RESOURCE_LIFETIME_NOT_RECONCILED",
    ),
    "line/line_bot.py:line_bind:commit:COMMIT:-:a726d561eba65201:1": (
        "#226 proved the controlled legacy path remains runtime-reachable and owns a direct adapter commit; #251 records the unresolved conflict with the formal Application outer-UoW contract.",
        "Await the #251 Human Owner decision on the legacy rollback mutation contract, then rebuild this exact disposition from the chosen owner boundary; do not map the old payload directly onto the canonical flow.",
        "LINE_BIND_TRANSACTION_OWNER_DECISION_REQUIRED_251",
    ),
    "scripts/migrate_weekly_report_batches.py:main:commit:COMMIT:-:a726d561eba65201:1": (
        "#227 directly verified the staged schema/seed transaction, close, failure, and rerun behavior, but the migration entry still has no approved exact-target and operator-confirmation contract.",
        "Obtain the current approved operator environment/exact-target/confirmation contract and direct evidence, or separately approve the minimum pre-connection entry guard change before accepting this maintenance boundary.",
        "MIGRATION_OPERATOR_TARGET_CONFIRMATION_UNESTABLISHED",
    ),
    "scripts/migrate_weekly_report_batches.py:seed_history_from_template:commit:COMMIT:-:a726d561eba65201:1": (
        "#227 directly verified terminal seed commit, rollback-on-close after mid-seed failure, and idempotent rerun behavior, but this helper inherits the unresolved migration operator target/confirmation boundary from main.",
        "Resolve the caller entry's approved exact-target and confirmation contract before accepting this maintenance boundary; retain the verified terminal seed transaction semantics.",
        "MIGRATION_OPERATOR_TARGET_CONFIRMATION_UNESTABLISHED",
    ),
    "scripts/seed_line_test_fixtures.py:seed_fixtures:commit:COMMIT:-:a726d561eba65201:1": (
        "PR #214 current source still leaves cursor/bootstrap dependency cleanup on failure paths; #228 proved and repaired those resource-lifetime gaps on current main, but that repair is not present in this fixed PR head.",
        "Reconcile the already-verified #228 resource-lifetime repair into the candidate before accepting this exact fixture commit boundary; preserve the existing fixture-commit-before-bootstrap transaction semantics.",
        "PR214_FIXTURE_RESOURCE_LIFETIME_NOT_RECONCILED",
    ),
}
'''
          generator = replace_once(generator, marker, unresolved + marker, "unresolved registry insertion")
          old = '''    path_symbol = (finding.relative_path, finding.symbol)
    reviewed = REVIEWED_COMMIT_BOUNDARIES.get(finding.identity)
    if reviewed is not None:
'''
          new = '''    path_symbol = (finding.relative_path, finding.symbol)
    unresolved = UNRESOLVED_REVIEWED_COMMIT_BOUNDARIES.get(finding.identity)
    if unresolved is not None:
        basis, remediation, blocker = unresolved
        return "real_violation", basis, remediation, blocker
    reviewed = REVIEWED_COMMIT_BOUNDARIES.get(finding.identity)
    if reviewed is not None:
'''
          generator = replace_once(generator, old, new, "exact unresolved classification")
          generator_path.write_text(generator, encoding="utf-8")

          test_path = Path("tests/test_task97_commit_dispositions.py")
          test = test_path.read_text(encoding="utf-8")
          test = replace_once(
              test,
              "    SOURCE_REVISION_INPUTS,\n    _classify,",
              "    SOURCE_REVISION_INPUTS,\n    UNRESOLVED_REVIEWED_COMMIT_BOUNDARIES,\n    _classify,",
              "test unresolved import",
          )
          old_test = '''def test_task97_audited_commit_boundaries_are_exactly_accepted() -> None:
    artifact = json.loads(EVIDENCE_PATH.read_text(encoding="utf-8"))
    by_identity = {str(entry["identity"]): entry for entry in artifact["entries"]}

    for identity, review in REVIEWED_COMMIT_BOUNDARIES.items():
        owner, layer, _basis, _remediation, _blocker = review
        entry = by_identity.get(identity)
        assert entry is not None, identity
        assert entry["classification"] == "application_owned_legitimate_outer_uow"
        assert entry["owner"] == owner
        assert entry["layer"] == layer
'''
          new_test = '''def test_task97_audited_commit_boundaries_follow_exact_current_decisions() -> None:
    artifact = json.loads(EVIDENCE_PATH.read_text(encoding="utf-8"))
    by_identity = {str(entry["identity"]): entry for entry in artifact["entries"]}

    for identity, review in REVIEWED_COMMIT_BOUNDARIES.items():
        owner, layer, _basis, _remediation, _blocker = review
        entry = by_identity.get(identity)
        assert entry is not None, identity
        assert entry["owner"] == owner
        assert entry["layer"] == layer
        unresolved = UNRESOLVED_REVIEWED_COMMIT_BOUNDARIES.get(identity)
        if unresolved is None:
            assert entry["classification"] == "application_owned_legitimate_outer_uow"
        else:
            basis, remediation, blocker = unresolved
            assert entry["classification"] == "real_violation"
            assert entry["analysis_basis"] == basis
            assert entry["replacement_or_remediation"] == remediation
            assert entry["blocker"] == blocker
'''
          test = replace_once(test, old_test, new_test, "current exact decision test")
          old_asserts = '''    assert reviewed.identity in REVIEWED_COMMIT_BOUNDARIES
    assert sibling_occurrence.identity not in REVIEWED_COMMIT_BOUNDARIES
    assert sibling_symbol.identity not in REVIEWED_COMMIT_BOUNDARIES
    assert _classify(reviewed, location)[0] == "application_owned_legitimate_outer_uow"
    assert _classify(sibling_occurrence, location)[0] == "real_violation"
    assert _classify(sibling_symbol, location)[0] == "real_violation"
    assert _semantic_owner(reviewed) == ("access_control", "adapter")
'''
          new_asserts = '''    assert reviewed.identity in REVIEWED_COMMIT_BOUNDARIES
    assert reviewed.identity in UNRESOLVED_REVIEWED_COMMIT_BOUNDARIES
    assert sibling_occurrence.identity not in REVIEWED_COMMIT_BOUNDARIES
    assert sibling_symbol.identity not in REVIEWED_COMMIT_BOUNDARIES
    exact_result = _classify(reviewed, location)
    sibling_occurrence_result = _classify(sibling_occurrence, location)
    sibling_symbol_result = _classify(sibling_symbol, location)
    assert exact_result[0] == "real_violation"
    assert exact_result[3] == UNRESOLVED_REVIEWED_COMMIT_BOUNDARIES[reviewed.identity][2]
    assert sibling_occurrence_result[0] == "real_violation"
    assert sibling_symbol_result[0] == "real_violation"
    assert sibling_occurrence_result[3] != exact_result[3]
    assert sibling_symbol_result[3] != exact_result[3]
    assert _semantic_owner(reviewed) == ("access_control", "adapter")
'''
          test = replace_once(test, old_asserts, new_asserts, "sibling exact blocker test")
          test_path.write_text(test, encoding="utf-8")
          PY
      - name: Regenerate exact writer evidence
        shell: bash
        run: |
          python scripts/generate_task97_commit_dispositions.py
          python scripts/generate_writer_inventory_v3_candidate.py
          python scripts/reconcile_writer_inventory_v3_dispositions.py
          python scripts/validate_writer_inventory_v3_candidate.py
          python scripts/validate_writer_inventory_v3_dispositions.py
      - name: Verify #243 focused acceptance
        shell: bash
        run: |
          python -m pytest -q tests/test_task97_commit_dispositions.py tests/test_writer_inventory_v3_dispositions.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from scripts.reconcile_writer_inventory_v3_dispositions import EXACT_SOURCE_REVIEWS

          path = "infrastructure/mysql/data_browser_query_repository.py"
          digest, symbols, _review = EXACT_SOURCE_REVIEWS[path]
          actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
          assert symbols == frozenset({"DataBrowserQueryRepository.query_page"})
          assert actual == digest, (actual, digest)
          print(f"Data Browser source-lock PASS symbol=DataBrowserQueryRepository.query_page sha256={actual}")
          PY
          git diff --check
          git status --short
      - name: Commit convergence and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lane1-issue243-once.yml
          git add scripts/generate_task97_commit_dispositions.py tests/test_task97_commit_dispositions.py \
            document/架構重整/03_追蹤清單與證據/evidence/task97_repository_commit_dispositions_v1.json \
            document/架構重整/03_追蹤清單與證據/evidence/writer_inventory_v3/writer_inventory_v3_candidate.findings.jsonl \
            document/架構重整/03_追蹤清單與證據/evidence/writer_inventory_v3/writer_inventory_v3_candidate.manifest.json \
            document/架構重整/03_追蹤清單與證據/evidence/writer_inventory_v3/writer_inventory_v3_disposition.records.jsonl \
            document/架構重整/03_追蹤清單與證據/evidence/writer_inventory_v3/writer_inventory_v3_disposition.manifest.json
          git commit -m "fix(ci): converge exact writer dispositions (#243)"
          git push origin HEAD:fix/current-regression-baseline-20260905
