name: Import field issue contracts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/import-field-issues.yml'
      - 'domains/case_import/**'
      - 'subsystems/case_import/**'
      - 'infrastructure/mysql/hcm_resubmission_repository.py'
      - 'infrastructure/mysql/import_field_issues_repository.py'
      - 'api/routes/hcm_import.py'
      - 'api/routes/import_field_issues.py'
      - 'api/routes/notification_tasks.py'
      - 'api/schemas/import_field_issues.py'
      - 'ui_react/src/api/case_import/**'
      - 'ui_react/src/pages/NotificationTasksPreviewPage.tsx'
      - 'ui_react/src/components/NotificationTaskActions.tsx'
      - 'ui_react/src/tests/**/notification_tasks_page.test.tsx'
      - 'tests/**/test_hcm_review_skip.py'
      - 'tests/**/test_current_import_field_issues.py'

permissions:
  contents: read

concurrency:
  group: ci-import-field-issues-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner:
    name: Case Import field issue and skip contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest httpx2==2.10.0
      - name: Verify optional skip and current field readback
        run: >-
          python -m pytest -vv
          tests/domains/case-import/subsystems/case-import/modules/hcm-current-workbook-import/unit/test_hcm_review_skip.py
          tests/domains/case-import/subsystems/case-import/modules/pairing-current-facts/contract/test_current_import_field_issues.py
  workbench:
    name: Notification field issue interaction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui_react
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Verify the action and refresh
        run: >-
          npm test --
          src/tests/domains/external-integration/subsystems/line/integration/notification_tasks_page.test.tsx
