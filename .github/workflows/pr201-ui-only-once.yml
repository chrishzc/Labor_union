name: PR201 one-shot UI integration verification

on:
  push:
    branches: [fix/ui-staff-case-preference-write-179]
    paths: [.github/workflows/pr201-ui-only-once.yml]

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: cc6eba309678ff6bfa714e06000cf223f1992b6f
          persist-credentials: false
      - name: Prepare exact two-file integrated commit without moving any branch
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, json, os, pathlib, subprocess, zlib
          base = 'cc6eba309678ff6bfa714e06000cf223f1992b6f'
          old = '7ad0a51d7a8840006307847b7d7bac488ebc34d4'
          repo = 'chrishzc/Labor_union'
          branch = 'fix/ui-staff-case-preference-write-179'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def api(path, body=None):
              args = ['gh', 'api', 'repos/' + repo + '/' + path]
              if body is not None:
                  args += ['--method', 'POST', '--input', '-']
              return json.loads(subprocess.check_output(args, input=None if body is None else json.dumps(body), text=True))
          assert git('rev-parse', 'HEAD') == base
          assert api('git/ref/heads/main')['object']['sha'] == base, 'MAIN_MOVED'
          pr = api('pulls/201')
          assert pr['state'] == 'open' and pr['head']['ref'] == branch
          assert pr['head']['sha'] == os.environ['GITHUB_SHA'], 'PR201_HEAD_MOVED'
          assert api('git/commits/' + os.environ['GITHUB_SHA'])['parents'][0]['sha'] == old, 'UNEXPECTED_PARENT'
          patch = zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(patch).hexdigest() == '809b2b81662b2cd44922182706e966209ef1adc99efcf5b3f52bda950f2680c5'
          patchfile = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr201-ui.patch'
          patchfile.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(patchfile)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patchfile)], check=True)
          paths = ['ui_react/src/pages/StaffPage.tsx', 'ui_react/src/tests/staff_case_preference_summary_flow.test.tsx']
          assert git('diff', '--cached', '--name-only').splitlines() == paths, 'UNEXPECTED_CHANGED_FILES'
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = api('git/trees', {'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': [
              {'path': path, 'mode': '100644', 'type': 'blob', 'content': pathlib.Path(path).read_text(encoding='utf-8')} for path in paths
          ]})['sha']
          assert tree == git('write-tree'), 'REMOTE_TREE_MISMATCH'
          commit = api('git/commits', {'message': 'fix(staff): reconcile PR #201 to current six-topic UI only', 'tree': tree, 'parents': [os.environ['GITHUB_SHA'], base]})['sha']
          print('PR201_CANDIDATE_SHA=' + commit)
          print('PR201_CANDIDATE_TREE=' + tree)
          print('PR201_BASE_SHA=' + base)
          print('PR201_PATCH_SHA256=809b2b81662b2cd44922182706e966209ef1adc99efcf5b3f52bda950f2680c5')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + commit + '\ntree=' + tree + '\n')
          PYCODE
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.candidate.outputs.commit }}
          persist-credentials: false
      - name: Read exact candidate and restore existing locked dependencies
        id: deps
        working-directory: ui_react
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = '${{ steps.candidate.outputs.commit }}'
          test "$(git rev-parse HEAD^{tree})" = '${{ steps.candidate.outputs.tree }}'
          node --version
          npm --version
          python3 - <<'PYCODE'
          import json
          from urllib.parse import urlsplit
          lock = json.load(open('package-lock.json'))
          packages = lock['packages']
          for name, package in packages.items():
              url = package.get('resolved')
              if url:
                  assert urlsplit(url).hostname == 'registry.npmjs.org', 'UNEXPECTED_PACKAGE_SOURCE: ' + name
                  assert package.get('integrity'), 'MISSING_INTEGRITY: ' + name
          print('Existing lockfile packages:', len(packages) - 1)
          for name, package in packages.items():
              if package.get('hasInstallScript'):
                  print('Install hook disabled:', name, package.get('version'))
          PYCODE
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused Staff UI tests on the exact integrated commit
        id: focused
        working-directory: ui_react
        run: npm test -- src/tests/staff_case_preference_summary_flow.test.tsx --reporter=verbose
      - name: TypeScript and Vite build on the exact integrated commit
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        working-directory: ui_react
        run: npm run build
      - name: Verify tracked tree unchanged
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          echo 'PR201_VERIFIED_CANDIDATE=${{ steps.candidate.outputs.commit }}'
          echo 'PR201_VERIFIED_TREE=${{ steps.candidate.outputs.tree }}'
