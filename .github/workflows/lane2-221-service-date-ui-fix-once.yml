# branch-head verification trigger
name: lane2-221-service-date-ui-fix-once

on:
  push:
    branches:
      - fix/lane2-221-service-date-ui-regressions
    paths:
      - .lane2/issue-221-service-date-ui.patch
      - .github/workflows/lane2-221-service-date-ui-fix-once.yml
      - ui_react/src/pages/OrdersPage.tsx
      - ui_react/src/tests/domains/orders/subsystems/orders/modules/service-date-confirmation/orders_service_dates_flow.test.tsx

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Apply owner-boundary repair if needed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('ui_react/src/pages/OrdersPage.tsx')
          lines = source_path.read_text(encoding='utf-8').splitlines()
          base_idx = next(i for i, line in enumerate(lines) if 'const baseInputsReady = serviceDates?.case_no === order.id' in line)
          fail_idx = next(i for i in range(base_idx, min(base_idx + 30, len(lines))) if lines[i].strip() == 'if (!baseInputsReady) {')
          early_gate = 'if (calendarDetail === null && allowRestartedNormalFlow && serviceDates?.case_no === order.id) {'
          if not any(early_gate in lines[i] for i in range(base_idx, fail_idx + 1)):
              indent = lines[fail_idx][:len(lines[fail_idx]) - len(lines[fail_idx].lstrip())]
              lines[fail_idx:fail_idx] = [
                  indent + early_gate,
                  indent + '  changeServiceDateSelection(order.id, serviceDates.current_dates);',
                  indent + '  setPrecisionError(null);',
                  indent + '  return;',
                  indent + '}',
              ]
              print('historical restart fallback ordering: inserted early gate')
          else:
              print('historical restart fallback ordering: early gate already present')

          base_idx = next(i for i, line in enumerate(lines) if 'const baseInputsReady = serviceDates?.case_no === order.id' in line)
          calendar_idx = next(i for i in range(base_idx, min(base_idx + 50, len(lines))) if lines[i].strip() == 'if (calendarDetail === null) {')
          if lines[calendar_idx + 1].strip() == 'if (allowRestartedNormalFlow) {':
              del lines[calendar_idx + 1:calendar_idx + 6]
              print('historical restart fallback ordering: removed late gate')
          source_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          test_path = Path('ui_react/src/tests/domains/orders/subsystems/orders/modules/service-date-confirmation/orders_service_dates_flow.test.tsx')
          tlines = test_path.read_text(encoding='utf-8').splitlines()

          actual_start_line = "vi.spyOn(ordersQueryClient, 'getActualStart').mockRejectedValue(new Error('query unavailable'));"
          actual_idx = next(i for i, line in enumerate(tlines) if line.strip() == actual_start_line)
          if not any("const projection = await orderCardProjectionClient.getCardProjection('ORD-2026-0801');" in tlines[i] for i in range(max(0, actual_idx - 25), actual_idx)):
              indent = tlines[actual_idx][:len(tlines[actual_idx]) - len(tlines[actual_idx].lstrip())]
              projection_block = [
                  indent + "const projection = await orderCardProjectionClient.getCardProjection('ORD-2026-0801');",
                  indent + 'projection.assignment_segments = {',
                  indent + '  ...projection.assignment_segments,',
                  indent + '  value: [{',
                  indent + '    assignment_id: { ...projection.assignment_segments, value: 501 },',
                  indent + '    staff_id: { ...projection.assignment_segments, value: 101 },',
                  indent + "    staff_name: { ...projection.assignment_segments, value: '林月嬌' },",
                  indent + '    sequence: { ...projection.assignment_segments, value: 1 },',
                  indent + "    assigned_start_date: { ...projection.assignment_segments, value: '2026-09-01' },",
                  indent + "    assigned_end_date: { ...projection.assignment_segments, value: '2026-09-03' },",
                  indent + "    status: { ...projection.assignment_segments, value: 'active' },",
                  indent + '  }],',
                  indent + "  availability: 'available',",
                  indent + '};',
                  indent + 'vi.mocked(orderCardProjectionClient.getCardProjection).mockResolvedValueOnce(projection);',
              ]
              tlines[actual_idx:actual_idx] = projection_block
              print('test 8 typed formal assignment fixture: inserted')
          else:
              print('test 8 typed formal assignment fixture: already present')

          eleven_idx = next(i for i, line in enumerate(tlines) if "it('11b. 服務中案件的正式指派投影缺失時 fail closed" in line)
          next_test_idx = next(i for i in range(eleven_idx + 1, len(tlines)) if tlines[i].lstrip().startswith("it('") and i > eleven_idx)
          helper_idx = next((i for i in range(eleven_idx, next_test_idx) if tlines[i].strip() == 'await openServiceCalendarTab();'), None)
          if helper_idx is not None:
              indent = tlines[helper_idx][:len(tlines[helper_idx]) - len(tlines[helper_idx].lstrip())]
              tlines[helper_idx:helper_idx + 1] = [
                  indent + "fireEvent.click(screen.getAllByRole('button', { name: /條款與契約/ })[0]);",
                  indent + "fireEvent.click(await screen.findByRole('button', { name: /實質服務日曆/ }));",
              ]
              neg_idx = next(i for i in range(helper_idx, next_test_idx + 3) if "queryByRole('button', { name: '前往請假／代班工作台' })" in tlines[i])
              alert_line = "expect(await screen.findByText('正式服務日精算所需的開始日、合約天數或排休類型尚未載入，請關閉後重試。'))"
              tlines[neg_idx:neg_idx] = [
                  indent + alert_line,
                  indent + "  .toHaveAttribute('role', 'alert');",
              ]
              print('test 11b fail-closed assertion: replaced helper')
          else:
              print('test 11b fail-closed assertion: helper already removed')

          test_path.write_text('\n'.join(tlines) + '\n', encoding='utf-8')
          PY

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui_react/package-lock.json

      - name: Install React dependencies
        working-directory: ui_react
        run: npm ci

      - name: Re-test original five failures
        working-directory: ui_react
        run: >-
          npx vitest run
          src/tests/domains/orders/subsystems/orders/modules/service-date-confirmation/orders_service_dates_flow.test.tsx
          -t "已有正式指派時 actual-start query 缺失|服務中案件的正式指派投影缺失時 fail closed|歷史訂單重啟後 calendar detail"

      - name: Run full canonical service-date UI suite
        working-directory: ui_react
        run: npm test -- src/tests/domains/orders/subsystems/orders/modules/service-date-confirmation/orders_service_dates_flow.test.tsx

      - name: Build React app
        working-directory: ui_react
        run: npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Python syntax sanity
        run: python -m compileall -q api domains infrastructure scripts subsystems

      - name: Materialize repair on branch
        shell: bash
        run: |
          set -euo pipefail
          git add \
            ui_react/src/pages/OrdersPage.tsx \
            ui_react/src/tests/domains/orders/subsystems/orders/modules/service-date-confirmation/orders_service_dates_flow.test.tsx
          if git diff --cached --quiet; then
            echo "branch head already contains repair"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(orders): preserve service-date restart owner gates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
