name: Lane 1 issue 243 direct focused runner

on:
  push:
    branches: [ "fix/current-regression-baseline-20260905" ]

permissions:
  contents: write

jobs:
  converge-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/current-regression-baseline-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply exact unresolved decisions from reviewed patch payload
        run: python -c "import base64,pathlib; t=pathlib.Path('.github/workflows/lane1-issue243-once.yml').read_text(); parts=t.split(\"b64.b64decode('\\\"\"); assert len(parts)==3, len(parts); p=parts[1].split(\"')\",1)[0]; exec(base64.b64decode(p))"
      - name: Regenerate exact writer evidence
        shell: bash
        run: |
          python scripts/generate_task97_commit_dispositions.py
          python scripts/generate_writer_inventory_v3_candidate.py
          python scripts/reconcile_writer_inventory_v3_dispositions.py
          python scripts/validate_writer_inventory_v3_candidate.py
          python scripts/validate_writer_inventory_v3_dispositions.py
      - name: Run every focused test node without external installs
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Verify Data Browser source lock and diff
        shell: bash
        run: |
          python -c "import base64,pathlib; t=pathlib.Path('.github/workflows/lane1-issue243-once.yml').read_text(); parts=t.split(\"b64.b64decode('\\\"\"); assert len(parts)==3, len(parts); p=parts[2].split(\"')\",1)[0]; exec(base64.b64decode(p))"
          git diff --check
          git status --short
      - name: Commit convergence and remove one-time workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lane1-issue243-once.yml .github/workflows/lane1-issue243-direct-runner.yml
          git add scripts/generate_task97_commit_dispositions.py tests/test_task97_commit_dispositions.py \
            document/架構重整/03_追蹤清單與證據/evidence/task97_repository_commit_dispositions_v1.json \
            document/架構重整/03_追蹤清單與證據/evidence/writer_inventory_v3/writer_inventory_v3_candidate.findings.jsonl \
            document/架構重整/03_追蹤清單與證據/evidence/writer_inventory_v3/writer_inventory_v3_candidate.manifest.json \
            document/架構重整/03_追蹤清單與證據/evidence/writer_inventory_v3/writer_inventory_v3_disposition.records.jsonl \
            document/架構重整/03_追蹤清單與證據/evidence/writer_inventory_v3/writer_inventory_v3_disposition.manifest.json
          git commit -m "fix(ci): converge exact writer dispositions (#243)"
          git push origin HEAD:fix/current-regression-baseline-20260905
