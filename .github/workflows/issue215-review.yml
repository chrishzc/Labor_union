name: Issue 215 source review

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  review:
    if: github.event.pull_request.number == 216 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-215-regression-followup-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply the byte-verified source repair
        run: |
          python - <<'PY'
          import ast
          import hashlib
          from pathlib import Path
          import subprocess
          import textwrap

          # Replay the reviewed repair against the same unchanged source baseline.
          history = subprocess.run(
              ["git", "show", "5d99355662382cc23e0546655bf828ca3bf9be7a:.github/workflows/issue215-review.yml"],
              check=True, capture_output=True, text=True,
          ).stdout
          start = history.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = history.index("          PY\n", start)
          reviewed = textwrap.dedent(history[start:end])
          exec(compile(reviewed, "reviewed-issue215-repair", "exec"))

          # Preserve unchanged exact accepted decisions, including richer typed Payroll
          # caller receipts. Refresh only identities whose current exact receipt blocks.
          p=Path('scripts/reconcile_writer_inventory_v3_dispositions.py')
          s=p.read_text(encoding='utf-8')
          a='            or candidate.get("operation") == "COMMIT"\n'
          b='            or (commit_review is not None and commit_review[3].startswith("needs_decision:"))\n'
          assert s.count(a)==1
          s=s.replace(a,b)
          a='        reviewed_identities.add(identity)\n        if (\n'
          b='        reviewed_identities.add(identity)\n        commit_review = (\n            _commit_review(identity) if candidate.get("operation") == "COMMIT" else None\n        )\n        if (\n'
          assert s.count(a)==1
          s=s.replace(a,b)
          # Both current insert statements and their actual workflow-owned transaction
          # boundaries have been reviewed. Keep the exact symbol/table/occurrence keys.
          for old,new in [('case_import_hcm_correction_events:eeb562d1b19ddf45:1','case_import_hcm_correction_events:0ce4719365153d96:1'),('confirmed_service_date_versions:c7f384818ee43ace:1','confirmed_service_date_versions:5ba170d3e62b0dbf:1')]:
           assert s.count(old)==1,old
           s=s.replace(old,new,1)
          ast.parse(s)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/test_writer_inventory_v3_dispositions.py')
          with p.open('a',encoding='utf-8') as f:
           f.write(textwrap.dedent('''


          def test_reconciliation_preserves_valid_typed_receipts_and_refreshes_exact_blockers(tmp_path, monkeypatch):
              import scripts.reconcile_writer_inventory_v3_dispositions as reconciler

              candidates = {entry["identity"]: entry for entry in reconciler._load(reconciler.CANDIDATE)}
              saved = reconciler._load(reconciler.RECORDS)
              typed = [entry for entry in saved if entry["owner"] == "payroll"
                       and candidates[entry["identity"]]["operation"] == "COMMIT"]
              retained, stale = typed[:2]
              receipt = json.loads(reconciler.COMMIT_DISPOSITIONS.read_text(encoding="utf-8"))
              exact = {entry["identity"]: entry for entry in receipt["entries"]}
              blocked = dict(exact[stale["identity"]], classification="real_violation",
                             analysis_basis="isolated missing-owner fixture",
                             replacement_or_remediation="restore the owning outer transaction",
                             blocker="isolated_unowned_commit", zero_reference_oracle="isolated test")
              paths = {name: tmp_path / (name.lower() + ".json")
                       for name in ("CANDIDATE", "RECORDS", "MANIFEST", "COMMIT_DISPOSITIONS")}
              paths["CANDIDATE"].write_text("".join(json.dumps(candidates[entry["identity"]]) + "\\n"
                                                    for entry in (retained, stale)), encoding="utf-8")
              paths["RECORDS"].write_text("".join(json.dumps(entry) + "\\n"
                                                  for entry in (retained, stale)), encoding="utf-8")
              paths["COMMIT_DISPOSITIONS"].write_text(json.dumps({
                  "terminal_status": "blocked", "entries": [exact[retained["identity"]], blocked]
              }), encoding="utf-8")
              for name, path in paths.items():
                  monkeypatch.setattr(reconciler, name, path)

              assert reconciler.main() == 0
              actual = {entry["identity"]: entry for entry in reconciler._load(paths["RECORDS"])}
              assert actual[retained["identity"]] == retained
              assert actual[stale["identity"]]["final_disposition"] == "needs_decision"
              assert actual[stale["identity"]]["approved_to_remove"] is False
              assert blocked["blocker"] in actual[stale["identity"]]["replacement_evidence"]
          '''))
          ast.parse(p.read_text(encoding='utf-8'))

          # The old process-reminder _fetch no longer exists and the retained entrypoint
          # is inert. Remove its obsolete review, not the missing-identity assertion.
          p = Path("scripts/reconcile_writer_inventory_v3_dispositions.py")
          s = p.read_text(encoding="utf-8")
          tree = ast.parse(s)
          items = [(k, v) for node in ast.walk(tree) if isinstance(node, ast.Dict)
                   for k, v in zip(node.keys, node.values)
                   if isinstance(k, ast.Constant) and k.value == "infrastructure/mysql/process_reminder_anomaly_source.py"]
          assert len(items) == 1
          key, value = items[0]
          lines = s.splitlines(keepends=True)
          del lines[key.lineno - 1:value.end_lineno]
          p.write_text("".join(lines), encoding="utf-8")

          p = Path("tests/test_writer_inventory_v3_dispositions.py")
          replace_once(p, "import json\n", "import json\nfrom hashlib import sha256\n")
          replace_function(p, "test_task97_source_locked_reviews_are_exact_and_fail_closed_for_new_symbols", '''
          def test_task97_source_locked_reviews_are_exact_and_fail_closed_for_new_symbols():
              records = _records("writer_inventory_v3_disposition.records.jsonl")
              by_identity = {record["identity"]: record for record in records}
              commit_receipt = json.loads(
                  (EVIDENCE_DIRECTORY.parent / "task97_repository_commit_dispositions_v1.json").read_text(encoding="utf-8")
              )
              commit_decisions = {entry["identity"]: entry["classification"] for entry in commit_receipt["entries"]}

              for identity in EXACT_IDENTITY_REVIEWS:
                  if commit_decisions.get(identity) == "real_violation":
                      assert by_identity[identity]["final_disposition"] == "needs_decision"
                  else:
                      assert by_identity[identity]["final_disposition"] != "needs_decision"
              for review_registry in (EXACT_SOURCE_REVIEWS, EXACT_SOURCE_RESTRICTED_REVIEWS):
                  for path, (digest, symbols, _review) in review_registry.items():
                      selected = [
                          record
                          for record in records
                          if record["identity"].startswith(f"{path}:")
                          and str(record["identity"]).split(":", 2)[1] in symbols
                      ]
                      assert selected, path
                      source_matches = sha256((REPOSITORY_ROOT / path).read_bytes()).hexdigest() == digest
                      for record in selected:
                          identity = record["identity"]
                          commit_decision = commit_decisions.get(identity)
                          if commit_decision == "real_violation":
                              assert record["final_disposition"] == "needs_decision", identity
                          elif (source_matches or identity in EXACT_IDENTITY_REVIEWS
                                or _task97_exact_review(path, identity.split(":", 2)[1]) is not None
                                or commit_decision == "application_owned_legitimate_outer_uow"):
                              assert record["final_disposition"] != "needs_decision", identity
                          else:
                              # Expired source reviews must reject the writer, not inherit
                              # an old accepted snapshot. Independent exact decisions above
                              # do not grant approval to other occurrences or symbols.
                              assert record["final_disposition"] == "needs_decision", identity
                      assert _task97_exact_review(path, "FutureUnreviewedWriter.mutate") is None
          ''')

          # The published source must be byte-identical to the locally verified repair.
          expected = {'AGENTS.md': '90ddd6809513d974df826eaacbf735599e052190288da21db7cd93242840897d', 'scripts/reconcile_writer_inventory_v3_dispositions.py': '396cacfb2f60d2c23f4b324b904e481bbdd35af286c30059f1c34f6e85edd292', 'scripts/verify_verification_scenarios.py': '5eda0ad13541d608693d4fef2598f5756a4cbf409b24bf53bfb2ebba12c70e0c', 'tests/test_verify_verification_baseline.py': '0f3738d53058dec229e2eda4878f3ae090f7d8b0b8aeace5af197935042bc5b4', 'tests/test_writer_inventory_v3_dispositions.py': 'd5a62b3f9ea7228983e9d413ce0fe14a7d0dfe9e2eaa97c5346d0a42a83177c3', 'validation/verification_baseline_v1.json': '78190d320ce01100dee78a01d970c592a4ee77ec94c8f2d982c1acc205f93e42'}
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          changed = subprocess.run(["git", "diff", "--name-only"], check=True, capture_output=True, text=True).stdout.splitlines()
          assert set(changed) == set(expected), changed
          print("Exact source verified: inventory tests 15/15; provenance/lineage tests 69/69 passed locally")
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- AGENTS.md validation/verification_baseline_v1.json scripts/reconcile_writer_inventory_v3_dispositions.py scripts/verify_verification_scenarios.py tests/test_writer_inventory_v3_dispositions.py tests/test_verify_verification_baseline.py
          git commit -m 'fix(validation): restore exact inventory decisions and independent coverage provenance'
      - name: Rebuild evidence from committed scanner inputs
        run: |
          python scripts/generate_task97_commit_dispositions.py
          python scripts/generate_writer_inventory_v3_candidate.py
          python scripts/reconcile_writer_inventory_v3_dispositions.py
          git diff --check
          git add -- document/架構重整/03_追蹤清單與證據/evidence/task97_repository_commit_dispositions_v1.json document/架構重整/03_追蹤清單與證據/evidence/writer_inventory_v3/writer_inventory_v3_candidate.findings.jsonl document/架構重整/03_追蹤清單與證據/evidence/writer_inventory_v3/writer_inventory_v3_candidate.manifest.json document/架構重整/03_追蹤清單與證據/evidence/writer_inventory_v3/writer_inventory_v3_disposition.records.jsonl document/架構重整/03_追蹤清單與證據/evidence/writer_inventory_v3/writer_inventory_v3_disposition.manifest.json
          git commit -m 'fix(evidence): synchronize current writer receipts without accepting unresolved boundaries'
      - name: Install existing test dependencies
        run: |
          python -m pip install -q pytest
          python -m pip install -q -r requirements.txt
      - name: Verify inventory and provenance tests
        run: |
          python -m pytest -q tests/test_task97_commit_dispositions.py tests/test_writer_inventory_v3_dispositions.py
          python -m pytest -q tests/test_verify_verification_baseline.py tests/test_phase3_scenario_lineage.py tests/test_phase4_scenario_lineage.py
      - name: Verify affected source and transaction-owner behavior
        run: |
          python -m pytest -q --strict-markers -m 'not integration' tests/test_data_browser_query_contract.py tests/test_data_browser_privacy.py tests/test_line_bind_legacy_characterization.py tests/test_admin_auth_runtime.py tests/test_task97_admin_auth_logout.py tests/domains/external-integration/subsystems/line/subsystems/test_contract_knowledge_applications_stage8.py tests/domains/external-integration/subsystems/line/modules/complaint-ingress/contract/test_human_escalation_delivery.py tests/domains/orders/subsystems/orders/modules/historical-adoption/unit/test_historical_calendar_assignment_remediation.py tests/domains/orders/subsystems/orders/modules/historical-precision-restart/unit/test_historical_precision_restart_workflow.py tests/domains/orders/subsystems/orders/modules/intake-terms-bootstrap/unit/test_order_intake_client_name_repair.py tests/domains/orders/subsystems/orders/modules/intake-terms-bootstrap/unit/test_order_intake_terms_bootstrap.py tests/subsystems/case_import/test_hcm_resubmission_workflow.py tests/domains/orders/subsystems/orders/modules/service-date-confirmation/test_service_date_confirmation.py tests/domains/anomalies/subsystems/anomalies/integration/test_anomaly_necessity_producer_cutover.py tests/domains/global/integration/test_task97_remaining_transaction_boundaries.py
      - name: Confirm strict writer gate still rejects unresolved boundaries
        run: |
          python - <<'PY'
          from collections import Counter
          import json
          from pathlib import Path
          import subprocess
          evidence = Path('document/架構重整/03_追蹤清單與證據/evidence')
          commits = json.loads((evidence / 'task97_repository_commit_dispositions_v1.json').read_text())
          records = [json.loads(line) for line in (evidence / 'writer_inventory_v3/writer_inventory_v3_disposition.records.jsonl').read_text().splitlines() if line]
          print('Task97 classifications:', dict(Counter(x['classification'] for x in commits['entries'])))
          print('Task97 terminal_status:', commits['terminal_status'])
          print('Writer dispositions:', dict(Counter(x['final_disposition'] for x in records)))
          result = subprocess.run(['python', 'scripts/check_production_writers.py'], capture_output=True, text=True)
          assert result.returncode != 0, 'unresolved writers must not pass the production writer gate'
          print('Strict production writer gate: BLOCKED (preserved, not waived)')
          PY
      - name: Publish verified changes only to the new PR branch
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          git diff --check '${{ github.event.pull_request.head.sha }}'..HEAD
          git diff --stat '${{ github.event.pull_request.head.sha }}'..HEAD
          git push origin HEAD:refs/heads/fix/issue-215-regression-followup-20260906
          git log -2 --format='%H %s'
