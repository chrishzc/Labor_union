name: Issue 215 source review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    if: github.event.pull_request.number == 216 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-215-regression-followup-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect only changed receipt identities
        run: |
          python - <<'PY'
          import json
          from scripts.generate_writer_inventory_v3_candidate import main as generate_candidate
          from scripts import reconcile_writer_inventory_v3_dispositions as reconciler

          def records(path):
              return [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line]

          saved = {item['identity']: item for item in records(reconciler.RECORDS)}
          generate_candidate()
          candidates = records(reconciler.CANDIDATE)
          fresh = {item['identity']: item for item in candidates}
          for identity, review in reconciler.EXACT_IDENTITY_REVIEWS.items():
              if identity not in fresh:
                  print('STALE_EXACT_REVIEW', identity, json.dumps(review))
                  path, symbol = identity.split(':', 2)[:2]
                  for record in candidates:
                      if record['relative_path'] == path and record['symbol'] == symbol:
                          print('CURRENT_SYMBOL_IDENTITY', json.dumps(record, ensure_ascii=False))
          for candidate in candidates:
              identity = candidate['identity']
              previous = saved.get(identity)
              if candidate['operation'] != 'COMMIT' or previous is None or previous['owner'] != 'payroll':
                  continue
              rebuilt = reconciler._disposition(candidate)
              if 'typed' not in rebuilt['runtime_caller'].lower():
                  print('PRESERVE_EXISTING_TYPED_RECEIPT', json.dumps({'previous': previous, 'recomputed': rebuilt}, ensure_ascii=False))
          PY
      - name: Export the exact PR Git history without credentials or runner files
        run: |
          git bundle create "$RUNNER_TEMP/issue215.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/issue215.bundle"
          sha256sum "$RUNNER_TEMP/issue215.bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue215-source
          path: ${{ runner.temp }}/issue215.bundle
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
