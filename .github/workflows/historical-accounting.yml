name: Historical accounting contracts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      type_base_sha:
        description: Baseline revision for the Pyright diff check
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: historical-accounting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Historical accounting Python and MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports: ["127.0.0.1:3307:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: development
      ACCESS_CONTROL_PROFILE: local_auth
      ENABLE_ADMIN_AUTH: "true"
      DB_HOST: 127.0.0.1
      DB_PORT: "3307"
      DB_USER: root
      DB_PASSWORD: ""
      DB_SSL_MODE: disabled
      DB_DATABASE: lu_test_historical_${{ github.run_id }}_${{ github.run_attempt }}
      PRICING_MYSQL: "1"
      HISTORICAL_ACCOUNTING_CONTRACT_PATH: scratch/historical-accounting-drawer/api-contract.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install declared test dependencies
        id: dependencies
        run: python -m pip install -r requirements.txt pytest httpx2==2.10.0 ruff pyright
      - name: Verify historical funding and original payment contracts
        run: >-
          python -m pytest -vv
          tests/domains/finance-import/subsystems/finance-import/integration/test_statement_workspace.py
          tests/domains/finance-import/subsystems/finance-import/integration/test_finance_import_query.py
          tests/domains/staff-payables/subsystems/staff-payables/integration/test_staff_payout_repository_recovery.py
          tests/domains/staff-payables/subsystems/staff-payables/integration/test_staff_payout_reconciliation_workflow.py
          tests/domains/staff-payables/subsystems/staff-payables/integration/test_accounts_payable_export_sources.py
          tests/domains/finance-import/subsystems/finance-import/integration/test_finance_import_owning_domain_composite.py
          tests/domains/client-finance/subsystems/client-finance/integration/test_accounting_source_projection.py
          tests/domains/payroll/subsystems/payroll/modules/historical-service-accounting/unit/test_historical_baseline_obligation_sync.py
          tests/domains/staff-payables/subsystems/staff-payables/modules/historical-payment-settlement/contract/test_historical_completion_read_adapter.py
          tests/domains/orders/subsystems/orders/modules/historical-service-accounting/unit/test_historical_service_accounting_mysql_repository.py
          tests/domains/orders/subsystems/orders/modules/historical-precision-restart/unit/test_historical_precision_restart_repository_contract.py
          tests/domains/case-import/subsystems/case-import/modules/pairing-current-facts/test_beclass_correction_workflow.py
          tests/domains/clients/subsystems/client-profile/modules/profile-change/contract/test_client_registry_query.py
          tests/domains/orders/subsystems/orders/modules/historical-adoption/unit/test_historical_service_accounting.py
          tests/domains/orders/subsystems/orders/modules/historical-adoption/unit/test_historical_service_accounting_workflow.py
          tests/domains/orders/subsystems/orders/modules/historical-adoption/unit/test_historical_order_adoption.py
          tests/domains/orders/subsystems/orders/modules/historical-adoption/contract/test_historical_service_accounting_router.py
          tests/domains/orders/subsystems/orders/integration/test_order_auto_completion_workflow.py
          tests/domains/orders/subsystems/orders/integration/test_order_cancellation_cross_domain_chain.py
          tests/domains/payroll/subsystems/payroll/integration/test_payroll_rebuild_workflow.py
          tests/domains/client-finance/subsystems/client-finance/modules/pricing-configuration/test_pricing_policy.py
          tests/domains/client-finance/subsystems/client-finance/modules/receipt-reconciliation/unit/test_difference_resolution.py
          tests/domains/orders/subsystems/orders/modules/order-terms/contract/test_incomplete_order_terms.py
      - name: Verify isolated MySQL query to accounting API and read-only snapshots
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python -m pytest -vv tests/domains/client-finance/subsystems/client-finance/integration/test_accounting_pricing_mysql.py -k historical_accounting
          python -m pytest -vv tests/domains/staff-payables/subsystems/staff-payables/integration/test_historical_payroll_reconciliation_decoupling_mysql.py
      - name: Verify historical completion writes payroll with unknown funding
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          password="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          echo "::add-mask::$password"
          export LABOR_UNION_TEST_MYSQL_DATABASE="$DB_DATABASE"
          export LABOR_UNION_TEST_MYSQL_HOST="$DB_HOST" LABOR_UNION_TEST_MYSQL_PORT="$DB_PORT"
          export LABOR_UNION_TEST_MYSQL_USER=lu_historical_fixture LABOR_UNION_TEST_MYSQL_PASSWORD="$password"
          python - <<'PY'
          import os
          from argparse import Namespace
          import pymysql
          from scripts.bootstrap_disposable_mysql_schema import bootstrap
          database = os.environ['LABOR_UNION_TEST_MYSQL_DATABASE']
          assert database.startswith('lu_test_historical_')
          bootstrap(Namespace(host='127.0.0.1', port=3307, user='root', password='',
                              database=database, confirm_database=database))
          with pymysql.connect(host='127.0.0.1', port=3307, user='root', password='', autocommit=True) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("CREATE USER 'lu_historical_fixture'@'%%' IDENTIFIED BY %s",
                                 (os.environ['LABOR_UNION_TEST_MYSQL_PASSWORD'],))
                  cursor.execute(f"GRANT ALL PRIVILEGES ON `{database}`.* TO 'lu_historical_fixture'@'%'")
          PY
          export DB_USER="$LABOR_UNION_TEST_MYSQL_USER" DB_PASSWORD="$LABOR_UNION_TEST_MYSQL_PASSWORD"
          python -m pytest -vv tests/domains/orders/subsystems/orders/modules/historical-adoption/integration/test_wp80_disposable_mysql_e2e.py::test_rollover_creates_undated_payroll_and_preserves_unknown_funding_reason
      - name: Verify refunds from confirmed service shortening
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          ACCOUNTING_SYNC_MYSQL: "1"
        run: >-
          python -m pytest -vv
          tests/domains/orders/subsystems/orders/integration/test_accounting_change_reconciliation_mysql.py
          -k test_early_end_creates_refund_only_for_formally_received_surplus
      - name: Verify late Sinopac receipts through real bank review
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          LABOR_UNION_TEST_MYSQL_DATABASE: lu_test_late_${{ github.run_id }}_${{ github.run_attempt }}
          LABOR_UNION_TEST_MYSQL_HOST: 127.0.0.1
          LABOR_UNION_TEST_MYSQL_PORT: "3307"
          LABOR_UNION_TEST_MYSQL_USER: lu_late_fixture
          DB_USER: lu_late_fixture
          DB_DATABASE: lu_test_late_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          password="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          echo "::add-mask::$password"
          export LABOR_UNION_TEST_MYSQL_PASSWORD="$password" DB_PASSWORD="$password"
          python - <<'PYSETUP'
          import os
          import subprocess
          import sys
          import pymysql

          database = os.environ['LABOR_UNION_TEST_MYSQL_DATABASE']
          assert database.startswith('lu_test_late_')
          with pymysql.connect(host='127.0.0.1', port=3307, user='root', password='', autocommit=True) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("CREATE USER 'lu_late_fixture'@'%%' IDENTIFIED BY %s",
                                 (os.environ['LABOR_UNION_TEST_MYSQL_PASSWORD'],))
                  cursor.execute(f"GRANT ALL PRIVILEGES ON `{database}_event_matrix`.* TO 'lu_late_fixture'@'%'")
                  # The repository fixture installs its real triggers on this disposable CI service.
                  cursor.execute("SELECT @@GLOBAL.log_bin_trust_function_creators")
                  previous = int(cursor.fetchone()[0])
                  cursor.execute("SET GLOBAL log_bin_trust_function_creators = 1")
                  try:
                      result = subprocess.run(
                          [sys.executable, "-m", "pytest", "-vv",
                           "tests/domains/finance-import/subsystems/finance-import/integration/test_accounting_event_matrix_mysql.py",
                           "-k", "terminal_sinopac_receipt"],
                          check=False,
                      )
                  finally:
                      connection.ping(reconnect=True)
                      cursor.execute("SET GLOBAL log_bin_trust_function_creators = %s", (previous,))
                  sys.exit(result.returncode)
          PYSETUP
      - name: Verify bank review through isolated money owners
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          DB_DATABASE: lu_test_subsidy_b_${{ github.run_id }}_${{ github.run_attempt }}
          SUBSIDY_CONFIRMATION_MYSQL: "1"
        run: |
          python - <<'PY'
          import os
          from argparse import Namespace
          from scripts.bootstrap_disposable_mysql_schema import bootstrap
          database = os.environ['DB_DATABASE']
          assert database.startswith('lu_test_subsidy_b_')
          bootstrap(Namespace(host='127.0.0.1', port=3307, user='root', password='',
                              database=database, confirm_database=database))
          PY
          python -m pytest -vv tests/domains/finance-import/subsystems/finance-import/integration/test_subsidy_confirmation_mysql.py -k 'test_staff_subsidy_suffix_with_wrong_month_requires_manual_reconciliation or test_staff_subsidy_without_suffix_cannot_bypass_cross_month_guard or test_staff_subsidy_cross_month_qualification_preserves_manual_amount_choices or test_shared_name_with_suffix_cannot_manually_reconcile_another_month or (test_bank_preview_then_apply_confirms_builds_and_settles_once and advance) or test_reconciled_partial_receipt_confirms_subsidy_scheme or test_reconciled_subsidy_payout_and_receipt_in_both_orders or test_apply_failure_rolls_back_confirmation_new_payable_and_settlement or test_confirmed_direct_preserves_normal_refund_entry_and_receipt'
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install strict drawer test dependencies
        working-directory: ui_react
        run: npm ci --ignore-scripts
      - name: Exercise historical payroll through the browser and real accounting API
        env:
          PAYROLL_BROWSER_E2E: "1"
        run: |
          python -m pip install 'playwright>=1.60.0'
          python -m playwright install --with-deps chromium
          python -m pytest -vv tests/domains/staff-payables/subsystems/staff-payables/integration/test_historical_payroll_reconciliation_decoupling_mysql.py::test_historical_payroll_via_real_browser
      - name: Render actual synthetic MySQL API responses through the strict client
        working-directory: ui_react
        env:
          HISTORICAL_ACCOUNTING_CONTRACT_PATH: ${{ github.workspace }}/scratch/historical-accounting-drawer/api-contract.json
        run: >-
          npm test --
          src/tests/domains/finance-import/subsystems/finance-import/modules/statement-workspace/compact_case_drawer.test.tsx
          -t 隔離
      - name: Check Python types and lint at the affected boundaries
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          FINANCE_TYPE_BASE_SHA: ${{ inputs.type_base_sha || github.event.pull_request.base.sha || 'HEAD^' }}
        run: |
          ruff check --select E9,F63,F7,F82 domains/client_finance/subsidy_coverage.py infrastructure/mysql/client_payments_query_repository.py infrastructure/mysql/case_staff_accounting_repository.py infrastructure/mysql/staff_payout_repository.py infrastructure/mysql/subsidy_confirmation_repository.py subsystems/client_finance/case_accounting_query.py subsystems/staff_payables/case_accounting_query.py subsystems/finance_import/accounting_workspace.py subsystems/finance_import/query.py api/schemas/finance_import.py api/dependencies/finance_import.py api/routes/finance_statement_workspace.py subsystems/payroll/historical_baseline_obligation_sync.py infrastructure/mysql/finance_import_owning_domain_composite.py infrastructure/mysql/accounts_payable_export_sources.py infrastructure/mysql/payroll_rebuild_repository.py infrastructure/mysql/finance_import_repository.py infrastructure/mysql/historical_staff_payout_repository.py subsystems/orders/historical_adoption_workflow.py \
            infrastructure/mysql/accounting_workspace_repository.py \
            tests/domains/payroll/subsystems/payroll/modules/historical-service-accounting/unit/test_historical_baseline_obligation_sync.py \
            tests/domains/staff-payables/subsystems/staff-payables/integration/test_historical_payroll_reconciliation_decoupling_mysql.py
          pyright domains/client_finance/subsidy_coverage.py subsystems/client_finance/case_accounting_query.py subsystems/staff_payables/case_accounting_query.py subsystems/payroll/historical_baseline_obligation_sync.py infrastructure/mysql/accounts_payable_export_sources.py
          python - <<'PY'
          import ast
          from collections import Counter
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          files = (
              'subsystems/finance_import/query.py',
              'infrastructure/mysql/subsidy_confirmation_repository.py',
              'infrastructure/mysql/staff_payout_repository.py',
              'api/dependencies/finance_import.py',
              'api/schemas/finance_import.py',
              'infrastructure/mysql/accounting_workspace_repository.py',
              'tests/domains/payroll/subsystems/payroll/modules/historical-service-accounting/unit/test_historical_baseline_obligation_sync.py',
              'tests/domains/staff-payables/subsystems/staff-payables/integration/test_historical_payroll_reconciliation_decoupling_mysql.py',
          )
          candidate = Path.cwd().resolve()
          temporary = Path(os.environ['RUNNER_TEMP']).resolve()
          base = temporary / 'finance-type-base'
          checker = shutil.which('pyright')
          if checker is None:
              raise SystemExit('Installed Pyright executable is missing')

          def diagnostics(root: Path, label: str) -> Counter[tuple[str, str, str, str, str]]:
              result = subprocess.run(
                  [checker, '--outputjson', *files], cwd=root,
                  capture_output=True, text=True, check=False,
              )
              (temporary / f'finance-type-{label}.json').write_text(result.stdout, encoding='utf-8')
              (temporary / f'finance-type-{label}.stderr').write_text(result.stderr, encoding='utf-8')
              if result.returncode not in (0, 1) or 'fatal' in result.stderr.lower():
                  raise RuntimeError(f'{label}: Pyright failed ({result.returncode}): {result.stderr}')
              report = json.loads(result.stdout)
              summary = report['summary']
              entries = report['generalDiagnostics']
              if (not isinstance(entries, list)
                      or not isinstance(summary['filesAnalyzed'], int)
                      or summary['filesAnalyzed'] < len(files)
                      or summary['errorCount'] != sum(item['severity'] == 'error' for item in entries)
                      or result.returncode != int(summary['errorCount'] > 0)):
                  raise RuntimeError(f'{label}: incomplete or inconsistent Pyright output')
              owners: dict[str, list[tuple[int, int, str]]] = {}
              for relative in files:
                  source = (root / relative).read_text(encoding='utf-8')
                  spans: list[tuple[int, int, str]] = []

                  def visit(node: ast.AST, names: tuple[str, ...] = ()) -> None:
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                          names = (*names, node.name)
                          start = min([node.lineno, *(item.lineno for item in node.decorator_list)])
                          if node.end_lineno is None:
                              raise RuntimeError(f'{label}: missing AST range in {relative}')
                          spans.append((start, node.end_lineno, '.'.join(names)))
                      for child in ast.iter_child_nodes(node):
                          visit(child, names)

                  visit(ast.parse(source, filename=relative))
                  owners[relative] = spans
              counts: Counter[tuple[str, str, str, str, str]] = Counter()
              for item in entries:
                  relative = Path(item['file']).resolve().relative_to(root).as_posix()
                  if relative not in owners:
                      raise RuntimeError(f'{label}: unexpected diagnostic file {relative}')
                  line = item['range']['start']['line'] + 1
                  matches = [span for span in owners[relative] if span[0] <= line <= span[1]]
                  owner = min(matches, key=lambda span: span[1] - span[0])[2] if matches else '<module>'
                  severity = item['severity']
                  message = item['message']
                  rule = item.get('rule', '')
                  if severity not in {'error', 'warning', 'information'} or not isinstance(message, str) or not isinstance(rule, str):
                      raise RuntimeError(f'{label}: malformed Pyright diagnostic')
                  counts[(relative, owner, rule, message, severity)] += 1
              print(f'{label}: {summary["filesAnalyzed"]} files analyzed, {summary["errorCount"]} errors')
              return counts

          subprocess.run(
              ['git', 'worktree', 'add', '--detach', str(base), os.environ['FINANCE_TYPE_BASE_SHA']],
              cwd=candidate, check=True,
          )
          try:
              baseline = diagnostics(base, 'base')
              current = diagnostics(candidate, 'candidate')
              added = current - baseline
              removed = baseline - current
              new_errors = sum(count for key, count in added.items() if key[-1] == 'error')
              removed_errors = sum(count for key, count in removed.items() if key[-1] == 'error')
              print(f'Additional {len(files)}-file scope: {new_errors} new errors, {removed_errors} removed errors')
              for (relative, owner, rule, message, severity), count in sorted(added.items()):
                  print(f'{relative}::{owner}: {severity} [{rule}] ({count} new): {message}')
              if new_errors:
                  raise SystemExit(f'New Pyright errors in the additional {len(files)}-file scope')
          finally:
              subprocess.run(['git', 'worktree', 'remove', str(base)], cwd=candidate, check=True)
          PY
      - name: Check completed historical correction boundaries
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          ruff check --select E9,F63,F7,F82 domains/orders/historical_service_accounting.py domains/payroll/historical_calculation.py domains/client_finance/historical_obligation_calculation.py subsystems/case_import/beclass_correction_workflow.py subsystems/orders/historical_service_accounting_workflow.py subsystems/client_finance/pricing_configuration.py infrastructure/mysql/beclass_correction_repository.py infrastructure/mysql/beclass_financial_sync.py infrastructure/mysql/historical_service_accounting_repository.py infrastructure/mysql/pricing_configuration_repository.py api/routes/client_registry.py api/routes/historical_service_accounting.py api/routes/accounting_pricing.py api/schemas/client_registry.py api/schemas/historical_service_accounting.py api/schemas/accounting_pricing.py
          pyright domains/orders/historical_service_accounting.py domains/payroll/historical_calculation.py domains/client_finance/historical_obligation_calculation.py subsystems/case_import/beclass_correction_workflow.py subsystems/orders/historical_service_accounting_workflow.py subsystems/client_finance/pricing_configuration.py api/schemas/client_registry.py api/schemas/historical_service_accounting.py api/schemas/accounting_pricing.py
      - name: Check the owning specification and whitespace
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python scripts/validate_spec_hygiene.py
          python scripts/validate_spec_hygiene.py --path .arch-map/requirements/22B_帳務差額處置與工作台UI正式規格.md
          python scripts/validate_spec_hygiene.py --path .arch-map/requirements/22_銀行流水匯入與帳務異常處理正式規格.md
          git diff --check ${{ github.event.pull_request.base.sha || 'HEAD^' }} HEAD

  frontend:
    name: Historical accounting React
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui_react
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - name: Verify historical drawer and normal order regressions
        run: >-
          npm test --
          src/tests/domains/finance-import/subsystems/finance-import/modules/statement-workspace/compact_case_drawer.test.tsx
          src/tests/domains/finance-import/subsystems/finance-import/modules/statement-workspace/bank_reconciliation_workspace.test.tsx
          src/tests/domains/finance-import/subsystems/finance-import/modules/statement-workspace/import_retry.test.tsx
          src/tests/domains/finance-import/subsystems/finance-import/modules/finance-import-correction/finance_import_correction_form.test.tsx
          src/tests/domains/finance-import/subsystems/finance-import/modules/statement-workspace/historical_payable_review.test.tsx
          src/tests/domains/client-finance/subsystems/client-finance/modules/pricing-configuration/accounting_pricing.test.tsx
          src/tests/domains/client-finance/subsystems/client-finance/modules/pricing-configuration/accounting_parameters_components.test.tsx
          src/tests/domains/clients/subsystems/client-profile/modules/profile-change/client_registry_accounting_summary.test.tsx
          src/tests/domains/clients/subsystems/client-profile/modules/profile-change/client_registry_page.test.tsx
      - run: npm run lint
      - run: npm run build
