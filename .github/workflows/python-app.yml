name: Python syntax

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check tracked Python files for syntax errors
        shell: bash
        run: git ls-files -z -- '*.py' | xargs -0 -r python -m py_compile
      - name: Install locked focused HTTP test dependencies
        id: python_deps
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          from pip._vendor.packaging.markers import Marker

          packages = tomllib.loads(Path('uv.lock').read_text(encoding='utf-8'))['package']
          roots = ['fastapi', 'pytest', 'httpx2', 'pymysql', 'python-dotenv', 'cryptography']
          pending = [{'name': name} for name in roots]
          selected = {}
          while pending:
              requirement = pending.pop()
              if requirement.get('marker') and not Marker(requirement['marker']).evaluate():
                  continue
              name = requirement['name']
              candidates = [p for p in packages if p['name'] == name and
                  (not requirement.get('version') or p['version'] == requirement['version'])]
              if len(candidates) > 1:
                  candidates = [p for p in candidates if any(Marker(m).evaluate()
                      for m in p.get('resolution-markers', []))]
              if len(candidates) != 1:
                  raise RuntimeError('Ambiguous locked dependency: ' + name)
              package = candidates[0]
              if name in selected:
                  assert selected[name]['version'] == package['version'], name
                  continue
              assert package.get('source') == {'registry': 'https://pypi.org/simple'}, name
              assert package.get('wheels'), name
              selected[name] = package
              pending.extend(package.get('dependencies', []))
          lines = []
          for name, package in sorted(selected.items()):
              hashes = sorted({w['hash'] for w in package['wheels']})
              assert all(w['url'].startswith('https://files.pythonhosted.org/') for w in package['wheels']), name
              lines.append(name + '==' + package['version'] + ' ' + ' '.join('--hash=' + h for h in hashes))
              print('LOCKED_HTTP_DEPENDENCY', name, package['version'])
          target = Path(os.environ['RUNNER_TEMP']) / 'pr296-http-requirements.txt'
          target.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python -m pip --isolated install --disable-pip-version-check --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r "$RUNNER_TEMP/pr296-http-requirements.txt"
      - name: Focused HTTP and archive query tests
        id: http_tests
        shell: bash
        env:
          APP_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: '1'
          DB_USER: pr296_no_database
          DB_DATABASE: pr296_no_database
        run: |
          python -m pytest -q --tb=short tests/test_client_entry_retirement.py tests/test_data_browser_admin_route.py tests/test_data_browser_query_contract.py tests/test_data_browser_privacy.py
      - name: Install locked React test dependencies without lifecycle scripts
        id: node_deps
        if: ${{ !cancelled() }}
        working-directory: ui_react
        shell: bash
        run: |
          node --version
          npm --version
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('package-lock.json').read_text(encoding='utf-8'))
          for name, package in lock['packages'].items():
              if not name:
                  continue
              assert package.get('resolved', '').startswith('https://registry.npmjs.org/'), name
              assert package.get('integrity'), name
              if package.get('hasInstallScript'):
                  print('INSTALL_SCRIPT_SKIPPED', name, package['version'])
          for name in ('typescript', 'vite', 'vitest', 'happy-dom', 'react', 'react-dom', '@vitejs/plugin-react'):
              package = lock['packages']['node_modules/' + name]
              print('LOCKED_REACT_DEPENDENCY', name, package['version'], package.get('license'))
          PY
          npm ci --ignore-scripts --no-audit --no-fund
      - name: React TypeScript and Vite build
        id: react_build
        if: ${{ !cancelled() && steps.node_deps.outcome == 'success' }}
        working-directory: ui_react
        shell: bash
        run: npm run build
      - name: Focused React archive query and replacement entry tests
        id: react_tests
        if: ${{ !cancelled() && steps.node_deps.outcome == 'success' }}
        working-directory: ui_react
        shell: bash
        run: |
          npm test -- src/tests/data_browser_query_client.test.ts src/tests/data_browser_query_adapter.test.ts src/tests/domains/clients/subsystems/client-profile/modules/profile-change/ src/tests/domains/global/subsystems/application-shell/modules/react-application-shell/data_browser_entry_cutover.test.tsx --maxWorkers=2 --minWorkers=1
      - name: Verify validation leaves tracked source unchanged
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git diff --exit-code
          git diff --check
          printf 'PR296_VALIDATION_HEAD '
          git rev-parse HEAD
