name: Python syntax

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check tracked Python files for syntax errors
        shell: bash
        run: git ls-files -z -- '*.py' | xargs -0 -r python -m py_compile
      - name: Temporary P2 compatibility reference audit
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          print('P2_AUDIT_HEAD', subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip())
          patterns = {
              'ANOMALIES_SHIM': re.compile(r'(?<![A-Za-z0-9_])AnomaliesPage(?![A-Za-z0-9_])'),
              'BIND_BOOKMARK': re.compile(r'/static/bind\.html'),
          }
          paths = subprocess.check_output(['git', 'ls-files', '-z', '--', 'ui_react', 'tests', 'api', 'line', 'config'], text=True).split('\0')
          totals = {name: 0 for name in patterns}
          for name in paths:
              path = Path(name)
              if not name or path.suffix not in {'.py', '.ts', '.tsx', '.js', '.jsx', '.html', '.json', '.css'} or path.name == 'package-lock.json':
                  continue
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  for label, pattern in patterns.items():
                      if pattern.search(line):
                          totals[label] += 1
                          print(label, f'{name}:{lineno}')
          print('P2_REFERENCE_COUNTS', totals)
          shell = Path('ui_react/src/tests/domains/global/subsystems/application-shell/modules/react-application-shell')
          for path in sorted(shell.glob('*.test.ts*')):
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if re.search(r'#(?:data-browser|databrowser|client-roster)', line):
                      print('HASH_COMPATIBILITY_TEST', f'{path.as_posix()}:{lineno}')
          PY
          git diff --exit-code
          git diff --check
