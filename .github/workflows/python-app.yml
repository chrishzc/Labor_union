# This workflow installs dependencies, validates repository governance,
# and runs the current regression gates on every main push and pull request.

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Validate Agent governance routing
      if: ${{ always() }}
      run: python scripts/validate_agent_governance.py

  regression-tests:
    name: regression suite (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run non-integration regression shard
      env:
        SHARD_INDEX: ${{ matrix.shard }}
        SHARD_COUNT: 8
      shell: bash
      run: |
        set -euo pipefail
        mapfile -t all_test_files < <(
          find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) | sort
        )
        selected_test_files=()
        for index in "${!all_test_files[@]}"; do
          if (( index % SHARD_COUNT == SHARD_INDEX - 1 )); then
            selected_test_files+=("${all_test_files[$index]}")
          fi
        done
        echo "pytest files total: ${#all_test_files[@]}"
        echo "pytest files in shard ${SHARD_INDEX}/${SHARD_COUNT}: ${#selected_test_files[@]}"
        if (( ${#selected_test_files[@]} == 0 )); then
          echo "No pytest files selected for shard ${SHARD_INDEX}/${SHARD_COUNT}" >&2
          exit 1
        fi
        python -m pytest -q --strict-markers -m "not integration" "${selected_test_files[@]}"

  required-regression-suite:
    name: required regression suite
    runs-on: ubuntu-latest
    needs: regression-tests
    if: ${{ always() }}

    steps:
    - name: Verify all regression shards passed
      env:
        REGRESSION_RESULT: ${{ needs.regression-tests.result }}
      run: test "$REGRESSION_RESULT" = "success"

  react-tests-and-build:
    name: React tests and build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: ui_react/package-lock.json
    - name: Install React dependencies
      working-directory: ui_react
      run: npm ci
    - name: Run complete React test suite
      working-directory: ui_react
      run: npm test
    - name: Build React application
      working-directory: ui_react
      run: npm run build

  historical-order-workbook-regression:
    name: historical order workbook router regression
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run historical order workbook router regression
      run: python -m pytest -q tests/domains/orders/subsystems/orders/modules/historical-adoption/contract/test_historical_order_adoption_router.py

  historical-cancellation-mysql-regression:
    name: historical cancellation disposable MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ci-root-password
      DB_DATABASE: lu_test_historical_mid_service_cancellation
      DB_SSL_MODE: disabled
      LABOR_UNION_TEST_MYSQL_HOST: 127.0.0.1
      LABOR_UNION_TEST_MYSQL_PORT: "3306"
      LABOR_UNION_TEST_MYSQL_USER: root
      LABOR_UNION_TEST_MYSQL_PASSWORD: ci-root-password
      LABOR_UNION_TEST_MYSQL_DATABASE: lu_test_historical_mid_service_cancellation

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run historical mid-service cancellation MySQL E2E
      run: python -m pytest -q tests/test_historical_mid_service_cancellation_disposable_mysql_e2e.py

  canonical-tests:
    name: canonical tests (${{ matrix.owner }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - owner: orders
            path: tests/domains/orders/subsystems/orders
          - owner: scheduling
            path: tests/domains/scheduling/subsystems/scheduling
          - owner: client-finance
            path: tests/domains/client-finance/subsystems/client-finance
          - owner: staff-payables
            path: tests/domains/staff-payables/subsystems/staff-payables
          - owner: anomalies
            path: tests/domains/anomalies/subsystems/anomalies
          - owner: payroll
            path: tests/domains/payroll/subsystems/payroll
          - owner: finance-import
            path: tests/domains/finance-import/subsystems/finance-import
          - owner: government-subsidy
            path: tests/domains/government-subsidy/subsystems/government-subsidy
          - owner: case-import
            path: tests/subsystems/case_import
          - owner: clients
            path: tests/domains/clients/subsystems/client-profile
          - owner: access
            path: tests/domains/external-integration/subsystems/access
          - owner: line
            path: tests/domains/external-integration/subsystems/line
          - owner: contract-signing
            path: tests/domains/contract-signing/subsystems/contract-signing

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Collect ${{ matrix.owner }} owner-local tests
      run: python -m pytest --collect-only -q "${{ matrix.path }}"
    - name: Run ${{ matrix.owner }} owner-local tests
      run: python -m pytest -q "${{ matrix.path }}"

  cross-domain-boundary-tests:
    name: cross-domain workflow boundaries
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Collect preserved cross-domain workflows
      run: |
        python -m pytest --collect-only -q \
          tests/domains/orders/subsystems/orders/integration/test_order_cancellation_cross_domain_chain.py \
          tests/test_order_terms_preassignment_correction.py \
          tests/test_contract_completion_workflow.py
    - name: Run preserved cross-domain workflows
      run: |
        python -m pytest -q \
          tests/domains/orders/subsystems/orders/integration/test_order_cancellation_cross_domain_chain.py \
          tests/test_order_terms_preassignment_correction.py \
          tests/test_contract_completion_workflow.py

  temporary-orders-ui-patch:
    name: apply exact Orders UI patch
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        fetch-depth: 0
    - name: Apply exact Orders UI edits
      run: python scripts/apply_orders_projection_ui_patch.py
    - name: Commit patched pages to the working branch
      shell: bash
      run: |
        set -euo pipefail
        if git diff --quiet -- ui_react/src/pages/OrdersPage.tsx ui_react/src/pages/OrderTrackerPage.tsx; then
          echo "Orders UI patch already applied"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add ui_react/src/pages/OrdersPage.tsx ui_react/src/pages/OrderTrackerPage.tsx
        git commit -m "fix(orders-ui): isolate cancellation and render terminal projection"
        git push origin HEAD:${{ github.event.pull_request.head.ref }}
