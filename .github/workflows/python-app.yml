  holiday-double-backend:
    name: Holiday double pricing backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest httpx2==2.10.0 ruff pyright
      - name: Lint and type-check holiday pricing boundaries
        run: |
          ruff check --select E9,F63,F7,F82 domains/client_finance/pricing_policy.py infrastructure/mysql/holiday_repricing.py subsystems/client_finance/pricing_configuration.py
          pyright domains/client_finance/pricing_policy.py infrastructure/mysql/holiday_repricing.py infrastructure/mysql/holiday_accounting_results.py
      - name: Verify holiday pricing and historical exclusions
        id: holiday_contracts
        run: >-
          python -m pytest -q --junitxml=${{ runner.temp }}/lu-holiday-baseline.xml
          tests/domains/scheduling/subsystems/scheduling/integration/test_holiday_router.py
          tests/domains/scheduling/subsystems/scheduling/modules/schedule-generation/test_service_date_adjustment.py
          tests/domains/payroll/subsystems/payroll/modules/tiered-payroll/test_tiered_payroll.py
          tests/domains/payroll/subsystems/payroll/integration/test_payroll_rebuild_workflow.py
          tests/domains/payroll/subsystems/payroll/modules/historical-service-accounting/unit/test_historical_payroll_calculation.py
          tests/domains/client-finance/subsystems/client-finance/modules/pricing-configuration/
          tests/domains/payroll/subsystems/payroll/integration/test_terms_impact.py
          tests/domains/client-finance/subsystems/client-finance/integration/test_client_finance_cancellation_direction.py
      - name: Compare holiday evidence selection without changing the gate
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.holiday_contracts.outcome == 'success' }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          module = "test_holiday_router"
          source = f"tests/domains/scheduling/subsystems/scheduling/integration/{module}.py"
          required = (
              "test_holiday_toggle_reprices_once_and_omitted_import_preserves_manual_setting",
              "test_transaction_failure_before_flag_change_never_commits_setting_or_receipt",
              "test_holiday_accounting_results_failure_is_not_an_empty_success",
          )
          temp = Path(os.environ["RUNNER_TEMP"])

          def evidence(path):
              cases = list(ET.parse(path).getroot().iter("testcase"))
              scoped = [case for case in cases if case.get("classname", "").rsplit(".", 1)[-1] == module]
              if not scoped:
                  raise ValueError("holiday router results missing")
              results = {}
              for case in scoped:
                  name = case.get("name")
                  if name not in required:
                      continue
                  if name in results:
                      results[name] = "ambiguous"
                  elif case.find("failure") is not None or case.find("error") is not None:
                      results[name] = "failed"
                  elif case.find("skipped") is not None:
                      results[name] = "skipped"
                  else:
                      results[name] = "passed"
              return {
                  "job_cases": len(cases),
                  "holiday_router_cases": len(scoped),
                  "case_seconds": round(sum(float(case.get("time", "0")) for case in scoped), 3),
                  "required": {name: results.get(name, "not_run") for name in required},
              }

          def run_trial(label, names):
              report = temp / f"lu-holiday-{label}.xml"
              subprocess.run(
                  [sys.executable, "-m", "pytest", "-q", f"--junitxml={report}",
                   *(f"{source}::{name}" for name in names)], check=True, timeout=120,
              )
              return evidence(report)

          checkout = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          parents = subprocess.check_output(["git", "show", "-s", "--format=%P", "HEAD"], text=True).split()
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))["pull_request"]
          event_base, head = event["base"]["sha"], event["head"]["sha"]
          expected_ref = f"refs/pull/{event['number']}/merge"
          version_ok = (checkout == os.environ["GITHUB_SHA"] and os.environ["GITHUB_REF"] == expected_ref
                        and len(parents) == 2 and parents[1] == head)
          tested_base = parents[0] if version_ok else None
          baseline = evidence(temp / "lu-holiday-baseline.xml")
          selected = run_trial("selected", required)
          omission = run_trial("omitted-consumer", required[:2])
          passed_cases = dict.fromkeys(required, "passed")
          expected_omission = {**passed_cases, required[-1]: "not_run"}
          ok = (version_ok and baseline["required"] == passed_cases
                and selected["required"] == passed_cases and selected["holiday_router_cases"] == 3
                and omission["required"] == expected_omission and omission["holiday_router_cases"] == 2)
          print("HOLIDAY_SELECTION_TRIAL " + json.dumps({
              "run": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "checkout": checkout, "head": head, "tested_base": tested_base, "event_base": event_base,
              "event_base_matches_tested": event_base == tested_base,
              "baseline": baseline, "selected": selected, "omitted_consumer": omission,
              "omitted_consumer_rejected": omission["required"] == expected_omission, "passed": ok,
          }, sort_keys=True))
          if not ok:
              raise SystemExit("Holiday selection evidence did not satisfy its trial contract.")
          PY

      - name: Verify current specification hygiene
        run: python scripts/validate_spec_hygiene.py
      - name: Verify whitespace
        run: git diff --check HEAD^

