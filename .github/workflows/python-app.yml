name: Python syntax

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check tracked Python files for syntax errors
        shell: bash
        run: git ls-files -z -- '*.py' | xargs -0 -r python -m py_compile
      - name: Verify retired standalone migration entrypoints
        run: python -m unittest discover -s tests -p test_migrate_admin_capability_grants_schema.py
      - name: Export tracked source for scoped cleanup verification
        # Temporary transport for this PR; never includes .git or untracked credentials.
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 343
        shell: bash
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/script-cleanup-source.tar"
      - name: Transfer tracked source snapshot
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 343
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: script-cleanup-source
          path: ${{ runner.temp }}/script-cleanup-source.tar
          if-no-files-found: error
          retention-days: 1
