name: Python syntax and script contracts

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check tracked Python files for syntax errors
        shell: bash
        run: git ls-files -z -- '*.py' | xargs -0 -r python -m py_compile
      - name: Verify retired standalone migration entrypoints
        run: python -m unittest discover -s tests -p test_migrate_admin_capability_grants_schema.py
      - name: Verify validation schema manifest
        run: python -m scripts.verify_validation_schema_manifest
      - name: Verify SQL release reproducibility without rebuilding
        run: python -m scripts.build_validation_schema_release --check

  weekly-report-api:
    name: Weekly report API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports:
          - "127.0.0.1:3307:3306"
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      ACCESS_CONTROL_PROFILE: local_auth
      ENABLE_ADMIN_AUTH: "true"
      DB_HOST: 127.0.0.1
      DB_PORT: "3307"
      DB_USER: root
      DB_SSL_MODE: disabled
      DB_DATABASE: lu_test_weekly_${{ github.run_id }}_${{ github.run_attempt }}
      LABOR_UNION_TEST_MYSQL_HOST: 127.0.0.1
      LABOR_UNION_TEST_MYSQL_PORT: "3307"
      LABOR_UNION_TEST_MYSQL_USER: root
      LABOR_UNION_TEST_MYSQL_DATABASE: lu_test_weekly_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install declared runtime and test dependencies
        id: dependencies
        run: python -m pip install -r requirements.txt 'pytest>=8.0' 'httpx2==2.10.0'
      - name: Initialize random credentials for this disposable MySQL service
        id: database
        run: |
          python - <<'PY'
          import os
          import secrets
          import pymysql
          password = secrets.token_urlsafe(32)
          print(f"::add-mask::{password}")
          connection = pymysql.connect(host='127.0.0.1', port=3307, user='root', password='', autocommit=True)
          try:
              with connection.cursor() as cursor:
                  for host in ('%', 'localhost'):
                      cursor.execute("ALTER USER 'root'@%s IDENTIFIED BY %s", (host, password))
          finally:
              connection.close()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write(f'DB_PASSWORD={password}\n')
              environment.write(f'LABOR_UNION_TEST_MYSQL_PASSWORD={password}\n')
          PY
      - name: Run weekly report contracts with real imports
        run: >-
          python -m pytest -q
          tests/test_weekly_operations_report_contract.py
          tests/test_weekly_operations_report_totals.py
          tests/test_weekly_operations_report_api_versions.py
      - name: Run session-authenticated API and export against MySQL
        if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        run: python -m pytest -q tests/test_weekly_operations_report_mysql.py
      - name: Run canonical scheduling to weekly report MySQL regression
        if: ${{ !cancelled() && steps.database.outcome == 'success' }}
        run: >-
          python -m pytest -q
          tests/global/integration/test_historical_restart_to_weekly_report_mysql.py
          -k test_historical_restart_reenters_canonical_scheduling_and_weekly_report

  weekly-report-frontend:
    name: Weekly report frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui_react
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install locked frontend dependencies without lifecycle hooks
        id: dependencies
        run: |
          node --version
          npm --version
          npm ci --ignore-scripts
      - name: Run weekly report client and React tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: >-
          npm test --
          src/tests/weekly_operations_report_client.test.ts
          src/tests/reports_query_page.test.tsx
          src/tests/reports_weekly_service_display.test.tsx
          src/tests/reports_entry_cross_owner_cutover.test.tsx
          src/tests/reports_weekly_totals.test.tsx
          src/tests/reports_weekly_api_versions.test.tsx
      - name: Typecheck and build complete frontend
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build

  # One-time repair for this authorized PR only; removed after the generated commit.
  regenerate-pr349-release:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.number == 349 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/weekly-report-totals-all-statuses-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Regenerate and publish only the confirmed release-header drift
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path
          from scripts.build_validation_schema_release import main
          path = Path('db/releases/labor_union_validation_schema_v1.sql')
          before = path.read_text(encoding='utf-8')
          assert main() == 0
          after = path.read_text(encoding='utf-8')
          expected = before.replace(
              '-- Release: labor-union-validation-schema-2026-09-22-v38\n',
              '-- Release: labor-union-validation-schema-2026-09-22-v39\n',
              1,
          )
          assert after == expected, 'release drift exceeds the confirmed header-only change'
          PY
          python -m scripts.build_validation_schema_release --check
          git diff --check
          if git diff --quiet; then exit 0; fi
          test "$(git diff --name-only)" = 'db/releases/labor_union_validation_schema_v1.sql'
          git add -- db/releases/labor_union_validation_schema_v1.sql
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(db): regenerate validation SQL release with current manifest version'
          git push origin HEAD:refs/heads/feat/weekly-report-totals-all-statuses-20260923
