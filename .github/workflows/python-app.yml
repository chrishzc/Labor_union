name: Python syntax

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check tracked Python files for syntax errors
        shell: bash
        run: git ls-files -z -- '*.py' | xargs -0 -r python -m py_compile
      - name: Temporary read-only P1 reference audit
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          import subprocess

          needles = (
              "DataBrowserPage", "api.routes.clients", "api/routes/clients.py", "/api/v1/clients",
              "client_full_list_endpoint_retired", "client_identity_status_direct_update_retired",
              "api.routes.schedule", "api/routes/schedule.py", "/api/v1/schedule/save",
              "SaveScheduleRequest", "ScheduleDateItem", "api.schemas.schedule", "api/schemas/schedule.py",
              "legacy_daily_schedule_writer_retired", "patch_data_browser_row",
              "preview_source_correction", "apply_source_correction", "data_browser_write_retired",
              "create_or_get_match_record", "legacy_match_record_writer_retired", "MatchCreateRequest",
          )
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          print("AUDIT_COMMIT", subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip())
          for path in paths:
              if not path or path == ".github/workflows/python-app.yml" or Path(path).name in {"package-lock.json", "uv.lock"}:
                  continue
              if Path(path).suffix not in {".py", ".ts", ".tsx", ".js", ".jsx", ".css", ".html", ".md", ".json", ".toml", ".yml", ".yaml"}:
                  continue
              text = Path(path).read_text(encoding="utf-8")
              hits = {needle: [i for i, line in enumerate(text.splitlines(), 1) if needle in line] for needle in needles if needle in text}
              if path.endswith(".py"):
                  for node in ast.walk(ast.parse(text, filename=path)):
                      if isinstance(node, ast.ImportFrom) and node.module == "api.routes":
                          for alias in node.names:
                              if alias.name in {"clients", "schedule", "match_records", "data_browser_admin"}:
                                  hits.setdefault("import:" + alias.name, []).append(node.lineno)
                      if isinstance(node, ast.ImportFrom) and node.module == "api.schemas":
                          for alias in node.names:
                              if alias.name == "schedule":
                                  hits.setdefault("import:schedule_schema", []).append(node.lineno)
              if path.startswith("ui_react/src/") and "/tests/" not in path:
                  for loader in ("import.meta.glob", "require.context"):
                      if loader in text:
                          hits[loader] = [i for i, line in enumerate(text.splitlines(), 1) if loader in line]
              if path.startswith("document/架構重整/01_規格基線/") and "410" in text:
                  hits["410"] = [i for i, line in enumerate(text.splitlines(), 1) if "410" in line]
              if hits:
                  print(json.dumps({"path": path, "matches": hits}, ensure_ascii=False, sort_keys=True))
          print("AUDIT_END")
          PY
