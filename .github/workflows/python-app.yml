name: Python syntax

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check tracked Python files for syntax errors
        shell: bash
        run: git ls-files -z -- '*.py' | xargs -0 -r python -m py_compile
      - name: Verify retired standalone migration entrypoints
        run: python -m unittest discover -s tests -p test_migrate_admin_capability_grants_schema.py
      - name: Inspect isolated command dependencies
        # Temporary scoped read-only inspection; removed after the cleanup.
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          import subprocess

          paths = [Path(p) for p in subprocess.check_output(["git", "ls-files", "-z"], text=True).split("\0") if p]
          texts = {}
          for path in paths:
              if path.suffix.lower() in {".py", ".md", ".json", ".jsonl", ".yaml", ".yml", ".toml", ".ps1", ".sh", ".bat", ".ts", ".tsx"}:
                  try:
                      texts[path.as_posix()] = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      pass
          scripts = {}
          for path, source in texts.items():
              if not path.startswith(("scripts/", "tools/")) or "/migration_artifacts/" in path:
                  continue
              if not path.endswith(".py"):
                  if "lu_test" in source:
                      print("SHELL " + path)
                  continue
              tree = ast.parse(source)
              imports = [ast.unparse(n) for n in ast.walk(tree) if isinstance(n, (ast.Import, ast.ImportFrom))]
              definitions = [[n.name, n.lineno, n.end_lineno] for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))]
              guards = [[n.lineno, n.end_lineno] for n in tree.body if isinstance(n, ast.If) and "__name__" in ast.unparse(n.test) and "__main__" in ast.unparse(n.test)]
              markers = [i for i, line in enumerate(source.splitlines(), 1) if "lu_test" in line or "require_test" in line or "ensure_test" in line]
              scripts[path] = {"path": path, "markers": markers, "imports": imports, "definitions": definitions, "guards": guards}
          selected = {p for p, item in scripts.items() if item["markers"]}
          while True:
              added = {p for p, item in scripts.items() if any(Path(s).stem in "\n".join(item["imports"]) for s in selected)} - selected
              if not added:
                  break
              selected.update(added)
          for path, item in sorted(scripts.items()):
              if path in selected:
                  print("CANDIDATE " + json.dumps(item, ensure_ascii=True))
              elif item["guards"] or any(d[0] == "main" for d in item["definitions"]):
                  print("OTHER_COMMAND " + json.dumps({"path": path, "imports": item["imports"]}, ensure_ascii=True))
          for command in sorted(selected):
              refs = []
              stem = Path(command).stem
              for path, source in texts.items():
                  if path == command:
                      continue
                  lines = [i for i, line in enumerate(source.splitlines(), 1) if stem in line]
                  if lines:
                      refs.append({"path": path, "lines": lines})
              print("REFERENCES " + json.dumps({"command": command, "references": refs}, ensure_ascii=True))
          PY
