name: Python syntax

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check tracked Python files for syntax errors
        shell: bash
        run: git ls-files -z -- '*.py' | xargs -0 -r python -m py_compile
      - name: Verify exact cleanup scope and retained handlers
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import subprocess
          from pathlib import Path
          baseline = '8b337055311d4d667bbbb74e8b612759367496b4'
          expected = {
              'ui_react/src/pages/SystemStatusPage.tsx',
              'ui_react/src/pages/SystemStatusPage.css',
              'ui_react/src/tests/system_status_entry_identity.test.tsx',
              'ui_react/src/tests/domains/global/subsystems/application-shell/modules/react-application-shell/system_status_entry_cutover.test.tsx',
              '.github/workflows/python-app.yml',
          }
          actual = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only', '-z', baseline, 'HEAD'], text=True).split('\0')))
          assert actual == expected, (actual - expected, expected - actual)
          for name in expected - {'.github/workflows/python-app.yml'}:
              if not name.endswith('system_status_entry_cutover.test.tsx'):
                  assert not Path(name).exists(), name
          hits = []
          for name in subprocess.check_output(['git', 'ls-files', '-z', '--', 'ui_react'], text=True).split('\0'):
              path = Path(name)
              if name and path.suffix in {'.ts', '.tsx', '.js', '.css', '.json', '.html'} and path.name != 'package-lock.json':
                  if 'SystemStatusPage' in path.read_text(encoding='utf-8'):
                      hits.append(name)
          assert not hits, hits
          print('PASS exact four-file cleanup, removed page and no remaining page references')
          for name, functions in {
              'api/routes/client_payments.py': ('create_client_transaction', 'backfill_client_payment_due_dates'),
              'api/routes/staff_payments.py': ('create_staff_transaction',),
              'api/routes/line_reviews.py': ('retired_line_review_route',),
          }.items():
              source = Path(name).read_text(encoding='utf-8')
              assert source == subprocess.check_output(['git', 'show', baseline + ':' + name], text=True), name
              definitions = {n.name: n for n in ast.parse(source).body if isinstance(n, ast.FunctionDef)}
              for function in functions:
                  calls = [node for stmt in definitions[function].body for node in ast.walk(stmt) if isinstance(node, ast.Call)]
                  assert len(calls) == 1, (name, function)
                  call = calls[0]
                  assert isinstance(call.func, ast.Name) and call.func.id == 'HTTPException', function
                  assert any(k.arg == 'status_code' and isinstance(k.value, ast.Constant) and k.value.value == 410 for k in call.keywords), function
                  print('PASS retained handler static body: only HTTP 410 exception', name, function)
          for name in ('ui_react/src/App.tsx', 'ui_react/src/components/MasterLayout.tsx', 'ui_react/src/api/system/system_status_client.ts', 'ui_react/package.json', 'ui_react/package-lock.json', 'api/main.py'):
              assert Path(name).read_bytes() == subprocess.check_output(['git', 'show', baseline + ':' + name]), name
          print('PASS current shell, snapshot client, API mounting and package files unchanged')
          PY
          git diff --check 8b337055311d4d667bbbb74e8b612759367496b4 HEAD
      - name: Build current React application with existing lockfile
        working-directory: ui_react
        shell: bash
        run: |
          node --version
          npm --version
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Run retained system status query and shell tests
        working-directory: ui_react
        shell: bash
        run: npm test -- src/tests/domains/global/subsystems/application-shell/modules/react-application-shell/system_status_entry_cutover.test.tsx --maxWorkers=2 --minWorkers=1
      - name: Verify validation did not modify tracked files
        shell: bash
        run: |
          git diff --exit-code
          git diff --check
          git status --short
          git rev-parse HEAD
