name: Python syntax

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 20
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check tracked Python files for syntax errors
        shell: bash
        run: git ls-files -z -- '*.py' | xargs -0 -r python -m py_compile
      - name: Verify exact scope preserved contracts and entry documentation
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import re
          import subprocess
          from pathlib import Path
          baseline = 'be3dcdb435ea20067b39070b432fca1babed415e'
          doc = 'document/架構重整/01_規格基線/19_Global_Entry_Point_Governance.md'
          expected = {'api/routes/data_browser_admin.py', 'api/schemas/data_browser.py', 'subsystems/access/data_browser_maintenance.py', 'scripts/api_contract_smoke.py', 'tests/test_data_browser_admin_route.py', 'tests/test_api_contract_smoke.py', doc, '.github/workflows/python-app.yml'}
          actual = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only', '-z', baseline, 'HEAD'], text=True).split('\0')))
          assert actual == expected, (actual - expected, expected - actual)
          print('PASS exact seven-file source/test/document scope plus temporary CI')
          def old(path):
              return subprocess.check_output(['git', 'show', baseline + ':' + path], text=True)
          def definitions(source):
              return {n.name: ast.dump(n, include_attributes=False) for n in ast.parse(source).body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))}
          for path, names in {
              'api/routes/data_browser_admin.py': ['get_data_browser_source'],
              'subsystems/access/data_browser_maintenance.py': ['query_data_browser_source'],
              'api/schemas/data_browser.py': ['_StrictQueryModel', 'DataBrowserCellView', 'DataBrowserRowView', 'DataBrowserPageView'],
          }.items():
              before, after = definitions(old(path)), definitions(Path(path).read_text(encoding='utf-8'))
              for name in names:
                  assert before[name] == after[name], (path, name)
              print('PASS preserved archive contract', path)
          path = 'scripts/api_contract_smoke.py'
          before, after = definitions(old(path)), definitions(Path(path).read_text(encoding='utf-8'))
          assert before.keys() == after.keys()
          assert all(before[name] == after[name] for name in before if name != '_expand_operations')
          print('PASS generic smoke runner behavior unchanged outside expansion')
          removed = {'get_data_browser_table_schema', 'DataBrowserTableResponse', 'DataBrowserPatchRequest', 'DataBrowserSourceCorrectionPreviewRequest', 'DataBrowserSourceCorrectionApplyRequest', 'DataBrowserCorrectionValue', 'DataBrowserFieldChangeView', 'DataBrowserSourceCorrectionPreviewView', 'DataBrowserSourceCorrectionReceiptView', 'DATA_BROWSER_PATH', 'DATA_BROWSER_TABLES'}
          constants = {'ALLOWED_TABLES', 'EDITABLE_COLUMNS', 'READ_ONLY_TABLES', 'COLUMN_VALID_OPTIONS'}
          for path in subprocess.check_output(['git', 'ls-files', '-z', '--', '*.py'], text=True).split('\0'):
              if not path:
                  continue
              tree = ast.parse(Path(path).read_text(encoding='utf-8'))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Name):
                      assert node.id not in removed, (path, node.lineno, node.id)
                  elif isinstance(node, ast.alias):
                      assert node.name not in removed, (path, node.name)
                  elif isinstance(node, ast.ImportFrom) and node.module == 'subsystems.access.data_browser_maintenance':
                      assert not (constants & {item.name for item in node.names}), path
                  elif isinstance(node, ast.Attribute) and isinstance(node.value, ast.Name) and node.value.id == 'data_browser_maintenance':
                      assert node.attr not in constants, path
          print('PASS no remaining removed Python symbol consumers')
          section = Path(doc).read_text(encoding='utf-8').split('## 2. Current React entries', 1)[1].split('## 3.', 1)[0]
          documented = set(re.findall(r'^- `([^`]+)`', section, re.M))
          layout = Path('ui_react/src/components/MasterLayout.tsx').read_text(encoding='utf-8')
          nav = set(re.findall(r"\{ id: '([^']+)'", layout))
          app = Path('ui_react/src/App.tsx').read_text(encoding='utf-8')
          rendered = set(re.findall(r"currentPage === '([^']+)'", app))
          assert documented == nav == rendered, (documented, nav, rendered)
          print('PASS documented navigation/render identities', len(documented))
          PY
          git diff --check be3dcdb435ea20067b39070b432fca1babed415e HEAD
          git diff --exit-code
          printf 'RAW_RETIREMENT_VALIDATION_HEAD '
          git rev-parse HEAD
