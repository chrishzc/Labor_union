name: Python syntax

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check tracked Python files for syntax errors
        shell: bash
        run: git ls-files -z -- '*.py' | xargs -0 -r python -m py_compile
      - name: Verify retired standalone migration entrypoints
        run: python -m unittest discover -s tests -p test_migrate_admin_capability_grants_schema.py
      - name: Inspect remaining command references
        # Temporary read-only inventory; no application imports or database calls.
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          import subprocess

          paths = [Path(p) for p in subprocess.check_output(["git", "ls-files", "-z"], text=True).split("\0") if p]
          texts = {}
          for path in paths:
              if path.suffix.lower() in {".py", ".md", ".json", ".jsonl", ".yaml", ".yml", ".toml", ".ps1", ".sh", ".bat", ".ts", ".tsx"}:
                  try:
                      texts[path] = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      pass
          for path, source in texts.items():
              if path.parts[0] not in {"scripts", "tools"} or "migration_artifacts" in path.parts:
                  continue
              if path.suffix != ".py":
                  if "lu_test" in source:
                      print("SHELL " + str(path))
                  continue
              tree = ast.parse(source)
              main = [node for node in tree.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == "main"]
              guards = [node for node in tree.body if isinstance(node, ast.If) and "__name__" in ast.unparse(node.test) and "__main__" in ast.unparse(node.test)]
              if main or not guards:
                  continue
              print("EXECUTABLE " + json.dumps({"path": str(path), "mentions_lu_test": "lu_test" in source, "guard_spans": [[node.lineno, node.end_lineno] for node in guards]}, ensure_ascii=True))
              for other, text in texts.items():
                  if other == path:
                      continue
                  lines = [number for number, line in enumerate(text.splitlines(), 1) if path.stem in line]
                  if lines:
                      print("REFERENCE " + json.dumps({"command": str(path), "path": str(other), "lines": lines}, ensure_ascii=True))
          for name in ("migrate_admin_capability_grants_schema", "migrate_case_architecture_bootstrap_receipt_version_contract", "migrate_leave_substitution_holiday_only_batch_contract"):
              for path, text in texts.items():
                  lines = [number for number, line in enumerate(text.splitlines(), 1) if name in line]
                  if lines:
                      print("RETIRED_REFERENCE " + json.dumps({"name": name, "path": str(path), "lines": lines}, ensure_ascii=True))
          PY
