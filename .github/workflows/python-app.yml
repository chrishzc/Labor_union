name: Python syntax

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 15
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check tracked Python files for syntax errors
        shell: bash
        run: git ls-files -z -- '*.py' | xargs -0 -r python -m py_compile
      - name: Run unchanged-style inventory and Stage 6 tests with stdlib unittest
        shell: bash
        run: |
          python - <<'PY'
          import inspect
          import runpy
          import unittest
          paths = (
              'tests/test_launcher_inventory.py',
              'tests/domains/external-integration/subsystems/line/infrastructure/test_line_schema_stage6.py',
          )
          suite = unittest.TestSuite()
          for path in paths:
              namespace = runpy.run_path(path)
              for name, function in sorted(namespace.items()):
                  if name.startswith('test_') and inspect.isfunction(function):
                      assert not inspect.signature(function).parameters, (path, name)
                      suite.addTest(unittest.FunctionTestCase(function, description=path + ':' + name))
          assert suite.countTestCases() == 5
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Verify exact scope, preserved LINE behavior and documentation sections
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import re
          import subprocess
          from pathlib import Path
          baseline = '17ce7d6a7ae69436c1a16bd43d2dfd85074a709c'
          doc = 'document/架構重整/01_規格基線/12_Global_效能與UX體感架構.md'
          launcher = 'scripts/launchers/start_fastapi_ngrok.py'
          expected = {
              launcher, 'tests/test_development_launcher_commands.py',
              'tests/test_launcher_inventory.py',
              'tests/domains/external-integration/subsystems/line/infrastructure/test_line_schema_stage6.py',
              'line/line_bot.py', doc, '.github/workflows/python-app.yml',
          }
          actual = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only', '-z', baseline, 'HEAD'], text=True).split('\0')))
          assert actual == expected, (actual - expected, expected - actual)
          def old(path):
              return subprocess.check_output(['git', 'show', baseline + ':' + path], text=True)
          assert not Path(launcher).exists()
          assert not Path('tests/test_development_launcher_commands.py').exists()
          subprocess.run(['git', 'cat-file', '-e', baseline + ':' + launcher], check=True)
          print('PASS exact six-file scope and baseline retired-file witness')
          before = ast.parse(old('line/line_bot.py'))
          before.body = [node for node in before.body if not (
              isinstance(node, ast.FunctionDef) and node.name == '_notify_development_reviewer'
              or isinstance(node, ast.Import) and [item.name for item in node.names] == ['requests']
          )]
          after = ast.parse(Path('line/line_bot.py').read_text(encoding='utf-8'))
          assert ast.dump(before, include_attributes=False) == ast.dump(after, include_attributes=False)
          print('PASS all retained LINE module statements/handlers unchanged in AST')
          roots = ('scripts/', 'tests/', 'api/', 'line/', 'config/', 'subsystems/', 'infrastructure/', 'ui_react/', '.arch-map/')
          retired = re.compile(r'start_fastapi_ngrok|ngrok-development|DevLineConsoleReviewer|DevReviewNotificationServer|run_streamlit|DEV_REVIEW_NOTIFY_URL|ENABLE_LINE_REVIEW_CONSOLE|_notify_development_reviewer')
          hits = []
          for name in subprocess.check_output(['git', 'ls-files', '-z'], text=True).split('\0'):
              path = Path(name)
              if not name.startswith(roots) or path.suffix not in {'.py', '.sh', '.bat', '.ps1', '.json', '.yaml', '.yml', '.md', '.ts', '.tsx', '.toml'} or path.name == 'package-lock.json':
                  continue
              if name == 'tests/test_launcher_inventory.py':
                  continue
              if retired.search(path.read_text(encoding='utf-8')):
                  hits.append(name)
          assert not hits, hits
          print('PASS no retained targeted supervisor/helper references beyond negative inventory assertions')
          for name in (
              'scripts/launcher_preflight.py', 'scripts/launchers/README.md',
              'scripts/launchers/start_local_development.bat', 'scripts/launchers/start_local_development.sh',
              'scripts/launchers/supervise_local_runtime.ps1', 'scripts/run_line_worker.py',
              'scripts/run_service_monitor.py', 'api/main.py', 'ui_react/src/App.tsx',
              'ui_react/src/components/MasterLayout.tsx', 'tests/test_launcher_dry_run.py',
              'uv.lock', 'ui_react/package.json', 'ui_react/package-lock.json',
          ):
              assert Path(name).read_bytes() == subprocess.check_output(['git', 'show', baseline + ':' + name]), name
          print('PASS standard launchers, workers, shell, API mounts and dependency files unchanged')
          preflight = ast.parse(Path('scripts/launcher_preflight.py').read_text(encoding='utf-8'))
          profiles = next(ast.literal_eval(node.value) for node in preflight.body if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'PROFILE_REQUIREMENTS' for t in node.targets))
          assert 'ngrok-development' not in profiles
          assert 'streamlit' not in repr(profiles).lower()
          assert {'local-windows', 'local-unix', 'dual-run'} <= profiles.keys()
          def sections(text):
              chunks = re.split(r'(?=^#{2,3} \d)', text, flags=re.M)
              return {re.match(r'^#{2,3} (\d+(?:\.\d+)?)', part).group(1): part for part in chunks if re.match(r'^#{2,3} \d', part)}
          previous, current = sections(old(doc)), sections(Path(doc).read_text(encoding='utf-8'))
          assert previous.keys() == current.keys()
          for section in previous.keys() - {'2', '2.1', '3.3', '3.4', '9', '10'}:
              assert previous[section] == current[section], section
          assert current['2'] == previous['2'].replace('browser／Streamlit interaction timing', 'browser／React interaction timing')
          assert current['10'] == previous['10'].replace('Streamlit 先完成 skeleton／placeholder', 'React 元件沿用 skeleton／placeholder')
          assert current['9'] == previous['9'].replace(
              '- UX 收斂進度（2026-08-26）：LINE Rich Menu',
              '- UX 收斂進度（2026-08-26；其中 Data Browser／System Status 的舊頁面描述已由 §3.4／§2.1\n  的現行入口取代，不構成復活舊頁面的要求）：LINE Rich Menu')
          assert '19_Global_Entry_Point_Governance.md' in current['2.1']
          assert 'GET /api/v1/system/status/performance-snapshot' in current['2.1']
          assert '33_案件與月嫂整合名冊正式規格.md' in current['3.4']
          assert '#data-browser' in current['3.4'] and '客戶名冊' in current['3.4']
          print('PASS bounded documentation changes and retained unrelated contracts')
          print('VALIDATED_CHECKOUT', subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip())
          PY
          bash -n scripts/launchers/start_local_development.sh
          bash -n scripts/launchers/start_local_development_no_auth.sh
          git diff --check 17ce7d6a7ae69436c1a16bd43d2dfd85074a709c HEAD
          git diff --exit-code
          git status --short
