# This workflow installs Python dependencies, validates repository governance,
# audits the test inventory, and runs the fixed regression suite on every main push / pull request.

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all other lint findings as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Validate Agent governance routing
      if: ${{ always() }}
      run: python scripts/validate_agent_governance.py

  test-suite-audit:
    name: test suite audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Audit pytest inventory
      run: python scripts/audit_test_suite.py

  regression-tests:
    name: regression suite (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run fixed regression shard
      env:
        SHARD_INDEX: ${{ matrix.shard }}
        SHARD_COUNT: 8
      shell: bash
      run: |
        set -euo pipefail
        mapfile -t all_test_files < <(
          find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) | sort
        )
        selected_test_files=()
        for index in "${!all_test_files[@]}"; do
          if (( index % SHARD_COUNT == SHARD_INDEX - 1 )); then
            selected_test_files+=("${all_test_files[$index]}")
          fi
        done
        echo "pytest files total: ${#all_test_files[@]}"
        echo "pytest files in shard ${SHARD_INDEX}/${SHARD_COUNT}: ${#selected_test_files[@]}"
        if (( ${#selected_test_files[@]} == 0 )); then
          echo "No pytest files selected for shard ${SHARD_INDEX}/${SHARD_COUNT}" >&2
          exit 1
        fi
        python -m pytest -q --strict-markers -m "not integration" "${selected_test_files[@]}"

  shared-kernel-contract-tests:
    name: shared kernel contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run shared kernel regression contracts
      run: |
        python -m pytest -q \
          tests/test_shared_kernel_regression_contracts.py \
          tests/test_shared_kernel_job_contracts.py

  canonical-tests:
    name: canonical tests (${{ matrix.owner }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - owner: orders
            path: tests/domains/orders/subsystems/orders
          - owner: scheduling
            path: tests/domains/scheduling/subsystems/scheduling
          - owner: client-finance
            path: tests/domains/client-finance/subsystems/client-finance
          - owner: staff-payables
            path: tests/domains/staff-payables/subsystems/staff-payables
          - owner: anomalies
            path: tests/domains/anomalies/subsystems/anomalies
          - owner: payroll
            path: tests/domains/payroll/subsystems/payroll
          - owner: finance-import
            path: tests/domains/finance-import/subsystems/finance-import
          - owner: government-subsidy
            path: tests/domains/government-subsidy/subsystems/government-subsidy
          - owner: case-import
            path: tests/subsystems/case_import
          - owner: access
            path: tests/domains/external-integration/subsystems/access
          - owner: line
            path: tests/domains/external-integration/subsystems/line
          - owner: contract-signing
            path: tests/domains/contract-signing/subsystems/contract-signing

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Collect ${{ matrix.owner }} owner-local tests
      run: python -m pytest --collect-only -q "${{ matrix.path }}"
    - name: Run ${{ matrix.owner }} owner-local tests
      run: python -m pytest -q "${{ matrix.path }}"

  cross-domain-boundary-tests:
    name: cross-domain workflow boundaries
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Collect preserved cross-domain workflows
      run: |
        python -m pytest --collect-only -q \
          tests/test_order_cancellation_workflow.py \
          tests/test_order_terms_preassignment_correction.py \
          tests/test_contract_completion_workflow.py
    - name: Run preserved cross-domain workflows
      run: |
        python -m pytest -q \
          tests/test_order_cancellation_workflow.py \
          tests/test_order_terms_preassignment_correction.py \
          tests/test_contract_completion_workflow.py
