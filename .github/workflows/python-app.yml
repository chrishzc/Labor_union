name: Python syntax

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check tracked Python files for syntax errors
        shell: bash
        run: git ls-files -z -- '*.py' | xargs -0 -r python -m py_compile
      - name: Verify consolidated M4 regressions (temporary)
        run: python -m unittest discover -s tests/domains/external-integration/subsystems/line/subsystems -p test_line_m4_continuation_regressions.py -v
      - name: Verify friend and feedback regressions (temporary)
        run: python -m unittest discover -s tests/domains/external-integration/subsystems/line/subsystems -p test_line_friend_feedback_regressions.py -v
      - name: Verify delivery and friend projection regressions (temporary)
        run: python -m unittest discover -s tests/domains/external-integration/subsystems/line/subsystems -p test_line_delivery_friend_regressions.py -v
      - name: Verify existing alert delivery contracts (temporary)
        run: |
          python - <<'PY'
          import runpy
          tests = runpy.run_path('tests/domains/external-integration/subsystems/line/modules/complaint-ingress/contract/test_human_escalation_delivery.py')
          tests['test_masked_alert_is_projected_then_canonical_delivery_records_provider_outcome']()
          tests['test_missing_target_is_a_durable_manual_fallback']()
          print('2 existing alert delivery contract tests passed')
          PY
