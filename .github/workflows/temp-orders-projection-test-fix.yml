name: Temporary Orders projection test fix

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply and commit exact regression fixes
        run: python scripts/apply_orders_projection_test_fix.py
