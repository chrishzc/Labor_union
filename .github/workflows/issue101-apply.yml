name: Issue 101 canonical data cutover

# Trigger the verified #101 cutover against the latest main checkout.
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/issue101-apply.yml"
      - ".github/issue101_payload.b64"
      - ".github/issue101_post_transform.sh"
      - ".github/issue101_cutover.sh"

permissions:
  contents: write

concurrency:
  group: issue-101-canonical-data-cutover
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui_react/package-lock.json

      - name: Apply, verify, and commit Issue 101
        shell: bash
        run: |
          cp .github/issue101_cutover.sh /tmp/issue101_cutover.sh
          cp .github/issue101_post_transform.sh /tmp/issue101_post_transform.sh
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/issue101_post_transform.sh')
          text = path.read_text(encoding='utf-8')
          old = """        (\"await expect(weeklyOperationsReportQueryClient.query('2026-08-17')).rejects.toThrow('未遮罩');\", \"await expect(weeklyOperationsReportQueryClient.query('2026-08-17')).resolves.toBeDefined();\"),"""
          new = """        (\"await expect(weeklyOperationsReportQueryClient.query('2026-08-20', '2026-08-26')).rejects.toThrow('未遮罩');\", \"await expect(weeklyOperationsReportQueryClient.query('2026-08-20', '2026-08-26')).resolves.toBeDefined();\"),"""
          if text.count(old) != 1:
              raise RuntimeError('weekly operations canonical assertion transform changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          sed -i 's#bash .github/issue101_post_transform.sh#bash /tmp/issue101_post_transform.sh#' /tmp/issue101_cutover.sh
          sed -i 's#git push origin HEAD:main#git push origin HEAD:issue101-canonical-cutover-direct#' /tmp/issue101_cutover.sh
          bash /tmp/issue101_cutover.sh
