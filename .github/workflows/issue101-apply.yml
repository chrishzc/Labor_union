name: Issue 101 canonical data cutover

# Trigger the verified #101 cutover against the latest main checkout.
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/issue101-apply.yml"
      - ".github/issue101_payload.b64"
      - ".github/issue101_post_transform.sh"
      - ".github/issue101_cutover.sh"

permissions:
  contents: write

concurrency:
  group: issue-101-canonical-data-cutover
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui_react/package-lock.json

      - name: Apply, verify, and commit Issue 101
        shell: bash
        run: |
          sed -i 's#git push origin HEAD:main#git push origin HEAD:issue101-canonical-cutover-direct#' .github/issue101_cutover.sh
          bash .github/issue101_cutover.sh
