name: Issue 218 receipt refresh

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/issue218-receipt-refresh.yml']

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.number == 236 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/issue-218-intake-boundaries-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Regenerate only provenance and run existing focused assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          import runpy
          import subprocess
          from scripts.generate_task97_commit_dispositions import (
              EVIDENCE_PATH, SOURCE_REVISION_INPUTS, build_artifact,
          )
          subprocess.run([
              'git', 'diff', '--exit-code',
              'c6d817dcd67f175bafbb432a93ee89d01782c789', 'HEAD',
              '--', *SOURCE_REVISION_INPUTS,
          ], check=True)
          old = json.loads(EVIDENCE_PATH.read_text(encoding='utf-8'))
          new = build_artifact()
          assert old['source_revision'] == '3cda784705693d31567f853b30ac718b0dc19d65'
          assert new['source_revision'] == 'be88347770404353ec40018e837bad175b49b3d3'
          expected = copy.deepcopy(old)
          expected['source_revision'] = new['source_revision']
          for entry in expected['entries']:
              suffix = '; source_revision=' + old['source_revision']
              assert entry['terminal_receipt'].endswith(suffix)
              entry['terminal_receipt'] = (
                  entry['terminal_receipt'][:-len(suffix)]
                  + '; source_revision=' + new['source_revision']
              )
          assert new == expected, 'Unexpected semantic change: do not publish receipt'
          EVIDENCE_PATH.write_text(json.dumps(new, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          tests = runpy.run_path('tests/test_task97_commit_dispositions.py')
          for name, test in tests.items():
              if name.startswith('test_') and callable(test):
                  test()
                  print('PASS:', name)
          print('source_revision:', new['source_revision'])
          print('candidate_count:', new['candidate_count'])
          print('classification_counts:', new['classification_counts'])
          print('terminal_status:', new['terminal_status'])
          print('scan_fingerprint:', new['scan_fingerprint'])
          PY
          git diff --check
          git diff --stat
          echo "parent_commit=$(git rev-parse HEAD)"
          echo "base_tree=$(git rev-parse 'HEAD^{tree}')"
      - name: Store verified artifact blob without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen
          path = Path('document/架構重整/03_追蹤清單與證據/evidence/task97_repository_commit_dispositions_v1.json')
          raw = path.read_bytes()
          body = json.dumps({'content': raw.decode('utf-8'), 'encoding': 'utf-8'}).encode()
          request = Request(
              'https://api.github.com/repos/chrishzc/Labor_union/git/blobs',
              data=body, method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
              },
          )
          with urlopen(request, timeout=30) as response:
              result = json.load(response)
          expected_sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert result['sha'] == expected_sha
          print('artifact_blob_sha=' + result['sha'])
          PY
