name: Lane1 issue 222 focused verification

on:
  push:
    branches:
      - fix/issue-222-finance-review-list

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply minimal source patch
        run: python .github/lane1_issue222_patch.py
      - name: Install Python project and pytest
        run: python -m pip install -e . pytest
      - name: Fresh finance-import owner tests
        run: python -m pytest tests/domains/finance-import/subsystems/finance-import -q
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install React dependencies
        working-directory: ui_react
        run: npm ci
      - name: Focused Finance UI tests
        working-directory: ui_react
        run: npm test -- src/tests/finance_source_review_list.test.tsx src/tests/finance_query_page.test.tsx src/tests/finance_entry_cutover.test.tsx
      - name: React typed build
        working-directory: ui_react
        run: npm run build
      - name: Commit verified product diff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui_react/src/pages/FinancePage.tsx ui_react/src/tests/finance_source_review_list.test.tsx
          git rm .github/lane1_issue222_patch.py .github/workflows/lane1-issue222-once.yml
          git diff --cached --check
          git commit -m "fix(finance): wire manual review owner readback (#222)"
          git push
