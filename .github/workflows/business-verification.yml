name: Scoped fixture corrections and subsidy comparison
on:
  push:
    branches: [verify/business-regression-7e12a3e-20260922]
permissions:
  contents: read
jobs:
  verification:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: staff-retirement
            source: 7e12a3e5b605261311f6339ffe01fb8f13b06b09
            database: lu_test_v_ret
            user: root
            prepare: false
            test: tests/domains/external-integration/subsystems/line/integration/test_staff_retirement_notification_disposable_mysql.py
          - mode: leave-uow
            source: 7e12a3e5b605261311f6339ffe01fb8f13b06b09
            database: lu_test_phase3b2_verify
            user: root
            prepare: false
            test: tests/test_leave_substitution_outer_uow_disposable_mysql_e2e.py
          - mode: replacement-r02
            source: 7e12a3e5b605261311f6339ffe01fb8f13b06b09
            database: lu_test_task96_ldu_candidate_1012_r1
            user: root
            prepare: true
            test: tests/domains/scheduling/subsystems/scheduling/modules/service-before-replacement/integration/test_service_before_replacement_mysql_adapter.py
          - mode: unsigned-contract-o2
            source: 7e12a3e5b605261311f6339ffe01fb8f13b06b09
            database: lu_test_contract_o2_candidate_1005_u3
            user: root
            prepare: true
            test: tests/integration/test_contract_unsigned_pdf_mysql_adapter.py
          - mode: finance-react-parity
            source: 7e12a3e5b605261311f6339ffe01fb8f13b06b09
            database: lu_test_v_finreact
            user: root
            prepare: true
            test: tests/test_finance_import_staging_persistent_mysql_e2e.py::test_workbook_api_preview_reaches_react_without_formal_posting
          - mode: line-query-g7
            source: 7e12a3e5b605261311f6339ffe01fb8f13b06b09
            database: lu_test_v_g7
            user: verification_app
            prepare: false
            test: tests/test_line_delivery_public_query_route.py::test_delivery_query_g7_uses_production_app_and_real_repository
          - mode: subsidy-before-cleanup
            source: aa7acaa88d59f40cad2d9b0b1f2cfc44a76634d6
            database: lu_test_v_subsidy
            user: root
            prepare: false
            test: tests/test_government_subsidy_durable_mysql_e2e.py::test_government_subsidy_claim_plan_durable_crash_recovery_and_duplicate_apply
    env:
      APP_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: '33306'
      DB_USER: ${{ matrix.user }}
      DB_PASSWORD: verification-only
      DB_DATABASE: ${{ matrix.database }}
      LABOR_UNION_TEST_MYSQL_HOST: 127.0.0.1
      LABOR_UNION_TEST_MYSQL_PORT: '33306'
      LABOR_UNION_TEST_MYSQL_USER: ${{ matrix.user }}
      LABOR_UNION_TEST_MYSQL_PASSWORD: verification-only
      LABOR_UNION_TEST_MYSQL_DATABASE: ${{ matrix.database }}
      LINE_CHANNEL_ACCESS_TOKEN: ''
      LINE_CHANNEL_SECRET: ''
      ANONYMIZED_TELEMETRY: 'False'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PROOF_DIR: /tmp/business-proof
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Record source and install the same locked wheel dependencies
        run: |
          mkdir -p "$PROOF_DIR"
          git rev-parse HEAD > "$PROOF_DIR/source-commit.txt"
          python - <<'PY'
          import tomllib
          from pathlib import Path
          from pip._vendor.packaging.markers import Marker
          from pip._vendor.packaging.requirements import Requirement
          lock = tomllib.loads(Path('uv.lock').read_text())
          project = tomllib.loads(Path('pyproject.toml').read_text())
          selected, seen = {}, set()
          pending = [{'name': Requirement(s).name, 'extra': list(Requirement(s).extras)} for s in project['project']['dependencies']]
          pending += [{'name': 'pytest'}, {'name': 'httpx'}]
          while pending:
              dep = pending.pop()
              if dep.get('marker') and not Marker(dep['marker']).evaluate():
                  continue
              candidates = [p for p in lock['package'] if p['name'] == dep['name'] and (not dep.get('version') or p['version'] == dep['version'])]
              candidates = [p for p in candidates if not p.get('resolution-markers') or any(Marker(m).evaluate() for m in p['resolution-markers'])]
              assert len(candidates) == 1, (dep['name'], len(candidates))
              package = candidates[0]
              assert package['source'] == {'registry': 'https://pypi.org/simple'}, package['name']
              key = (package['name'], package['version'], tuple(sorted(dep.get('extra', []))))
              if key in seen:
                  continue
              seen.add(key)
              selected[package['name']] = package
              pending.extend(package.get('dependencies', []))
              for extra in dep.get('extra', []):
                  pending.extend(package.get('optional-dependencies', {}).get(extra, []))
          lines = []
          for name, package in sorted(selected.items()):
              hashes = sorted({wheel['hash'] for wheel in package['wheels']})
              assert hashes and all(h.startswith('sha256:') for h in hashes), name
              lines.append(f"{name}=={package['version']} " + ' '.join('--hash=' + h for h in hashes))
          assert 'graphifyy' not in selected and 'httpx2' not in selected
          Path('/tmp/business-test-requirements.txt').write_text('\n'.join(lines) + '\n')
          print('Locked runtime/test packages:', len(lines))
          PY
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r /tmp/business-test-requirements.txt > "$PROOF_DIR/dependencies.log" 2>&1 || { tail -60 "$PROOF_DIR/dependencies.log"; exit 1; }
      - name: Install existing React dependencies required by the parity case
        if: matrix.mode == 'finance-react-parity'
        working-directory: ui_react
        run: npm ci --ignore-scripts --no-audit --fund=false > "$PROOF_DIR/npm-install.log" 2>&1
      - name: Start the same disposable MySQL image and verify authenticated host TCP
        env:
          MYSQL_ROOT_PASSWORD: verification-only
        run: |
          image=mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
          docker pull "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}' > "$PROOF_DIR/mysql-image.json"
          docker run -d --name business-verification-mysql -p 127.0.0.1:33306:3306 -e MYSQL_ROOT_PASSWORD -e MYSQL_ROOT_HOST=% "$image"
          python - <<'PY'
          import os
          import time
          import pymysql
          deadline = time.monotonic() + 90
          while True:
              try:
                  connection = pymysql.connect(host='127.0.0.1', port=33306, user='root', password=os.environ['DB_PASSWORD'], connect_timeout=2, read_timeout=2)
                  with connection.cursor() as cursor:
                      cursor.execute('SELECT VERSION()')
                      print('Authenticated host TCP ready:', cursor.fetchone()[0])
                  break
              except pymysql.MySQLError:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(2)
          if os.environ['DB_USER'] == 'verification_app':
              with connection.cursor() as cursor:
                  cursor.execute("CREATE USER 'verification_app'@'%%' IDENTIFIED BY %s", (os.environ['DB_PASSWORD'],))
                  cursor.execute("GRANT ALL PRIVILEGES ON `lu_test_line_delivery_public_query_20260820_a1`.* TO 'verification_app'@'%'")
          connection.close()
          PY
      - name: Prepare only the canonical schema explicitly required by this existing test
        if: matrix.prepare
        run: |
          python - <<'PY' > "$PROOF_DIR/schema-setup.log" 2>&1
          import os
          from argparse import Namespace
          from scripts.bootstrap_disposable_mysql_schema import bootstrap
          database = os.environ['DB_DATABASE']
          bootstrap(Namespace(host='127.0.0.1', port=33306, user='root', password=os.environ['DB_PASSWORD'], database=database, confirm_database=database))
          print('Fresh canonical schema prepared on the temporary runner.')
          PY
      - name: Execute the unchanged selected test with its required fixture configuration
        run: |
          set +e
          timeout 420 python -m pytest -q --tb=short --junitxml="$PROOF_DIR/results.xml" '${{ matrix.test }}' > "$PROOF_DIR/results.log" 2>&1
          code=$?
          echo "$code" > "$PROOF_DIR/exit-code.txt"
          tail -80 "$PROOF_DIR/results.log"
          exit "$code"
      - name: Record source state and destroy only the test container
        if: always()
        run: |
          git status --short > "$PROOF_DIR/working-tree-after-tests.txt"
          docker logs business-verification-mysql > "$PROOF_DIR/mysql-container.log" 2>&1 || true
          docker rm -f business-verification-mysql || true
      - name: Upload exact selected-case evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: business-fixture-${{ matrix.mode }}
          path: /tmp/business-proof
          retention-days: 1
          if-no-files-found: error
