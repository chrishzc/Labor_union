name: Remaining synthetic business integration verification
on:
  push:
    branches: [verify/business-regression-7e12a3e-20260922]
permissions:
  contents: read
jobs:
  integration:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [controlled-files, holiday, preserved-database]
    env:
      APP_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: '33306'
      DB_USER: root
      DB_PASSWORD: verification-only
      DB_DATABASE: lu_test_phase3bh_verification
      LABOR_UNION_TEST_MYSQL_HOST: 127.0.0.1
      LABOR_UNION_TEST_MYSQL_PORT: '33306'
      LABOR_UNION_TEST_MYSQL_USER: root
      LABOR_UNION_TEST_MYSQL_PASSWORD: verification-only
      LABOR_UNION_TEST_MYSQL_DATABASE: lu_test_phase3bh_verification
      MYSQL_TEST_CONTAINER: business-verification-mysql
      PRESERVED_DB_TEST_SOURCE: lu_test_phase3bh_verification
      LINE_CHANNEL_ACCESS_TOKEN: ''
      LINE_CHANNEL_SECRET: ''
      ANONYMIZED_TELEMETRY: 'False'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PROOF_DIR: /tmp/business-proof
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 7e12a3e5b605261311f6339ffe01fb8f13b06b09
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Record source and install the same locked wheel dependencies
        run: |
          mkdir -p "$PROOF_DIR"
          git rev-parse HEAD > "$PROOF_DIR/source-commit.txt"
          python - <<'PY'
          import tomllib
          from pathlib import Path
          from pip._vendor.packaging.markers import Marker
          from pip._vendor.packaging.requirements import Requirement
          lock = tomllib.loads(Path('uv.lock').read_text())
          project = tomllib.loads(Path('pyproject.toml').read_text())
          selected, seen = {}, set()
          pending = [{'name': Requirement(s).name, 'extra': list(Requirement(s).extras)} for s in project['project']['dependencies']]
          pending += [{'name': 'pytest'}, {'name': 'httpx'}]
          while pending:
              dep = pending.pop()
              if dep.get('marker') and not Marker(dep['marker']).evaluate():
                  continue
              candidates = [p for p in lock['package'] if p['name'] == dep['name'] and (not dep.get('version') or p['version'] == dep['version'])]
              candidates = [p for p in candidates if not p.get('resolution-markers') or any(Marker(m).evaluate() for m in p['resolution-markers'])]
              assert len(candidates) == 1, (dep['name'], len(candidates))
              package = candidates[0]
              assert package['source'] == {'registry': 'https://pypi.org/simple'}, package['name']
              key = (package['name'], package['version'], tuple(sorted(dep.get('extra', []))))
              if key in seen:
                  continue
              seen.add(key)
              selected[package['name']] = package
              pending.extend(package.get('dependencies', []))
              for extra in dep.get('extra', []):
                  pending.extend(package.get('optional-dependencies', {}).get(extra, []))
          lines = []
          for name, package in sorted(selected.items()):
              hashes = sorted({wheel['hash'] for wheel in package['wheels']})
              assert hashes and all(h.startswith('sha256:') for h in hashes), name
              lines.append(f"{name}=={package['version']} " + ' '.join('--hash=' + h for h in hashes))
          assert 'graphifyy' not in selected and 'httpx2' not in selected
          Path('/tmp/business-test-requirements.txt').write_text('\n'.join(lines) + '\n')
          print('Locked runtime/test packages:', len(lines))
          PY
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r /tmp/business-test-requirements.txt > "$PROOF_DIR/dependencies.log" 2>&1 || { tail -60 "$PROOF_DIR/dependencies.log"; exit 1; }
          python -m pip list --format=json > "$PROOF_DIR/installed-packages.json"
      - name: Start authenticated host TCP MySQL on the temporary runner
        env:
          MYSQL_ROOT_PASSWORD: verification-only
        run: |
          image=mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
          docker pull "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}' > "$PROOF_DIR/mysql-image.json"
          docker run -d --name business-verification-mysql -p 127.0.0.1:33306:3306 -e MYSQL_ROOT_PASSWORD -e MYSQL_ROOT_HOST=% "$image"
          python - <<'PY'
          import time
          import pymysql
          deadline = time.monotonic() + 90
          while True:
              try:
                  connection = pymysql.connect(host='127.0.0.1', port=33306, user='root', password='verification-only', connect_timeout=2, read_timeout=2)
                  with connection.cursor() as cursor:
                      cursor.execute('SELECT VERSION()')
                      print('Authenticated host TCP ready:', cursor.fetchone()[0])
                  connection.close()
                  break
              except pymysql.MySQLError:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(2)
          PY
      - name: Prepare a synthetic source for file and database-copy tests
        if: matrix.mode != 'holiday'
        run: |
          python - <<'PY' > "$PROOF_DIR/synthetic-setup.log" 2>&1
          import os
          from pathlib import Path
          from argparse import Namespace
          from scripts.bootstrap_disposable_mysql_schema import bootstrap
          import pymysql
          database = os.environ['DB_DATABASE']
          bootstrap(Namespace(host='127.0.0.1', port=33306, user='root', password=os.environ['DB_PASSWORD'], database=database, confirm_database=database))
          connection = pymysql.connect(host='127.0.0.1', port=33306, user='root', password=os.environ['DB_PASSWORD'], database=database, charset='utf8mb4')
          with connection.cursor() as cursor:
              cursor.execute('INSERT INTO clients(case_no,name) VALUES (%s,%s)', ('VERIFY-FILE-001','Synthetic verification client'))
              client_id = cursor.lastrowid
              cursor.execute('INSERT INTO orders(case_no,client_id,status,service_days,service_hours_per_day,start_date,end_date,service_start_time,service_end_time,service_end_day_offset) VALUES (%s,%s,%s,2,8,%s,%s,%s,%s,0)', ('VERIFY-FILE-001',client_id,'洽談中','2026-10-01','2026-10-02','09:00:00','17:00:00'))
          connection.commit()
          connection.close()
          target = Path('.env')
          assert not target.exists(), 'checkout unexpectedly contains environment configuration'
          target.write_text('\n'.join(name+'='+os.environ[name] for name in ('DB_HOST','DB_PORT','DB_USER','DB_PASSWORD','DB_DATABASE'))+'\n', encoding='utf-8')
          print('Canonical schema and one synthetic order prepared on the temporary MySQL container.')
          PY
      - name: Verify controlled file staging receipt finalization and download
        if: matrix.mode == 'controlled-files'
        env:
          RUN_CONTROLLED_FILE_MYSQL_E2E: '1'
        run: |
          set +e
          timeout 300 python -m pytest -q --tb=short --junitxml="$PROOF_DIR/results.xml" tests/test_controlled_file_disposable_mysql_e2e.py tests/domains/global/subsystems/controlled-files/integration/test_controlled_file_finalize_mysql_e2e.py > "$PROOF_DIR/results.log" 2>&1
          code=$?
          echo "$code" > "$PROOF_DIR/exit-code.txt"
          tail -60 "$PROOF_DIR/results.log"
          exit "$code"
      - name: Verify holiday preview rollback apply and replay on its required namespace
        if: matrix.mode == 'holiday'
        run: |
          set +e
          timeout 300 python -m pytest -q --tb=short --junitxml="$PROOF_DIR/results.xml" tests/test_holiday_preview_apply_disposable_mysql_e2e.py > "$PROOF_DIR/results.log" 2>&1
          code=$?
          echo "$code" > "$PROOF_DIR/exit-code.txt"
          tail -60 "$PROOF_DIR/results.log"
          exit "$code"
      - name: Verify copy-only backups upgrades recovery and preservation
        if: matrix.mode == 'preserved-database'
        run: |
          set +e
          timeout 900 python -m pytest -q -m integration --tb=short --junitxml="$PROOF_DIR/results.xml" tests/test_preserved_database_additive_upgrade_cutover.py::test_real_mysql_preserved_source_candidate_cutover tests/test_wp74_local_database_upgrade_mysql.py tests/test_wp78_partial_recovery_disposable_mysql.py tests/test_wp79_line_runtime_recovery_disposable_mysql.py tests/test_wp84_legacy_knowledge_empty_recovery.py tests/test_customer_service_partial_recovery_disposable_mysql.py tests/integration/test_human_escalation_mysql_preserve_data.py > "$PROOF_DIR/results.log" 2>&1
          code=$?
          echo "$code" > "$PROOF_DIR/exit-code.txt"
          tail -80 "$PROOF_DIR/results.log"
          exit "$code"
      - name: Record source state and destroy only the synthetic container
        if: always()
        run: |
          git status --short > "$PROOF_DIR/working-tree-after-tests.txt"
          docker logs business-verification-mysql > "$PROOF_DIR/mysql-container.log" 2>&1 || true
          docker rm -f business-verification-mysql || true
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: business-supplement-${{ matrix.mode }}-7e12a3e
          path: /tmp/business-proof
          retention-days: 1
          if-no-files-found: error
