name: LINE query fixture and read-only integration
on:
  push:
    branches: [fix/business-regressions-20260922]
    paths: [.github/workflows/business-repair.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - id: publish
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REF']=='refs/heads/fix/business-regressions-20260922'
          records=json.loads(r'''[{"path":"tests/test_line_delivery_public_query_route.py","before":"99da38546d43ed1e43101770911cecda16fcc57e09f54b315bf7d84c2c216b73","after":"a6e90293aab54d5f26a9a1af5185b6542ce730baabd4dedac2dfceca84a9b904","edits":[[12929,13177,"from scripts.bootstrap_disposable_mysql_schema import bootstrap\n\n        _assert_disposable_schema_name(name)\n        bootstrap(Namespace(\n            host=self._values[\"LABOR_UNION_TEST_MYSQL_HOST\"],\n            port=int(self._values[\"LABOR_UNION_TEST_MYSQL_PORT\"]),\n            user=self._values[\"LABOR_UNION_TEST_MYSQL_USER\"],\n            password=self._values[\"LABOR_UNION_TEST_MYSQL_PASSWORD\"],\n            database=name,\n            confirm_database=name,\n        )"],[15027,15503,""]]}]''')
          assert hashlib.sha256(json.dumps(records,ensure_ascii=False,separators=(',',':')).encode()).hexdigest()=='af8cda3d10db8fabeed6a836d9d5fdf4f3821b81c54a08f57a618426742b2c38'
          for item in records:
              p=Path(item['path']);original=p.read_bytes();assert hashlib.sha256(original).hexdigest()==item['before']
              text=original.decode('utf-8')
              for start,end,replacement in reversed(item['edits']): text=text[:start]+replacement+text[end:]
              result=text.encode('utf-8');assert hashlib.sha256(result).hexdigest()==item['after'];p.write_bytes(result)
          paths=[item['path'] for item in records]
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==set(paths)
          subprocess.run(['git','diff','--check'],check=True);subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix(tests): give the LINE query fixture one canonical schema creation owner'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/fix/business-regressions-20260922'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('commit='+sha+'\n')
          PY
  verification:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROOF_DIR: /tmp/business-repair
      APP_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: '33306'
      DB_USER: repair_reader
      DB_DATABASE: lu_test_line_delivery_public_query_20260820_a1
      LABOR_UNION_TEST_MYSQL_HOST: 127.0.0.1
      LABOR_UNION_TEST_MYSQL_PORT: '33306'
      LABOR_UNION_TEST_MYSQL_USER: repair_reader
      LABOR_UNION_TEST_MYSQL_DATABASE: lu_test_line_delivery_public_query_20260820_a1
      LINE_CHANNEL_ACCESS_TOKEN: ''
      LINE_CHANNEL_SECRET: ''
      ANONYMIZED_TELEMETRY: 'False'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Record source and install locked wheels
        run: |
          mkdir -p "$PROOF_DIR"
          git rev-parse HEAD > "$PROOF_DIR/source-commit.txt"
          python - <<'PY'
          import tomllib
          from pathlib import Path
          from pip._vendor.packaging.markers import Marker
          from pip._vendor.packaging.requirements import Requirement
          lock=tomllib.loads(Path('uv.lock').read_text());project=tomllib.loads(Path('pyproject.toml').read_text())
          selected,seen={},set();pending=[{'name':Requirement(s).name,'extra':list(Requirement(s).extras)} for s in project['project']['dependencies']]+[{'name':'pytest'},{'name':'httpx'}]
          while pending:
              dep=pending.pop()
              if dep.get('marker') and not Marker(dep['marker']).evaluate():continue
              candidates=[p for p in lock['package'] if p['name']==dep['name'] and (not dep.get('version') or p['version']==dep['version'])]
              candidates=[p for p in candidates if not p.get('resolution-markers') or any(Marker(m).evaluate() for m in p['resolution-markers'])]
              assert len(candidates)==1,dep['name'];p=candidates[0];assert p['source']=={'registry':'https://pypi.org/simple'}
              key=(p['name'],p['version'],tuple(sorted(dep.get('extra',[]))))
              if key in seen:continue
              seen.add(key);selected[p['name']]=p;pending.extend(p.get('dependencies',[]))
              for extra in dep.get('extra',[]):pending.extend(p.get('optional-dependencies',{}).get(extra,[]))
          lines=[]
          for name,p in sorted(selected.items()):
              hashes=sorted({w['hash'] for w in p['wheels']});assert hashes
              lines.append(f"{name}=={p['version']} "+' '.join('--hash='+h for h in hashes))
          Path('/tmp/repair-requirements.txt').write_text('\n'.join(lines)+'\n')
          PY
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r /tmp/repair-requirements.txt > "$PROOF_DIR/dependencies.log" 2>&1
      - name: Prepare one-schema non-root account on a disposable server
        run: |
          MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)
          DB_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$MYSQL_ROOT_PASSWORD"
          echo "::add-mask::$DB_PASSWORD"
          export MYSQL_ROOT_PASSWORD DB_PASSWORD
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          echo "LABOR_UNION_TEST_MYSQL_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          docker run -d --name repair-mysql -p 127.0.0.1:33306:3306 -e MYSQL_ROOT_PASSWORD -e MYSQL_ROOT_HOST=% mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b --log-bin-trust-function-creators=1
          python - <<'PY'
          import os,time,pymysql
          for attempt in range(60):
              try:
                  c=pymysql.connect(host='127.0.0.1',port=33306,user='root',password=os.environ['MYSQL_ROOT_PASSWORD'])
                  with c.cursor() as cur:cur.execute('SELECT 1');assert cur.fetchone()[0]==1
                  break
              except pymysql.err.OperationalError:
                  if attempt==59:raise
                  time.sleep(2)
          with c.cursor() as cur:
              cur.execute("CREATE USER 'repair_reader'@'%' IDENTIFIED BY %s",(os.environ['DB_PASSWORD'],))
              cur.execute("GRANT ALL PRIVILEGES ON `lu_test_line_delivery_public_query_20260820_a1`.* TO 'repair_reader'@'%'")
          c.commit();c.close()
          PY
      - name: Verify real LINE query and schema lease contracts
        run: python -m pytest -q --tb=short --junitxml="$PROOF_DIR/line-query.xml" tests/test_line_delivery_public_query_route.py > "$PROOF_DIR/line-query.log" 2>&1
      - name: Destroy only the disposable server
        if: always()
        run: docker rm -f repair-mysql
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repair-line-query-${{ github.run_number }}
          path: /tmp/business-repair
          retention-days: 1
          if-no-files-found: error
