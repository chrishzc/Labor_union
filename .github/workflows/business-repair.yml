name: Verify transfer bytes
on:
  push:
    branches: [fix/business-regressions-20260922]
    paths: [.github/workflows/business-repair.yml]
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Export only prior transfer definition
        run: |
          mkdir -p /tmp/repair-readback
          git show HEAD^:.github/workflows/business-repair.yml > /tmp/repair-readback/transfer.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repair-transfer-readback
          path: /tmp/repair-readback
          retention-days: 1
          if-no-files-found: error
