name: Final business regression repairs
on:
  push:
    branches: [fix/business-regressions-20260922]
    paths: [.github/workflows/business-repair.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Publish exact final reviewed edits
        id: publish
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REF']=='refs/heads/fix/business-regressions-20260922'
          records=json.loads(r'''[{"path":"infrastructure/mysql/historical_service_accounting_repository.py","before":"71330b112265026a72124bd54b391b9c5f2fca8c96eb08b7b887d462d86df656","after":"148eb3a32b84a26c51d931f905a5697aa03a35c200e68d8b087e3577840b76c4","edits":[[14176,14279,"# A zero initial obligation still establishes the settled lineage required\n    # by completion readback and by later source-bound day revisions."]]},{"path":"scripts/reconcile_writer_inventory_v3_dispositions.py","before":"b575bd912b144861d2af37f4e5dadd3951a447dba629649f3c61d48716d8400d","after":"cda4f2208219e3394aab7432bc1f83b724e9cc87dba6c965dd0dd8fa956d0a1c","edits":[[70912,70912,"    if path in EXACT_SOURCE_RESTRICTED_REVIEWS or path in EXACT_SOURCE_REVIEWS:\n        # An expired or symbol-mismatched source review cannot inherit a broader\n        # module-level decision. Independent exact decisions were checked above.\n        return _needs_decision_review(path)\n"],[72363,72386,"source = ROOT / path\n    if not source.is_file() or sha256(source"]]},{"path":"subsystems/anomalies/government_return_outbound_overage_anomaly_source.py","before":"3b38bd76d1c007e8f73ffb6bb08733a6d5d510d7dabf69a8c829e35a79bb54e6","after":null,"edits":[]},{"path":"subsystems/anomalies/government_subsidy_anomaly_source.py","before":"48895e4cc008a034091d0086ae72cadb647dd46fd372be01e31568358b12b762","after":null,"edits":[]},{"path":"subsystems/anomalies/government_subsidy_integrity_anomaly_source.py","before":"2b8ea218aff587407d787176139b20e885a41cbac1e032e67a35eb8ba5e3a04d","after":null,"edits":[]},{"path":"subsystems/anomalies/government_subsidy_reversal_anomaly_source.py","before":"28bad07fb32c96a8a97c4fda51f0e4a177af5719ce3cbd75c1aacc1b02650734","after":null,"edits":[]},{"path":"subsystems/anomalies/process_reminder_anomaly_source.py","before":"7d94339914ac2f6fe05cdbdbd32a4224dcce917997228352a718029bf12c9fb2","after":null,"edits":[]},{"path":"subsystems/anomalies/staff_payables_anomaly_source.py","before":"c61e7c09c02c20d532aa5f678992c5c78d513228b353026e59180fcfadda2587","after":null,"edits":[]},{"path":"subsystems/validation_dataset/inspection.py","before":"19c27cf6b9508105275de839adbef277df479c75fa0cb3222e68344d1a09ddc5","after":null,"edits":[]},{"path":"tests/domains/clients/subsystems/client-profile/modules/profile-change/test_registry_accounting_dates.py","before":"c6fb525a2b315767779bbc8b7b17ca6c43ad2584b7c95549af77e379e21dd690","after":"b32e3607194a03cf55971111e1bf120a346e381c83cc434965938a4ee8d8ee6d","edits":[[6888,6889,"4\n    assert sum(\"FROM client_legacy_virtual_accounts\" in sql for sql, _ in connection.statements) == 1"]]},{"path":"tests/test_finance_import_staging_persistent_mysql_e2e.py","before":"fe91c6980c435ba29850d0f1dcec919621db616cb31bc2d8f04a2012ad8f00aa","after":"68a399c2a71cffd89b26939b44a2168e4e98faa4dfd237e43af113e53e6cf83e","edits":[[7714,7714,"        manifest_response = client.get(\n            f\"/api/v1/finance-import/batches/{intake['batch_identity']}/manifest\",\n        )\n        review_response = client.get(\n            f\"/api/v1/finance-import/batches/{intake['batch_identity']}/review-rows?limit=50\",\n        )\n        assert manifest_response.status_code == review_response.status_code == 200\n"],[9130,9130,"        \"manifest_response\": manifest_response.json(), \"review_response\": review_response.json(),\n"],[9936,9936,"default\", \"--reporter="]]},{"path":"tests/test_line_service_help.py","before":"cc987051d85320f13275f450f5db05df2fc1c0dc492c7cc030dc40f97b13d2aa","after":"9e102a8b9372607f97a5d2ff5fb20a8228fe8776df6315c395d1b662a1ff291c","edits":[[4540,4590,"detail\"][\"error\"][\"code\"] == \"knowledge_catalog_unavailable\"\n    assert \"data\" not in response.json()"]]},{"path":"tests/test_writer_inventory_v3_dispositions.py","before":"3ecea9206a24765f6cc685423c3c341f7ede7b63abea18ad39749d20f49ef149","after":"198ee500a89a51b55995823b3ec03390da8356c2c8cc21b5d405b56fa5bc1048","edits":[[276,276,"    _disposition,\n    _review,\n"],[2802,2802,"    candidates = {record[\"identity\"]: record for record in _records(\"writer_inventory_v3_candidate.findings.jsonl\")}\n    # Historical receipts remain immutable; current eligibility is recomputed\n    # by the review resolver against current source, not accepted from snapshots.\n"],[2923,2923,"historical_"],[3244,3286," = REPOSITORY_ROOT / path\n            source_matches = source.is_file() and sha256(source"],[3405,3405,"                current = _disposition(candidates[identity])\n"],[3596,3602,"current"],[3943,3949,"current"],[4088,4088,"            unknown = {\"relative_path\": path, \"symbol\": \"FutureUnreviewedWriter.mutate\", \"identity\": f\"{path}:FutureUnreviewedWriter.mutate:execute\"}\n            assert _review(unknown)[3].startswith(\"needs_decision:\")\n"]]},{"path":"ui_react/src/tests/domains/external-integration/subsystems/line/integration/line_rules_query_flow.test.tsx","before":"be9e3239852037db9e9d594fb6314e1efb39c07e1a92be2ffa7a0e3c569887fe","after":"e93604a9645a2b31810bc4ae5d6daddc2eca641bd63d5ca18d725878eaadb5df","edits":[[2984,3035,"async (input: RequestInfo | URL, options?: RequestInit) => {\n      expect(String(input)).toBe('/api/v1/line/notification-rules/deposit_notice/message-template');\n      expect(options?.method).toBe('GET');\n      expect(options?.body).toBeUndefined();\n      return new Response(JSON.stringify({ success: true, data: {\n        rule_id: 'deposit_notice', template_id: 'deposit_notice', name: '訂金確認',\n        content: '訂金確認通知', revision: 1, variables: [], sample_preview: '訂金確認通知',\n      } }), { status: 200, headers: { 'Content-Type': 'application/json' } });\n    }"],[3641,3641,"    expect(fetchSpy).not.toHaveBeenCalled();\n"],[4483,4521,"await waitFor(() => expect(fetchSpy).toHaveBeenCalled());\n    expect(fetchSpy.mock.calls.every(([, options]) => options?.method === 'GET')).toBe(true"]]}]''')
          for item in records:
              path=Path(item['path']); original=path.read_bytes()
              assert hashlib.sha256(original).hexdigest()==item['before'], str(path)
              if item['after'] is None:
                  path.unlink(); continue
              text=original.decode('utf-8')
              for start,end,replacement in reversed(item['edits']): text=text[:start]+replacement+text[end:]
              result=text.encode('utf-8')
              assert hashlib.sha256(result).hexdigest()==item['after'], str(path)
              path.write_bytes(result)
          paths=[item['path'] for item in records]
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==set(paths)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix: preserve zero-value accounting lineage and enforce current source review contracts'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/fix/business-regressions-20260922'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('commit='+sha+'\n')
          PY
  verification:
    needs: prepare
    name: ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [backend, frontend, finance-query, finance-parity, subsidy, order-terms]
    env:
      PROOF_DIR: /tmp/business-repair
      APP_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: '33306'
      DB_USER: root
      DB_DATABASE: ''
      LINE_CHANNEL_ACCESS_TOKEN: ''
      LINE_CHANNEL_SECRET: ''
      ANONYMIZED_TELEMETRY: 'False'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Record source
        run: |
          mkdir -p "$PROOF_DIR"
          git rev-parse HEAD > "$PROOF_DIR/source-commit.txt"
      - name: Install locked Python runtime and test wheels
        if: matrix.mode != 'frontend'
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          from pip._vendor.packaging.markers import Marker
          from pip._vendor.packaging.requirements import Requirement
          lock=tomllib.loads(Path('uv.lock').read_text()); project=tomllib.loads(Path('pyproject.toml').read_text())
          selected,seen={},set()
          pending=[{'name':Requirement(s).name,'extra':list(Requirement(s).extras)} for s in project['project']['dependencies']]+[{'name':'pytest'},{'name':'httpx'}]
          while pending:
              dep=pending.pop()
              if dep.get('marker') and not Marker(dep['marker']).evaluate(): continue
              candidates=[p for p in lock['package'] if p['name']==dep['name'] and (not dep.get('version') or p['version']==dep['version'])]
              candidates=[p for p in candidates if not p.get('resolution-markers') or any(Marker(m).evaluate() for m in p['resolution-markers'])]
              assert len(candidates)==1,dep['name']
              p=candidates[0]; assert p['source']=={'registry':'https://pypi.org/simple'}
              key=(p['name'],p['version'],tuple(sorted(dep.get('extra',[]))))
              if key in seen: continue
              seen.add(key); selected[p['name']]=p; pending.extend(p.get('dependencies',[]))
              for extra in dep.get('extra',[]): pending.extend(p.get('optional-dependencies',{}).get(extra,[]))
          lines=[]
          for name,p in sorted(selected.items()):
              hashes=sorted({w['hash'] for w in p['wheels']}); assert hashes
              lines.append(f"{name}=={p['version']} "+' '.join('--hash='+h for h in hashes))
          Path('/tmp/repair-requirements.txt').write_text('\n'.join(lines)+'\n')
          PY
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes -r /tmp/repair-requirements.txt > "$PROOF_DIR/dependencies.log" 2>&1
      - name: Install locked frontend dependencies without hooks
        if: matrix.mode == 'frontend' || startsWith(matrix.mode, 'finance-')
        run: npm --prefix ui_react ci --ignore-scripts --no-audit --fund=false > "$PROOF_DIR/npm-install.log" 2>&1
      - name: Backend regression suite without external services
        if: matrix.mode == 'backend'
        run: python -m pytest -q --continue-on-collection-errors --tb=short --ignore=tests/test_background_job_repository_mysql.py --ignore=tests/test_durable_job_disposable_mysql_e2e.py --ignore=tests/test_durable_job_payload_equality_disposable_mysql_e2e.py --ignore=tests/domains/orders/subsystems/orders/integration/test_order_terms_empty_service_time_disposable_mysql.py --junitxml="$PROOF_DIR/backend.xml" > "$PROOF_DIR/backend.log" 2>&1
      - name: Full frontend tests
        if: matrix.mode == 'frontend'
        run: npm --prefix ui_react test -- --reporter=json --outputFile="$PROOF_DIR/frontend.json" --maxWorkers=2 --minWorkers=1 > "$PROOF_DIR/frontend.log" 2>&1
      - name: Frontend build and lint
        if: always() && matrix.mode == 'frontend'
        run: |
          npm --prefix ui_react run build > "$PROOF_DIR/build.log" 2>&1
          npm --prefix ui_react run lint > "$PROOF_DIR/lint.log" 2>&1
      - name: Start synthetic MySQL and await authenticated host TCP
        if: matrix.mode != 'backend' && matrix.mode != 'frontend'
        run: |
          MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$MYSQL_ROOT_PASSWORD"
          export MYSQL_ROOT_PASSWORD
          echo "DB_PASSWORD=$MYSQL_ROOT_PASSWORD" >> "$GITHUB_ENV"
          echo "LABOR_UNION_TEST_MYSQL_PASSWORD=$MYSQL_ROOT_PASSWORD" >> "$GITHUB_ENV"
          echo 'LABOR_UNION_TEST_MYSQL_HOST=127.0.0.1' >> "$GITHUB_ENV"
          echo 'LABOR_UNION_TEST_MYSQL_PORT=33306' >> "$GITHUB_ENV"
          echo 'LABOR_UNION_TEST_MYSQL_USER=root' >> "$GITHUB_ENV"
          echo 'LABOR_UNION_TEST_MYSQL_DATABASE=lu_test_business_repair' >> "$GITHUB_ENV"
          echo 'DB_DATABASE=lu_test_business_repair' >> "$GITHUB_ENV"
          docker run -d --name repair-mysql -p 127.0.0.1:33306:3306 -e MYSQL_ROOT_PASSWORD -e MYSQL_ROOT_HOST=% mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
          python - <<'PY'
          import os,time,pymysql
          for attempt in range(60):
              try:
                  c=pymysql.connect(host='127.0.0.1',port=33306,user='root',password=os.environ['MYSQL_ROOT_PASSWORD'])
                  with c.cursor() as cur: cur.execute('SELECT 1'); assert cur.fetchone()[0]==1
                  c.close(); break
              except pymysql.err.OperationalError:
                  if attempt==59: raise
                  time.sleep(2)
          PY
      - name: Finance integration with real query and typed frontend
        if: startsWith(matrix.mode, 'finance-')
        env:
          MODE: ${{ matrix.mode }}
        run: |
          python - <<'PY' > "$PROOF_DIR/finance.log" 2>&1
          import os,sys,traceback
          from argparse import Namespace
          import pytest
          if os.environ['MODE']=='finance-parity':
              from scripts.bootstrap_disposable_mysql_schema import bootstrap
              bootstrap(Namespace(host='127.0.0.1',port=33306,user='root',password=os.environ['DB_PASSWORD'],database=os.environ['DB_DATABASE'],confirm_database=os.environ['DB_DATABASE']))
          from api.routes import finance_import as route
          original=route._call_query
          def trace_query(query,message,correlation):
              def checked():
                  try: return query()
                  except Exception:
                      traceback.print_exc(); raise
              return original(checked,message,correlation)
          route._call_query=trace_query
          case='tests/test_finance_source_review_mysql_e2e.py' if os.environ['MODE']=='finance-query' else 'tests/test_finance_import_staging_persistent_mysql_e2e.py'
          sys.exit(pytest.main(['-q','--tb=long','--junitxml=/tmp/business-repair/finance.xml',case]))
          PY
      - name: Subsidy durable business flows on separate synthetic targets
        if: matrix.mode == 'subsidy'
        run: |
          python - <<'PY'
          import os,subprocess,sys,json
          from pathlib import Path
          results=[]
          for index,name in enumerate(['submission','claim_plan','approval']):
              db=f'lu_test_repair_subsidy_{index}'
              env={**os.environ,'DB_DATABASE':db,'LABOR_UNION_TEST_MYSQL_DATABASE':db}
              node='tests/test_government_subsidy_durable_mysql_e2e.py::test_government_subsidy_'+name+'_durable_crash_recovery_and_duplicate_apply'
              with open(f'/tmp/business-repair/subsidy-{index}.log','w') as log:
                  result=subprocess.run([sys.executable,'-m','pytest','-q','--tb=short',f'--junitxml=/tmp/business-repair/subsidy-{index}.xml',node],env=env,stdout=log,stderr=subprocess.STDOUT)
              results.append({'nodeid':node,'exit_code':result.returncode})
          Path('/tmp/business-repair/subsidy-results.json').write_text(json.dumps(results))
          sys.exit(int(any(r['exit_code'] for r in results)))
          PY
      - name: Empty service time preservation on real MySQL
        if: matrix.mode == 'order-terms'
        run: python -m pytest -q --tb=short --junitxml="$PROOF_DIR/orders.xml" tests/domains/orders/subsystems/orders/integration/test_order_terms_empty_service_time_disposable_mysql.py > "$PROOF_DIR/orders.log" 2>&1
      - name: Destroy only synthetic test container
        if: always() && matrix.mode != 'backend' && matrix.mode != 'frontend'
        run: docker rm -f repair-mysql
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repair-${{ matrix.mode }}-${{ github.run_number }}
          path: /tmp/business-repair
          retention-days: 1
          if-no-files-found: error
