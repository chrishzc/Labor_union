name: Issue 244 Task97 reconciliation one-off
on:
  push:
    branches: [fix/current-regression-baseline-20260905]
    paths: [.github/workflows/issue-244-focused-once.yml]
permissions:
  contents: write
jobs:
  reconcile-task97:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 10
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify product baseline plus workflow-only commits
        run: |
          git cat-file -e 7d8869de8a0c1b42c22b2c923798911b4f15702b^{commit}
          test "$(git diff --name-only 7d8869de8a0c1b42c22b2c923798911b4f15702b HEAD)" = ".github/workflows/issue-244-focused-once.yml"
      - name: Install exact locked pytest
        run: |
          python - <<'PY'
          import subprocess, tomllib
          with open('uv.lock', 'rb') as stream:
              packages = tomllib.load(stream)['package']
          pytest = next(package for package in packages if package['name'] == 'pytest')
          assert pytest['source'] == {'registry': 'https://pypi.org/simple'}
          subprocess.run(['python','-m','pip','install','--only-binary=:all:',f"pytest=={pytest['version']}"], check=True)
          PY
      - name: Reconcile completed Task97 decisions and retired LINE bind evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          generator = Path('scripts/generate_task97_commit_dispositions.py')
          text = generator.read_text(encoding='utf-8')
          line_bind = '''    "line/line_bot.py:line_bind:commit:COMMIT:-:a726d561eba65201:1": (\n        "line_identity", "adapter",\n        "Legacy rollback-only LINE bind route owns one bounded binding transaction; canonical runtime returns 410 before opening the write path.",\n        "Retain only behind the explicit legacy rollback runtime contract; canonical runtime must remain write-inaccessible.",\n        "Canonical 410-before-write and production rollback-mode guards remain the required focused evidence.",\n    ),\n'''
          assert text.count(line_bind) == 1
          text = text.replace(line_bind, '', 1)
          unresolved = 'UNRESOLVED_REVIEWED_COMMIT_BOUNDARIES: dict[str, tuple[str, str, str]] = {'
          start = text.index(unresolved)
          end = text.index('\n\n\n\n@dataclass', start)
          text = text[:start] + 'UNRESOLVED_REVIEWED_COMMIT_BOUNDARIES: dict[str, tuple[str, str, str]] = {}' + text[end:]
          old = '"Operator-only invocation and safe rerun semantics remain the required migration evidence.",'
          new = '"Exact target confirmation, live database match, and safe rerun semantics remain the required migration evidence.",'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          generator.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_task97_commit_dispositions.py')
          test_text = test_path.read_text(encoding='utf-8')
          old_test = '''    assert reviewed.identity in REVIEWED_COMMIT_BOUNDARIES\n    assert reviewed.identity in UNRESOLVED_REVIEWED_COMMIT_BOUNDARIES\n    assert sibling_occurrence.identity not in REVIEWED_COMMIT_BOUNDARIES\n    assert sibling_symbol.identity not in REVIEWED_COMMIT_BOUNDARIES\n    exact_result = _classify(reviewed, location)\n    sibling_occurrence_result = _classify(sibling_occurrence, location)\n    sibling_symbol_result = _classify(sibling_symbol, location)\n    assert exact_result[0] == "real_violation"\n    assert exact_result[3] == UNRESOLVED_REVIEWED_COMMIT_BOUNDARIES[reviewed.identity][2]\n    assert sibling_occurrence_result[0] == "real_violation"\n    assert sibling_symbol_result[0] == "real_violation"\n    assert sibling_occurrence_result[3] != exact_result[3]\n    assert sibling_symbol_result[3] != exact_result[3]\n'''
          new_test = '''    assert reviewed.identity in REVIEWED_COMMIT_BOUNDARIES\n    assert reviewed.identity not in UNRESOLVED_REVIEWED_COMMIT_BOUNDARIES\n    assert sibling_occurrence.identity not in REVIEWED_COMMIT_BOUNDARIES\n    assert sibling_symbol.identity not in REVIEWED_COMMIT_BOUNDARIES\n    exact_result = _classify(reviewed, location)\n    sibling_occurrence_result = _classify(sibling_occurrence, location)\n    sibling_symbol_result = _classify(sibling_symbol, location)\n    assert exact_result[0] == "application_owned_legitimate_outer_uow"\n    assert sibling_occurrence_result[0] == "real_violation"\n    assert sibling_symbol_result[0] == "real_violation"\n    assert sibling_occurrence_result[3] != exact_result[3]\n    assert sibling_symbol_result[3] != exact_result[3]\n'''
          assert test_text.count(old_test) == 1
          test_path.write_text(test_text.replace(old_test, new_test, 1), encoding='utf-8')

          reconciler = Path('scripts/reconcile_writer_inventory_v3_dispositions.py')
          rec_text = reconciler.read_text(encoding='utf-8')
          old_line_bind_review = '''    replacement = replacements.get(symbol)\n    if replacement is None:\n        return _needs_decision_review("line/line_bot.py")\n    return (\n        "line_integration",\n        "LINE transport route",\n        "api/main.py mounts line.line_bot.router",\n        f"retain_canonical:{replacement}",\n    )\n'''
          new_line_bind_review = '''    if symbol == "line_bind":\n        return (\n            "line_identity",\n            "retired legacy LINE bind mutation boundary",\n            "current /api/line/bind returns typed 410 before any write path",\n            "migrate_then_remove:#251 retired the legacy bind mutation; keep only historical candidate evidence and do not restore runtime writer authority",\n        )\n    replacement = replacements.get(symbol)\n    if replacement is None:\n        return _needs_decision_review("line/line_bot.py")\n    return (\n        "line_integration",\n        "LINE transport route",\n        "api/main.py mounts line.line_bot.router",\n        f"retain_canonical:{replacement}",\n    )\n'''
          assert rec_text.count(old_line_bind_review) == 1
          reconciler.write_text(rec_text.replace(old_line_bind_review, new_line_bind_review, 1), encoding='utf-8')
          PY
          git diff --check -- scripts/generate_task97_commit_dispositions.py scripts/reconcile_writer_inventory_v3_dispositions.py tests/test_task97_commit_dispositions.py
      - name: Commit governance decision reconciliation locally
        run: |
          git config user.name "issue-244-verification"
          git config user.email "issue-244-verification@users.noreply.github.com"
          git add scripts/generate_task97_commit_dispositions.py scripts/reconcile_writer_inventory_v3_dispositions.py tests/test_task97_commit_dispositions.py
          git commit -m "chore(governance): reconcile completed Task97 decisions"
      - name: Rebuild Task97 and writer inventory disposition evidence
        run: |
          python scripts/generate_task97_commit_dispositions.py
          python scripts/reconcile_writer_inventory_v3_dispositions.py
          git diff --check -- \
            document/架構重整/03_追蹤清單與證據/evidence/task97_repository_commit_dispositions_v1.json \
            document/架構重整/03_追蹤清單與證據/evidence/writer_inventory_v3/writer_inventory_v3_disposition.records.jsonl \
            document/架構重整/03_追蹤清單與證據/evidence/writer_inventory_v3/writer_inventory_v3_disposition.manifest.json
      - name: Verify rebuilt Task97 and writer inventory contracts
        run: |
          python -m pytest -q \
            tests/test_task97_commit_dispositions.py \
            tests/test_writer_inventory_v3_dispositions.py \
            --junitxml=/tmp/issue-244-task97.xml
      - name: Commit rebuilt evidence locally
        run: |
          git add \
            document/架構重整/03_追蹤清單與證據/evidence/task97_repository_commit_dispositions_v1.json \
            document/架構重整/03_追蹤清單與證據/evidence/writer_inventory_v3/writer_inventory_v3_disposition.records.jsonl \
            document/架構重整/03_追蹤清單與證據/evidence/writer_inventory_v3/writer_inventory_v3_disposition.manifest.json
          git commit -m "chore(governance): rebuild Task97 writer evidence"
          git diff --check 7d8869de8a0c1b42c22b2c923798911b4f15702b HEAD
      - name: Publish exact receipt
        run: |
          python - <<'PY'
          import json, os, subprocess, xml.etree.ElementTree as ET
          root = ET.parse('/tmp/issue-244-task97.xml').getroot()
          suites = list(root.iter('testsuite'))
          result = {key: sum(int(suite.get(key, 0)) for suite in suites) for key in ('tests','failures','errors','skipped')}
          result['candidate_head'] = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          task97 = json.load(open('document/架構重整/03_追蹤清單與證據/evidence/task97_repository_commit_dispositions_v1.json', encoding='utf-8'))
          manifest = json.load(open('document/架構重整/03_追蹤清單與證據/evidence/writer_inventory_v3/writer_inventory_v3_disposition.manifest.json', encoding='utf-8'))
          result['task97_source_revision'] = task97['source_revision']
          result['task97_status'] = task97['terminal_status']
          result['task97_candidates'] = task97['candidate_count']
          result['v3_dispositions'] = manifest['final_disposition_counts']
          print('::notice title=Issue 244 Task97 reconciled receipt::' + json.dumps(result, ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('```json\n' + json.dumps(result, ensure_ascii=False, indent=2) + '\n```\n')
          assert result['failures'] == result['errors'] == result['skipped'] == 0, result
          PY
      - name: Push only after verification succeeds
        run: git push origin HEAD:fix/current-regression-baseline-20260905
