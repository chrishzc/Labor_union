name: Issue 218 drawer owner routing

on:
  push:
    branches: ["fix/issue-218-intake-drawer-20260906"]
    paths: [".github/workflows/issue218-drawer-owner-routing.yml"]

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply owner-routing correction
        run: python scripts/issue218_drawer_owner_routing_tmp.py
      - name: Verify focused React behavior
        working-directory: ui_react
        run: |
          npm ci
          npm test -- --run src/tests/order_intake_completion_entry.test.tsx src/tests/orders_page_real_data.test.tsx
          npm run build
      - name: Commit verified correction
        run: |
          rm scripts/issue218_drawer_owner_routing_tmp.py .github/workflows/issue218-drawer-owner-routing.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(orders): keep owner workflows beside intake repair"
          git push origin HEAD:fix/issue-218-intake-drawer-20260906
# rerun after selector scoping
