name: LINE rich menu contracts
on:
  pull_request:
    paths:
      - '.github/workflows/line-rich-menu.yml'
      - 'api/**/line_rich_menu*'
      - 'domains/line/rich_menu*.py'
      - 'subsystems/line/rich_menu*.py'
      - 'infrastructure/line/rich_menu*.py'
      - 'tests/domains/external-integration/subsystems/line/**'
      - 'ui_react/src/**/line_rich_menu*/**'
      - 'ui_react/src/tests/line_rich_menu*.test.*'
      - 'ui_react/src/api/line_configuration/**'
      - 'ui_react/src/pages/LineManagementPage.tsx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify publication model and isolated LINE provider
        run: python -m pytest -vv tests/domains/external-integration/subsystems/line/infrastructure/test_line_rich_menu_provider_saga.py
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
        working-directory: ui_react
      - name: Verify same-publication UI readback
        run: npm test -- src/tests/line_rich_menu_query_flow.test.tsx
        working-directory: ui_react
