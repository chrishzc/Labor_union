name: Verify 111 focused backend

on:
  push:
    branches:
      - fix/111-python-collection-blocker

permissions:
  contents: read

jobs:
  weekly-operations-report-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run #111 backend focused contract
        run: python -m pytest -q tests/test_weekly_operations_report_contract.py
