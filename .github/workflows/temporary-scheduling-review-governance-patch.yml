name: Temporary Scheduling Review governance patch

on:
  push:
    branches:
      - fix/current-regression-baseline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply exact Scheduling mobile review governance mapping
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/generate_entrypoint_review_queue.py')
          text = path.read_text(encoding='utf-8')
          old = '''        elif "/identity-reviews/" in identity:
            owner = "LINE Identity"
            operator = "authenticated LINE mobile identity-review operator"
        else:
'''
          new = '''        elif "/identity-reviews/" in identity:
            owner = "LINE Identity"
            operator = "authenticated LINE mobile identity-review operator"
        elif "/scheduling-review/" in identity:
            owner = "Scheduling"
            operator = "authenticated LINE mobile scheduling reviewer"
        else:
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one exact anchor, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile scripts/generate_entrypoint_review_queue.py
          git diff --check
      - name: Commit bounded patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-scheduling-review-governance-patch.yml
          git add scripts/generate_entrypoint_review_queue.py
          git commit -m "fix: govern scheduling mobile review entrypoints"
          git push origin HEAD:fix/current-regression-baseline
