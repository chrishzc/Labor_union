name: Lane3 issue251 one-time verification
on:
  push:
    branches: [fix/issue-251-retire-legacy-bind]
    paths: [.github/workflows/lane3-issue251-once.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_ENV: development
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install existing pinned runtime wheels and focused test runner
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt pytest==9.1.1
      - name: Reproduce original failure then retire only the decided writer
        run: python .github/lane3_issue251_once.py patch
      - name: Focused real route, runtime and replacement entry verification
        run: |
          python -m pytest -q tests/test_line_bind_legacy_boundary.py tests/test_line_bind_legacy_characterization.py tests/domains/external-integration/subsystems/line/subsystems/test_line_runtime_cutover_stage10.py tests/domains/external-integration/subsystems/line/infrastructure/test_line_liff_entrypoint.py --junitxml=/tmp/issue251/focused.xml
          git diff --check
      - name: Controlled removal reproduces the original failure and restored fix passes
        run: python .github/lane3_issue251_once.py removal
      - name: Commit verified source and rebuild Task97 from clean committed inputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add line/line_bot.py
          git diff --cached --check
          git commit -m 'fix(line): retire legacy bind mutation in every runtime (#251)'
          python .github/lane3_issue251_once.py readback
          git rm .github/lane3_issue251_once.py .github/workflows/lane3-issue251-once.yml
          git commit -m 'chore(line): remove completed #251 verification harness'
          git diff d03551ab75de3e9cffc32ee772bdcf863181adad HEAD --check
          git diff d03551ab75de3e9cffc32ee772bdcf863181adad HEAD --stat
          git rev-parse HEAD
      - name: Push only the verified issue branch without persisting credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, os, subprocess
          token = os.environ.pop('GH_TOKEN')
          auth = base64.b64encode(('x-access-token:' + token).encode()).decode()
          environment = {**os.environ, 'GIT_CONFIG_COUNT': '1',
              'GIT_CONFIG_KEY_0': 'http.https://github.com/.extraheader',
              'GIT_CONFIG_VALUE_0': 'AUTHORIZATION: basic ' + auth}
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/fix/issue-251-retire-legacy-bind'], env=environment, check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue251-verification-${{ github.run_id }}
          path: |
            /tmp/issue251/*.xml
            /tmp/issue251/*.log
            /tmp/issue251/readback.json
          if-no-files-found: error
          retention-days: 7
