      canonical_intent: exact mapping keys=`case_ref,original_segment_ref,items`。original_segment_ref
        必須為 current:N；items 為非空 list，依 service_day 升冪且 item_ref=item:N 連續 0..N-1。每項
        exact keys=`item_ref,service_day,resolution,substitute_caregiver_ref`；resolution
        只允許 defer／substitute，defer 的 substitute_caregiver_ref 必須為 null，substitute
