    type: integration_test
    description: 以單一 Subsystem final gate 驗證新匯入、歷史 batch 重分類、共用 dispatch、append-only
      audit、IMPORT-006 與兩個 bounded CLI 的實際資料形狀；固定 1 列 fixture 與 ASUS 目標主機 batch 1
