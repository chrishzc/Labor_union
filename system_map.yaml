  OrderLifecycleFactsValidator:
    type: domain_contract
    description: 將 ORD-01 caller 提供的權威事實驗證並正規化為 immutable facts；不推導候選狀態或執行副作用。
    source: services/order_lifecycle_facts.py::validate_order_lifecycle_facts
    domain: Services
    subsystem: null
    map_file: services\services_system_map.md
    dependencies: []
    input:
      current_status: 洽談中、訂單成立、服務中、訂單完成或訂單取消
      trigger_event: canonical lifecycle trigger
      authoritative_facts: cancellation 與 canonical cancellation_reason、有效訂金核銷、actual
        dates、aware evaluation/completion instants、開始日重新確認、scoped blockers 與可空 canonical
        correction target
    output:
      validated_status: canonical current status
      validated_trigger: canonical trigger
      validated_facts: 型別穩定且 immutable 的完整事實
    invariants:
    - current_status 只允許洽談中、訂單成立、服務中、訂單完成、訂單取消。
    - trigger_event 只允許 case_created、deposit_reconciled、deposit_reversed、actual_start_updated、actual_start_reconfirmed、schedule_applied、evaluation_time_reached、cancelled、manual_correction、hold_activated、hold_released。
    - evaluation_at 必須是含 offset 的 ISO datetime 且進入規則前正規化為 Asia/Taipei；本節點不得取得現在時間。completion_instant
      可空，但非空時同樣必須含 offset。
    - actual_start_date／actual_end_date 使用 ISO 日期或 None；cancellation、deposit_reconciled、actual_start_reconfirmed、completion_facts_consistent
      等布林不得接受 truthy 字串或數字。
    - cancellation=true 時 cancellation_reason 必須為 trim 後非空字串；cancellation=false 時必須為
      None。reason 只能由 FactsLoader 的 post-control current projection提供。
    - transition_blockers 必須是 exact mapping，key 固定 enter_service、auto_complete，各值為不重複、穩定排序的
      machine codes；不得接收 Alert status、UI 文案或 generic blocking list。
    - manual_correction_target 只可在 trigger_event=manual_correction 時為 canonical status；其他
      trigger 必須為 None。它只能由 typed correction command 產生，不得直接採信 UI status payload。
    - 本節點不得讀 DB、推導付款／排班事實、選擇 target status 或建立 alert。
    preferred_pattern: none
    verification:
    - 'command: {"argv": [".venv\\Scripts\\python.exe", "-m", "pytest", "tests\\test_order_lifecycle_facts.py",
      "-q", "-p", "no:cacheprovider"], "cwd": "project", "timeout": 60, "expect_exit":
      0, "expect_stdout_contains": "passed"}'
    decisions: []
    todo: []
    checkpoint: []
    state: planned
    fan_in_snapshot: 3
