      為 service_time_terms_missing。
    - assignment、leave、substitution 與 schedule Apply 只能繼承案件統一時段，不得建立逐日時間覆寫。
    - migration 只新增 nullable 欄位與 CHECK；不得更新、刪除、重建或推測既有 orders、assignments、schedules
      及付款資料。
