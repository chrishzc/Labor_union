  OrderLifecycleControlFactsSchema:
    type: database_schema
    description: 建立 ORD-01 aggregate version、append-only cancellation／真正開始日重新確認／人工
      hold control events、高效 current projection，以及可重試 Alert projection outbox；system_alerts
      不屬 canonical facts。
    source: db/schema_parts/106_order_lifecycle_control_facts.sql
    domain: null
    subsystem: null
    map_file: system_map.md
    dependencies:
    - PaymentSchema
    - OrderLifecycleStateHistorySchema
    - OrderServiceTimeTermsSchema
    - DatabaseSchemaLoader
    input:
      order_aggregate: case_no、status 與 lifecycle_version
      control_command: control_type、control_key、scope、action、actor、reason、expected_version、idempotency_key
        與 bounded payload
      projection_intent: deterministic alert identity、action 與 bounded payload
    output:
      lifecycle_version: orders 上非負 BIGINT UNSIGNED aggregate revision
      order_lifecycle_control_events: '`id BIGINT UNSIGNED`、`case_no VARCHAR(50)`、`control_type
        ENUM(cancellation,actual_start_reconfirmation,human_hold)`、`control_key VARCHAR(100)`、`scope
        ENUM(order,enter_service,auto_complete)`、`action ENUM(activate,clear)`、`actor
        VARCHAR(100)`、`reason VARCHAR(500)`、`expected_version BIGINT UNSIGNED`、`idempotency_key
        VARCHAR(191)`、`payload_hash CHAR(64) ASCII BINARY`、`payload_snapshot JSON`、`created_at
        TIMESTAMP(6)` 的 append-only command facts'
      order_lifecycle_control_state: 以 `(case_no,control_type,control_key)` 為 PK，另含
        `scope`、`state ENUM(active,cleared)`、`current_event_id`、`release_policy ENUM(manual,expires_at)
        NULL`、`expires_at_utc DATETIME(6) NULL`、`confirmed_start_date DATE NULL`、`deposit_settlement_identity_hash
        CHAR(64) ASCII BINARY NULL`、`reason`、`changed_by`、`changed_at TIMESTAMP(6)`
        的 current projection
      order_lifecycle_projection_outbox: '`id`、`case_no`、`lifecycle_event_id`、`intent_key
        VARCHAR(191)`、`scope ENUM(enter_service,auto_complete)`、`alert_code VARCHAR(191)`、`action
        ENUM(open,resolve)`、`payload_hash CHAR(64) ASCII BINARY`、`payload_snapshot
        JSON`、`status ENUM(pending,processing,projected,failed)`、`attempt_count`、`next_attempt_at_utc`、`locked_at_utc`、`projected_at_utc`、`last_error
        VARCHAR(1000)`、`created_at/updated_at TIMESTAMP(6)` 的可重試 intents'
    invariants:
    - orders.lifecycle_version 必須 NOT NULL DEFAULT 0；每個成功接受且非 identical replay 的 aggregate
      command，不論 decision 為 changed、unchanged 或 blocked，恰遞增一次。identical replay 不得遞增。
    - control_type 只允許 cancellation、actual_start_reconfirmation、human_hold；domain-derived
      deposit、schedule consistency 或 time blockers 由 authoritative facts 即時計算，不得偽造成
      control row。
    - cancellation 固定 control_key=order_cancelled、scope=order；actual_start_reconfirmation
      固定 control_key=actual_start_reconfirmation、scope=enter_service；human_hold 使用穩定非空
      control_key，scope 只允許 enter_service 或 auto_complete。
    - human_hold 的 release_policy 只允許 manual 或 expires_at；expires_at policy 必須有明確
      Asia/Taipei-aware expiry。時間到達只允許背景 command 追加 release event 並重評估，不得由 query／loader
      靜默忽略 active row。
    - event 必須保存 case_no、type/key/scope、activate／clear action、actor、reason、expected_version、idempotency_key、payload
      hash／snapshot 與建立時間；同 case_no/idempotency_key 唯一，完全相同才 replay，不同 payload conflict。
    - event 必須另有 `UNIQUE(id,case_no,control_type,control_key)`；current state 的 `(current_event_id,case_no,control_type,control_key)`
      以 composite FK 精確指回該 event。control event 建立後不得 UPDATE／DELETE；current state 可更新但不得
      DELETE。
    - actual_start_reconfirmation 的 `state=active` 唯一表示仍需重新確認；成功確認以 clear event 將
      projection 設為 `cleared`，並強制保存與 orders.actual_start_date 相同的 confirmed_start_date
      及當下 deposit settlement SHA-256。其他 control 不得寫入兩個 confirmation 欄位。
    - 只有 human_hold 可保存 release_policy；manual policy 的 expires_at_utc 必須 NULL，expires_at
      policy 必須保存 UTC DATETIME(6)。非 human_hold 的 release_policy/expires_at_utc 必須
      NULL。
    - cancellation clear 只可由 typed manual correction command；清除後 orders.cancel_reason
      必須設 NULL，舊原因只從 append-only event 查詢。狀態不得直接恢復取消前 projection，而要依最新權威事實重新評估。
    - actual-start confirmation 只在 active confirmation 的 confirmed_start_date 精確等於
      orders.actual_start_date 且沒有較新的 required control 時有效；一般日期更新不得代替明確重新確認命令。
    - Alert claim／resolve、system_alerts row、UI flags 或任意 JSON details 均不得建立、清除或取代
      control fact。
    - outbox 以 `(case_no,intent_key)` 唯一；identical replay 必須同時比對 lifecycle_event_id、scope、alert_code、action、payload_hash
      與 canonical JSON payload，任何差異皆 conflict。pending/failed 才可依 next_attempt_at_utc
      重試；processing 必須有 locked_at_utc；projected 必須有 projected_at_utc 且 last_error=NULL。
    - outbox 與 lifecycle decision/control event 同 transaction 寫入；domain transaction
      不直接呼叫 system_alerts writer。投影失敗只影響重試狀態，不回滾已提交 domain command。
    - current-state Loader 必須使用 case/status/type 索引讀 projection，不得每次掃描完整 event history；event
      history 僅供 idempotency、audit 與人工查詢。
    - migration 必須 additive、可重跑且不修改既有 status、cancel_reason、日期、付款、排班或歷史；不相容既有 metadata
      必須 fail-closed。
    preferred_pattern: none
    verification:
    - 'command: {"argv": [".venv\\Scripts\\python.exe", "-m", "pytest", "tests\\test_order_lifecycle_control_facts_schema.py",
      "-q", "-p", "no:cacheprovider", "--basetemp", "C:\\tmp\\pytest-order-lifecycle-control-facts-schema"],
      "cwd": "project", "timeout": 120, "expect_exit": 0, "expect_stdout_contains":
      "passed"}'
    decisions: []
    todo: []
    checkpoint: []
    state: validated
    fan_in_snapshot: 8
