      並回傳或拋出明確結果的 validator helper，不得只把判斷內嵌在讀取正式 migration 的單一正向測試中。
    - adversarial／mutation cases 必須參數化覆蓋八種禁止操作 × orders、case_staff_assignments、staff_schedule
      三個受保護表的完整 24 組交叉組合，逐案證明 validator 拒絕；不得只讓每種 operation 各挑一個表形成 8 筆分散案例。
    - 測試另須直接把五種合法 statement shape 各自送入 validator 證明通過，並逐案將額外 SQL、非 SIGNAL trigger
      body、inline `--` comment、`#` comment 或 `/* ... */` block comment 插入合法前綴／token
      邊界後證明無法繞過或造成假通過；僅因 allowlist regex 具有 `^...$` 而未執行負向 mutation case，不算驗收證據。
    - 去除任何註解時必須以至少一個空白替代而非空字串，保留原本由註解分隔的 SQL token 邊界；mutation cases 必須直接覆蓋 `ALTER/**/TABLE`、`ALTER--comment`
      換行接 `TABLE`、`UPDATE/**/table`、`DELETE/**/FROM` 等註解兩側沒有既有空白的合法 SQL，並證明仍能偵測。
    - RENAME 防線必須同時檢查來源與 `TO` 目標；`RENAME TABLE orders TO archive` 與 `RENAME TABLE
      harmless TO orders` 只要任一側是受保護表都必須拒絕，並具有直接 mutation case。
    - 本輪驗收不得只新增 `_contains_forbidden_mutation` 後仍將 allowlist 判斷留在 `test_sql_statements_are_whitelisted_by_exact_shape`
      內；必須存在單一 `_validate_statement(statement)`（或明確等價 helper），同時執行完整 shape allowlist
      與全部 protected-table 檢查，正式 migration、五種合法 shape 與所有 mutation cases 都必須呼叫同一 helper。
    - 直接負向案例至少必須明確包含：合法 CREATE TABLE shape 後附加額外 SQL、兩種 CREATE TRIGGER 合法前綴改成 UPDATE／DELETE
      受保護表的非 SIGNAL body、inline `--`、`#`、block comment token-separator，以及 RENAME protected
      source 與 protected target；每筆須斷言 `_validate_statement` 拒絕。另須對五種合法 shape 各自斷言接受，不能只在迴圈讀正式
      migration 時間接通過。
    - '上述直接案例必須以測試內明確建構的 statement literal／fixture 呼叫 `_validate_statement`：五種合法 shape
      各呼叫一次且不拋錯；24 組交叉操作、RENAME 雙向與每個 comment／tail／非 SIGNAL body case 都必須使用 `with
