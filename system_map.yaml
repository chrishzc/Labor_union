    - 'command: {"argv": [".venv\\Scripts\\python.exe", "-m", "pytest", "tests\\test_order_lifecycle_state_history_schema.py",
      "-q", "-p", "no:cacheprovider"], "cwd": "project", "timeout": 60, "expect_exit":
