      transition_event: stage、classify、reclassify、reconcile、duplicate_occurrence、claim、resolve
        或 reopen
    output:
      validated_axes: canonical vocabularies
      transition_decision: allowed 或穩定拒絕原因
    invariants:
    - batch_status 只允許 staged、completed、failed，合法轉移為 staged→completed|failed。
    - occurrence_outcome 只允許 inserted、skipped_existing；只描述本次 occurrence，不得寫入 canonical
      classification/reconciliation 欄位。
    - classification_type 只允許 pending、client_receipt、government_subsidy、client_subsidy_return、staff_salary、staff_legacy_subsidy、non_business_review。
    - 正常 classification 為 pending→一個完成類型；自動 reclassification 只允許 eligible non_business_review→business
      classification 或 unchanged，business classification 不得自動倒退。
    - reconciliation_status 只允許 pending、reconciled，正常只可 pending→reconciled；正式退匯／沖正用
      append-only domain event，不將 staging 倒退。
    - alert_status 只允許 open、claimed、resolved，問題重現時 resolved 可 reopen；不得以 alert status
      取代 classification/reconciliation。
