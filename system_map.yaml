        exact keys=`state,protected_segment_refs`，state 只允許 bootstrap／unlocked／locked，refs
        為 canonical unique current:N list；bootstrap 時必須空、locked 時不得空。occupancy 為 canonical
        ordered list，每項 exact keys=`caregiver_ref,service_day,source_kind,source_segment_ref`；source_kind
        只允許 formal_service／waiting_deposit_lock／legacy_unresolved，同案 before ownership
        才可提供 current:N source_segment_ref，其餘必須 null。不得包含 schedule／assignment／lock／payment／settlement
        DB identity。
    output:
      transition_result: exact mapping keys=`canonical_intent,service_plan_transition,canonical_eligibility`；canonical_eligibility
        的 blocking／review diagnostics 是正常 business-conflict data，不是 exception。
      service_plan_transition: exact keys=`before,intent,after,impacts`。before／intent
        為 canonical defensive copies；invalid transition 時 after=null 且 impacts=null；valid
        時 after 使用與 before 相同 plan exact shape但 refs 可為 current:N／derived:N／substitute:N，impacts
        exact keys=`per_caregiver,total`。
      per_caregiver_impact: 每項 exact keys=`caregiver_ref,before_service_days,after_service_days,delta_service_days,before_service_hours,after_service_hours,delta_service_hours`，依
        typed caregiver ref canonical 升冪。
      total_impact: exact keys=`before_service_days,after_service_days,delta_service_days,before_service_hours,after_service_hours,delta_service_hours,required_service_days,required_total_hours`；所有
        delta 精確為 after-before，per-caregiver 合計必須等於 total。
      canonical_eligibility: exact keys=`transition_valid,applicable,blocking_diagnostics,review_diagnostics`。invalid
        時 false／false；valid 且 blocking 時 true／false；valid 且只有 review 或無 diagnostic
        時 true／true。
      diagnostic: 每項 exact keys=`code,scope_ref,facts`。scope_ref 只允許 case／transition／current:N／derived:N／substitute:N／item:N／service-day:YYYY-MM-DD。blocking
        code allowlist=`batch_leave_target_mismatch,batch_substitute_lineage_invalid,batch_substitute_date_duplicate,batch_original_staff_ownership_changed,batch_defer_shift_invalid,assignment_row_limit_exceeded,assignment_daily_ownership_invalid,historical_ownership_locked,formal_service_conflict,waiting_deposit_lock_conflict,service_commitment_mismatch`；review
        code allowlist=`historical_change_requires_review,legacy_ownership_requires_review`。
      diagnostic_facts: 只能使用 keys=`field,reason,expected,actual,service_day,segment_ref,segment_refs,original_segment_ref,caregiver_ref,source_kind,expected_defer_days,actual_defer_days,maximum_active_segments,actual_active_segments,expected_service_days,actual_service_days,expected_service_hours,actual_service_hours,database_current_date,effective_date`
        及 JSON-safe canonical values；不得含 display text、DB identity 或 temporary adapter
        identity。diagnostics 依 code、scope_ref、sorted-key compact JSON facts 升冪。
    invariants:
    - change_class=implements_existing_goal；本節點是 Batch before→after pure domain transition
      的唯一 owner，不新增跨 assignment batch、部分成功或薪資規則。
