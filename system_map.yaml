  MultiCaregiverAssignmentRules:
    type: service
    description: 以純函式驗證正式案件完整 assignment transition plan：套用後最多四個未取消區段、全案日期完整且單日唯一、依
      Server 判定的歷史營運 facts 分級保護 ownership、未來生效切段、休假後續區段順延、單日代班，以及同一 original assignment
      的多日期 aggregate 休假處置；同一月嫂可在代班前後持有不同不連續 assignment。
    source: services/multi_caregiver_assignment_rules.py::AssignmentPlanTransitionConflict,validate_non_overlapping_assignment_interval,validate_assignment_plan_transition
    domain: null
    subsystem: null
    map_file: system_map.md
    dependencies:
    - MultiCaregiverScheduleSchema
    - AssignmentScheduleLeaveSubstitutionEventSchema
    input:
      case_no: trim 後非空的案件編號
      database_current_date: 由交易服務在同一 transaction 取得的精確 date；本節點不得自行讀 clock
      effective_date: 本次未來生效日；defer_following_assignments 聚合多個休假日時為 canonical defer
        items 中最早的原始休假日期，batch_leave_resolution 時為 canonical batch 中最早的原始休假日期
      current_case_start_date: 變更前案件服務起日
      current_case_end_date: 變更前案件服務迄日
      proposed_case_start_date: 變更後案件服務起日
      proposed_case_end_date: 變更後案件服務迄日
      operation_kind: segment_reconfigure、single_day_substitute、defer_following_assignments
        或 batch_leave_resolution
      historical_fact_state: 由 Server 依 DB facts 判定的 bootstrap、unlocked 或 locked；不得接受
        API client 自報
      current_assignments: 現況 assignment exact rows，含 id、case/staff/status、區間、kind、original_assignment_id、substitution_work_date
      proposed_assignments: 套用後 existing id 或 new client key 的完整 assignment rows
    output:
      assignment_transition_plan: canonical before/after 案件區間與 assignment rows、created／retained／truncated／cancelled
        facts、effective_date、逐日唯一 ownership 與未來移除日期
      transition_conflict: AssignmentPlanTransitionConflict(code, details)，表示可預期、可轉成
        Preview canonical blocked reason 的規則拒絕。
    invariants:
    - 最多四個有效 assignment 區段；相同 staff 可在被代班隔開後再次出現，不得以 staff 唯一或 distinct staff 數實作上限。
    - 歷史日期是否可改不得只由 work_date 與 database_current_date 比較。historical_fact_state=bootstrap
      時可建立或重整尚無 assignment-owned schedule、休假／代班事件、人工時數調整、付款或月結 facts 的歷史配置；unlocked
      時可明確更正但必須由 Apply 寫 audit；locked 時不得直接改寫，必須走沖正、重新結算或獨立歷史更正流程。
    - historical_fact_state 必須由 Server 依 DB facts 判定，API client 不得傳入 allow_historical_edit、bootstrap
      或等價 bypass；本純函式只驗證 canonical enum，不自行讀 DB。
    - 不論 historical_fact_state，皆不得在未經明確歷史更正命令時 UPDATE 原 assignment.staff_id 轉移既有服務與薪資
      ownership；取消列保留但不占日期或四段。
    - database_current_date 必須保留資料庫實際日期，允許早於 current/proposed 案件區間或晚於兩者；不得要求其位於任一案件期間內，亦不得
      clamp、替換或推測。未來案件仍可預覽；案件結束後若無合法未來 effective_date，變更自然拒絕。
    - current 與 proposed 案件區間必須分別精確提供；不得以單一區間同時驗證 before/after。案件縮短不得移除 database_current_date
      前的歷史日期，案件延長不得改變既有歷史 ownership。
    - '`segment_reconfigure` 唯一可接受零筆 current assignments 作為首次正式配置 bootstrap；一旦存在任何有效
      current assignment，before 全期間覆蓋要求恢復生效。此差異節點維持 dirty，待查核是否要以專用 bootstrap operation
      取代現有例外。'
    - 代班一定是獨立單日 assignment 且連結 original_assignment_id/work_date；同日原與代班不得雙重 ownership。
    - defer_following_assignments 必須保持 assignment row 數、id、staff、status、kind、original_assignment_id、substitution_work_date、服務順序與區段連續性；D
      必須由 `proposed_case_end_date - current_case_end_date` 唯一推導且 `D >= 1`，不得接受額外 defer_days
      參數。effective_date 為最早原始休假日期且必須位於 affected assignment 變更前區間；affected assignment
      起日不變、迄日增加 D 天，所有後續 rows 起訖日均增加相同 D 天，更早 rows 完全不變。Batch caller 須另行證明 D 等於 canonical
      defer item 數及每個休假 schedule 的 exact ownership；所有新日期仍須由 caller 執行檔期、日期鎖與付款／月結門禁，D=1
      的輸出與拒絕行為不得改變。
    - batch_leave_resolution 不得改變 segment_reconfigure、single_day_substitute 或 defer_following_assignments
      的既有行為。所有 substitute rows 必須指向同一 original assignment、具有唯一日期／new key且恰一日；original
      staff formal fragments 必須完整持有其餘日期。D=0 時後續 existing rows 不得位移；D>=1 時後續 rows 必須等量位移
      D，且不得將 substitute 日重複計為 defer 補足日。
    - batch_leave_resolution 允許恰一筆或多筆 substitute rows；恰一筆 substitute 且 D=0 是合法的 pure-substitute
      transition。
    - batch_leave_resolution 的 well-formed 業務拒絕必須使用 AssignmentPlanTransitionConflict
      與固定 code：batch_leave_target_mismatch、batch_substitute_lineage_invalid、batch_substitute_date_duplicate、batch_original_staff_ownership_changed、batch_defer_shift_invalid、assignment_row_limit_exceeded、assignment_daily_ownership_invalid、historical_ownership_locked；details
      必須為 JSON-safe 且包含可定位的 assignment／日期／expected-actual facts。Malformed mapping、非法型別、未知欄位或
      dependency 不可能狀態仍以 ValueError 原樣失敗。
    - 調整草稿可暫時未達訂單總時數，但每次 Preview 必須重算並顯示差額；任何正式 Apply 都必須以最新資料驗證所有未取消 assignments
      的 actual_hours 總和精確等於訂單計畫時數（目前為 orders.service_days × orders.service_hours_per_day）。成功寫入後薪資直接由該正式排班自動計算；建立應付款或月結時再從最新正式資料重算，不另等待人工薪資確認。本純日期規則不得自行推測
      actual_hours。
    - 所有 schedule day 預設 is_double_pay=false；只有工會人員對明確 assignment_id、schedule_id、work_date
      手動設定且該日 is_work_day=true 時才可計入雙倍薪。國定假日不得自動啟用，薪資金額由 AssignmentPayrollReconciliationService
      核對。
    - deterministic pure；不得讀 DB/clock/env/filesystem，不計薪、不寫 assignment/schedule/event/payment。
    - 可預期的 assignment transition 拒絕必須拋出 AssignmentPlanTransitionConflict 並提供固定 code；不得要求
      caller 解析一般 ValueError 訊息。輸入型別錯誤或不可能狀態仍須明確區分，不得偽裝成可套用的 blocked plan。
    - 驗收須逐案覆蓋合法1–4／第5段、同 staff prefix-substitute-suffix、gap/overlap/左右越界、bootstrap/unlocked/locked
      歷史狀態、client 歷史 bypass、today/future split、單段與多段順延、D=1 相容、單段與多段 D=2／D=3、D<=0、affected／後續
      row 非等量位移、最早原始休假 effective_date 位於 affected row 與區間外拒絕、row count／id／staff／status／kind／original
      links／順序改寫拒絕、所有代班重用與 ownership 錯誤、batch_leave_resolution pure multi-substitute、substitute+D=1／D=2／D=3、duplicate
      substitute date、跨 original target、非法單日 lineage、D=0 後續零位移、四段／第五段 typed conflict、stable
      code/details、既有三種 operation 回歸、嚴格 mappings、穩定輸出與 AST capability guard。
    preferred_pattern: none
    verification:
    - 'command: {"argv": [".venv\\Scripts\\python.exe", "-m", "pytest", "tests\\test_multi_caregiver_assignment_rules.py",
      "-q", "-p", "no:cacheprovider", "--basetemp", "C:\\tmp\\pytest-multi-caregiver-assignment-rules"],
      "cwd": "project", "timeout": 60, "expect_exit": 0, "expect_stdout_contains":
      "passed"}'
    decisions: []
    todo: []
    checkpoint: []
    state: validated
    fan_in_snapshot: 11
  MultiCaregiverScheduleGenerationService:
    type: service
    description: 依一筆正式服務指派建立初始日層級排班，並以月嫂個別固定休假與國定假日計算初始 actual_hours。
    source: services/multi_caregiver_schedule_generation.py::generate_assignment_schedule
    domain: null
    subsystem: null
    map_file: system_map.md
    dependencies:
    - MultiCaregiverScheduleSchema
    - MultiCaregiverAssignmentRules
    input:
      assignment_id: 正式服務指派 id
    output:
      assignment_schedule: 僅屬於 assignment_id 的新增日層級排班列
      actual_hours: 初始工作日數乘 orders.service_hours_per_day 的結果
    invariants:
    - 同一訂單的不同月嫂不得有相同服務日期；同日分時段不支援。
    - 不得以 case_no 刪除排班、更新訂單整體結束日，或覆寫其他指派與 legacy 排班列。
    - 已存在同月嫂同日的其他案件、其他指派或 assignment_id 為 NULL 的 legacy 排班時必須拒絕，禁止 silent overwrite。
    - 重新執行同一指派時僅補足缺列，不得覆寫既有 is_work_day、is_double_pay 或 notes。
    - 已存在非 cancelled staff_payments 或有效月結明細的指派不得產生或重建排班，避免 actual_hours 與薪資快照不一致。
    - 已存在任何 actual_hours_adjustments 的指派不得重新計算或覆寫 actual_hours；必須要求人工覆核，不得以最新日層級排班取代已確認的
      assignment 級時數。
    - service_hours_per_day 缺漏、非數值、非有限值或小於等於零時，必須在新增排班列前 fail-fast；不得依賴外層 rollback
      掩蓋先寫後驗證。
    - 測試必須證明人工 actual_hours adjustment、付款鎖、月結鎖及無效 service_hours_per_day 均在任何 INSERT／UPDATE
      前拒絕，且 caller-owned cursor 路徑也沒有部分寫入。
    - 鎖定檢查必須對 `actual_hours_adjustments WHERE assignment_id = %s ... FOR UPDATE` 執行存在性查詢；不得以
      staff_payments 或月結查詢結果推測沒有人工調整。
    - 每日時數必須以 `Decimal(str(value))` 安全正規化，捕捉缺值、非數字及無效 Decimal，並以 `is_finite()` 拒絕
