    - apply 前必須驗證非空 backup、target database identity、orders row count 與必要來源欄；不得對未知或未備份資料庫執行。
    - backup 必須是含 MySQL dump header 及 target database marker 的 SQL artifact；任意非空檔、其他
      database dump 或無法雜湊的檔案不得通過。
    - apply 當下的 target server/database、orders/cancelled/bootstrappable/review counts、schema
      fingerprint 與 dataset fingerprint 必須與 plan receipt 完全相同；任何 dry-run 後漂移均停止。
    - lifecycle_version 只初始化為 0，不依 updated_at、event count 或 status 推算。
    - 只有 status=訂單取消且 cancel_reason trim 後非空的 legacy row可建立 deterministic legacy_status_bootstrap
      cancellation event/state；取消日期未知必須明記，不建立虛構 state transition history。
    - 缺取消原因的 cancelled row 只能列為 review_required，不得自動建立有效 cancellation；非取消案件不得建立 cancellation、reconfirmation
      或 hold control。
    - 不得由 actual_start_date、actual_end_date、schedule、assignment、system_alerts 或付款資料推測
      reconfirmation、completion、domain blocker 或 human hold。
    - 重跑 apply 必須 identical replay；相同 deterministic key 不同 payload、schema drift、row
      count drift 或 partial prior state皆 fail-closed。
    - cancellation reason 最長 500 字元，canonical payload UTF-8 最多 16384 bytes；超限列只能 review_required，禁止依賴
      MySQL 截斷。
    - migration 不得內嵌於 API startup、init_db 或一般 importer；失敗 rollback 並保留 receipt，不得重建或刪除
      DB。receipt 必須含 before/after schema fingerprint、event/state counts、plan hash、backup
      hash，以及以新 DB restore + DB_DATABASE 明確切換的回復說明。
