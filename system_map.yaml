  CaregiverMatchingPlanSchema:
    type: database_schema
    description: 建立洽談中訂單的單一或多月嫂配對方案 header 與一至四個連續服務區段；此節點只保存版本化配對結構，不保存聯繫／意願／履歷事件，也不建立等待訂金日期鎖定、正式
      assignment、正式排班或薪資資料。
