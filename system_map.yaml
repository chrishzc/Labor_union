    output:
      staff_schedule_assignment_reviews: 歷史排班或遷移時需要人工確認的歸屬覆核紀錄
    invariants:
    - '`staff_schedule.assignment_id` 為 NULL 時須保留既有排班相容性；非 NULL 時必須外鍵連回 `case_staff_assignments.id`。'
    - migration 必須可重跑且不得刪除、重建、覆寫或自動回填既有 `staff_schedule`；不得出現 INSERT、UPDATE、DELETE、REPLACE、TRUNCATE、DROP
      或 RENAME。
    - 不得只以欄位、索引、constraint 或資料表名稱存在就視為正確；同名錯誤與異名等價 metadata 必須 deterministic fail-closed。
    - 覆核表每個 `schedule_id` 最多一筆，且已解決列必須連回明確的 `resolved_assignment_id`；不得以候選推測取代人工決定。
    - 覆核狀態為 `review_required` 時 `resolved_assignment_id`、`resolved_by`、`resolved_at`
      必須皆為 NULL；狀態為 `resolved` 時三者必須皆非 NULL。
    - 不得放寬或重建既有 `staff_schedule.ukey_staff_date(staff_id, work_date)`；不得新增第二份 assignment-date
      unique，該約束由 AssignmentScheduleIntegrityMigration 擁有。
