  ApiContractSmokeRunner:
    type: script
    description: 唯讀、可重複執行的 OpenAPI API smoke 與 response contract 驗證工具；接受 runtime URL、正式
      auth headers 與參數 fixture，預設只執行 GET 並展開集合型路徑，輸出可機讀報告以快速定位 401、403、404、422、500、BaseResponse
      及 OpenAPI response schema 錯誤。
    source: scripts/api_contract_smoke.py
    domain: null
    subsystem: null
    map_file: system_map.md
    dependencies:
    - APILayer
    input:
      base_url: 目標 API base URL；預設 http://127.0.0.1:8000。
      internal_api_key: 可由 CLI 或環境變數提供的 internal service key；不得寫入報告。
      bearer_token: 可由 CLI 或環境變數提供的管理員 session token；不得寫入報告。
      fixtures_file: 可選 JSON，提供 path/query 參數與集合型端點展開值。
      include_pattern: 可選 endpoint path 篩選。
      allow_writes: 預設 false；只有明確指定時才允許非 GET/HEAD/OPTIONS。
    output:
      report: JSON 報告，逐請求保存 method、resolved path、status、契約結果與去敏感化 detail。
      summary: 依 pass、auth、client、server、schema、transport 分類的統計。
      exit_code: 所有已測端點符合預期為 0；任何非預期 HTTP 或 response contract 錯誤為非零。
    invariants:
    - 預設只能執行 GET、HEAD、OPTIONS；不得因 OpenAPI 存在寫入 method 就自動送出 POST、PUT、PATCH 或 DELETE。
    - internal key、Bearer token、Authorization header、Cookie 與其他憑證不得出現在 stdout、JSON
      report、exception 或 URL。
    - 401 必須分類為 internal key 缺失/錯誤、Bearer 缺失/失效，403 必須分類為角色不足；無法由 response detail
      判定時標記 auth_unknown，不得猜測。
    - 必須驗證 JSON 形狀、BaseResponse success/data/error 契約與 OpenAPI 宣告的成功 response schema；HTTP
      200 不得直接視為通過。
    - Data Browser 集合型路徑必須展開正式可讀表清單逐一測試，不得只用 sample 取代 table path 參數。
    - 任一必要 path/query 參數缺少 fixture 時必須標記 skipped_missing_fixture，不得送出猜測可能造成誤判的請求。
    preferred_pattern: none
    verification:
    - 'command: {"argv": [".venv\\Scripts\\python.exe", "-m", "pytest", "tests\\test_api_contract_smoke.py",
      "-q", "-p", "no:cacheprovider"], "cwd": "project", "timeout": 60, "expect_exit":
      0, "expect_stdout_contains": "passed"}'
    - 'command: {"argv": [".venv\\Scripts\\python.exe", "-m", "py_compile", "scripts\\api_contract_smoke.py"],
      "cwd": "project", "timeout": 60, "expect_exit": 0}'
    decisions: []
    todo: []
    checkpoint: []
    state: validated
    fan_in_snapshot: 0
    known_symbols:
    - _auth_kind
    - _detail
    - _expand_operations
    - _json_schema
    - _load_fixtures
    - _matches_filters
    - _operation_fixture
    - _redact
    - _response_spec
