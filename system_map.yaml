      sentinel fail-closed、零修復 DDL。
    - 測試必須覆蓋 assignment canonical 外鍵欄位／目標正確但 ON UPDATE 或 ON DELETE action 錯誤的情境；不得將其誤判為
      exact match。
    - 日期區段不得重疊、月嫂請假隔離、排班生成與實際時數計算均由後續服務節點執行；本 Schema 不實作該等商業規則。
