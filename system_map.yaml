  AssignmentScheduleLeaveSubstitutionDomainTransitionRulesAdapter:
    type: internal_helper
    description: 將純 ServicePlanTransition 的 opaque segment refs、canonical daily ownership
      與 leave intent 暫時投影為既有 Assignment Rules 驗證格式，再將結果映回 pure-domain after plan／stable
      diagnostics；adapter identity 不得外洩。
    source: services/assignment_schedule_leave_resolution_preview.py::validate_assignment_leave_resolution_domain_transition
    domain: Services
    subsystem: null
    map_file: services\services_system_map.md
    dependencies:
    - MultiCaregiverAssignmentRules
    input:
      case_ref: canonical 案件業務 reference；只接受typed bool、non-bool int或exact non-empty
        str，不接受其他型別或跨型別coercion。
      database_current_date: Server canonical business date。
      historical_fact_state: bootstrap、unlocked 或 locked。
      before_service_plan: exact keys為segments／daily_ownership／service_period；segment
        exact keys為segment_ref／caregiver_ref／status／service_period／segment_kind／lineage，且segment_ref只允許current:N。
      canonical_leave_intent: exact keys為original_segment_ref／items；item exact keys為item_ref／service_day／resolution／substitute_caregiver_ref，依canonical
        batch ordinal排列。
      candidate_after_service_plan: 與before相同pure shape；segment_ref只允許current:N、derived:N、substitute:N。
    output:
      rules_result: valid bool、validated after_service_plan（transition invalid 時為
        null）與依 stable code／scope_ref／business facts 排序的 transition_diagnostics。
    invariants:
    - deterministic pure；不得讀 DB、clock、env、filesystem、取得 mutex、管理 transaction或修改輸入。
    - pure plan exact key sets：plan=segments／daily_ownership／service_period；service_period=start／end；segment=segment_ref／caregiver_ref／status／service_period／segment_kind／lineage；lineage=original_segment_ref／substitution_service_day；ownership=service_day／segment_ref／caregiver_ref；intent
      item=item_ref／service_day／resolution／substitute_caregiver_ref。missing／extra
      key一律拒絕。
    - status只允許planned／active／completed／replaced／cancelled；segment_kind只允許formal／single_day_substitute／substitute；resolution只允許defer／substitute；datetime不得當date截斷。
    - per-call mapping必須deterministic、bijective且input-order independent；bool、int、str
      identities不得以Python equality或stringification合併。
    - temporary adapter identity 不得出現在 output、Preview、fingerprint、Apply authorization或
      audit。
    - 不得將 DB／generated ID、batch／event key、actor、reason、SQL action或 persistence payload放入
      pure model。
    - current:N 只能指向 before plan既存 segment；derived:N 只能指向原照顧者 formal fragment；substitute:N
      必須與 canonical substitute item 一一對應。
    - daily ownership 是一級 canonical state；每個服務日必須恰有一個 segment_ref 與 caregiver_ref，不得只由區間隱性推測。
    - Rules 回傳 shape 必須與 candidate refs、lineage、服務期間與 daily ownership 完全一致，否則視為 dependency
      contract violation。
    - Rules不得成為after-plan產生器或normalizer；reverse result若不完全等於candidate，不回傳Rules改寫版。
    - invalid transition 必須 after_service_plan=null；本 adapter 不判斷 availability、active
      lock、payment、settlement 或 review eligibility。
    - pure diagnostic exact keys為code／scope_ref／facts；code只允許batch_leave_target_mismatch／batch_substitute_lineage_invalid／batch_substitute_date_duplicate／batch_original_staff_ownership_changed／batch_defer_shift_invalid／assignment_row_limit_exceeded／assignment_daily_ownership_invalid／historical_ownership_locked。
    - scope_ref只允許case／transition／current:N／derived:N／substitute:N／item:N／service-day:YYYY-MM-DD；facts
      keys只允許field／reason／expected／actual／service_day／segment_ref／segment_refs／original_segment_ref／expected_defer_days／actual_defer_days／maximum_active_segments／actual_active_segments／database_current_date／effective_date，且值必須JSON-safe並不得含temporary
      Rules identity。
    preferred_pattern: none
    verification:
    - 'command: {"argv": [".venv\\Scripts\\python.exe", "-m", "pytest", "tests\\test_assignment_rest_date_service.py",
      "-k", "batch_leave_resolution_domain_rules_adapter", "-q", "-p", "no:cacheprovider",
      "--basetemp", "C:\\tmp\\pytest-assignment-leave-domain-rules-adapter"], "cwd":
      "project", "timeout": 90, "expect_exit": 0, "expect_stdout_contains": "passed"}'
    decisions: []
    todo: []
    checkpoint: []
    state: planned
    fan_in_snapshot: 1
  OrderRouter:
    type: api_router
    description: 訂單查詢、基本資料、時程精算、多月嫂指派同步與typed lifecycle commands API；通用status writer退役，取消、真正開始日重確認、hold與correction只委派各自Service。
    source: api/routes/orders.py
    domain: API
    subsystem: null
    map_file: api\api_system_map.md
    dependencies:
    - DbService
    - OrderSchemas
    - OrderAssignmentSynchronizationPreviewService
    - OrderAssignmentSynchronizationApplyService
    - OrderCancellationCommandService
    - OrderActualStartReconfirmationCommandService
    - OrderLifecycleHoldCommandService
    - OrderLifecycleManualCorrectionService
    - OrderLifecycleControlReadProjection
    - AdminAuthorizationDependency
    input:
      case_no: path 中的 canonical order identifier。
      preview_request: 包含排班關鍵欄位與可編輯訂單主資料完整目標值的 order_change，以及完整明確 assignment_plan。
      apply_request: preview_request 加上完整 schedule_change_plan.remove_schedule_ids
        與非空 applied_by。
      lifecycle_commands: cancel、actual-start reconfirm、hold activate/release或manual
        correction的typed body，均含expected_version、idempotency key、actor與reason；actual-start
        reconfirm另含Calendar Preview確認的完整order_change、assignment_plan與schedule_change_plan。
      lifecycle_control_query: case_no path 與 authenticated system-admin principal；不得接受
        client 自報的 control、blocker 或 lifecycle_version。
    output:
      synchronization_preview: target hours、指派時數影響、required_schedule_removals、sync_status
        與 blocking_reasons。
      synchronization_apply_result: 已套用結果、排班生成摘要、時數確認與 audit_id。
      lifecycle_command_result: Router先將Service的dataclass、Mapping、tuple、date/datetime與Decimal遞迴轉為JSON-safe
        primitive，再以BaseResponse回傳decision、persisted_version、control/history/outbox
        identities；不得以str()壓平或遺失欄位。
      lifecycle_command_conflict: HTTP 409 detail固定為`{code,message}`；code只允許`order_lifecycle_version_conflict`、`order_lifecycle_idempotency_conflict`、`order_lifecycle_state_conflict`或`order_lifecycle_blocked`。
      lifecycle_control_state: authoritative lifecycle_version、目前 canonical status、actual-start
        reconfirmation control 的 active/cleared 狀態、required/current date、canonical
        blockers 與 can_reconfirm。
    invariants:
    - 兩個同步端點不得直接呼叫 db_service 寫入 orders、case_staff_assignments、staff_schedule、付款、月結或稽核表；所有同步商業操作只能委派對應服務。
    - Preview 必須是唯讀；Apply request 必須同時提供完整 assignment_plan、schedule_change_plan.remove_schedule_ids
      與非空 applied_by，缺少時不得呼叫 Apply 服務。
    - 同步端點不得自行寫入訂單或客戶主資料；更新必須由 Apply service 的單一 transaction 完成。EditOrderUI 不得以 `/full-details`
      先寫入同一份同步變更。
    - API 不得接受 clients.identity_status 或 identity_status；身分資格只能由服務層依 case_no 關聯 clients.identity_status
      讀取。
    - Router 不得建立第二個 FastAPI app 或重複註冊；必須沿用既有 `/api/v1/orders` router 與 BaseResponse
      包裝。
    - Preview／Apply routes 都必須使用 `Depends(require_system_admin)`；Apply 只以 authenticated
      principal 的 canonical username 委派 Service，client applied_by 不一致回 403。
    - '`/full-details` 不得接受或寫入 service_days、service_hours_per_day、floor_fee、start/end/actual
      dates 或 deposit_date；這些 staffing-sensitive 欄位只由 assignment-synchronization Preview／Apply
      transaction 更新。'
    - 所有lifecycle mutation必須使用Depends(require_system_admin)，body actor必須等於authenticated
      principal；expected_version mismatch、idempotency conflict或blocked command回409並保留machine
      code。
    - actor比較使用trim後authenticated principal canonical username；body actor本身必須已是trim後canonical值，不得由Router靜默改寫冒用者輸入。
    - 未知exception固定回generic 500，不得把資料庫SQL、連線資訊、event payload或內部str(error)洩漏至HTTP response。
    - Router不得接受derived blockers、Alert status、cancellation fact、deposit state、completion
      flag或outbox action；這些一律由Server canonical sources推導。
    - 取消endpoint不得直接呼叫CaregiverAvailabilityLockCancellationService；只呼叫OrderCancellationCommandService，讓有／無waiting
      lock皆走同一canonical cancellation。
    - lifecycle-control-state 必須使用 Depends(require_system_admin)，只讀 canonical persistence/control
      facts；Router 不得以 alert、orders.status 字串、前端草稿或日期自行推導 can_reconfirm。
    - lifecycle-control-state 是純查詢：Router 與 Projection 都不得取得寫鎖、寫入、commit、建立事件、更新 alert
      或推進 lifecycle version。
    preferred_pattern: none
    verification:
    - 'command: {"argv": [".venv\\Scripts\\python.exe", "-m", "pytest", "tests\\test_order_assignment_synchronization_router.py",
      "tests\\test_order_assignment_synchronization_app_routes.py", "tests\\test_order_lifecycle_command_router.py",
      "tests\\test_order_lifecycle_control_read_router.py", "-q", "-p", "no:cacheprovider",
      "--basetemp", "adad_tmp\\pytest-order-router-batch"], "cwd": "project", "timeout":
