    type: domain_contract
    description: 定義 IMP-01 的 batch、occurrence outcome、classification、reconciliation
      與 alert 五個正交狀態軸及合法轉移，避免把 skipped_existing／review／pending 混成單一狀態。
    source: services/finance_import_states.py
