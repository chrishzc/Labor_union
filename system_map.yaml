      orders`，且逐筆以 `pytest.raises` 呼叫 `_validate_statement`；只列 `/**/` 的 ALTER／UPDATE／DELETE
      三案不符合。
    - 最終收斂驗收：RENAME source/target 測試迴圈必須對每個受保護表分別以 `pytest.raises` 呼叫 `_validate_statement("RENAME
      TABLE <protected> TO harmless")` 與 `_validate_statement("RENAME TABLE harmless
      TO <protected>")`；只對 `_contains_forbidden_mutation` 做 bool assert 不符合。
