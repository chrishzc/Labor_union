        為 ordered list，每項 exact keys=`segment_ref,caregiver_ref,status,service_period,segment_kind,lineage`
        且 before 只允許 current:N；segment service_period exact keys=`start,end`，lineage
        exact keys=`original_segment_ref,substitution_service_day`。daily_ownership
