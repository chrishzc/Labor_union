    - D 必須精確等於 defer item 數；每個 substitute item 恰有一個 substitute:N；substitute 同日不得讓原與代班
      caregiver雙重 ownership。
    - well-formed business decision 必須保留完整 absolute before、intent及after candidate與canonical
      diagnostics；不得用exception表示 blocked／requires_review。只有無法形成well-formed absolute
      candidate的malformed／integrity failure可無after並拋typed exception。
