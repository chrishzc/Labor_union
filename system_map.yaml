  AssignmentScheduleRestDateRouter:
    type: api_router
    description: 保留既有 assignment 排休更新與單日休假 action，並提供 atomic batch 休假順延／代班 Preview／Apply
      強型別 action；單日與 Batch Preview／Apply 均要求正式 system-admin，Apply 另比對 actor。
    source: api/routes/assignment_schedule_rest_dates.py
    domain: API
    subsystem: null
    map_file: api\api_system_map.md
    dependencies:
    - AssignmentScheduleRestDateService
    - OrderSchemas
    - AssignmentScheduleLeaveSubstitutionPreviewOrchestration
    - AssignmentScheduleLeaveSubstitutionApplyOrchestration
    - AssignmentScheduleLeaveSubstitutionBatchPreviewOrchestration
    - AssignmentScheduleLeaveSubstitutionBatchApplyOrchestration
    - AdminAuthorizationDependency
    - AssignmentLeaveResolutionExceptionHandler
    input:
      legacy_update: PUT /api/v1/assignment-schedules/{assignment_id}/rest-dates，body
        為 AssignmentRestDatesUpdateRequest；既有語意必須保持相容。
      leave_resolution_preview: POST /api/v1/assignment-schedules/{assignment_id}/rest-dates/leave-resolution/preview，body
        為 AssignmentLeaveResolutionPreviewRequest。
      leave_resolution_apply: POST /api/v1/assignment-schedules/{assignment_id}/rest-dates/leave-resolution/apply，body
        為 AssignmentLeaveResolutionApplyRequest。
      batch_leave_resolution_preview: POST /api/v1/assignment-schedules/{assignment_id}/rest-dates/leave-resolution/batch-preview，body
        為 AssignmentLeaveResolutionBatchPreviewRequest。
      batch_leave_resolution_apply: POST /api/v1/assignment-schedules/{assignment_id}/rest-dates/leave-resolution/batch-apply，body
        為 AssignmentLeaveResolutionBatchApplyRequest。
      auth_context: 單日與 Batch Preview／Apply 全部使用 Depends(require_system_admin)；Apply
        另比對 actor。所有 action 的 path assignment_id 必須等於 body.original_assignment_id。
    output:
      legacy_response: BaseResponse[Dict[str, Any]]，維持既有 contract。
      preview_response: 完整傳遞 Server canonical preview，含 ready／blocked／requires_review、preview_fingerprint、conflicts、assignment
        impacts 與 requires_confirmation。
      apply_response: 完整傳遞 applied／idempotent_replay 與 canonical event、assignment、schedule、actual-hours、payroll
        snapshots。
      batch_preview_response: 完整傳遞單一 aggregate ready／blocked／requires_review preview、canonical
        items／ordinals 與單一 preview_fingerprint。
      batch_apply_response: 完整傳遞 applied／idempotent_replay、batch header、依 ordinal
        排序的逐日 events 與 canonical assignment／schedule／actual-hours／payroll snapshots。
      error_response: 由AssignmentLeaveResolutionExceptionHandler統一產生typed machine-readable
        detail；Router不產生技術錯誤response
    invariants:
    - Router 只能進行輸入驗證、認證/授權檢查與委派，禁止直接執行 SQL 或商業邏輯。
    - Preview 只能委派 AssignmentScheduleLeaveSubstitutionPreviewOrchestration；Apply 只能委派
      AssignmentScheduleLeaveSubstitutionApplyOrchestration，不得在 Router 重算 Preview、fingerprint、歷史狀態、檔期、ownership、工時或薪資。
    - Batch Preview 只能委派 AssignmentScheduleLeaveSubstitutionBatchPreviewOrchestration；Batch
      Apply 只能委派 AssignmentScheduleLeaveSubstitutionBatchApplyOrchestration，不得逐項呼叫單日
      endpoint／Service 或在 Router canonicalize、排序、去重、派生 ordinal／event_key。
    - API client 不得提交 provisional plan、historical_fact_state、availability、lock、payroll、double-pay、ownership
      或其他 Server facts。
    - path assignment_id 與 body.original_assignment_id 不一致時回 422 且不得呼叫 Service。
    - Apply body.actor 必須等於 authenticated principal 的 canonical identity；不一致回 403。認證
      dependency 的 401／403／503 必須原樣傳遞。
    - 單日 Preview 與 Batch Preview 必須和 Apply 一樣要求 require_system_admin；認證 dependency
      的 401／403／503 原樣傳遞。
    - Preview ready／requires_review 回 200，blocked 回 409；Apply applied／idempotent_replay
      回 200。
    - Batch Preview與Batch Apply的blocked／requires_review／stale confirmation是正常business
      result；blocked回409並保留完整conflicts，requires_review與需重新confirmation的result不得建構exception。
    - Preview canonical blocked 必須直接依 result.status 回 409 並保留完整 blocking_reasons 與
      canonical facts；不得先改包成 DomainError。requires_review 必須維持 200。
    - typed AssignmentLeaveResolutionDomainError 的 HTTP mapping 只能由集中 handler 擁有；Router
      只允許處理 transport validation、正常 business result 與未型別化的 unexpected failure。
    - malformed Server facts、dependency contract violation、DB或infrastructure failure不得降級為business
      conflict或4xx。
    - 錯誤回應必須保留 machine-readable status／reason，不得只回傳人類字串。
    - 不得建立 transaction、commit、rollback、鎖資料，或建立／更新／取消 payment、settlement、assignment、schedule
      或 event。
    - 既有 legacy PUT 與單日 Preview／Apply paths、models、event_key、response 與錯誤映射必須保持不變；Batch
      只能新增上述兩條明確 action paths。
    preferred_pattern: none
    verification:
    - 'command: {"argv": [".venv\\Scripts\\python.exe", "-m", "pytest", "tests/test_assignment_rest_date_service.py",
      "-k", "leave_resolution_router", "-q", "-p", "no:cacheprovider", "--basetemp",
      "C:\\tmp\\pytest-assignment-leave-router"], "cwd": "project", "timeout": 60,
      "expect_exit": 0, "expect_stdout_contains": "passed"}'
    decisions: []
    todo: []
    checkpoint: []
    state: planned
    fan_in_snapshot: 1
    known_symbols:
    - _raise_retired
    - apply_assignment_leave_resolution_batch_route
    - apply_assignment_leave_resolution_route
    - preview_assignment_leave_resolution_batch_route
    - preview_assignment_leave_resolution_route
    - save_assignment_rest_dates
