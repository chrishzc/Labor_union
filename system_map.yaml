      改寫及 segment 刪除；不得只依賴服務層自律、註解或測試字串。
    - 每個 CREATE TRIGGER 必須能由現有 DatabaseSchemaLoader 當成單一完整 statement 交給 MySQL：不得需要
      DELIMITER、BEGIN／END、IF／END IF 或 trigger body 內部分號；測試必須檢查 loader 擷取出的四個 CREATE
      TRIGGER statement 完整且不含被切斷的片段。
    - migration 必須可重跑且只能新增本節點擁有的表、索引、外鍵與約束；不得修改、回填或刪除 matching_records、orders、case_staff_assignments
      或 staff_schedule 的既有資料。
