    - FinanceImportReprocessingSchema
    input:
      repository_fixture: '`document/資料庫、資料處理/歷史對帳單.xlsx`，目前固定 1 筆 legacy 流水'
      deterministic_recovery_fixture: 可重建 2659 occurrences／2655 distinct rows、2058
        incoming invalid-or-missing-VA、597 outgoing staff-no-match，且 incoming 中 279
        筆具有有效 canonical virtual account 的隔離 DB fixture
      target_host_evidence: ASUS 目標 DB identity、completed batch_id 與重處理前唯讀基線；不在本機
        DB 時必須明確標示 not_executed，不得以 repository fixture 代替
    output:
      component_results: import、dispatch、reprocess、audit、IMPORT-006、scan 與 CLI assertions
      deterministic_counts: occurrence、distinct、eligible、changed、unchanged、dispatch
        attempted/reconciled/pending 與 remaining direction/reason counts
      target_host_acceptance: passed、failed 或 not_executed，以及不含敏感資料的 DB/batch evidence
    invariants:
    - repository fixture 必須維持 1 筆 non_business_review、reason=sinopac_staff_account_no_match，不建立正式帳務；測試不得以姓名「張淑婷」建立
      identity。
    - deterministic recovery fixture 的 dry-run 必須得到 occurrence=2659、distinct=2655、selected=2655、changed=279、unchanged=2376、IMPORT-006
      remaining=2376、incoming=1779、outgoing=597；dry-run 結束後所有 classification、run/event、正式交易、finance/system
      alerts 必須與執行前完全相同。
    - dry-run 產生的 plan fingerprint 必須可由同 DB/batch 未漂移狀態用於 apply；任一 DB identity、classifier
      version、row membership 或 before/after tuple 漂移必須在副作用前 fail-closed。
    - apply 必須只為 279 個 changed rows 寫 append-only events 並透過 FinanceImportDispatchService
      嘗試 dispatch；reconciled 可小於 279，remaining 2376 才屬 IMPORT-006，business pending
      只能進既有 finance alert 流程。
    - apply 後相同 plan replay 必須回 existing，run/event、正式交易與 alert 數量不增加；不同 plan 或部分殘留必須
      conflict/rollback，不得補成表面成功。
    - IMPORT-006 每 batch 最多一筆，details 需符合 bounded/privacy 契約；historical scan 只 materialize
      current-state alert，不得重分類或 dispatch；remaining=0 時 open/claimed 可自動 resolved，問題重現時
      resolved 必須 reopen。
    - import 與 reprocess 的正式帳務路徑必須能以 spy/contract assertion 證明呼叫同一 FinanceImportDispatchService；不得只比較最終資料而容許兩套私有
      dispatch。
    - 兩個 CLI stdout 必須為 bounded summary；只有明確 report_path 才可寫 strict UTF-8、無 BOM、最多
      safety_limit 筆且無姓名／完整帳號／raw_payload／secret 的 JSON report。
