  DatabaseSnapshotFixtureV2Serializer:
    type: module
    description: 將 DB snapshot 的日期、datetime、Decimal、NULL、boolean、JSON、Unicode 與前導零字串轉為
      deterministic tagged JSON，產生固定欄位順序、row order、JSONL bytes、逐檔 SHA-256 與 canonical
      manifest checksum。
    source: scripts/db_snapshot_fixture_v2_serializer.py
    domain: null
    subsystem: null
    map_file: system_map.md
    dependencies: []
    input:
      table_spec: 固定欄位順序、row sort key、business key 與 source-id metadata 規格。
      rows: 已由 exporter 查得且待 canonicalize 的 table rows。
      table_file_metadata: table 名稱、row count 與輸出相對路徑。
    output:
      jsonl_bytes: UTF-8、LF 換行、固定 key order 的 canonical JSONL bytes。
      file_sha256: canonical JSONL 的小寫 SHA-256。
      manifest_bytes: 不含執行時間或環境資訊的 canonical manifest bytes。
      snapshot_checksum: 依固定 table order 與逐檔 checksum 計算的整體 checksum。
    invariants:
    - 相同輸入必須產生 byte-for-byte 相同輸出；不得讀取時鐘、亂數、環境變數、DB 或 filesystem metadata。
    - 必須明確區分 NULL、空字串、boolean、integer、Decimal、date、datetime、JSON object/list 與一般字串；不得讓
      Excel／float coercion 改變值。
    - Decimal 必須以不使用科學記號的固定字串保存；date 使用 YYYY-MM-DD，datetime 使用固定秒精度 ISO-8601。
    - JSON object 必須遞迴排序 key；table row 依 table_spec.sort_key 穩定排序，欄位依 table_spec.columns
      固定排序。
    - 每列必須包含 __row_key、__row_sha256 與可空 __source_id metadata；source id 不得成為 canonical
      business identity。
    - JSONL 使用 ensure_ascii=false、UTF-8、緊湊 separators 與 LF；空 table 產生零 byte table
      file但仍必須有 checksum。
    - manifest 不得包含 exported_at、來源 DB、帳密、路徑絕對值或其他每次執行漂移資訊。
    - serializer 不得 import 或呼叫 GenerateFakeData，不得建立 DB connection，不得寫入正式 fixture
      目錄。
    preferred_pattern: none
    verification:
    - 'command: {"argv": [".venv\\Scripts\\python.exe", "-m", "pytest", "tests\\test_db_snapshot_fixture_v2_serializer.py",
      "-q", "-p", "no:cacheprovider", "--basetemp", "C:\\tmp\\pytest-db-snapshot-v2-serializer"],
      "cwd": "project", "timeout": 60, "expect_exit": 0, "expect_stdout_contains":
      "passed"}'
    - 'command: {"argv": [".venv\\Scripts\\python.exe", "-m", "py_compile", "scripts\\db_snapshot_fixture_v2_serializer.py"],
      "cwd": "project", "timeout": 60, "expect_exit": 0}'
    decisions: []
    todo: []
    checkpoint: []
    state: planned
    fan_in_snapshot: 2
    known_symbols:
    - _json
    - build_manifest
    - encode_tagged_value
    - serialize_table
  DatabaseSnapshotFixtureV2Validator:
    type: module
    description: 對 exporter 讀取的固定 50 案 snapshot 執行純資料驗證，確認 case coverage、日期血緣、bundle
      內 FK、生命週期與指定 boundary facts、finance staging cardinality，不修正來源資料。
    source: scripts/db_snapshot_fixture_v2_validator.py
    domain: null
    subsystem: null
    map_file: system_map.md
    dependencies:
    - ClientHcmInsertOnlyImporter
    - PaymentSchema
    - MultiCaregiverScheduleSchema
    - StaffMonthlySettlementSchema
    - StaffMonthlySettlementDetailSchema
    - StaffActualTransferSchema
    - StaffTransferAllocationSchema
    - FinanceImportRawStagingSchema
    input:
      tables: 依固定 allowlist 取得的 table name 至 rows 映射。
      reference_case_range: 固定為 115000001 至 115000050。
    output:
      validation_report: case coverage、staff count、日期血緣、FK、boundary facts、finance
        staging 與 table counts。
    invariants:
    - 必須完整且只接受 clients/orders 案號 115000001 至 115000050；缺號、重複或額外案件一律失敗。
    - staff 必須固定 50 筆；所有 exported FK 與 business reference 必須能在 tables 內解析，不得接受孤兒資料。
    - 每筆 orders.start_date 必須等於對應 clients.service_start_date 的正規化日期；不得修正或 fallback。
    - 每筆 orders.end_date 必須使用 ClientHcmInsertOnlyImporter 相同規則，由 start_date、orders.service_days、clients.service_type
      與固定 holidays 計算；不得只驗起日而保留過期迄日。
    - 必須驗證 115000003、115000004、115000008、115000009 的多月嫂交接，115000005 的取消退款且無 assignment/schedule，以及
      115000018 至少一個雙薪日。
    - 115000013 的超收必須以 first_payment 階段判定：應收 2500、摘要實收 3000，且恰有 3 筆 succeeded receipt、每筆
      1000；成功交易合計必須等於階段摘要實收。
    - 115000014 的超收必須以 second_payment 階段判定：應收 2500、摘要實收 3000，且恰有 1 筆 succeeded receipt
      3000；成功交易合計必須等於階段摘要實收。
    - 不得以全案 amount_received 大於 amount_receivable 判定階段超收；其他階段尚未到期或尚未收款時，全案實收可合理小於全案應收。
    - finance staging 必須為 2 batches、1 canonical row、2 occurrences，且 canonical fingerprint
      非空並由 occurrences 共同引用。
    - 必須驗證 assignment、schedule、staff payment、settlement detail、transfer allocation
      的 bundle 內 FK 與基本 ownership 一致性。
    - validator 是純函式資料檢查；不得開 DB、寫檔、修改輸入 rows、建立 alert/event 或呼叫 GenerateFakeData。
    preferred_pattern: none
    verification:
    - 'command: {"argv": [".venv\\Scripts\\python.exe", "-m", "pytest", "tests\\test_reset_fake_database.py::test_preview_validates_v3_without_reset",
      "-q", "-p", "no:cacheprovider", "--basetemp", "C:\\tmp\\pytest-db-snapshot-v3-validator"],
      "cwd": "project", "timeout": 60, "expect_exit": 0, "expect_stdout_contains":
      "passed"}'
    - 'command: {"argv": [".venv\\Scripts\\python.exe", "-m", "py_compile", "scripts\\db_snapshot_fixture_v2_validator.py"],
      "cwd": "project", "timeout": 60, "expect_exit": 0}'
    decisions: []
    todo: []
    checkpoint: []
    state: dirty
    fan_in_snapshot: 3
    known_symbols:
    - _date
    - _fail
    - validate_snapshot_fixture_v2
  FixtureOrderDateReconciliationV2:
    type: script
    description: 在匯出固定 snapshot 前，將測試 DB 中固定 50 案 orders 的預計起訖日對齊 clients.service_start_date
      與既有服務規則；預設只做 check，只有明確 apply 才在單一 transaction 更新 planned dates。
    source: scripts/reconcile_fixture_order_dates_v2.py
    domain: null
    subsystem: null
    map_file: system_map.md
    dependencies:
    - ClientHcmInsertOnlyImporter
    - DatabaseSnapshotFixtureV2Validator
    input:
      mode: 預設 check；只有明確 --apply 才允許 UPDATE。
      database_config: 來源測試 DB 連線設定。
      reference_case_range: 固定為 115000001 至 115000050。
    output:
      reconciliation_report: scanned、unchanged、would_update／updated、invalid、conflicts、每案
        before/after planned dates 與 status。
    invariants:
    - 只能處理 clients/orders 皆存在且案號完整等於 115000001 至 115000050 的測試 fixture；缺號、重複、額外案件或孤兒資料一律
      fail-closed。
    - 預設 check 模式不得執行 UPDATE、INSERT、DELETE、REPLACE、TRUNCATE 或 DDL，最後必須 rollback 並關閉
      connection。
    - apply 模式只可更新 orders.start_date 與 orders.end_date；不得修改 clients、orders 其他欄位、actual
      dates、status、service_days、assignments、schedule、付款、帳務或 staging facts。
    - start_date 必須直接使用 clients.service_start_date 的正規化日期；缺少或無法解析時整批失敗，不得猜測。
    - end_date 必須使用 ClientHcmInsertOnlyImporter 相同規則，以 start_date、現有 orders.service_days、clients.service_type
      與 holidays 計算；開始日可出勤即算第 1 日。
    - 週休1日排除週日、週休2日排除週六與週日、連續服務不排固定週休，holidays 表日期一律順延。
    - apply 必須先鎖定 50 筆 orders 並保存 before values；UPDATE 使用 optimistic before-value
      guard，任一 rowcount 不等於 1 或資料競態即 rollback 全批。
    - apply 更新後必須在 commit 前重新查詢並確認 50 筆日期全部符合預期；任一不符整批 rollback。
    - 腳本不得 import、呼叫或解除 frozen GenerateFakeData，不得建立或修改 schema。
    preferred_pattern: none
    verification:
    - 'command: {"argv": [".venv\\Scripts\\python.exe", "-m", "py_compile", "scripts\\reconcile_fixture_order_dates_v2.py"],
      "cwd": "project", "timeout": 60, "expect_exit": 0}'
    decisions: []
    todo:
    - 新增使用 fake connection 的可重複 reconciliation pytest；已移除依賴目前固定 50 案資料庫狀態的一次性驗收。
    checkpoint: []
    state: dirty
    fan_in_snapshot: 0
    known_symbols:
    - _d
    - main
    - reconcile
  DatabaseSnapshotFixtureV2Exporter:
    type: script
    description: 從已驗證的 50 案測試 DB 以一致性唯讀 snapshot 匯出版本化、byte-stable 的 JSONL fixture
      bundle；保存生命週期、指派、排班、付款、月結、匯款及 finance staging 業務 facts，供後續獨立 importer 重播，不再執行日期或亂數生成。
    source: scripts/export_db_snapshot_fixture_v2.py
    domain: null
    subsystem: null
    map_file: system_map.md
    dependencies:
    - DatabaseSnapshotFixtureV2Serializer
    - DatabaseSnapshotFixtureV2Validator
    input:
      database_config: 僅用於讀取來源測試 DB；不得寫入 bundle 或 manifest。
      output_directory: 預設 fixtures/db_snapshot_v2/v3。
      fixture_version: 固定版本 v3；同版本內容不得靜默覆寫。
      reference_case_range: 固定為 115000001 至 115000050。
    output:
      manifest: 固定格式版本、schema 相容資訊、table allowlist、匯入順序、business key、row count、逐檔
        SHA-256、整體 snapshot checksum 與明確排除 tables。
      table_files: 每張 allowlist table 一個 UTF-8 JSONL，固定欄位順序與穩定 row order。
      export_report: 匯出 table counts、checksum、fixture case coverage 與 validation 結果。
    invariants:
    - exporter 全程唯讀；不得執行 INSERT、UPDATE、DELETE、REPLACE、TRUNCATE、DDL 或任何資料異動 commit。
    - 只能讀取固定 allowlist：clients、beclass_records、staff、staff_bank_accounts、staff_regions、staff_time_slots、staff_cooking_skills、staff_transportation、staff_holiday_availability、staff_weekly_rest、staff_baby_types、holidays、orders、matching_records、client_payments、client_payment_transactions、case_staff_assignments、staff_schedule、staff_payments、staff_payment_transactions、staff_monthly_settlements、staff_monthly_settlement_details、staff_actual_transfers、staff_transfer_allocations、finance_import_batches、finance_import_rows、finance_import_occurrences。
    - 必須明確排除 finance_alerts、finance_alert_events、LINE、crawler、system alerts、FAQ、legacy
      payments、migration review、人工稽核與其他非 allowlist tables；不得以 SHOW TABLES 後全庫傾倒。
    - 必須在單一 repeatable-read consistent snapshot 中讀取所有 allowlist tables，完成後 rollback
      唯讀 transaction 並關閉連線。
    - 必須將完整 tables 交由 DatabaseSnapshotFixtureV2Validator 驗證；不得在 exporter 中略過、放寬或自行修正失敗資料。
    - v3 必須包含固定 15 筆 2026 國定假日。fixture 中既有 is_double_pay_default 僅為歷史相容資料；正式排班流程不得讀取它自動啟用雙倍薪，新建假日與新排班預設均為
      false。
    - 必須將已驗證 rows 交由 DatabaseSnapshotFixtureV2Serializer 產生 JSONL、manifest 與 checksum；不得在
      exporter 複製另一套 canonicalization。
    - manifest 與正式 table files 不得包含 exported_at=now、來源 DB 名稱、DB 帳密、.env 值、連線資訊或其他每次執行會漂移的
      metadata。
    - exporter 不得 import、呼叫、解除或繞過 frozen GenerateFakeData；其歷史原始碼僅作人工規格參考。
    - 所有資料檔、manifest、row count、FK、boundary facts 與 checksum 驗證成功後才能從暫存目錄原子發布；失敗不得留下半套正式
      bundle。
    - 目標版本不存在時可發布；已存在且 checksum 相同時回報 identical 且不得重寫，checksum 不同時拒絕覆蓋。
    preferred_pattern: none
    verification:
    - 'command: {"argv": [".venv\\Scripts\\python.exe", "-m", "py_compile", "scripts\\export_db_snapshot_fixture_v2.py"],
      "cwd": "project", "timeout": 60, "expect_exit": 0}'
    decisions: []
    todo:
    - 新增注入 fake snapshot reader 的可重複 exporter pytest；已移除直接讀取 configured DB 的測試。
    checkpoint: []
    state: dirty
    fan_in_snapshot: 1
    known_symbols:
    - _normalize
    - export_snapshot_fixture
    - main
    - publish
    - read_consistent_snapshot
  DatabaseSnapshotFixtureV2Importer:
    type: script
    description: 將固定 v3 JSONL snapshot fixture 以 insert-only transaction 重建至已完成 schema
      migration 的測試 DB；可安全重跑相同 bundle，但絕不覆蓋既有或歷史資料。
    source: scripts/import_db_snapshot_fixture_v2.py
    domain: null
    subsystem: null
    map_file: system_map.md
    dependencies:
    - DatabaseSnapshotFixtureV2Exporter
    - DatabaseSnapshotFixtureV2Serializer
    - DatabaseSnapshotFixtureV2Validator
    input:
      fixture_directory: 固定預設 fixtures/db_snapshot_v2/v3。
      database_config: 已完成 schema migration 的目標測試 DB。
      mode: 預設 dry-run；只有明確 --apply 才可 INSERT。
    output:
      import_report: fixture checksum、各表 inserted／skipped_identical、總筆數、validation
        與 mode。
    invariants:
    - 只接受 fixture_name=labor_union_db_snapshot、fixture_version=v3、schema_version=db-snapshot-fixture-v2，且
      manifest table 名稱、順序、相對路徑必須完整等於固定 27 表 allowlist。
    - 匯入前必須驗證 manifest snapshot checksum、每個 JSONL 檔案 checksum、row count、每列 __row_key／__row_sha256
      與 tagged value 結構；任一不符不得開啟寫入 transaction。
    - 必須解碼 NULL、boolean、integer、Decimal、date、datetime、JSON object/list 與 string；MySQL
      TIME 固定字串保持 HH:MM:SS，JSON 欄位以 canonical JSON text 寫入。
    - 必須以固定 FK 拓撲匯入；含 id 的表使用 bundle __source_id 明確還原原 id，使 bundle 內 FK 不需猜測或重新配對。
    - 預設 dry-run 不得 INSERT、UPDATE、DELETE、REPLACE、TRUNCATE、DDL 或 commit，最後必須 rollback
      並關閉 connection。
    - apply 只允許參數化 INSERT 與 identity/business-key SELECT；不得執行 UPDATE、DELETE、REPLACE、TRUNCATE、DDL，不得呼叫
      GenerateFakeData。
    - business key 不存在且 source id 未被占用時才 INSERT；business key 已存在且 canonical row hash
      完全相同時 skipped_identical；business key 或 source id 任一衝突時整批 rollback。
    - 所有表完成後必須從 transaction 內重新讀取固定 27 表並交由 DatabaseSnapshotFixtureV2Validator 驗證；驗證通過才可
      commit。
    - finance_alerts、finance_alert_events、LINE、crawler、system alerts、FAQ、legacy payments、migration
      review 與其他非 allowlist tables 一律不得讀寫。
    - 匯入器不建立 schema、不執行 migration、不清空 DB；缺表、缺欄位或 FK/schema 不相容時 fail-closed。
    preferred_pattern: none
    verification:
    - 'command: {"argv": [".venv\\Scripts\\python.exe", "-m", "py_compile", "scripts\\import_db_snapshot_fixture_v2.py"],
      "cwd": "project", "timeout": 60, "expect_exit": 0}'
    decisions: []
    todo:
    - 新增注入 fake target DB 的可重複 importer pytest；已移除只在 configured DB 等同 v3 fixture 時成立的測試。
    checkpoint: []
    state: dirty
    fan_in_snapshot: 1
    known_symbols:
    - _dbvalue
    - _row
    - decode
    - import_fixture
    - load_fixture_bundle
    - main
