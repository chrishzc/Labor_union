      狀態；不以覆寫 orders.status 取代歷史。
    source: db/schema_parts/104_order_lifecycle_state_history.sql
    domain: null
    subsystem: null
    map_file: system_map.md
    dependencies:
    - PaymentSchema
    - DatabaseSchemaLoader
    input:
      transition: case_no、trigger_event、before_status、after_status、actor、business_date、expected_version、idempotency_key
        與 facts snapshot
    output:
      order_lifecycle_state_events: 每次合法狀態轉移或明確維持／阻擋決策的不可覆寫事件
    invariants:
    - event 必須 FK 連回 orders.case_no，保存非空 trigger_event、actor、idempotency_key、before/after
      status、business_date、facts snapshot 與建立時間。
    - 同一 case_no 與 idempotency_key 最多一筆；完全相同重送回 existing，不同內容衝突必須 fail-fast。
    - expected_version 固定保存本次 command 接受前的 orders.lifecycle_version；每一筆非 replay event
      的結果版本固定為 expected_version + 1，不得由 event id、筆數或 created_at 推測版本。
    - before/after status 只允許洽談中、訂單成立、服務中、訂單完成、訂單取消；不得保存任意字串。
    - 事件建立後不得 UPDATE 或 DELETE；DB trigger 必須機械拒絕。
    - schema 只新增歷史表、索引、FK 與 trigger；不得回填、推測或修改既有 orders.status、付款、排班、月結或交易。
    preferred_pattern: none
