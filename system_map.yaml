      classification、建立 run/event 或 dispatch 前停止。
    - apply 全批單一 commit，任一例外全批 rollback；成功後同一 batch_id/plan_fingerprint 重送必須讀取 completed
      run 並回 transaction_outcome=existing，不得再次分類、dispatch、投影第二份 audit 或建立正式交易。
