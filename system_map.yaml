      required=(''0.1.0-draft'',''MCSUX-G-001'',''MCSUX-G-009'',''MCSUX-AC-001'',''MultiCaregiverSchedulingUXProgramGoalGuide'',''多月嫂排班UX改善討論紀錄.md'',''new_requirement'',''responsibility_change'');
      assert all(x in s for x in required); print(''MCSUX GOAL GUIDE TRACEABLE'')"],
      "cwd": "project", "timeout": 60, "expect_exit": 0, "expect_stdout_contains":
