        items
      batch_leave_resolution_apply: contract_version=`assignment-leave-substitution-batch-apply/v1`、Preview
        identity 欄位加 preview_fingerprint、batch_key、actor、reason
      lifecycle_commands: cancellation、actual-start reconfirmation、hold activate/release與manual
        correction；actual-start reconfirmation包含Calendar Preview確認的完整order_change、非空assignment_plan與schedule_change_plan.remove_schedule_ids。
    output:
      request_models: 既有schedule/leave models、共用`OrderAssignmentSynchronizationOrderChange`、`OrderAssignmentSynchronizationAssignment`、`OrderAssignmentSynchronizationScheduleChangePlan`，以及`OrderLifecycleCancellationRequest`、`OrderActualStartReconfirmationRequest`、`OrderLifecycleHoldRequest`、`OrderLifecycleManualCorrectionRequest`；legacy
        `OrderStatusUpdateRequest`僅供410相容解析，不得交給writer。
    invariants:
    - 規格出處：`多月嫂排班UX改善討論紀錄.md`「每個休假日期各自選擇順延／代班」「代班時管理員必須明確選擇代班月嫂」「預覽仍須在後端完成檔期、區段、日排班、服務總量及鎖定檢查」；滿足
      API 僅接收操作意圖、Server 自行推導 facts。
    - 規格出處：2026-07-28 人工核准決策「歷史日期本身可修改，client 不得自報歷史可改狀態」；因此 schema 不提供 historical
      bypass 欄位。
    - deposit_date 必須允許 null，且不得以今天或其他期款日期作為預設值。
    - 不得定義 clients.identity_status 或 identity_status 為可寫入的訂單 API 欄位。
    - 每個lifecycle command均要求StrictInt且非bool的expected_version>=0、trim後非空的idempotency_key/actor/reason，model
      extra=forbid。
    - cancellation body不接受status、refund、payment或lock flags；actual-start reconfirm除common
      command欄位與new_actual_start_date外，只接受Calendar Preview的完整order_change、assignment_plan及schedule_change_plan，不接受derived
      end date、status、blocker、付款或control facts；order_change.actual_start_date必須精確等於new_actual_start_date。
    - lifecycle request及其巢狀order/assignment/schedule plan model一律`extra=forbid`；actual-start
      assignment_plan至少一筆，schedule_change_plan必含remove_schedule_ids list，且沿用同步Preview/Apply的完整欄位形狀，不得另造縮水版或允許任意dict夾帶derived
      facts。
    - hold scope只允許enter_service／auto_complete；release_policy只允許manual／expires_at且與aware
      expires_at交叉驗證。
    - manual correction requested_status只允許canonical statuses，但target=訂單取消必須由cancellation
      model，correction model必須拒絕。
    - API model不得接受blocking anomalies、domain facts、Alert state、lifecycle_version after
      value、control action result或outbox payload。
    - legacy OrderStatusUpdateRequest若為相容import暫時保留，必須標示retired且Router不得將其交給任何writer。
