      operation_receipt_path: restore/apply/verify/switch 必填的 durable receipt 路徑
      environment_file: switch/rollback-switch 明確指定的 UTF-8 .env；只允許原子修改唯一 DB_DATABASE
        設定
    output:
      upgrade_plan: Schema 61、104、105、106、107、108 每個 statement 的 absent/exact/blocked
        判定、固定執行順序與預期 metadata
      operation_receipt: prepared、restored、partial、schema_applied、backfilled、verified、switched
        或 rolled_back 狀態，以及每個不可回滾 statement 的 before/after fingerprint
      candidate_verification: source/candidate row-count與資料 fingerprint 比對、61/104/105/106/107/108
        exact metadata、matching_records既有欄位保存、backfill/view驗證及可切換判定
      switch_receipt: .env before/after SHA-256、原/candidate DB_DATABASE、切換時間與精確回切前置條件；不得含完整
        .env bytes、hex、credential 或其他環境變數值
    invariants:
    - 'deny_imports: [scripts.init_db, scripts.reset_fake_database]'
    - source_database及目前DB_DATABASE指向的live原DB在所有mode都不得執行CREATE、ALTER、DROP、TRUNCATE、INSERT、UPDATE、DELETE、trigger/view重建或backfill；任何mutation
      connection的SELECT DATABASE()必須精確等於candidate_database。
    - 禁止呼叫init_db、DatabaseSchemaLoader destructive entrypoint、reset_fake_database或db/schema.sql重建流程；只允許六個明列且hash綁定的additive
      schema part。
    - candidate_database必須與source不同且在restore前不存在；不得以既有、非空、名稱模糊匹配或未綁定server identity的資料庫作candidate，也不得使用DROP
      DATABASE清場後冒充全新candidate。
    - restore必須由已驗證source mysqldump建立candidate；不得用CREATE TABLE AS、部分copy、測試fixture或application-level逐表搬移代替正式restore。
    - source dump、candidate pre-DDL dump、plan及operation receipt均須保存SHA-256；receipt寫入必須atomic且每個statement可恢復辨識，不能因final
      receipt失敗把partial DDL宣稱為rollback。
    - 61→104→105→106→107→108順序固定；Schema 61、104、107及108既有同名table/column/index也必須完整metadata
      exact才可replay，CREATE TABLE IF NOT EXISTS或ADD COLUMN不得遮蔽drift。
    - apply期間不得允許finance import/reprocess、API writer、background lifecycle projector或其他writer連到candidate；解除maintenance與啟動服務不屬runner，必須在switch後由外部部署程序完成。
    - backfill只允許既有OrderLifecycleControlFactsBackfillMigration契約認可的legacy cancellation
      facts；runner不得自行推測actual-start reconfirmation、hold、completion或其他domain facts。
    - DB_DATABASE切換及回切必須可稽核、原子且綁定.env fingerprint；不得自動覆寫DB_HOST、DB_PORT、DB_USER、DB_PASSWORD或其他設定，不得把credential、完整.env
      bytes、hex或可逆編碼寫入receipt、stdout或command argv。
    - runner成功只代表candidate DB cutover備妥；未完成真實MySQL integration驗收、人工maintenance協調及服務重啟後smoke，不得宣稱production完成。
    preferred_pattern: none
    verification:
