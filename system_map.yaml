    output:
      candidate_status: 五個 canonical order statuses 之一
      candidate_reasons: 穩定可機讀的決策原因
      domain_blocker_states: 固定 registry 中由候選規則擁有的 blocker code → active bool
    invariants:
    - 優先順序固定為：有效取消；符合完整完工門禁；訂金有效且真正開始日已到的服務中；訂金有效但尚未開始的訂單成立；其餘洽談中。
    - actual_end_date 非空不等於完成；必須有由正式 assignment/schedule 與 OrderServiceTimeTermsSchema
      推導的 completion_instant、evaluation_at 已到該時刻且 completion_facts_consistent。
    - scoped blockers 不參與候選狀態計算；候選先依 structural facts 產生，再由 TransitionGuard 只阻擋對應
      scope，避免 auto_complete hold 錯誤阻擋 enter_service。
    - actual_start_date 已到但訂金無效時候選不得為服務中，並回傳 enter_service.deposit_required_before_service
      intent。
    - 延遲訂金且真正開始日尚未重新確認時候選不得為服務中，並回傳 enter_service.actual_start_reconfirmation_required
      intent。
    - 退款、退匯、沖正或後續結算不得推測訂單取消；取消只由有效 cancellation control fact 決定。
    - 本節點不得讀 DB、取得時間、參考 trigger 或 current status、建立 alert 或修改資料。
    preferred_pattern: none
    verification:
    - 'command: {"argv": [".venv\\Scripts\\python.exe", "-m", "pytest", "tests\\test_order_lifecycle_candidate.py",
      "-q", "-p", "no:cacheprovider"], "cwd": "project", "timeout": 60, "expect_exit":
      0, "expect_stdout_contains": "passed"}'
    decisions: []
    todo: []
    checkpoint: []
    state: planned
    fan_in_snapshot: 2
  OrderLifecycleTransitionGuard:
    type: domain_service
    description: 比對 current status、trigger 與候選狀態，回傳 changed、unchanged 或 blocked 及穩定原因；不重新計算候選狀態。
    source: services/order_lifecycle_transition.py::guard_order_lifecycle_transition
    domain: Services
    subsystem: null
    map_file: services\services_system_map.md
    dependencies:
    - OrderLifecycleFactsValidator
    - OrderLifecycleCandidateDecision
    input:
      current_status: validated canonical status
      trigger_event: validated canonical trigger
      candidate_status: OrderLifecycleCandidateDecision 的候選狀態
      validated_facts: 已驗證事實
      domain_blocker_states: 候選決策產生的固定 scoped blocker desired states
    output:
      recommended_status: 合法目標或原狀態
      transition: changed、unchanged 或 blocked
      blocking_reasons: 穩定可機讀原因
      projection_states: 依公開常數 `LIFECYCLE_BLOCKER_PROJECTION_REGISTRY` 固定 13 筆、穩定排序的
        immutable `LifecycleBlockerProjectionState(scope,alert_code,active,payload)`
        tuple；payload 固定為穩定排序的 `tuple[tuple[str,str],...]`，Application materialize
        為 JSON object；不含 case、command key、outbox action 或 intent_key
    invariants:
    - active cancellation control 永遠優先產生訂單取消；取消解除後只有 manual_correction 可離開取消，且目標由最新權威事實重新驗證，不得直接恢復取消前
      status。
    - 訂單完成只有 schedule_applied 或 manual_correction 可因正式事實改變回到服務中；不得因付款事件倒退。
    - enter_service blockers 只阻擋進入服務中；auto_complete blockers 只阻擋進入訂單完成；取消不受 hold 阻擋，底層
      domain command 不因 hold 被禁止。
