      未執行時，Domain 歷史資料修復不得宣稱完成。目標主機必須先唯讀確認原始基線完全相符，再依 dry-run fingerprint apply 並查核
      audit、正式交易與 IMPORT-006。
    - 集中 pytest 的內層 timeout 固定 300 秒，外層初始等待至少 310 秒；若工具先 yield，必須先檢查新增輸出與程序 CPU／I/O
      狀態，確認持續進展且無重複 traceback、deadlock 或無限迴圈跡象後才以有限增量延長。連續兩次無新輸出或可證明進度時必須終止並回報未驗證，不得以無界
      timeout 掩蓋 hang。
