services:
  redis:
    image: redis:7-alpine
    container_name: union_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - union-network

# MySQL 由外部主機（例如 NAS）管理；應用程式依 .env 的 DB_* 直接連線。
# 既有 mysql_db 容器與 mysql-data volume 不由此檔案移除。

networks:
  union-network:
    driver: bridge
