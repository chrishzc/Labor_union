  ClientPaymentWriteService:
    type: service
    description: 將客戶金流交易實際寫入新表，並依所有交易重算客戶帳務摘要與各期結清日。
    source: services/client_payment_writer.py
    domain: Services
    subsystem: null
    map_file: services\services_system_map.md
    dependencies:
    - PaymentSchema
    - ClientSubsidyReturnObligationService
    - OrderAmountCalculator
    - AccountingSourceProjection
    input:
      cursor: 由呼叫端持有 transaction 的 cursor；既有 API wrapper 可自行建立連線後呼叫同一核心
      client_payment_id: case-linked client ledger identifier
      transaction: stage、type、status、amount、occurred_at、external_reference 與可空 finance_import_row_id
    output:
      transaction_id: 新增或完全相同既有交易的 id
      client_payment_state: persisted stage receipts, subsidy refund and amount_received
    exceptions: []
    invariants:
    - 必須透過 AccountingSourceProjection 讀取訂單條件與 clients.identity_status，不得在服務內自行拼接 SQL。
    - 在成功寫入 succeeded 收款交易且 amount_received 等於 amount_receivable 時，若具備 actual_end_date
      必須在同一 transaction 內呼叫 activate_subsidy_return_obligation；未全額、沖正、超收、缺少實際完成日或應退金額為零均不得建立正式義務。
    - 已經建立義務後遭遇沖正致未全額實付者，必須將狀態設為 review_required 並暫停未支付義務出帳，不得保留為可自動出帳狀態。
    - review_required 必須持久化於 PaymentSchema；只改函式回傳值不構成狀態變更。歷史應付清單仍依預定日期納入該筆並顯示覆核狀態。
    preferred_pattern: none
    verification:
    - command:
        argv:
        - .venv\Scripts\python.exe
        - -m
        - pytest
        - tests\test_client_payment_writer.py
        - -q
        cwd: project
        timeout: 60
        expect_exit: 0
        expect_stdout_contains: passed
    decisions: []
    todo: []
    checkpoint: []
    observability:
      mode: not_required
      signals: []
    complexity: medium
    algorithm:
    - 鎖定客戶帳務與既有交易，將候選交易先交 ClientPaymentTransactionService 計算，超額或重複識別一律回滾。
    - 寫入交易，再重算訂金、第一期、第二期摘要；只有三個收款階段計入 amount_received，退款功能暫不啟用。
    - 階段淨額首度等於應收時記錄完成日；應收為零的階段不得產生完成日。第一期首度結清時，若第二期應收大於零，將第二期應收日設為第一期實收日加 15 天；第一期遭沖正而未結清時清空該日期。
    - 訂金首次全額核銷時，僅將目前為洽談中的同一 case_no 案件自動更新為訂單成立；歷史資料仍可在單筆訂單頁以受稽核的人工流程建立。
    - 觸發點 1（完工後收清）：在成功寫入 succeeded 收款交易且更新後 amount_received 等於 amount_receivable 時，透過
      AccountingSourceProjection 載入訂單條件與 clients.identity_status，由 OrderAmountCalculator
      計算 subsidy_return_amount。若案件具實際完成日 (actual_end_date) 且應退金額大於零，在同一個資料庫 transaction
      中呼叫 ClientSubsidyReturnObligationService (activate_subsidy_return_obligation)
      啟用補助退還義務。
    - 沖正防護（Reversal Policy）：若案件已存在生效的補助退還義務 (subsidy_return_receivable > 0)，後續發生沖正交易致使
      amount_received < amount_receivable 時，在同一 transaction 持久化 subsidy_return_review_status=review_required
      與明確原因，暫停銀行流水自動核銷；不得清除原始義務或預定退款日。
    - 案件再次精確收清時，只有重新投影、計算並確認既有義務金額與到期日完全一致後，才可清除 review status/reason；投影、計算或啟用例外必須使整筆收款交易
      rollback，不得靜默忽略。
    idempotency:
      level: unknown
      side_effects: []
    retry_budget: 0
    required_context: []
    forbidden_context: []
    context_priority: {}
    non_goals: []
