    type: import_pipeline
    description: 由任意檔名的歷史、台新或永豐 Excel 建立匯入批次；先 append-only 保存與分類所有流水，再只對唯一且完全符合 P0
      正常規則的新流水執行正式核銷。
    source: scripts/imports/import_finance_excel.py
    domain: Services
    subsystem: null
    map_file: services\services_system_map.md
