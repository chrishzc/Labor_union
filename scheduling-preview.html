<div id="lu-scheduling-preview"></div>
<style>
#lu-scheduling-preview{color-scheme:light dark;--lu-bg:light-dark(#faf7f3,#211c19);--lu-panel:light-dark(#fff,#2b2420);--lu-text:light-dark(#392e27,#f4e8dd);--lu-muted:light-dark(#7b6e64,#c4b3a6);--lu-line:light-dark(#e8ded4,#57483d);--lu-soft:light-dark(#fff0e6,#483024);--lu-primary:light-dark(#b95125,#efac83);--lu-on:light-dark(#fff,#321c0d);--lu-green:light-dark(#26734f,#9bd5b6);--lu-greenbg:light-dark(#ecf6ef,#223c2e);--lu-red:light-dark(#a43c32,#ffb0a5);font:14px/1.65 'Microsoft JhengHei','PingFang TC',system-ui,sans-serif;color:var(--lu-text);background:var(--lu-bg);border-radius:12px;overflow:clip;min-width:0}
#lu-scheduling-preview *{box-sizing:border-box}#lu-scheduling-preview button,#lu-scheduling-preview input,#lu-scheduling-preview select,#lu-scheduling-preview textarea{font:inherit;color:inherit}#lu-scheduling-preview button{cursor:pointer}#lu-scheduling-preview button:disabled{cursor:not-allowed;opacity:.5}#lu-scheduling-preview button:focus-visible,#lu-scheduling-preview input:focus-visible,#lu-scheduling-preview select:focus-visible{outline:3px solid var(--lu-primary);outline-offset:3px}#lu-scheduling-preview .lu-top{padding:16px 24px;border-bottom:1px solid var(--lu-line);background:var(--lu-panel);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#lu-scheduling-preview .lu-brand{font-weight:700;letter-spacing:1px}#lu-scheduling-preview .lu-muted{color:var(--lu-muted)}#lu-scheduling-preview .lu-small{font-size:12px}#lu-scheduling-preview .lu-tag{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;background:var(--lu-soft);color:var(--lu-primary);font-size:12px;white-space:nowrap}#lu-scheduling-preview .lu-tag.green{background:var(--lu-greenbg);color:var(--lu-green)}#lu-scheduling-preview .lu-main{padding:22px 24px 24px}#lu-scheduling-preview h1{font-size:23px;line-height:1.35;margin:6px 0 8px}#lu-scheduling-preview h2{font-size:18px;margin:0}#lu-scheduling-preview h3{font-size:15px;margin:0 0 8px}#lu-scheduling-preview p{margin:5px 0 0}#lu-scheduling-preview .lu-heading{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px;flex-wrap:wrap}#lu-scheduling-preview .lu-crumb{border:0;background:none;padding:0;color:var(--lu-primary)}#lu-scheduling-preview .lu-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--lu-line);padding:0 0 14px;margin:20px 0}#lu-scheduling-preview .lu-tabs button{border:0;background:transparent;padding:8px 14px;border-radius:8px;color:var(--lu-muted)}#lu-scheduling-preview .lu-tabs button[aria-pressed=true]{background:var(--lu-soft);color:var(--lu-primary);font-weight:700}#lu-scheduling-preview .lu-panel{background:var(--lu-panel);border:1px solid var(--lu-line);border-radius:12px;padding:20px;margin-top:16px}#lu-scheduling-preview .lu-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#lu-scheduling-preview .lu-between{justify-content:space-between}#lu-scheduling-preview .lu-button{border:1px solid var(--lu-line);border-radius:8px;background:var(--lu-panel);padding:9px 14px;min-height:40px}#lu-scheduling-preview .lu-button.primary{background:var(--lu-primary);color:var(--lu-on);border-color:var(--lu-primary)}#lu-scheduling-preview .lu-button.link{background:transparent;border-color:transparent;color:var(--lu-primary);padding-left:0}#lu-scheduling-preview .lu-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}#lu-scheduling-preview label.lu-field{display:flex;flex-direction:column;gap:6px;min-width:0}#lu-scheduling-preview input,#lu-scheduling-preview select,#lu-scheduling-preview textarea{width:100%;min-width:0;border:1px solid var(--lu-line);border-radius:8px;padding:9px 10px;background:var(--lu-panel);min-height:42px}#lu-scheduling-preview textarea{resize:vertical;min-height:68px}#lu-scheduling-preview .lu-wide{grid-column:1/-1}#lu-scheduling-preview .lu-table-wrap{overflow-x:auto}#lu-scheduling-preview table{width:100%;border-collapse:collapse;text-align:left}#lu-scheduling-preview th{color:var(--lu-muted);font-weight:500;font-size:12px}#lu-scheduling-preview th,#lu-scheduling-preview td{padding:15px 12px;border-bottom:1px solid var(--lu-line);vertical-align:middle}#lu-scheduling-preview th:first-child,#lu-scheduling-preview td:first-child{padding-left:0}#lu-scheduling-preview tr:last-child td{border-bottom:0}#lu-scheduling-preview .lu-summary{display:flex;gap:22px;flex-wrap:wrap;padding:14px 0 0;margin-top:14px;border-top:1px solid var(--lu-line)}#lu-scheduling-preview .lu-summary strong{color:var(--lu-primary);font-size:18px}#lu-scheduling-preview .lu-person{display:grid;grid-template-columns:minmax(130px,1fr) minmax(135px,1fr) minmax(135px,1fr) auto;gap:12px;align-items:end;padding:18px 0;border-bottom:1px solid var(--lu-line)}#lu-scheduling-preview .lu-person:last-child{border-bottom:0}#lu-scheduling-preview .lu-person label{font-size:12px}#lu-scheduling-preview .lu-person input,#lu-scheduling-preview .lu-person select{font-size:14px}#lu-scheduling-preview .lu-number{width:24px;height:24px;border-radius:50%;background:var(--lu-soft);color:var(--lu-primary);display:inline-flex;align-items:center;justify-content:center;margin-right:6px}#lu-scheduling-preview .lu-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px;padding-top:18px;border-top:1px solid var(--lu-line)}#lu-scheduling-preview .lu-notice{padding:12px 14px;background:var(--lu-soft);border-radius:8px;color:var(--lu-primary);margin-top:16px}#lu-scheduling-preview .lu-error{color:var(--lu-red)}#lu-scheduling-preview .lu-ok{color:var(--lu-green)}#lu-scheduling-preview .lu-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}#lu-scheduling-preview .lu-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:12px}#lu-scheduling-preview .lu-week{text-align:center;padding:5px;color:var(--lu-muted);font-size:12px}#lu-scheduling-preview .lu-day{border:1px solid var(--lu-line);border-radius:7px;min-height:49px;padding:5px 2px;background:var(--lu-panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:13px}#lu-scheduling-preview .lu-day small{font-size:11px}#lu-scheduling-preview .lu-day[aria-pressed=true]{border-color:var(--lu-primary);background:var(--lu-soft);color:var(--lu-primary)}#lu-scheduling-preview .lu-day:disabled{background:var(--lu-bg);opacity:.6}#lu-scheduling-preview .lu-day.lu-conflict{border-color:var(--lu-red);color:var(--lu-red)}#lu-scheduling-preview .lu-day.lu-a{background:var(--lu-soft)}#lu-scheduling-preview .lu-day.lu-b{background:var(--lu-greenbg)}#lu-scheduling-preview .lu-calendar-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}#lu-scheduling-preview .lu-strip{display:flex;gap:4px;flex-wrap:wrap;margin-top:14px}#lu-scheduling-preview .lu-date-chip{background:var(--lu-soft);color:var(--lu-primary);border-radius:6px;padding:3px 7px;font-size:12px}#lu-scheduling-preview .lu-timeline{border-left:2px solid var(--lu-line);padding-left:16px;margin:18px 0 0 7px}#lu-scheduling-preview .lu-timeline>div{position:relative;padding-bottom:20px}#lu-scheduling-preview .lu-timeline>div:last-child{padding-bottom:0}#lu-scheduling-preview .lu-timeline>div:before{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:var(--lu-primary);left:-21px;top:8px}#lu-scheduling-preview .lu-dates-editor{border-top:1px solid var(--lu-line);padding-top:18px;margin-top:6px}#lu-scheduling-preview .lu-info{display:flex;gap:24px;flex-wrap:wrap;margin-top:14px}#lu-scheduling-preview .lu-toast{background:var(--lu-greenbg);color:var(--lu-green);padding:12px 16px;border-radius:8px;margin:16px 0}#lu-scheduling-preview .lu-inline-date{max-width:185px}#lu-scheduling-preview .lu-mobile-label{display:none}@media(max-width:760px){#lu-scheduling-preview .lu-layout{grid-template-columns:1fr}#lu-scheduling-preview .lu-person{grid-template-columns:1fr 1fr}#lu-scheduling-preview .lu-main{padding:18px 14px}#lu-scheduling-preview .lu-top{padding:14px}#lu-scheduling-preview .lu-panel{padding:16px}#lu-scheduling-preview .lu-fields{gap:12px}}@media(max-width:440px){#lu-scheduling-preview .lu-fields{grid-template-columns:1fr}#lu-scheduling-preview .lu-person{grid-template-columns:1fr}#lu-scheduling-preview .lu-day{min-height:44px}#lu-scheduling-preview .lu-calendar{gap:3px}#lu-scheduling-preview .lu-top .lu-muted{display:none}#lu-scheduling-preview h1{font-size:21px}#lu-scheduling-preview input,#lu-scheduling-preview select,#lu-scheduling-preview textarea{font-size:16px}}
</style>
<script>
(()=>{
const root=document.getElementById('lu-scheduling-preview');
const staff=['月嫂甲','月嫂乙','月嫂丙','月嫂丁'];
const makeDates=(month,start,end)=>Array.from({length:end-start+1},(_,i)=>`2026-${String(month).padStart(2,'0')}-${String(start+i).padStart(2,'0')}`).filter(d=>![0,6].includes(new Date(d+'T12:00:00Z').getUTCDay()));
const oct=makeDates(10,5,30),nov=makeDates(11,2,27),today='2026-10-21';
let page='home',editing=null,message='',error='',savedMulti=false,replaced=false,subbed=false;
let rows=[{staff:'月嫂甲',from:'2026-11-02',to:'2026-11-13',dates:nov.slice(0,10)},{staff:'月嫂乙',from:'2026-11-16',to:'2026-11-27',dates:nov.slice(10)}];
let replace={original:'月嫂乙',staff:'月嫂丙',date:'2026-10-23',reason:''};
let sub={original:'月嫂乙',staff:'月嫂丙',dates:['2026-10-22','2026-10-23'],reason:''};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=d=>d.slice(5).replace('-','/');
const nameOptions=(value,excluded=[])=>staff.filter(s=>!excluded.includes(s)).map(s=>`<option${s===value?' selected':''}>${s}</option>`).join('');
const btn=(text,action,cls='',extra='')=>`<button type="button" class="lu-button ${cls}" data-act="${action}" ${extra}>${text}</button>`;
const info=(text,kind='')=>`<div class="lu-notice ${kind}">${text}</div>`;
const metrics=()=>{const counts=nov.map(d=>rows.filter(r=>r.dates.includes(d)).length);return{missing:nov.filter((_,i)=>counts[i]===0),overlap:nov.filter((_,i)=>counts[i]>1),count:counts.filter(n=>n>0).length};};
function calendar(month,kind){
 const days=month===11?30:31,offset=(new Date(`2026-${month}-01T12:00:00Z`).getUTCDay()+6)%7,base=month===11?nov:oct;
 return `<div class="lu-calendar">${['一','二','三','四','五','六','日'].map(x=>`<div class="lu-week">${x}</div>`).join('')}${'<div></div>'.repeat(offset)}${Array.from({length:days},(_,i)=>{const d=`2026-${month}-${String(i+1).padStart(2,'0')}`;const outsideLabel=[0,6].includes(new Date(d+'T12:00:00Z').getUTCDay())?'休息':'區間外';const owners=rows.filter(r=>r.dates.includes(d));let active=false,disabled=!base.includes(d),label=disabled?outsideLabel:'';let css='';
 if(kind==='multi'){active=editing!==null&&rows[editing].dates.includes(d);label=disabled?outsideLabel:owners.length>1?'重疊':owners.length?owners.map(r=>r.staff.slice(-1)).join('/'):'未排';css=owners.length>1?'lu-conflict':owners.length?(owners[0]===rows[0]?'lu-a':'lu-b'):'';disabled=disabled||editing===null;}
 if(kind==='sub'){disabled=disabled||d<today||!originalDates(sub.original).includes(d);active=sub.dates.includes(d)&&!disabled;label=!base.includes(d)?outsideLabel:d<today?'已服務':!originalDates(sub.original).includes(d)?'他人':active?'代班':'可選';}
 return `<button type="button" class="lu-day ${css}" data-date="${d}" data-kind="${kind}" aria-label="${d} ${label}" aria-pressed="${active}" ${disabled?'disabled':''}><span>${i+1}</span><small>${label}</small></button>`;}).join('')}</div>`;
}
function originalDates(s){return s==='月嫂甲'?oct.slice(0,10):oct.slice(10);}
function header(){const isMulti=page==='multi';return `<header class="lu-top"><span class="lu-brand">工會管理系統</span><span class="lu-muted">案件管理 ／ 待辦看板</span><span class="lu-tag">互動預覽 · 示意資料</span></header><main class="lu-main"><div class="lu-heading"><div>${page==='home'?'<span class="lu-muted lu-small">案件管理</span>':btn('← 返回待辦看板','home','link')}<h1>${({home:'待辦看板',multi:'多月嫂手動排班',replace:'服務中更換月嫂',sub:'服務中安排代班'})[page]}</h1><p class="lu-muted">${page==='home'?'服務安排直接辦理換人、代班與多月嫂排班。':isMulti?'示例案件 B · DEMO-002 · 服務前':'示例案件 A · DEMO-001 · 服務中'}</p></div>${page==='home'?'':`<span class="lu-tag ${isMulti?'':'green'}">${isMulti?'待建立排班':'已服務 12 日 · 剩餘 8 日'}</span>`}</div><nav class="lu-tabs" aria-label="服務安排預覽頁面">${[['home','案件清單'],['multi','多月嫂排班'],['replace','服務中換人'],['sub','服務中代班']].map(([key,label])=>`<button type="button" data-act="${key}" aria-pressed="${page===key}">${label}</button>`).join('')}</nav>${message?`<div class="lu-toast" role="status">${esc(message)}</div>`:''}`;}
function home(){return `<section class="lu-panel"><div class="lu-row lu-between"><h2>案件目前待辦</h2><span class="lu-muted lu-small">2 筆示例案件</span></div><div class="lu-table-wrap"><table><thead><tr><th>案件／客戶</th><th>服務安排</th><th>目前狀態</th><th>辦理事項</th></tr></thead><tbody><tr><td><strong>DEMO-001</strong><br><span class="lu-muted">示例案件 A</span></td><td>10/05～10/30<br><span class="lu-small lu-muted">月嫂甲、月嫂乙${replaced?'、'+esc(replace.staff):''}</span></td><td><span class="lu-tag green">服務中</span></td><td><div class="lu-row">${btn('服務中換人 →','replace')}${btn('安排代班 →','sub')}</div>${replaced?'<p class="lu-ok lu-small">已模擬儲存換人安排</p>':''}${subbed?'<p class="lu-ok lu-small">已模擬儲存代班安排</p>':''}</td></tr><tr><td><strong>DEMO-002</strong><br><span class="lu-muted">示例案件 B</span></td><td>11/02～11/27<br><span class="lu-small lu-muted">約定 20 個服務日</span></td><td><span class="lu-tag">${savedMulti?'已安排排班':'待建立排班'}</span></td><td>${btn(savedMulti?'查看多月嫂排班 →':'多月嫂手動排班 →','multi')}</td></tr></tbody></table></div></section><section class="lu-panel"><h3>服務安排</h3><p class="lu-muted">服務前可更換人選；服務開始後，可直接辦理接任換人或指定日期代班。多月嫂案件可逐人輸入服務日期。</p></section>`;}
function multi(){const m=metrics();return `<section class="lu-panel"><div class="lu-row lu-between"><div><h2>各月嫂服務日期</h2><p class="lu-muted lu-small">本案 11/02～11/27，共 20 個服務日；示例週六、日休息。</p></div>${btn('＋ 新增月嫂','add','',rows.length>=4?'disabled':'')}</div>${rows.map((r,i)=>`<div class="lu-person"><label class="lu-field"><span><span class="lu-number">${i+1}</span>服務月嫂</span><select data-row="${i}" data-key="staff" aria-label="第${i+1}位月嫂">${nameOptions(r.staff)}</select></label><label class="lu-field">開始日期<input type="date" value="${r.from}" min="2026-11-02" max="2026-11-27" data-row="${i}" data-key="from" aria-label="第${i+1}位開始日期"></label><label class="lu-field">結束日期<input type="date" value="${r.to}" min="2026-11-02" max="2026-11-27" data-row="${i}" data-key="to" aria-label="第${i+1}位結束日期"></label><div><div class="lu-small lu-muted">${r.dates.length} 個服務日</div><div class="lu-row">${btn(editing===i?'收合逐日調整':'逐日調整','edit','',`data-index="${i}"`)}${rows.length>2?btn('移除','remove','link',`data-index="${i}"`):''}</div></div></div>`).join('')}<div class="lu-summary"><span>約定 <strong>20</strong> 日</span><span>已涵蓋 <strong>${m.count}</strong> 日</span><span class="${m.missing.length?'lu-error':'lu-ok'}">未安排 ${m.missing.length} 日</span><span class="${m.overlap.length?'lu-error':'lu-ok'}">重疊 ${m.overlap.length} 日</span></div>${m.missing.length?info('尚未安排：'+m.missing.map(short).join('、'),'lu-error'):''}${m.overlap.length?info('重複安排：'+m.overlap.map(short).join('、'),'lu-error'):''}${rows.some(r=>r.from>r.to)?info('結束日期需在開始日期之後。','lu-error'):''}${editing!==null?`<section class="lu-dates-editor"><div class="lu-calendar-head"><h3>2026 年 11 月 · ${esc(rows[editing].staff)}</h3><span class="lu-small lu-muted">點日期加入／移除該月嫂服務日</span></div>${calendar(11,'multi')}<p class="lu-muted lu-small">甲、乙為月嫂標記；休息日不計入，調整範圍只影響目前選取月嫂。</p></section>`:''}<div class="lu-foot"><span class="lu-small lu-muted">日期可直接輸入，也可逐日選取；按一次儲存完成。</span>${btn('儲存排班','save-multi','primary')}</div></section>${editing===null?`<section class="lu-panel"><div class="lu-calendar-head"><h3>排班總覽 · 2026 年 11 月</h3><span class="lu-small lu-muted">日期內標示負責月嫂</span></div>${calendar(11,'multi')}</section>`:''}`;}
function replacement(){const source=originalDates(replace.original),affected=source.filter(d=>d>=replace.date&&d>=today),retained=source.filter(d=>d<replace.date||d<today);return `<div class="lu-layout"><section class="lu-panel"><h2>設定交接安排</h2><div class="lu-fields"><label class="lu-field">原服務月嫂<select data-model="replace" data-key="original">${nameOptions(replace.original,['月嫂丙','月嫂丁'])}</select></label><label class="lu-field">交接日期<input type="date" data-model="replace" data-key="date" value="${replace.date}" min="${today}" max="2026-10-30"></label><label class="lu-field lu-wide">接任月嫂<select data-model="replace" data-key="staff">${nameOptions(replace.staff,['月嫂甲','月嫂乙'])}</select></label><label class="lu-field lu-wide">換人原因（選填）<textarea data-model="replace" data-key="reason" placeholder="可填寫交接事項或換人原因">${esc(replace.reason)}</textarea></label></div>${info('接任範圍：原月嫂自交接日起的剩餘服務日。已服務紀錄與其他月嫂安排保留。')}<div class="lu-foot">${btn('返回清單','home')}${btn('儲存換人安排','save-replace','primary')}</div>${error?`<p role="alert" class="lu-error">${esc(error)}</p>`:''}</section><section class="lu-panel"><h3>交接後的服務安排</h3><p class="lu-muted lu-small">示例服務日：10/05～10/30，週一至週五</p><div class="lu-timeline">${replace.original==='月嫂乙'?'<div><strong>月嫂甲</strong><p>10/05～10/16 · 10 日</p><span class="lu-tag green">已服務 · 保留</span></div>':''}<div><strong>${esc(replace.original)}</strong><p>${retained.length?short(retained[0])+'～'+short(retained[retained.length-1])+' · '+retained.length+' 日':'無保留服務日'}</p><span class="lu-muted lu-small">交接前服務歸原月嫂</span></div><div><strong>${esc(replace.staff)} 接任</strong><p>${affected.length?short(affected[0])+'～'+short(affected[affected.length-1])+' · '+affected.length+' 日':'交接日起無可接任服務日'}</p><div class="lu-strip">${affected.map(d=>`<span class="lu-date-chip">${short(d)}</span>`).join('')}</div></div></div><div class="lu-summary"><span>服務總日數 <strong>20</strong> 日</span><span>本次接任 <strong>${affected.length}</strong> 日</span></div></section></div>`;}
function substitution(){const selected=sub.dates.filter(d=>originalDates(sub.original).includes(d)&&d>=today);return `<div class="lu-layout"><section class="lu-panel"><div class="lu-calendar-head"><h2>選擇代班服務日</h2><span class="lu-tag">2026 年 10 月</span></div><p class="lu-muted lu-small">可選多個日期；其餘服務日維持原安排。</p><label class="lu-field" style="margin-top:16px">原服務月嫂<select data-model="sub" data-key="original">${nameOptions(sub.original,['月嫂丙','月嫂丁'])}</select></label>${calendar(10,'sub')}<div class="lu-foot"><span>已選 <strong>${selected.length}</strong> 日</span>${btn('清除選取','clear-sub','link')}</div></section><section class="lu-panel"><h2>代班人員與日期</h2><div class="lu-fields"><label class="lu-field lu-wide">代班月嫂<select data-model="sub" data-key="staff">${nameOptions(sub.staff,['月嫂甲','月嫂乙'])}</select></label><div class="lu-wide"><span class="lu-muted lu-small">本次代班日期</span><div class="lu-strip">${selected.length?selected.map(d=>`<span class="lu-date-chip">${short(d)}</span>`).join(''):'尚未選擇日期'}</div></div><label class="lu-field lu-wide">代班原因（選填）<textarea data-model="sub" data-key="reason" placeholder="可填寫請假原因或代班備註">${esc(sub.reason)}</textarea></label></div>${info(`所選 ${selected.length} 日由 ${esc(sub.staff)} 代班，${esc(sub.original)} 的其他服務日保留。`)}<div class="lu-foot">${btn('返回清單','home')}${btn('儲存代班安排','save-sub','primary')}</div>${error?`<p role="alert" class="lu-error">${esc(error)}</p>`:''}</section></div>`;}
function render(){root.innerHTML=header()+(page==='home'?home():page==='multi'?multi():page==='replace'?replacement():substitution())+'</main>';}
function go(next){page=next;message='';error='';render();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const a=b.dataset.act;if(['home','multi','replace','sub'].includes(a)){go(a);return;}
 if(b.dataset.date){const d=b.dataset.date;if(b.dataset.kind==='multi'&&editing!==null){const r=rows[editing];r.dates=r.dates.includes(d)?r.dates.filter(x=>x!==d):[...r.dates,d].sort();r.from=r.dates[0]||r.from;r.to=r.dates.at(-1)||r.to;}if(b.dataset.kind==='sub'){sub.dates=sub.dates.includes(d)?sub.dates.filter(x=>x!==d):[...sub.dates,d].sort();}message='';error='';render();return;}
 if(a==='edit'){editing=editing===Number(b.dataset.index)?null:Number(b.dataset.index);render();}
 if(a==='add'&&rows.length<4){const s=staff.find(n=>!rows.some(r=>r.staff===n))||'月嫂丁';rows.push({staff:s,from:'2026-11-02',to:'2026-11-27',dates:[]});editing=rows.length-1;message='';render();}
 if(a==='remove'){rows.splice(Number(b.dataset.index),1);editing=null;render();}
 if(a==='clear-sub'){sub.dates=[];render();}
 if(a==='save-multi'){const m=metrics();if(m.missing.length||m.overlap.length||rows.some(r=>!r.dates.length||r.from>r.to)||new Set(rows.map(r=>r.staff)).size!==rows.length){message='';error='服務日期需完整涵蓋本案服務日、沒有重疊，且每位月嫂至少安排一天。';render();root.querySelector('.lu-panel').insertAdjacentHTML('beforeend',`<p class="lu-error" role="alert">${error}</p>`);return;}savedMulti=true;message='預覽已模擬儲存：'+rows.map(r=>r.staff+' '+r.dates.length+' 日').join('、')+'。未寫入正式系統。';error='';render();}
 if(a==='save-replace'){const days=originalDates(replace.original).filter(d=>d>=replace.date&&d>=today);if(!replace.date||replace.date<today||!days.length){error='請選擇仍有剩餘服務日的交接日期。';render();return;}replaced=true;message=`預覽已模擬儲存：${replace.staff} 自 ${short(replace.date)} 起接任 ${days.length} 個服務日。未寫入正式系統。`;error='';render();}
 if(a==='save-sub'){if(!sub.dates.length){error='請先選擇代班日期。';render();return;}subbed=true;message=`預覽已模擬儲存：${sub.staff} 代班 ${sub.dates.length} 日，其餘安排保留。未寫入正式系統。`;error='';render();}
});
root.addEventListener('change',e=>{const t=e.target;if(t.dataset.row!==undefined){const r=rows[Number(t.dataset.row)];r[t.dataset.key]=t.value;if(t.dataset.key!=='staff')r.dates=nov.filter(d=>d>=r.from&&d<=r.to);message='';error='';render();return;}if(t.dataset.model){const target=t.dataset.model==='replace'?replace:sub;target[t.dataset.key]=t.value;if(t.dataset.model==='sub'&&t.dataset.key==='original')sub.dates=[];message='';error='';if(t.tagName!=='TEXTAREA')render();}});
render();
})();
</script>
