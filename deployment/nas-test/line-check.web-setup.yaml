name: lu-nas-websetup-line-check
services:
  line-check:
    image: chris23144638/cecec:nas-websetup-r2-20261016
    restart: "no"
    command: ["python", "-m", "scripts.nas_appliance", "line-check"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cpus: 0.10
    mem_limit: 128m
    network_mode: none
    logging:
      driver: json-file
      options: {max-size: "1m", max-file: "2"}
