name: lu-nas-websetup

x-common: &common
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}

services:
  initialize:
    <<: *common
    image: chris23144638/cecec:nas-websetup-r2-20261016
    restart: "no"
    command: ["python", "-m", "scripts.nas_appliance", "initialize"]
    network_mode: none
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cpus: 0.25
    mem_limit: 384m
    volumes:
      - settings:/settings
      - app-data:/data
      - server-tls:/server-tls
      - mysql-secrets:/mysql-secrets
      - bootstrap:/bootstrap

  db:
    <<: *common
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lu_test_nas_preview
      MYSQL_USER: nas_app
      MYSQL_PASSWORD_FILE: /run/mysql-secrets/app-password
      MYSQL_ROOT_PASSWORD_FILE: /run/mysql-secrets/root-password
    command:
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=8M
      - --max-connections=20
      - --table-open-cache=256
      - --temptable-max-ram=16M
      - --require-secure-transport=ON
      - --ssl-ca=/tls/ca.pem
      - --ssl-cert=/tls/server-cert.pem
      - --ssl-key=/tls/server-key.pem
      - --mysqlx=OFF
    cpus: 0.50
    mem_limit: 512m
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-secrets:/run/mysql-secrets:ro
      - server-tls:/tls:ro
      - bootstrap:/docker-entrypoint-initdb.d:ro
    networks: [data]
    depends_on:
      initialize: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/mysql/.lu-preview-initialized && mysqladmin --host=127.0.0.1 ping --silent"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s

  redis:
    <<: *common
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction"]
    cpus: 0.10
    mem_limit: 64m
    volumes: [redis-data:/data]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    <<: *common
    image: chris23144638/cecec:nas-websetup-r2-20261016
    restart: unless-stopped
    environment:
      REACT_ADMIN_CURRENT_ARTIFACT_DIR: /opt/react-admin/current
      REACT_ADMIN_PREVIOUS_ARTIFACT_DIR: /opt/react-admin/previous
      REACT_ADMIN_ACTIVE_SELECTOR: current
    cpus: 0.50
    mem_limit: 768m
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    volumes:
      - settings:/settings:ro
      - app-data:/data
    networks: [data, app]
    depends_on:
      initialize: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

networks:
  data: {internal: true}
  app: {name: lu-nas-websetup-app}

volumes:
  settings: {name: lu-nas-websetup-settings}
  app-data: {name: lu-nas-websetup-app-data}
  server-tls: {name: lu-nas-websetup-server-tls}
  mysql-secrets: {name: lu-nas-websetup-mysql-secrets}
  bootstrap: {name: lu-nas-websetup-bootstrap}
  mysql-data: {name: lu-nas-websetup-mysql-data}
  redis-data: {name: lu-nas-websetup-redis-data}
