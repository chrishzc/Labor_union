name: lu-nas-preview

x-limits: &limits
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}

services:
  db:
    <<: *limits
    image: mysql:8.0
    env_file: settings/mysql.env
    cpus: ${MYSQL_CPUS:-0.50}
    mem_limit: ${MYSQL_MEMORY:-512m}
    command:
      - --innodb-buffer-pool-size=64M
      - --innodb-log-buffer-size=8M
      - --max-connections=20
      - --table-open-cache=256
      - --temptable-max-ram=16M
      - --require-secure-transport=ON
      - --ssl-ca=/tls/ca.pem
      - --ssl-cert=/tls/server-cert.pem
      - --ssl-key=/tls/server-key.pem
      - --mysqlx=OFF
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./settings/tls:/tls:ro
    networks: [data]
    healthcheck:
      test: ["CMD", "mysqladmin", "--host=127.0.0.1", "ping", "--silent"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s

  redis:
    <<: *limits
    image: redis:7-alpine
    cpus: ${REDIS_CPUS:-0.10}
    mem_limit: ${REDIS_MEMORY:-64m}
    command: ["redis-server", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 5s
      retries: 3

  api:
    <<: *limits
    image: ${APP_IMAGE:-labor-union-nas-test:local}
    env_file: settings/app.env
    environment:
      APP_ENV: production
      ACCESS_CONTROL_PROFILE: production
      ENABLE_ADMIN_AUTH: "true"
      REACT_ADMIN_CURRENT_ARTIFACT_DIR: /opt/react-admin/current
      REACT_ADMIN_PREVIOUS_ARTIFACT_DIR: /opt/react-admin/previous
      REACT_ADMIN_ACTIVE_SELECTOR: current
      API_CONCURRENCY: ${API_CONCURRENCY:-8}
    cpus: ${API_CPUS:-0.50}
    mem_limit: ${API_MEMORY:-768m}
    ports: ["${NAS_BIND_IP:-127.0.0.1}:${NAS_HTTP_PORT:-18080}:8080"]
    volumes:
      - app-data:/data
      - ./settings/tls/ca.pem:/run/nas-ca.pem:ro
    networks: [data, app]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).close()"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

  line-check:
    image: ${APP_IMAGE:-labor-union-nas-test:local}
    profiles: [line-check]
    restart: "no"
    command: ["python", "-m", "scripts.run_line_worker", "--check"]
    env_file: settings/worker.env
    environment:
      APP_ENV: production
      INTERNAL_SERVICE_AUTH_MODE: google_oidc
    cpus: ${LINE_CPUS:-0.10}
    mem_limit: ${LINE_MEMORY:-128m}
    security_opt: ["no-new-privileges:true"]
    volumes: ["./settings/line-oidc.json:/run/line-oidc.json:ro"]
    networks: [app]
    depends_on:
      api: {condition: service_healthy}

networks:
  data: {internal: true}
  app: {}

volumes:
  mysql-data: {name: lu-nas-preview-mysql-data}
  redis-data: {name: lu-nas-preview-redis-data}
  app-data: {name: lu-nas-preview-app-data}
