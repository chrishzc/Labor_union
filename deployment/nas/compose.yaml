# File: compose.yaml
# Description: NAS 專用 MySQL 8.0 資料庫正式部署設定（應用系統、LINE Webhook 與 Tunnel 由工會電腦負責）。
name: ${COMPOSE_PROJECT_NAME:?請先把 .env.example 複製為 .env 並設定 COMPOSE_PROJECT_NAME}

services:
  db:
    image: ${MYSQL_IMAGE:-mysql:8.0.46}
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    mem_limit: ${NAS_MYSQL_MEMORY:-1024m}
    ports:
      # 僅綁定 NAS 內網固定 IPv4，嚴禁對外網公開 3306；DSM 防火牆僅允許工會電腦內網 IP。
      - "${NAS_DB_BIND_IP:?請在 .env 填入 NAS 固定內網 IPv4}:${NAS_DB_PORT:-3306}:3306"
    environment:
      TZ: ${TZ:-Asia/Taipei}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-union_db}
      MYSQL_USER: ${MYSQL_USER:-union_app}
      MYSQL_PASSWORD_FILE: /run/mysql-secrets/app-password
      MYSQL_ROOT_PASSWORD_FILE: /run/mysql-secrets/root-password
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL:-256M}"
      - "--innodb-log-buffer-size=16M"
      - "--max-connections=${MYSQL_MAX_CONNECTIONS:-60}"
      - "--mysqlx=OFF"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-client.cnf:/etc/mysql/conf.d/mysql-client.cnf:ro
      - type: bind
        source: ${NAS_MYSQL_SECRETS_DIR:-./mysql-secrets}
        target: /run/mysql-secrets
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "mysqladmin", "--host=127.0.0.1", "ping", "--silent"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  mysql-data:
